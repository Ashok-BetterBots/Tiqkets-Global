services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiqkets
      POSTGRES_USER: tiqkets
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiqkets"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tiqkets:${DB_PASSWORD:-changeme_strong_password}@db:5432/tiqkets
      NODE_ENV: production
      PORT: "5000"
    volumes:
      - uploads:/app/server/uploads
      - static_build:/app/static-build

volumes:
  pgdata:
  uploads:
  static_build:
