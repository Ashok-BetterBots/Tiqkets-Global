services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiqkets
      POSTGRES_USER: tiqkets
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiqkets"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # APP_DOMAIN is baked into the Expo JS bundle at build time so the mobile
      # app knows where to send API requests.  It is also used at serve-time to
      # rewrite manifest download URLs, so changing only the env var (without
      # rebuilding) still works for asset delivery — but API calls inside the
      # bundle will keep using the domain that was set at build time.
      args:
        - APP_DOMAIN=${APP_DOMAIN}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://tiqkets:${DB_PASSWORD:-changeme_strong_password}@db:5432/tiqkets
      NODE_ENV: production
      PORT: "5000"
    volumes:
      # Persist user-uploaded files across container restarts/rebuilds
      - uploads:/app/server/uploads
      # NOTE: static-build is intentionally NOT a volume — it is built into the
      # Docker image so bundles are always in sync with the deployed code.

volumes:
  pgdata:
  uploads:
