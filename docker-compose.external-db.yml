services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
    volumes:
      - uploads:/app/server/uploads
      - static_build:/app/static-build

volumes:
  uploads:
  static_build:
