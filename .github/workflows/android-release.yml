name: Android release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example, 1.0.1)
        required: true
        type: string
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Google Play release status
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ (inputs.track || 'internal') == 'production' && 'google-play-production' || 'google-play-testing' }}
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      PLAY_TRACK: ${{ inputs.track || 'internal' }}
      PLAY_STATUS: ${{ inputs.status || 'draft' }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use X.Y.Z format; received: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Set Android version code
        shell: bash
        run: echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate release configuration
        shell: bash
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || {
            echo "Repository environment variable EXPO_PUBLIC_API_URL is required." >&2
            exit 1
          }
          npx expo-doctor
          npx expo export --platform android --output-dir /tmp/tiqkets-export --clear

      - name: Generate release notes
        run: node scripts/generate-release-notes.mjs "$RELEASE_VERSION"

      - name: Generate native Android project
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore Android upload keystore
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || {
            echo "ANDROID_KEYSTORE_BASE64 is required." >&2
            exit 1
          }
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/tiqkets-upload.jks"
          echo "TIQKETS_UPLOAD_STORE_FILE=$RUNNER_TEMP/tiqkets-upload.jks" >> "$GITHUB_ENV"

      - name: Configure release signing
        run: node scripts/configure-android-signing.mjs
        env:
          TIQKETS_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TIQKETS_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TIQKETS_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build and upload with Fastlane
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          TIQKETS_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TIQKETS_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TIQKETS_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android release

      - name: Collect signed bundle
        shell: bash
        run: cp android/app/build/outputs/bundle/release/app-release.aab "tiqkets-$RELEASE_VERSION.aab"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "tiqkets-$RELEASE_VERSION.aab" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "tiqkets-$RELEASE_VERSION.aab" \
              --target "$GITHUB_SHA" \
              --title "TIQKETS $RELEASE_VERSION" \
              --generate-notes
          fi

      - name: Publish workflow summary
        shell: bash
        run: |
          {
            echo "## TIQKETS Android $RELEASE_VERSION"
            echo
            echo "- Android version code: \`$ANDROID_VERSION_CODE\`"
            echo "- Google Play track: \`$PLAY_TRACK\`"
            echo "- Google Play status: \`$PLAY_STATUS\`"
            echo "- GitHub release: \`$RELEASE_TAG\`"
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"
