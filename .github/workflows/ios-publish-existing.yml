name: Publish existing iOS build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable GitHub Release containing the signed IPA (v1.0.15)
        required: true
        type: string
      build_run_id:
        description: Successful Publish mobile apps run that created the IPA
        required: true
        type: string
      destination:
        description: Upload to TestFlight or submit for public App Store review
        default: production
        type: choice
        options: [testing, production]
      publish_draft:
        description: Publish a draft GitHub Release after submission (no rebuilds)
        default: false
        type: boolean

concurrency:
  group: tiqkets-store-ios
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  CI: "true"
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_DESTINATION: ${{ inputs.destination }}
      PUBLISH_DRAFT: ${{ inputs.publish_draft }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify completed archive and release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vX.Y.Z tag.' >&2; exit 1; }
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Use a numeric Actions run ID.' >&2; exit 1; }
          mkdir -p release-output
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > release-output/build-run.json
          jq -e '.path == ".github/workflows/mobile-release.yml" and .status == "completed"' release-output/build-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" \
            --jq '.jobs' > release-output/build-jobs.json
          jq -e 'any(.[]; .name == "ios" and .conclusion == "success")' release-output/build-jobs.json
          build=$(jq -r '"\(.run_number).\(.run_attempt)"' release-output/build-run.json)
          [[ "$build" =~ ^[1-9][0-9]{0,3}\.[1-9][0-9]?$ ]] || { echo 'Invalid iOS build number.' >&2; exit 1; }
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json body,isDraft,isPrerelease,targetCommitish > release-output/release.json
          jq -e '.isPrerelease == false and (.body | length > 0)' release-output/release.json
          if [[ $(jq -r '.isDraft' release-output/release.json) == true ]]; then
            [[ "$PUBLISH_DRAFT" == true ]] || { echo 'Explicitly select publish_draft to submit this draft.' >&2; exit 1; }
            jq -e '.targetCommitish | test("^[0-9a-f]{40}$")' release-output/release.json
          fi
      - name: Download the exact validated artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ env.RELEASE_VERSION }}-${{ env.IOS_BUILD_NUMBER }}
          path: release-output
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Check IPA identity and prepare approved notes
        run: |
          ipa="release-output/tiqkets-$RELEASE_VERSION-$IOS_BUILD_NUMBER.ipa"
          test -f "$ipa"
          plist_entry=$(zipinfo -1 "$ipa" | grep -E '^Payload/[^/]+\.app/Info\.plist$')
          test "$(printf '%s\n' "$plist_entry" | wc -l | tr -d ' ')" -eq 1
          plist="$RUNNER_TEMP/tiqkets-build-info.plist"
          unzip -p "$ipa" "$plist_entry" > "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.tiqkets.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$IOS_BUILD_NUMBER"
          node scripts/generate-release-notes.mjs release-output/release.json 0
      - name: Submit the existing IPA with company API credentials
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: bundle exec fastlane ios publish
      - name: Publish the GitHub draft after successful store submission
        if: inputs.publish_draft
        run: |
          # GITHUB_TOKEN events do not trigger another release workflow. This
          # publishes the record without rebuilding either platform.
          if [[ $(jq -r '.isDraft' release-output/release.json) == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
