<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Queue Ticket</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:#e8e3dc;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:32px 16px 48px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body.embed{padding:0;background:transparent;align-items:flex-start;}
.pass{
  width:100%;
  max-width:440px;
  background:#fff;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.13);
  position:relative;
}

/* ── Banner ── */
.banner{
  position:relative;
  height:200px;
  overflow:hidden;
  border-radius:22px 22px 0 0;
}
.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
}
.banner-notch{
  position:absolute;
  bottom:-18px;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#e8e3dc;
  z-index:2;
}
.banner-notch.left{left:-18px;}
.banner-notch.right{right:-18px;}

/* ── Body ── */
.body{
  padding:20px 20px 16px;
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin-top:4px;
}
.body-left{flex:1;min-width:0;}
.body-right{
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

/* Mode icon + service */
.mode-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.mode-icon{width:28px;height:28px;color:#b5a99c;}
.service-name{
  font-size:12px;
  font-weight:600;
  color:#b5a99c;
  letter-spacing:0.8px;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Ticket icon + number */
.ticket-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ticket-icon{color:#c4b5aa;width:20px;height:20px;flex-shrink:0;}
.ticket-label{font-size:11px;color:#b5a99c;letter-spacing:0.5px;text-transform:uppercase;}
.ticket-number{
  font-size:34px;
  font-weight:800;
  color:#2d2419;
  letter-spacing:-1px;
  line-height:1;
}

/* Status badge */
.status-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  margin-top:4px;
  letter-spacing:0.3px;
}
.status-badge.waiting{background:#fef3c7;color:#b45309;}
.status-badge.called{background:#d1fae5;color:#065f46;}
.status-badge.serving{background:#dbeafe;color:#1e40af;}
.status-badge.completed{background:#f3f4f6;color:#6b7280;}
.status-badge.cancelled,.status-badge.no_show{background:#fee2e2;color:#991b1b;}
.status-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

/* Position */
.position-text{
  margin-top:8px;
  font-size:13px;
  color:#8c7f70;
  font-weight:500;
}
.position-text strong{color:#2d2419;}

/* QR code */
.qr-frame{
  width:120px;
  height:120px;
  border:2px dashed #d0c8be;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fafaf9;
}
.qr-frame img{width:100%;height:100%;object-fit:contain;}
.qr-placeholder{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:#c4b5aa;
  font-size:11px;
}
.branch-tag{
  font-size:10px;
  font-weight:600;
  color:#b5a99c;
  text-align:center;
  letter-spacing:0.5px;
  text-transform:uppercase;
  max-width:120px;
  word-break:break-word;
}

/* ── Dashed divider ── */
.divider{
  position:relative;
  margin:0 -1px;
  border-top:2px dashed #e0d8cf;
}
.divider-notch{
  position:absolute;
  top:-14px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#e8e3dc;
}
.divider-notch.left{left:-14px;}
.divider-notch.right{right:-14px;}

/* ── Customer section ── */
.customer-section{padding:16px 20px 12px;}
.info-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}
.info-icon{width:18px;height:18px;color:#b5a99c;flex-shrink:0;}
.info-text{font-size:14px;color:#3d3028;font-weight:500;}
.info-text.secondary{font-size:13px;color:#8c7f70;}
.details-row{display:flex;gap:24px;flex-wrap:wrap;}

/* ── Status timeline ── */
.timeline{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
  margin:4px 20px 12px;
}
.tl-step{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  flex:1;
}
.tl-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#e0d8cf;
  border:2px solid #e0d8cf;
  z-index:1;
}
.tl-dot.active{background:#22c55e;border-color:#22c55e;}
.tl-dot.current{background:#fff;border:2.5px solid #f59e0b;box-shadow:0 0 0 2px #fef3c7;}
.tl-label{font-size:9px;color:#b5a99c;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;text-align:center;}
.tl-label.active{color:#065f46;}
.tl-label.current{color:#b45309;}
.tl-line{flex:1;height:2px;background:#e0d8cf;margin-top:-19px;}
.tl-line.done{background:#22c55e;}

/* ── Footer ── */
.ticket-footer{
  background:#f7f4f0;
  padding:12px 20px 16px;
  text-align:center;
  border-top:1px solid #ede9e3;
}
.footer-text{font-size:12px;color:#9c8e80;line-height:1.5;font-style:italic;}

/* ── Loading / Error ── */
.loading-state,.error-state{
  padding:60px 24px;
  text-align:center;
  color:#b5a99c;
}
.error-state{color:#ef4444;}
.spinner{
  width:40px;height:40px;border:3px solid #e0d8cf;
  border-top-color:#c4b5aa;border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Live indicator (non-embed only) ── */
.live-bar{
  display:flex;align-items:center;justify-content:center;
  gap:6px;padding:8px;font-size:11px;color:#9c8e80;
  border-bottom:1px solid #f0ece6;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* called alert */
.called-banner{
  background:#22c55e;color:#fff;
  text-align:center;padding:10px 16px;
  font-size:14px;font-weight:700;
  animation:flash 1s ease-in-out infinite alternate;
}
@keyframes flash{from{opacity:1}to{opacity:0.7}}
</style>
</head>
<body>
<div class="pass" id="pass">
  <div id="loading-state" class="loading-state">
    <div class="spinner"></div>
    <div>Loading your ticket...</div>
  </div>
  <div id="ticket-content" style="display:none;">
    <div id="called-banner" class="called-banner" style="display:none;">
      Your turn has arrived — please proceed!
    </div>
    <div id="live-bar" class="live-bar">
      <span class="live-dot"></span>Live ticket status
    </div>
    <div class="banner">
      <img id="banner-img" src="/public/queue-ticket-template.png" alt="" />
      <div class="banner-notch left"></div>
      <div class="banner-notch right"></div>
    </div>
    <div class="body">
      <div class="body-left">
        <div class="mode-row">
          <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="mode-icon">
            <path d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"/>
          </svg>
          <span class="service-name" id="service-name">Service</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
          <svg class="ticket-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
          <span class="ticket-label">Ticket</span>
        </div>
        <div class="ticket-number" id="ticket-number">–</div>
        <span class="status-badge waiting" id="status-badge">
          <span class="status-dot"></span>
          <span id="status-text">Waiting</span>
        </span>
        <div class="position-text" id="position-text" style="display:none;"></div>
      </div>
      <div class="body-right">
        <div class="qr-frame" id="qr-frame">
          <div class="qr-placeholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d0c8be" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h.01M14 17h.01M17 14h.01M17 17h.01M20 14h.01M20 17h.01M20 20h.01"/></svg>
            <span>QR Code</span>
          </div>
        </div>
        <div class="branch-tag" id="branch-name">Branch</div>
      </div>
    </div>

    <div class="divider">
      <div class="divider-notch left"></div>
      <div class="divider-notch right"></div>
    </div>

    <div class="customer-section">
      <div class="info-row">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="info-text" id="customer-name">Guest</span>
      </div>
      <div class="details-row">
        <div class="info-row" style="margin:0;">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span class="info-text secondary" id="joined-time">–</span>
        </div>
        <div class="info-row" id="guests-row" style="margin:0;display:none;">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          <span class="info-text secondary" id="guests-text">1 guest</span>
        </div>
      </div>
    </div>

    <div class="timeline" id="timeline">
      <div class="tl-step">
        <div class="tl-dot active" id="tl-joined"></div>
        <div class="tl-label active">Joined</div>
      </div>
      <div class="tl-line" id="tl-line1"></div>
      <div class="tl-step">
        <div class="tl-dot" id="tl-called"></div>
        <div class="tl-label" id="tl-called-lbl">Called</div>
      </div>
      <div class="tl-line" id="tl-line2"></div>
      <div class="tl-step">
        <div class="tl-dot" id="tl-serving"></div>
        <div class="tl-label" id="tl-serving-lbl">Serving</div>
      </div>
      <div class="tl-line" id="tl-line3"></div>
      <div class="tl-step">
        <div class="tl-dot" id="tl-done"></div>
        <div class="tl-label" id="tl-done-lbl">Done</div>
      </div>
    </div>

    <div class="ticket-footer">
      <div class="footer-text" id="footer-text">
        Show this QR code to staff. Head to the counter within 2 minutes of being called.
      </div>
    </div>
  </div>
  <div id="error-state" class="error-state" style="display:none;">
    <div style="font-size:32px;margin-bottom:12px;">✕</div>
    <div id="error-text">Ticket not found</div>
  </div>
</div>

<script>
(function(){
  const path = window.location.pathname; // /queue-ticket/TOKEN
  const parts = path.split('/');
  const token = parts[parts.length - 1];
  const isEmbed = new URLSearchParams(window.location.search).has('embed');
  if(isEmbed){ document.getElementById('live-bar').style.display='none'; }

  function fmt(iso){ try{ const d=new Date(iso); return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }catch(e){return'';} }
  function ordinal(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

  function getStatusClass(s){ return s==='waiting'?'waiting':s==='called'?'called':s==='serving'?'serving':s==='completed'?'completed':'cancelled'; }
  function getStatusLabel(s,mode){
    if(s==='waiting') return mode==='dinein'||mode==='dine_in'?'Waiting for table':mode==='checkin'||mode==='check_in'?'Awaiting check-in':mode==='takeaway'?'Order received':'Waiting';
    if(s==='called') return mode==='dinein'||mode==='dine_in'?'Table ready!':mode==='checkin'||mode==='check_in'?'Please approach':'Your turn!';
    if(s==='serving') return mode==='dinein'||mode==='dine_in'?'Seated':'In service';
    if(s==='completed') return 'Completed';
    if(s==='no_show') return 'Missed';
    return 'Cancelled';
  }
  function getFooterText(s,mode){
    if(s==='waiting') return mode==='dinein'||mode==='dine_in'?'Show this QR when your table is called. Please be nearby.':mode==='takeaway'?'Your order is being prepared. We will notify you when ready.':'Show this QR code to staff. Head to the counter within 2 minutes of being called.';
    if(s==='called') return 'Your turn has arrived! Please proceed to the counter now.';
    if(s==='serving') return 'You are currently being served. Thank you for your patience.';
    return 'Thank you for visiting. See you again!';
  }
  function getModeIcon(mode){
    if(mode==='dinein'||mode==='dine_in') return '<path d="M3 11l19-9-9 19-2-8-8-2z"/>';
    if(mode==='takeaway') return '<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>';
    if(mode==='checkin'||mode==='check_in') return '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>';
    if(mode==='multistage') return '<circle cx="12" cy="12" r="10"/><polyline points="16 12 12 8 8 12"/><line x1="12" y1="16" x2="12" y2="8"/>';
    return '<path d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>';
  }

  function render(data){
    document.getElementById('loading-state').style.display='none';
    document.getElementById('ticket-content').style.display='block';

    const mode=data.queueMode||'fifo';
    const status=data.status||'waiting';
    const sc=getStatusClass(status);

    // Mode icon
    document.getElementById('mode-icon').innerHTML=getModeIcon(mode);
    document.getElementById('service-name').textContent=data.serviceName||'Queue';
    document.getElementById('ticket-number').textContent=data.ticketNumber||'–';
    document.getElementById('customer-name').textContent=data.customerName||'Guest';
    document.getElementById('branch-name').textContent=data.branchName||'';
    document.getElementById('joined-time').textContent=fmt(data.joinedAt);

    // Status badge
    const badge=document.getElementById('status-badge');
    badge.className='status-badge '+sc;
    document.getElementById('status-text').textContent=getStatusLabel(status,mode);

    // Called banner
    document.getElementById('called-banner').style.display=(status==='called')?'block':'none';

    // Position
    const posEl=document.getElementById('position-text');
    if(status==='waiting'&&data.position>0){
      posEl.style.display='block';
      posEl.innerHTML='<strong>'+ordinal(data.position)+'</strong> in queue'+(data.estimatedWait>0?' &bull; ~'+data.estimatedWait+' min':'');
    } else { posEl.style.display='none'; }

    // QR code
    const qrFrame=document.getElementById('qr-frame');
    qrFrame.innerHTML='<img src="/queue-qr/'+token+'.png" style="width:100%;height:100%;object-fit:contain;" onerror="this.parentNode.innerHTML=\'<span style=color:#c4b5aa;font-size:11px>QR error</span>\'" />';

    // Guests
    const guests=data.formData&&(data.formData.guests||data.formData.Guests||data.formData.guestCount);
    if(guests&&guests>1){ document.getElementById('guests-row').style.display='flex'; document.getElementById('guests-text').textContent=guests+' guests'; }

    // Timeline
    const states=['waiting','called','serving','completed'];
    const idx=Math.max(0,states.indexOf(status));
    const dots=['tl-joined','tl-called','tl-serving','tl-done'];
    const lbls=['tl-called-lbl','tl-serving-lbl','tl-done-lbl'];
    const lines=['tl-line1','tl-line2','tl-line3'];
    dots.forEach((id,i)=>{
      const el=document.getElementById(id);
      if(i<idx){el.className='tl-dot active';}
      else if(i===idx){el.className='tl-dot current';}
      else{el.className='tl-dot';}
    });
    lines.forEach((id,i)=>{
      document.getElementById(id).className='tl-line'+(i<idx?' done':'');
    });

    // Footer
    document.getElementById('footer-text').textContent=getFooterText(status,mode);

    if(isEmbed) document.body.dataset.ready='1';
  }

  function showError(msg){
    document.getElementById('loading-state').style.display='none';
    document.getElementById('error-state').style.display='block';
    document.getElementById('error-text').textContent=msg||'Ticket not found';
    if(isEmbed) document.body.dataset.ready='1';
  }

  async function load(){
    try{
      const r=await fetch('/api/queue-ticket/'+token+'?t='+Date.now());
      if(!r.ok){ showError(r.status===404?'Ticket not found':'Could not load ticket'); return; }
      render(await r.json());
    }catch(e){ showError('Connection error'); }
  }

  load();
  if(!isEmbed) setInterval(load, 6000);
})();
</script>
</body>
</html>
