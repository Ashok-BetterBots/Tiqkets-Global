<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
  background: #e8e3dc;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 36px 16px 48px;
}
.pass {
  width: 360px;
  background: #ffffff;
  border-radius: 26px;
  overflow: visible;
  box-shadow: 0 28px 80px rgba(0,0,0,0.18), 0 4px 16px rgba(0,0,0,0.08);
  position: relative;
}
/* ── Food banner ───────────────────────────────────────── */
.banner {
  width: 100%;
  height: 198px;
  background: url('/assets/images/dine-in-banner.png') center top / cover no-repeat;
  border-radius: 26px 26px 0 0;
  position: relative;
  overflow: hidden;
}
.banner::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 55%, rgba(0,0,0,0.22) 100%);
}
/* ── Notch row (ticket perforation) ────────────────────── */
.notch-row {
  display: flex;
  align-items: center;
  background: #ffffff;
  padding: 0;
  position: relative;
}
.notch-cut {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #e8e3dc;
  flex-shrink: 0;
  margin-top: -12px;
}
.notch-line {
  flex: 1;
  height: 0;
  border-top: 2px dashed #e0d8cf;
  margin: 0 6px;
  margin-top: -12px;
}
/* ── Card body ─────────────────────────────────────────── */
.body {
  padding: 18px 22px 22px;
  background: #ffffff;
  border-radius: 0 0 26px 26px;
  position: relative;
}
/* Faint watermark tiqkets logo pattern */
.body::before {
  content: 'TIQKETS';
  position: absolute;
  right: 14px;
  top: 22px;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #f0ebe4;
  text-transform: uppercase;
  pointer-events: none;
  user-select: none;
}
/* ── Info rows ─────────────────────────────────────────── */
.info-row {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 13px;
}
.icon-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #f5f0e8;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.field-label {
  font-size: 9.5px;
  color: #b8ae9f;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 700;
  line-height: 1;
}
.field-value {
  font-size: 14.5px;
  font-weight: 800;
  color: #1c1917;
  margin-top: 2px;
  line-height: 1.1;
}
/* ── QR + Info split ───────────────────────────────────── */
.split-row {
  display: flex;
  gap: 12px;
  margin: 4px 0 16px;
}
.qr-box {
  flex: 0 0 138px;
  background: #f7f3ee;
  border-radius: 16px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.qr-box img {
  width: 114px;
  height: 114px;
  display: block;
  border-radius: 4px;
}
.qr-scan-label {
  font-size: 8.5px;
  color: #c4b49a;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 700;
  text-align: center;
}
.info-box {
  flex: 1;
  background: #f7f3ee;
  border-radius: 16px;
  padding: 12px 11px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
}
/* Corner bracket decorators */
.corner {
  position: absolute;
  width: 13px;
  height: 13px;
  border-color: #c9a46a;
  border-style: solid;
}
.c-tl { top: 7px; left: 7px; border-width: 2px 0 0 2px; border-radius: 3px 0 0 0; }
.c-tr { top: 7px; right: 7px; border-width: 2px 2px 0 0; border-radius: 0 3px 0 0; }
.c-bl { bottom: 7px; left: 7px; border-width: 0 0 2px 2px; border-radius: 0 0 0 3px; }
.c-br { bottom: 7px; right: 7px; border-width: 0 2px 2px 0; border-radius: 0 0 3px 0; }
/* ── Dashed separator ──────────────────────────────────── */
.separator {
  border: none;
  border-top: 2px dashed #e0d8cf;
  margin: 2px 0 14px;
}
/* ── Bottom info row ───────────────────────────────────── */
.bottom-row {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
}
.bottom-item {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
}
/* ── Footer instruction ────────────────────────────────── */
.footer {
  background: #f7f3ee;
  border-radius: 13px;
  padding: 10px 14px;
  text-align: center;
  font-size: 11px;
  color: #a09282;
  line-height: 1.55;
  font-weight: 500;
}
/* ── Non-embed page chrome ─────────────────────────────── */
.page-header {
  text-align: center;
  margin-bottom: 20px;
  color: #7a6e64;
  font-size: 13px;
  font-weight: 600;
}
.arrived-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #d1fae5;
  color: #065f46;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 16px;
}
</style>
</head>
<body>
<div>
  <!-- Non-embed: show status badge above card -->
  <div id="page-header" class="page-header" style="display:none"></div>

  <div class="pass">
    <div class="banner"></div>
    <div class="notch-row">
      <div class="notch-cut"></div>
      <div class="notch-line"></div>
      <div class="notch-cut"></div>
    </div>
    <div class="body">

      <!-- Restaurant Name -->
      <div class="info-row">
        <div class="icon-circle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c9a46a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
            <path d="M7 2v20"/>
            <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
        </div>
        <div>
          <div class="field-label">Restaurant</div>
          <div class="field-value" id="restaurantName">—</div>
        </div>
      </div>

      <!-- Booking ID -->
      <div class="info-row">
        <div class="icon-circle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c9a46a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
            <path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>
          </svg>
        </div>
        <div>
          <div class="field-label">Booking ID</div>
          <div class="field-value" id="bookingId">—</div>
        </div>
      </div>

      <!-- QR code + info box -->
      <div class="split-row">
        <div class="qr-box">
          <img id="qrImg" src="" alt="QR Code">
          <div class="qr-scan-label">Scan to check in</div>
        </div>
        <div class="info-box">
          <div class="corner c-tl"></div>
          <div class="corner c-tr"></div>
          <div class="corner c-bl"></div>
          <div class="corner c-br"></div>
          <div>
            <div class="field-label">Branch</div>
            <div id="branchName" style="font-size:13px;font-weight:800;color:#1c1917;margin-top:2px;line-height:1.25;">—</div>
          </div>
          <div>
            <div class="field-label">Queue No.</div>
            <div id="position" style="font-size:30px;font-weight:900;color:#c9a46a;margin-top:2px;letter-spacing:-1px;line-height:1;">—</div>
          </div>
        </div>
      </div>

      <hr class="separator">

      <!-- Customer Name -->
      <div class="info-row">
        <div class="icon-circle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c9a46a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="5" rx="2"/>
            <path d="M16 14a2 2 0 0 1-2-2V9a2 2 0 0 1 4 0v3a2 2 0 0 1-2 2Z"/>
            <path d="M6 9h4"/><path d="M6 13h4"/>
          </svg>
        </div>
        <div>
          <div class="field-label">Customer</div>
          <div class="field-value" id="customerName">—</div>
        </div>
      </div>

      <!-- Registered time + Guests -->
      <div class="bottom-row">
        <div class="bottom-item">
          <div class="icon-circle">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c9a46a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12,6 12,12 16,14"/>
            </svg>
          </div>
          <div>
            <div class="field-label">Registered</div>
            <div id="joinedAt" style="font-size:13px;font-weight:700;color:#1c1917;margin-top:2px;">—</div>
          </div>
        </div>
        <div class="bottom-item">
          <div class="icon-circle">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#c9a46a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div>
            <div class="field-label">Guests</div>
            <div id="guestCount" style="font-size:13px;font-weight:700;color:#1c1917;margin-top:2px;">—</div>
          </div>
        </div>
      </div>

      <div class="footer">Show this QR ticket at the entrance. Head to reception within 2 minutes of being called.</div>

    </div><!-- /.body -->
  </div><!-- /.pass -->
</div>

<script>
(function() {
  var d = window.__TICKET_DATA__;
  if (!d) return;

  function setText(id, val) {
    var el = document.getElementById(id);
    if (el) el.textContent = val || '—';
  }

  setText('restaurantName', d.restaurantName);
  setText('bookingId', d.bookingId ? '#' + d.bookingId : '—');
  setText('branchName', d.branchName);
  setText('customerName', d.customerName);
  setText('guestCount', d.guestCount || '1');
  setText('position', d.position ? '#' + d.position : '—');

  if (d.joinedAt) {
    try {
      var dt = new Date(d.joinedAt);
      setText('joinedAt', dt.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }));
    } catch(e) { setText('joinedAt', d.joinedAt); }
  }

  if (d.qrDataUrl) {
    var img = document.getElementById('qrImg');
    if (img) img.src = d.qrDataUrl;
  }

  // Show arrived badge on the non-embed page
  var header = document.getElementById('page-header');
  if (header && !d.embed) {
    header.style.display = 'block';
    if (d.arrived) {
      header.innerHTML = '<span class="arrived-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Checked In — Welcome!</span>';
    } else {
      header.textContent = 'Your Dine-In Ticket';
    }
  }

  document.body.setAttribute('data-ready', '1');
})();
</script>
</body>
</html>
