            <template x-if="subscription && subscription.pendingPlanId">
              <div class="dash-card mb-8 bg-amber-50/60 border-amber-200/60">
                <div class="flex items-center justify-between gap-4">
                  <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center"><i class="fa-solid fa-clock-rotate-left"></i></div>
                    <div>
                      <p class="text-sm font-bold text-amber-900">Plan change scheduled</p>
                      <p class="text-xs text-amber-700 mt-0.5">
                        Your plan will switch to
                        <span class="font-bold" x-text="(plans.find(p => p.id === subscription.pendingPlanId)?.name) || 'a new plan'"></span>
                        on
                        <span class="font-bold" x-text="subscription.currentPeriodEnd ? new Date(subscription.currentPeriodEnd).toLocaleDateString() : 'your next billing date'"></span>.
                        Your current plan stays active until then.
                      </p>
                    </div>
                  </div>
                  <button x-show="hasPerm('org.billing.manage')" @click="cancelPendingChange()" class="px-3 py-2 rounded-lg bg-white border border-amber-200 text-amber-700 text-xs font-bold hover:bg-amber-100 transition-colors">
                    <i class="fa-solid fa-rotate-left mr-1.5"></i>Cancel scheduled change
                  </button>
                </div>
              </div>
            </template>

            <!-- Plan Usage (current vs cap). Hidden until /api/dashboard/plan-limits resolves. -->
            <template x-if="planLimits && planLimits.enforced">
              <div class="dash-card mb-8" testID="card-plan-usage">
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <h3 class="font-bold text-gray-900">Plan Usage</h3>
                    <p class="text-xs text-gray-400 mt-0.5">How much of your subscription you've used right now.</p>
                  </div>
                  <button @click="loadPlanLimits()" class="text-xs text-brand font-bold hover:text-brand-dark transition-colors" testID="button-refresh-plan-usage">
                    <i class="fa-solid fa-rotate mr-1"></i>Refresh
                  </button>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <template x-for="m in planUsageMetrics()" :key="m.key">
                    <div class="rounded-xl border border-gray-100 p-4 bg-white" :testID="'usage-' + m.key">
                      <p class="text-[11px] uppercase tracking-wide text-gray-400 font-bold mb-1" x-text="m.label"></p>
                      <p class="text-2xl font-extrabold" :class="m.atCap ? 'text-red-600' : (m.nearCap ? 'text-amber-600' : 'text-gray-900')">
                        <span x-text="m.current"></span><span class="text-sm text-gray-400 font-bold" x-text="m.cap === null ? ' / unlimited' : ' / ' + m.cap"></span>
                      </p>
                      <div x-show="m.cap !== null" class="mt-2 h-1.5 rounded-full bg-gray-100 overflow-hidden">
                        <div class="h-full transition-all duration-300" :class="m.atCap ? 'bg-red-500' : (m.nearCap ? 'bg-amber-500' : 'bg-brand')" :style="'width:' + m.pct + '%'"></div>
                      </div>
                      <p x-show="m.atCap" class="text-[10px] text-red-600 font-bold mt-1.5" testID="warning-at-cap">Limit reached</p>
                      <p x-show="!m.atCap && m.nearCap" class="text-[10px] text-amber-600 font-bold mt-1.5">Approaching limit</p>
                    </div>
                  </template>
                </div>
                <p x-show="planLimits.servicesPerBranchCap !== null" class="text-[11px] text-gray-400 mt-3">
                  Each branch can host up to <span class="font-bold text-gray-600" x-text="planLimits.servicesPerBranchCap"></span> services on this plan.
                </p>
              </div>
            </template>

            <!-- Plans Grid -->
            <div class="mb-8">
              <h3 class="font-bold text-gray-900 mb-1">Available Plans</h3>
              <p class="text-sm text-gray-400 mb-6">Choose the perfect plan for your centre</p>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <template x-for="plan in plansForDisplay()" :key="plan.id">
                  <div class="dash-card relative transition-all duration-300" :class="plan.name === 'Professional' ? 'ring-2 ring-brand shadow-xl shadow-brand/10 scale-[1.02]' : 'hover:shadow-lg'">
                    <div x-show="plan.name === 'Professional'" class="absolute -top-3 left-1/2 -translate-x-1/2">
                      <span class="px-4 py-1 bg-gradient-to-r from-brand to-brand-dark text-white text-[10px] font-bold rounded-full shadow-md uppercase tracking-wide">Most Popular</span>
                    </div>
                    <div class="text-center pt-2 pb-4 border-b border-gray-100 mb-5">
                      <h4 class="text-lg font-extrabold text-gray-900" x-text="plan.name"></h4>
                      <p class="text-xs text-gray-400 mt-1 h-8" x-text="plan.description || ''"></p>
                      <div class="mt-4">
                        <span class="text-4xl font-black text-gray-900" x-text="'&#8377;' + (plan.monthlyPrice / 100)"></span>
                        <span class="text-sm text-gray-400 font-medium">/month</span>
                      </div>
                    </div>
                    <ul class="space-y-3 mb-6 text-sm text-gray-600">
                      <template x-for="(spec, idx) in planSpecLines(plan)" :key="idx">
                        <li class="flex items-start gap-2.5">
                          <div class="w-5 h-5 rounded-full bg-green-50 text-green-500 flex items-center justify-center flex-shrink-0 mt-0.5"><i :class="spec.icon || 'fa-solid fa-check'" class="text-[10px]"></i></div>
                          <span class="text-sm" x-text="spec.label"></span>
                        </li>
                      </template>
                    </ul>
                    <button x-show="hasPerm('org.billing.manage')" @click="subscribeToPlan(plan)" class="w-full py-3 rounded-xl font-bold text-sm transition-all duration-200"
                      :class="planRelation(plan) === 'current' ? 'bg-gray-100 text-gray-400 cursor-not-allowed border border-gray-200' : (planRelation(plan) === 'upgrade' ? 'bg-gradient-to-r from-brand to-brand-dark text-white hover:shadow-lg shadow-brand/20' : (planRelation(plan) === 'downgrade' ? 'bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200' : 'bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200'))"
                      :disabled="planRelation(plan) === 'current'"
                      x-text="planButtonLabel(plan)"></button>
                  </div>
                </template>
              </div>
            </div>

            <!-- Payment History -->
            <div class="dash-card-flat">
              <div class="px-6 py-4 border-b border-gray-100">
                <h3 class="font-bold text-gray-900">Payment History</h3>
              </div>
              <div x-show="payments.length > 0">
                <table class="w-full">
                  <thead>
                    <tr><th class="table-header">Date</th><th class="table-header">Amount</th><th class="table-header">Status</th><th class="table-header">Reference</th><th class="table-header text-right">Invoice</th></tr>
                  </thead>
                  <tbody class="divide-y divide-gray-50">
                    <template x-for="pay in payments" :key="pay.id">
                      <tr class="hover:bg-brand-50/20 transition-colors">
                        <td class="table-cell text-xs font-medium text-gray-500" x-text="pay.paidAt ? new Date(pay.paidAt).toLocaleDateString() : '-'"></td>
                        <td class="table-cell font-bold text-gray-900" x-text="'&#8377;' + (pay.amount / 100)"></td>
                        <td class="table-cell">
                          <span class="badge" :class="{
                            'bg-green-50 text-green-600 border border-green-200': pay.status === 'captured' || pay.status === 'paid',
                            'bg-amber-50 text-amber-600 border border-amber-200': pay.status === 'pending',
                            'bg-red-50 text-red-600 border border-red-200': pay.status === 'refunded' || pay.status === 'failed'
                          }" x-text="pay.status"></span>
                        </td>
                        <td class="table-cell text-xs text-gray-400 font-mono" x-text="pay.razorpayPaymentId || '-'"></td>
                        <td class="table-cell text-right">
                          <template x-if="pay.status === 'captured'">
                            <div class="inline-flex items-center gap-1">
                              <!--
                                View opens the PDF inline in a new tab;
                                download forces Content-Disposition: attachment
                                via ?download=1. Both hit the same per-payment
                                route which scopes by org via assertOrgOwnership.
                              -->
                              <a :href="'/api/billing/payments/' + pay.id + '/invoice'" target="_blank" rel="noopener"
                                 class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold text-brand hover:bg-brand-50 transition-colors"
                                 title="View invoice">
                                <i class="fa-solid fa-eye"></i> View
                              </a>
                              <a :href="'/api/billing/payments/' + pay.id + '/invoice?download=1'"
                                 class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold text-gray-600 hover:bg-gray-100 transition-colors"
                                 title="Download invoice PDF">
                                <i class="fa-solid fa-download"></i> PDF
                              </a>
                            </div>
                          </template>
                          <template x-if="pay.status !== 'captured'">
                            <span class="text-xs text-gray-300">—</span>
                          </template>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div x-show="payments.length === 0" class="text-center py-12">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-3"><i class="fa-solid fa-receipt text-xl text-gray-300"></i></div>
                <p class="text-sm font-semibold text-gray-400">No payments yet</p>
                <p class="text-xs text-gray-300 mt-1">Your payment history will appear here</p>
              </div>
            </div>
          </div>

          <!-- TECH SUPPORT PAGE -->
          <div x-show="currentPage === 'support'" x-transition>
            <div class="flex justify-between items-center mb-6 gap-3 flex-wrap">
              <div class="flex items-center gap-2">
                <select x-model="supportStatusFilter" @change="loadOrgSupport()" class="px-3 py-2 rounded-xl border border-gray-200 bg-white text-xs font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-brand/20 focus:border-brand">
                  <option value="">All statuses</option>
                  <option value="open">Open</option>
                  <option value="in_progress">In Progress</option>
                  <option value="awaiting_reply">Awaiting Reply</option>
                  <option value="resolved">Resolved</option>
                  <option value="closed">Closed</option>
                </select>
                <button @click="loadOrgSupport()" class="px-3 py-2 rounded-xl border border-gray-200 bg-white text-xs font-semibold text-gray-700 hover:bg-gray-50">
                  <i class="fa-solid fa-rotate" :class="{ 'fa-spin': supportLoading }"></i>
                </button>
              </div>
              <button @click="openOrgNewTicket()" class="btn-primary"><i class="fa-solid fa-plus mr-2"></i>New ticket</button>
            </div>

            <template x-if="supportLoading && supportTickets.length === 0">
              <div class="dash-card text-center py-10 text-xs text-gray-400">Loading tickets…</div>
            </template>
            <template x-if="!supportLoading && supportTickets.length === 0">
              <div class="dash-card text-center py-12">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-brand-50 text-brand flex items-center justify-center mb-3"><i class="fa-solid fa-life-ring text-xl"></i></div>
                <p class="text-sm font-bold text-gray-700">No tickets yet</p>
                <p class="text-xs text-gray-400 mt-1">Have a question or issue? Open your first ticket — our team replies right here.</p>
                <button @click="openOrgNewTicket()" class="btn-primary mt-4 text-xs"><i class="fa-solid fa-plus mr-1.5"></i>Open a ticket</button>
              </div>
            </template>
            <template x-if="!supportLoading && filteredSupportTickets.length === 0 && supportTickets.length > 0">
              <div class="dash-card text-center py-10 text-xs text-gray-400">No tickets match this filter.</div>
            </template>

            <div class="space-y-3" x-show="filteredSupportTickets.length > 0">
              <template x-for="t in filteredSupportTickets" :key="t.id">
                <button @click="openOrgTicket(t)" class="w-full text-left dash-card hover:border-brand/40 hover:shadow-md transition-all">
                  <div class="flex items-start justify-between gap-3 mb-2">
                    <div class="flex items-center gap-2">
                      <span class="font-mono text-[11px] font-bold text-brand" x-text="t.ticketNumber"></span>
                      <span class="badge text-[10px]" :class="{
                        'bg-amber-50 text-amber-700 border border-amber-200': t.status === 'open',
                        'bg-blue-50 text-blue-700 border border-blue-200': t.status === 'in_progress' || t.status === 'awaiting_reply',
                        'bg-green-50 text-green-700 border border-green-200': t.status === 'resolved',
                        'bg-gray-100 text-gray-600 border border-gray-200': t.status === 'closed'
                      }" x-text="formatTicketStatus(t.status)"></span>
                      <span class="badge text-[10px]" :class="{
                        'bg-red-50 text-red-700 border border-red-200': t.priority === 'high',
                        'bg-amber-50 text-amber-700 border border-amber-200': t.priority === 'medium',
                        'bg-gray-100 text-gray-600 border border-gray-200': t.priority === 'low'
                      }" x-text="formatTicketPriority(t.priority)"></span>
                    </div>
                    <span class="text-[11px] text-gray-400" x-text="'Updated ' + supportTimeAgo(t.updatedAt)"></span>
                  </div>
                  <p class="text-sm font-bold text-gray-900" x-text="t.subject"></p>
                  <p x-show="t.description" class="text-xs text-gray-500 mt-1 line-clamp-2" x-text="t.description"></p>
                </button>
              </template>
            </div>
          </div>

          <!-- TECH SUPPORT — New ticket modal -->
          <div x-show="supportComposerOpen" x-cloak x-transition.opacity class="fixed inset-0 z-40 flex items-center justify-center p-4" @keydown.escape.window="supportComposerOpen = false">
            <div class="absolute inset-0" style="background: rgba(15,23,42,0.55); backdrop-filter: blur(4px);" @click="supportComposerOpen = false"></div>
            <div class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-xl">
              <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-base font-bold text-gray-900">Open a ticket</h3>
                <button @click="supportComposerOpen = false" class="w-9 h-9 rounded-lg hover:bg-gray-50 text-gray-400 inline-flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="px-6 py-5 space-y-4">
                <div>
                  <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500">Subject</label>
                  <input x-model="supportComposerSubject" type="text" placeholder="A short summary" class="mt-1 w-full px-3 py-2 rounded-xl border border-gray-200 bg-gray-50/80 text-sm focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none" />
                </div>
                <div>
                  <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500">Priority</label>
                  <div class="flex gap-2 mt-1">
                    <template x-for="p in ['low','medium','high']" :key="p">
                      <button type="button" @click="supportComposerPriority = p"
                              class="px-3 py-1.5 rounded-full border text-xs font-bold capitalize"
                              :class="supportComposerPriority === p ? 'bg-brand text-white border-brand' : 'bg-white text-gray-700 border-gray-200 hover:border-gray-300'"
                              x-text="p"></button>
                    </template>
                  </div>
                </div>
                <div>
                  <label class="text-[11px] font-bold uppercase tracking-wider text-gray-500">Describe your question or issue</label>
                  <textarea x-model="supportComposerBody" rows="6" placeholder="Provide as much detail as you can — you can keep chatting after the ticket is created."
                            class="mt-1 w-full px-3 py-2 rounded-xl border border-gray-200 bg-gray-50/80 text-sm focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none" style="resize: vertical;"></textarea>
                </div>
              </div>
              <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-2">
                <button @click="supportComposerOpen = false" class="px-4 py-2 rounded-xl text-xs font-bold text-gray-500 hover:bg-gray-50">Cancel</button>
                <button @click="submitOrgNewTicket()" :disabled="!supportComposerSubject.trim() || supportComposerSubmitting" class="btn-primary text-xs">
                  <i class="fa-solid fa-paper-plane mr-1.5"></i>
                  <span x-text="supportComposerSubmitting ? 'Opening…' : 'Open ticket'"></span>
                </button>
              </div>
            </div>
          </div>

          <!-- TECH SUPPORT — Chat thread modal -->
          <div x-show="supportThreadOpen" x-cloak x-transition.opacity class="fixed inset-0 z-40 flex items-center justify-center p-4" @keydown.escape.window="supportThreadOpen = false">
            <div class="absolute inset-0" style="background: rgba(15,23,42,0.55); backdrop-filter: blur(4px);" @click="supportThreadOpen = false"></div>
            <div class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col" style="max-height: 90vh;">
              <div class="px-6 py-4 border-b border-gray-100 flex items-start justify-between gap-3">
                <div class="min-w-0 flex-1">
                  <div class="text-[11px] font-bold tracking-wider text-gray-500 uppercase" x-text="(supportThread?.ticketNumber || '') + ' · ' + formatTicketStatus(supportThread?.status || '')"></div>
                  <h3 class="text-lg font-bold text-gray-900 truncate" x-text="supportThread?.subject || ''"></h3>
                </div>
                <button @click="supportThreadOpen = false" class="w-9 h-9 rounded-lg hover:bg-gray-50 text-gray-400 inline-flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="flex-1 overflow-y-auto px-6 py-4 space-y-3" style="background: #F8FAFC;" x-ref="supportThreadScroll">
                <template x-if="supportThreadLoading">
                  <div class="text-center text-gray-400 py-6 text-sm">Loading conversation…</div>
                </template>
                <template x-if="!supportThreadLoading && supportMessages.length === 0">
                  <div class="text-center text-gray-400 py-6 text-sm">No messages yet — say hello below.</div>
                </template>
                <template x-for="m in supportMessages" :key="m.id">
                  <div :class="m.senderType === 'org' ? 'flex justify-end' : 'flex justify-start'">
                    <div :class="m.senderType === 'org' ? 'bg-brand text-white' : 'bg-white text-gray-800 border border-gray-100'"
                         class="rounded-2xl px-4 py-2.5 max-w-[78%] shadow-sm">
                      <div class="text-[10px] font-bold tracking-wider uppercase opacity-70 mb-1"
                           x-text="(m.senderName || (m.senderType === 'org' ? 'You' : 'Tech Support')) + ' · ' + supportTimeAgo(m.createdAt)"></div>
                      <div class="text-sm whitespace-pre-wrap leading-relaxed" x-text="m.body"></div>
                    </div>
                  </div>
                </template>
              </div>
              <div class="px-6 py-4 border-t border-gray-100">
                <div class="flex items-end gap-2">
                  <textarea x-model="supportReplyDraft" rows="2" placeholder="Type your reply…"
                            class="flex-1 px-3 py-2 rounded-xl border border-gray-200 bg-gray-50/80 text-sm focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none"
                            style="resize: vertical; min-height: 60px;"
                            @keydown.meta.enter.prevent="sendOrgTicketReply()" @keydown.ctrl.enter.prevent="sendOrgTicketReply()"></textarea>
                  <button @click="sendOrgTicketReply()" :disabled="!supportReplyDraft.trim() || supportReplySending" class="btn-primary text-xs">
                    <i class="fa-solid fa-paper-plane mr-1"></i>
                    <span x-text="supportReplySending ? 'Sending…' : 'Send'"></span>
                  </button>
                </div>
                <div class="text-[11px] text-gray-400 mt-2">⌘/Ctrl + Enter to send</div>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </template>

  <!-- BRANCH MODAL -->
  <template x-if="showBranchModal">
    <div class="modal-overlay" @click.self="showBranchModal = false" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
      <div class="modal-content" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
        <div class="p-6 border-b border-gray-100 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand flex items-center justify-center"><i class="fa-solid fa-building"></i></div>
            <h3 class="text-lg font-extrabold text-gray-900" x-text="branchForm.id ? 'Edit Branch' : 'New Branch'"></h3>
          </div>
          <button @click="showBranchModal = false" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="p-6 space-y-4">
          <div><label class="block text-sm font-semibold text-gray-700 mb-2">Branch Name *</label><input x-model="branchForm.name" class="input-field" placeholder="Main Branch"></div>
          <div><label class="block text-sm font-semibold text-gray-700 mb-2">Address</label><input x-model="branchForm.address" class="input-field" placeholder="123 Main St"></div>
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-sm font-semibold text-gray-700 mb-2">City</label><input x-model="branchForm.city" class="input-field"></div>
            <div><label class="block text-sm font-semibold text-gray-700 mb-2">State</label><input x-model="branchForm.state" class="input-field"></div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-sm font-semibold text-gray-700 mb-2">Pincode</label><input x-model="branchForm.pincode" class="input-field"></div>
            <div><label class="block text-sm font-semibold text-gray-700 mb-2">Phone</label><input x-model="branchForm.phone" class="input-field"></div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Timezone</label>
            <!--
              IANA timezone for this branch. Drives how working hours,
              break times, holidays and booking slots are interpreted
              server-side. Defaults to the org's tz on new branches;
              owner can override per-branch (multi-region orgs).
            -->
            <select x-model="branchForm.timezone" class="input-field appearance-none">
              <option value="">Use organization default</option>
              <template x-for="tz in supportedTimezones" :key="tz">
                <option :value="tz" x-text="tz"></option>
              </template>
            </select>
            <p class="mt-1.5 text-xs text-gray-500">Working hours, breaks and booking slots for this branch are interpreted in this timezone.</p>
          </div>
        </div>
        <div class="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50/50">
          <button @click="showBranchModal = false" class="btn-secondary">Cancel</button>
          <button @click="saveBranch()" class="btn-primary" x-text="branchForm.id ? 'Update Branch' : 'Create Branch'"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- SERVICE MODAL -->
  <template x-if="showServiceModal">
    <div class="modal-overlay" @click.self="showServiceModal = false" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
      <div class="modal-content" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
        <div class="p-6 border-b border-gray-100 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand flex items-center justify-center"><i class="fa-solid fa-concierge-bell"></i></div>
            <h3 class="text-lg font-extrabold text-gray-900" x-text="serviceForm.id ? 'Edit Service' : 'New Service'"></h3>
          </div>
          <button @click="showServiceModal = false" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
          <div x-show="!serviceForm.id">

    async function api(path, options = {}) {
      const res = await fetch(BASE + path, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({ error: 'Request failed' }));
        const err = new Error(body.error || 'Request failed');
        err.status = res.status;
        err.body = body;
        throw err;
      }
      return res.json();
    }

          // Owner-direct org login: user.id is null (org credentials), grant full access.
          if (!this.currentUser?.id) return true;
          if (!this.permissionsLoaded) return true;
          return this.orgPermissions.includes(key);

        hasAnyPerm(keys) {
          if (!keys || keys.length === 0) return true;
          const role = this.currentUser?.role;
          if (role === 'super_admin') return true;
          if (!this.currentUser?.id) return true;
          if (!this.permissionsLoaded) return true;
          for (const k of keys) if (this.orgPermissions.includes(k)) return true;
          return false;
        },

        async refreshOrgPermissions() {
          try {
            const res = await fetch('/api/org/me/permissions', { credentials: 'include' });
            if (!res.ok) return;
            const data = await res.json();
            this.orgPermissions = Array.isArray(data?.permissions) ? data.permissions : [];
            this.permissionsLoaded = true;

            ];
            // If permissions are loaded for a staff user, gate by permission; otherwise fall back to legacy role list.
            if (this.permissionsLoaded && this.currentUser?.id && role !== 'super_admin') {
              return allItems.filter(item => this.orgPermissions.includes(item.permission));
            }
            return allItems.filter(item => item.roles.includes(role));
        },

        get accessibleBranches() {
            const role = this.currentUser?.role;
            if (role === 'admin') return this.branches;
            const assignedIds = [...(this.currentUser?.branchIds || [])];
            if (this.currentUser?.branchId && !assignedIds.includes(this.currentUser.branchId)) assignedIds.push(this.currentUser.branchId);
            if (assignedIds.length === 0) return this.branches;
            return this.branches.filter(b => assignedIds.includes(b.id));
        },

        // Active services in a branch that the current user may see/act on.
        // Front-desk staff are limited to their assigned services (when any are
        // set); admin / location manager / floor manager see every active
        // service in their accessible branches.
        accessibleServicesFor(branch) {
            const active = (branch?.services || []).filter(s => s.isActive);
            const role = this.currentUser?.role;
            const ids = this.currentUser?.assignedServiceIds || [];
            if (role === 'front_desk' && ids.length > 0) {
                return active.filter(s => ids.includes(s.id));
            }
            return active;
        },
        isServiceAccessible(serviceId) {
            const role = this.currentUser?.role;
            const ids = this.currentUser?.assignedServiceIds || [];
            if (role === 'front_desk' && ids.length > 0) return ids.includes(serviceId);
            return true;
        },

        waModeLabel(id) { return (this.waModeMeta[id] && this.waModeMeta[id].label) || id; },
        waLangLabel(code) { const l = this.waLanguages.find(x => x.code === code); return l ? l.label : code; },
        waCurrentTriggers() { return this.waTriggersByMode[this.waOrgMode] || []; },
        waCurrentVariables() { return this.waVariablesByMode[this.waOrgMode] || []; },
        waDefaultTemplate(mode, key, lang) {
          // For now all languages fall back to the EN default; users can edit per language.
          return this.waDefaultsEN[`${mode}|${key}`] || '';
        },
        waGetTemplate(mode, key, lang) {
          const ovKey = `${mode}|${key}|${lang}`;
          if (Object.prototype.hasOwnProperty.call(this.waOverrides, ovKey)) return this.waOverrides[ovKey];
          return this.waDefaultTemplate(mode, key, lang);
        },
        waIsModified(mode, key, lang) {
          return Object.prototype.hasOwnProperty.call(this.waOverrides, `${mode}|${key}|${lang}`);
        },
        waModifiedCount() {
          let n = 0;
          for (const t of this.waCurrentTriggers()) {
            if (this.waIsModified(this.waOrgMode, t.key, this.waLang)) n++;
          }
          return n;
        },
        waOpenEdit(t) {
          this.waEditing = { mode: this.waOrgMode, key: t.key, label: t.label, lang: this.waLang };
          this.waEditDraft = this.waGetTemplate(this.waOrgMode, t.key, this.waLang);
          this.waEditOpen = true;
        },
        waCloseEdit() { this.waEditOpen = false; this.waEditing = null; this.waEditDraft = ''; },
        waSaveEdit() {
          if (!this.waEditing) return;
          const { mode, key, lang } = this.waEditing;
          const ovKey = `${mode}|${key}|${lang}`;
          const def = this.waDefaultTemplate(mode, key, lang);
          const next = { ...this.waOverrides };
          if ((this.waEditDraft || '').trim() === (def || '').trim()) {
            delete next[ovKey];
          } else {
            next[ovKey] = this.waEditDraft;
          }
          this.waOverrides = next;
          this.waPersistOverrides();
          this.showToast('Template saved', 'success');
          this.waCloseEdit();
        },
        waResetEdit() {
          if (!this.waEditing) return;
          const { mode, key, lang } = this.waEditing;
          this.waEditDraft = this.waDefaultTemplate(mode, key, lang);
          this.showToast('Reset to default — click Save to apply', 'success');
        },
        waInsertVariable(name) {
          const ta = this.$refs.waOrgTextarea;
          const token = `{{${name}}}`;
          if (ta && typeof ta.selectionStart === 'number') {
            const start = ta.selectionStart, end = ta.selectionEnd;
            this.waEditDraft = this.waEditDraft.slice(0, start) + token + this.waEditDraft.slice(end);
            this.$nextTick(() => { ta.focus(); ta.setSelectionRange(start + token.length, start + token.length); });
          } else {
            this.waEditDraft += token;
          }
        },
        waRenderPreview(text) {
          if (!text) return '';
          return text.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (_, name) => {
            const v = this.waSampleData[name];
            return v !== undefined ? v : `{{${name}}}`;
          });
        },
        waPersistOverrides() {
          try {
            const orgId = this.org?.id || this.currentUser?.organizationId || 'default';
            localStorage.setItem(`tiqkets_org_wa_overrides_${orgId}`, JSON.stringify(this.waOverrides));
          } catch (_) {}
        },

          try {
            const orgId = this.org?.id || this.currentUser?.organizationId || 'default';
            const raw = localStorage.getItem(`tiqkets_org_wa_overrides_${orgId}`);
            if (raw) this.waOverrides = JSON.parse(raw);
          } catch (_) {}
        },

        async init() {
          // Wire up the country-state-city ESM module. If it's already on
          // window we flip the flag immediately; otherwise we wait for the
          // `csc-ready` event dispatched by the <script type="module">
          // import in <head>. Once ready we seed the default country and
          // dial code from the browser's locale (e.g. en-IN → +91 / India).
          const seedLocaleDefaults = () => {
            try {
              if (this.registerForm.country) return;
              const locale = new Intl.Locale(navigator.language || 'en-US');
              const region = (locale.region || '').toUpperCase();
              if (!region || !window.CSC) return;
              const c = window.CSC.Country.getCountryByCode(region);
              if (!c) return;
              this.registerForm.country = c.isoCode;
              this.registerForm.countryName = c.name;
              this.registerForm.dialCode = (c.phonecode || '').replace(/^\+/, '');
              this.registerForm.timezone = this.timezoneForCountryIso(c.isoCode) || '';
            } catch (e) { /* best-effort */ }
          };
          if (window.CSC) {
            this.cscReady = true;
            seedLocaleDefaults();
          } else {
            window.addEventListener('csc-ready', () => {
              this.cscReady = true;
              seedLocaleDefaults();
            }, { once: true });
          }

          const saved = localStorage.getItem('tiqkets_org');
          if (saved) {
            try {
              const data = JSON.parse(saved);
              this.org = data;
              this.loggedIn = true;
              const savedUser = localStorage.getItem('tiqkets_user');
              if (savedUser) {
                try { this.currentUser = JSON.parse(savedUser); } catch (e) { localStorage.removeItem('tiqkets_user'); }
              } else {
                this.currentUser = { id: null, name: data.name, email: data.email, role: 'admin', branchId: '', branchIds: [], assignedServiceIds: [], profilePictureUrl: '' };
              }
              await this.refreshOrgPermissions();
              this.currentPage = this.visibleMenuItems.length > 0 ? this.visibleMenuItems[0].id : 'queue';
              this.waLoadOverrides();
              await this.loadAllData();
              if (this.announcementsEnabled) this.connectAnnouncementSSE();
              this.startLivePolling();
            } catch (e) {
              localStorage.removeItem('tiqkets_org');
              localStorage.removeItem('tiqkets_user');
            }
          } else {
            // Not logged in — restore an in-progress OTP verification if
            // the owner reloaded mid-flow (e.g. switched to their email
            // app to copy the code, came back, and the page reloaded).
            this.hydratePendingVerify();
          }
        },

        // ---------- Email verification (OTP) helpers ----------
        // Persistence so a page refresh while the owner is reading the
        // OTP email doesn't drop them back to the sign-in screen.
        // 30-min TTL is well past the server-side 10-min OTP expiry but
        // bounded enough that a stale entry doesn't leak the previous
        // user's email on a shared browser.
        // PENDING_VERIFY_KEY is referenced as a string literal everywhere
        // below to keep this block self-contained.
        savePendingVerify() {
          try {
            localStorage.setItem('tiqkets_org_pending_verify', JSON.stringify({
              organizationId: this.pendingVerify.organizationId,
              email: this.pendingVerify.email,
              createdAt: Date.now(),
            }));
          } catch (_) {}
        },
        clearPendingVerify() {
          this.pendingVerify = { organizationId: '', email: '' };
          this.verifyForm.code = '';
          this.verifyError = '';
          this.verifyInfo = '';
          this.stopResendCooldown();
          try { localStorage.removeItem('tiqkets_org_pending_verify'); } catch (_) {}
        },
        hydratePendingVerify() {
          let raw;
          try { raw = localStorage.getItem('tiqkets_org_pending_verify'); } catch (_) { raw = null; }
          if (!raw) return;
          try {
            const parsed = JSON.parse(raw);
            const TTL_MS = 30 * 60 * 1000;
            const fresh = parsed && parsed.organizationId && parsed.email
              && typeof parsed.createdAt === 'number'
              && (Date.now() - parsed.createdAt) < TTL_MS;
            if (!fresh) {
              try { localStorage.removeItem('tiqkets_org_pending_verify'); } catch (_) {}
              return;
            }
            this.pendingVerify = { organizationId: parsed.organizationId, email: parsed.email };
            this.authMode = 'verify';
          } catch (_) {
            try { localStorage.removeItem('tiqkets_org_pending_verify'); } catch (_) {}
          }
        },
        startResendCooldown(seconds) {
          this.stopResendCooldown();
          this.resendCooldown = Math.max(0, Math.floor(seconds || 0));
          if (this.resendCooldown <= 0) return;
          this._resendTimer = setInterval(() => {
            this.resendCooldown -= 1;
            if (this.resendCooldown <= 0) this.stopResendCooldown();
          }, 1000);
        },
        stopResendCooldown() {
          if (this._resendTimer) {
            clearInterval(this._resendTimer);
            this._resendTimer = null;
          }
          this.resendCooldown = 0;
        },
        async verifyEmailOtp() {
          this.verifyError = '';
          this.verifyInfo = '';
          const code = (this.verifyForm.code || '').replace(/\D+/g, '');
          if (!this.pendingVerify.organizationId) {
            this.verifyError = 'Verification session expired. Please register again.';
            return;
          }
          if (code.length !== 6) {
            this.verifyError = 'Please enter the 6-digit code from your email.';
            return;
          }
          this.verifyLoading = true;
          try {
            await api('/api/organizations/verify-email-otp', {
              method: 'POST',
              body: JSON.stringify({ organizationId: this.pendingVerify.organizationId, otp: code }),
            });
            // Per spec: route to the sign-in screen with email pre-filled
            // (do NOT auto-login — the owner must enter their password).
            const verifiedEmail = this.pendingVerify.email;
            this.clearPendingVerify();
            this.loginForm.email = verifiedEmail || this.loginForm.email;
            this.loginForm.password = '';
            this.loginError = '';
            this.authMode = 'signin';
            this.showToast('Email verified! Please sign in.', 'success');
          } catch (e) {
            this.verifyError = e.message || 'Verification failed. Please try again.';
            // Server signals when the user has no remaining attempts and
            // must request a fresh code before trying again.
            if (e.body && e.body.requiresResend) {
              this.verifyForm.code = '';
            }
          }
          this.verifyLoading = false;
        },
        async resendEmailOtp() {
          if (!this.pendingVerify.organizationId) {
            this.verifyError = 'Verification session expired. Please register again.';
            return;
          }
          this.verifyError = '';
          this.verifyInfo = '';
          this.resendLoading = true;
          try {
            const data = await api('/api/organizations/resend-email-otp', {
              method: 'POST',
              body: JSON.stringify({ organizationId: this.pendingVerify.organizationId }),
            });
            if (data && data.alreadyVerified) {
              this.verifyInfo = 'Email already verified — you can sign in.';
              const verifiedEmail = this.pendingVerify.email;
              this.clearPendingVerify();
              this.loginForm.email = verifiedEmail || this.loginForm.email;
              this.loginForm.password = '';
              this.authMode = 'signin';
              this.showToast('Email already verified. Please sign in.', 'success');
            } else if (data && data.emailSent === false) {
              // Server generated a new code but the SMTP provider isn't
              // configured in this environment — be honest about it so
              // the owner doesn't sit waiting on an email that won't
              // arrive. Admin can still pull the code from server logs.
              this.verifyInfo = 'A new code was generated, but email sending is not configured in this environment. Please ask the administrator for the code.';
              this.startResendCooldown(60);
            } else {
              this.verifyInfo = 'A new code has been sent to your email.';
              this.startResendCooldown(60);
            }
          } catch (e) {
            this.verifyError = e.message || 'Could not resend code. Please try again.';
            // Server returns 429 with retryAfterSec when the cooldown is
            // still active; honor it so the button shows the real wait.
            const retry = e.body && (e.body.retryAfterSec || e.body.retryAfter);
            if (retry) this.startResendCooldown(retry);
          }
          this.resendLoading = false;
        },
        cancelVerify() {
          this.clearPendingVerify();
          this.authMode = 'signin';
          this.loginError = '';
        },

        async login() {
          this.loginError = '';
          this.loginLoading = true;
          try {
            let data;
            let isStaffLogin = false;
            try {
              data = await api('/api/organizations/login', {
                method: 'POST',
                body: JSON.stringify(this.loginForm)
              });
            } catch (orgErr) {
              // Verification gate: the org owner has the right password
              // but hasn't confirmed their email yet. Pivot straight to
              // the OTP screen instead of falling through to staff-login
              // (which would otherwise mask this with a generic error).
              if (orgErr && orgErr.status === 403 && orgErr.body && orgErr.body.requiresEmailVerification && orgErr.body.organizationId) {
                this.pendingVerify = {
                  organizationId: orgErr.body.organizationId,
                  email: orgErr.body.email || this.loginForm.email || '',
                };
                this.savePendingVerify();
                this.verifyForm.code = '';
                this.verifyError = '';
                this.verifyInfo = 'Please enter the 6-digit code we sent to your email.';
                this.authMode = 'verify';
                this.loginError = '';
                this.loginLoading = false;
                // Try to (re)send a fresh code so the owner doesn't have
                // to dig through old emails. resendEmailOtp() handles its
                // own cooldown / 429 messaging.
                this.resendEmailOtp();
                return;
              }
              try {
                data = await api('/api/organizations/staff-login', {
                  method: 'POST',
                  body: JSON.stringify(this.loginForm)
                });
                isStaffLogin = true;
              } catch (staffErr) {
                throw orgErr;
              }
            }
            // Super Admin bypass — redirect to the platform-wide portal.
            if (data && data.superAdmin) {
              try { localStorage.setItem('tiqkets_super_admin', JSON.stringify(data.user)); } catch (_) {}
              window.location.href = data.redirect || '/super-admin';
              return;
            }
            this.org = data.organization;
            this.loggedIn = true;
            localStorage.setItem('tiqkets_org', JSON.stringify(data.organization));
            if (isStaffLogin && data.currentUser) {
              this.currentUser = {
                id: data.currentUser.id,
                name: data.currentUser.name,
                email: data.currentUser.email,
                role: data.currentUser.role,
                branchId: data.currentUser.branchId || '',
                branchIds: data.currentUser.branchIds || [],
                assignedServiceIds: data.currentUser.assignedServiceIds || [],
                profilePictureUrl: data.currentUser.profilePictureUrl || '',
                phone: data.currentUser.phone || '',
              };
            } else {
              this.currentUser = { id: null, name: data.organization.name, email: data.organization.email, role: 'admin', branchId: '', branchIds: [], assignedServiceIds: [], profilePictureUrl: '' };
            }
            localStorage.setItem('tiqkets_user', JSON.stringify(this.currentUser));
            // Hygiene: a successful login means any pending OTP state is
            // stale (or belongs to the now-logged-in org). Clear it so a
            // shared browser doesn't leak a previous owner's email.
            this.clearPendingVerify();
            this.branches = data.branches || [];
            this.users = data.users || [];
            if (this.accessibleBranches.length > 0) {
              this.selectedBranchId = this.accessibleBranches[0].id;
            }
            await this.refreshOrgPermissions();
            this.currentPage = this.visibleMenuItems.length > 0 ? this.visibleMenuItems[0].id : 'queue';
            await this.loadAllData();
            if (this.announcementsEnabled) this.connectAnnouncementSSE();
            this.startLivePolling();
            this.showToast('Welcome back!', 'success');
          } catch (e) {
            this.loginError = e.message || 'Login failed';
          }
          this.loginLoading = false;
        },

        // Computed list of states for the currently selected country.
        // Returns [] when the country is empty or has no sub-divisions in
        // the catalogue. Used by the State <select> + by `registerCities`.
        get registerStates() {
          if (!this.cscReady || !this.registerForm.country) return [];
          try { return window.CSC.State.getStatesOfCountry(this.registerForm.country) || []; }
          catch (e) { return []; }
        },
        // Computed list of city names. Prefer cities-of-state when we have
        // a state selection; otherwise fall back to cities-of-country so
        // countries with no state catalogue still surface a city list.
        get registerCities() {
          if (!this.cscReady || !this.registerForm.country) return [];
          try {
            const cities = this.registerForm.state
              ? window.CSC.City.getCitiesOfState(this.registerForm.country, this.registerForm.state)
              : window.CSC.City.getCitiesOfCountry(this.registerForm.country);
            // De-duplicate by name (city catalogue can have repeats across
            // states of the same country); keep names only — that's what
            // the backend stores in `organizations.city`.
            const names = (cities || []).map(c => c.name);
            return Array.from(new Set(names));
          } catch (e) { return []; }
        },
        // Build a CDN URL for a country flag image. We use flagcdn.com
        // (free, no-key) so the flag renders on every OS — emoji flags
        // fall back to letters on Windows, which is the bug the mobile
        // app doesn't have. Returns '' for empty input.
        flagUrl(isoCode) {
          if (!isoCode) return '';
          return 'https://flagcdn.com/w40/' + String(isoCode).toLowerCase() + '.png';
        },
        // Filtered country list for the shared modal — matches name OR
        // dial code (so typing "44" finds the UK). Returns [] until the
        // CSC catalogue is loaded.
        get pickerCountries() {
          if (!this.cscReady) return [];
          const all = window.CSC.Country.getAllCountries();
          const list = this.pickerMode === 'dial'
            ? all.filter(c => !!c.phonecode)
            : all;
          const q = (this.pickerQuery || '').trim().toLowerCase();
          if (!q) return list;
          return list.filter(c =>
            (c.name || '').toLowerCase().includes(q) ||
            String(c.phonecode || '').replace(/^\+/, '').includes(q.replace(/^\+/, ''))
          );
        },
        openPicker(mode) {
          if (!this.cscReady) return;
          this.pickerQuery = '';
          this.pickerMode = mode;
          // Auto-focus the search box after Alpine renders the modal.
          this.$nextTick(() => {
            try { this.$refs.pickerSearchInput?.focus(); } catch (e) { /* noop */ }
          });
        },
        closePicker() {
          this.pickerMode = 'none';
          this.pickerQuery = '';
        },
        // Common handler for picks from the shared modal. Always updates
        // country + dial code together so the two fields stay in lock-step
        // (picking a country code in the dial picker also moves the
        // Country field, and vice-versa).
        selectPickerCountry(c) {
          if (!c) return;
          this.registerForm.country = c.isoCode;
          this.registerForm.countryName = c.name;
          if (c.phonecode) {
            this.registerForm.dialCode = String(c.phonecode).replace(/^\+/, '');
          }
          // Country changed → wipe dependent fields.
          this.registerForm.state = '';
          this.registerForm.stateName = '';
          this.registerForm.city = '';
          // Derive the IANA timezone too. Multi-tz countries (US, RU, CA,
          // BR, AU, MX, ID, AR, CL, KZ, CN) get a curated default we can
          // surface as a hint; the user can change it in branch settings.
          this.registerForm.timezone = this.timezoneForCountryIso(c.isoCode) || '';
          this.closePicker();
        },
        // Resolve IANA tz from an ISO-2 country code. Mirrors the curated
        // multi-tz map in shared/timezone.ts so the hint we show on signup
        // matches what the server will store.
        timezoneForCountryIso(iso) {
          if (!iso || !window.CSC) return '';
          const MULTI = {
            US: 'America/New_York', CA: 'America/Toronto', RU: 'Europe/Moscow',
            BR: 'America/Sao_Paulo', AU: 'Australia/Sydney', MX: 'America/Mexico_City',
            ID: 'Asia/Jakarta', AR: 'America/Argentina/Buenos_Aires',
            CL: 'America/Santiago', KZ: 'Asia/Almaty', CN: 'Asia/Shanghai',
            CD: 'Africa/Kinshasa', GL: 'America/Nuuk',
          };
          const up = String(iso).toUpperCase();
          if (MULTI[up]) return MULTI[up];
          try {
            const country = window.CSC.Country.getCountryByCode(up);
            return country?.timezones?.[0]?.zoneName || '';
          } catch (e) { return ''; }
        },

        // Cascade rules: changing the country invalidates state + city and
        // updates the dial code (picking a country is the strongest signal
        // of where the org actually is). State change invalidates city.
        onCountryChange() {
          if (!this.cscReady) return;
          const c = window.CSC.Country.getCountryByCode(this.registerForm.country);
          this.registerForm.countryName = c ? c.name : '';
          this.registerForm.state = '';
          this.registerForm.stateName = '';
          this.registerForm.city = '';
          if (c && c.phonecode) {
            this.registerForm.dialCode = String(c.phonecode).replace(/^\+/, '');
          }
        },
        onStateChange() {
          if (!this.cscReady) return;
          const s = this.registerForm.country && this.registerForm.state
            ? window.CSC.State.getStateByCodeAndCountry(this.registerForm.state, this.registerForm.country)
            : null;
          this.registerForm.stateName = s ? s.name : '';
          this.registerForm.city = '';
        },
        // Selecting a different dial code implies the user is in that
        // country — keep the Country picker in sync (and clear dependents
        // if the country actually changed) so we don't end up shipping a
        // "Mumbai, Germany" payload.
        onDialCodeChange() {
          if (!this.cscReady || !this.registerForm.dialCode) return;
          const dial = String(this.registerForm.dialCode).replace(/^\+/, '');
          const hit = window.CSC.Country.getAllCountries().find(
            c => String(c.phonecode || '').replace(/^\+/, '') === dial
          );
          if (hit && hit.isoCode !== this.registerForm.country) {
            this.registerForm.country = hit.isoCode;
            this.registerForm.countryName = hit.name;
            this.registerForm.state = '';
            this.registerForm.stateName = '';
            this.registerForm.city = '';
          }
        },

        // Wipe the register form back to its initial shape after a
        // successful submission. Keeps the dial-code / country defaults
        // re-seeded from the browser locale so the next attempt isn't
        // blank if the user backs out of OTP.
        resetRegisterForm() {
          this.registerForm = { name: '', email: '', phone: '', dialCode: '', password: '', category: '', country: '', countryName: '', state: '', stateName: '', city: '', address: '', timezone: '' };
          try {
            if (window.CSC) {
              const locale = new Intl.Locale(navigator.language || 'en-US');
              const region = (locale.region || '').toUpperCase();
              const c = region ? window.CSC.Country.getCountryByCode(region) : null;
              if (c) {
                this.registerForm.country = c.isoCode;
                this.registerForm.countryName = c.name;
                this.registerForm.dialCode = (c.phonecode || '').replace(/^\+/, '');
                this.registerForm.timezone = this.timezoneForCountryIso(c.isoCode) || '';
              }
            }
          } catch (e) { /* best-effort */ }
        },

        async register() {
          this.registerError = '';
          if (!this.registerForm.country) {
            this.registerError = 'Please select your country.';
            return;
          }
          if (!this.registerForm.city) {
            this.registerError = 'Please select or enter your city.';
            return;
          }
          this.registerLoading = true;
          try {
            // Build the wire payload from the form: send human-readable
            // country/state names (the DB stores text), and combine the
            // dial code with the local number into a single +XX phone.
            const payload = {
              name: this.registerForm.name,
              email: this.registerForm.email,
              password: this.registerForm.password,
              category: this.registerForm.category,
              address: this.registerForm.address,
              country: this.registerForm.countryName || '',
              state: this.registerForm.stateName || '',
              city: this.registerForm.city || '',
              // Derived IANA tz (e.g. "America/New_York") so the server
              // can pin the org + auto-created first branch to the right
              // locale without re-deriving from the country name.
              timezone: this.registerForm.timezone || undefined,
              phone: this.registerForm.dialCode
                ? ('+' + String(this.registerForm.dialCode).replace(/^\+/, '') + ' ' + String(this.registerForm.phone || '').trim())
                : String(this.registerForm.phone || '').trim(),
            };
            const data = await api('/api/organizations/register', {
              method: 'POST',
              body: JSON.stringify(payload)
            });
            if (data.success) {
              // Server gates session issuance on email verification.
              // Capture orgId/email and pivot to the OTP screen so the
              // owner can finish verification before signing in.
              if (data.requiresEmailVerification && data.organizationId) {
                this.pendingVerify = {
                  organizationId: data.organizationId,
                  email: data.email || this.registerForm.email || '',
                };
                this.savePendingVerify();
                this.verifyForm.code = '';
                this.verifyError = '';
                this.verifyInfo = data.emailVerificationSent === false
                  ? 'Account created. Use the code shown in the server logs (email is not configured in this environment).'
                  : 'Account created! We just emailed you a 6-digit verification code.';
                // Pre-fill the sign-in email so that after OTP verify
                // the owner only has to type their password.
                this.loginForm.email = this.registerForm.email;
                this.loginForm.password = '';
                // Surface the auto-provisioned starter accounts (modal is
                // shown over the verify screen; on dismiss the owner sees
                // the OTP entry).
                if (Array.isArray(data.starterUsers) && data.starterUsers.length > 0) {
                  this.starterCredentials = {
                    notice: data.defaultPasswordNotice || '',
                    users: data.starterUsers,
                  };
                  this.showStarterCredentialsModal = true;
                }
                this.resetRegisterForm();
                this.authMode = 'verify';
                this.showToast('Check your email for the verification code.', 'success');
              } else {
                // Backwards-compatible path (verification disabled server-side).
                this.showToast('Account created! Please sign in.', 'success');
                this.loginForm.email = this.registerForm.email;
                this.loginForm.password = '';
                if (Array.isArray(data.starterUsers) && data.starterUsers.length > 0) {
                  this.starterCredentials = {
                    notice: data.defaultPasswordNotice || '',
                    users: data.starterUsers,
                  };
                  this.showStarterCredentialsModal = true;
                }
                this.resetRegisterForm();
                this.authMode = 'signin';
              }
            }
          } catch (e) {
            this.registerError = e.message || 'Registration failed';
          }
          this.registerLoading = false;
        },
        async copyStarterCredentialsToClipboard() {
          if (!this.starterCredentials || !Array.isArray(this.starterCredentials.users)) return;
          const lines = this.starterCredentials.users.map(u =>
            u.name + ' (' + this.formatRole(u.role) + ')\n  Email: ' + u.email + '\n  Password: ' + u.password
          );
          const text = lines.join('\n\n');
          // Try the async clipboard API first; if it rejects (insecure context,
          // permissions denied, etc.) fall back to the legacy execCommand path.
          let copied = false;
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            try {
              await navigator.clipboard.writeText(text);
              copied = true;
            } catch (_) {
              copied = false;
            }
          }
          if (!copied) {
            try {
              const ta = document.createElement('textarea');
              ta.value = text;
              ta.setAttribute('readonly', '');
              ta.style.position = 'fixed';
              ta.style.opacity = '0';
              document.body.appendChild(ta);
              ta.select();
              copied = document.execCommand('copy');
              document.body.removeChild(ta);
            } catch (_) {
              copied = false;
            }
          }
          if (copied) {
            this.showToast('Credentials copied', 'success');
          } else {
            this.showToast('Could not copy automatically — please copy manually', 'error');
          }
        },

        async logout() {
          this.disconnectAnnouncementSSE();
          this.stopLivePolling();
          // Tell the backend to clear both the org-session cookie and any
          // stale Super-Admin cookie. Without this, the next sign-in in the
          // same browser would inherit elevated permissions from leftover
          // cookies (e.g. a previous Super Admin session).
          try { await fetch('/api/organizations/logout', { method: 'POST', credentials: 'include' }); } catch (_) {}
          this.loggedIn = false;
          this.org = null;
          this.currentUser = { id: null, role: 'admin', name: '', email: '', branchId: '', branchIds: [], assignedServiceIds: [], profilePictureUrl: '' };
          this.orgPermissions = [];
          this.permissionsLoaded = false;
          localStorage.removeItem('tiqkets_org');
          localStorage.removeItem('tiqkets_user');
          // Wipe any in-progress OTP state so the next user on this
          // browser doesn't inherit the previous owner's pending verify.
          this.clearPendingVerify();
          this.authMode = 'signin';
        },

        async loadAllData() {
          if (!this.org) return;
          await Promise.all([
            this.loadBranches(),
            this.loadUsers(),
            this.loadOrgRoles(),
            this.loadSubscription(),
            this.loadPlans(),
            this.loadPayments(),
            this.loadPlanLimits(),
          ]);
          if (!this.selectedBranchId && this.accessibleBranches.length > 0) {
            this.selectedBranchId = this.accessibleBranches[0].id;
          }
          if (this.selectedBranchId) {
            await Promise.all([
              this.loadQueueData(),
              this.loadServices(),
              this.loadBookings(),
              this.loadJourneys(),
              this.loadStats(),
            ]);
          }
        },

        async loadPageData() {
          const p = this.currentPage;
          if (p === 'overview') { await this.loadStats(); await this.loadBranches(); }
          else if (p === 'queue') await this.loadQueueData();
          else if (p === 'branches') await this.loadBranches();
          else if (p === 'services') await this.loadServices();
          else if (p === 'staff') await Promise.all([this.loadUsers(), this.loadOrgRoles()]);
          else if (p === 'bookings') { await this.loadBranches(); this.loadSettingsForm(); }
          else if (p === 'journeys') await this.loadJourneys();
          else if (p === 'reports') { await this.loadReportFilters(); await this.loadReportData(); }
          else if (p === 'settings') { await this.loadUsers(); this.loadSettingsForm(); }
          else if (p === 'billing') await this.loadPlanLimits();
          else if (p === 'support') await this.loadOrgSupport();
        },

        async loadBranches() {
          try {
            const data = await api(`/api/dashboard/branches/${this.org.id}`);
            this.branches = data.branches || [];
            if (!this.selectedBranchId) {
              const first = this.accessibleBranches[0] || this.branches[0];
              if (first) this.selectedBranchId = first.id;
            }
          } catch (e) { console.error(e); }
        },

        async loadServices() {
          if (!this.selectedBranch) {
            this.services = this.selectedBranch?.services || [];
          } else {
            this.services = this.selectedBranch.services || [];
          }
          await this.loadAllJourneys();
        },

        isMultiStageBranch(branch) {
          const m = (branch?.queueMode || branch?.settings?.queueMode || 'fifo').toLowerCase();
          return m === 'multistage' || m === 'multi_stage';
        },

        async loadAllJourneys() {
          if (!this.hasPerm('org.journeys.view')) { this.journeysByBranch = {}; return; }
          const branches = (this.accessibleBranches || []).filter(b => this.isMultiStageBranch(b));
          const map = {};
          await Promise.all(branches.map(async (b) => {
            try {
              const data = await api(`/api/dashboard/journeys/${b.id}`);
              map[b.id] = data.journeys || [];
            } catch (e) { console.error(e); map[b.id] = []; }
          }));
          this.journeysByBranch = map;
        },

        async loadUsers() {
          try {
            const data = await api(`/api/dashboard/users/${this.org.id}`);
            this.users = data.users || [];
          } catch (e) { console.error(e); }
        },

        async loadQueueData() {
          if (!this.selectedBranchId) return;
          try {
            const data = await api(`/api/branches/${this.selectedBranchId}/queue`);
            // Scope tickets at the source so every downstream count/list/mode
            // (FIFO, selective, check-in, takeaway, dine-in) is automatically
            // restricted: front-desk staff only ever see their assigned services.
            this.queueTickets = (data.queue || []).filter(t => !t.serviceId || this.isServiceAccessible(t.serviceId));
            const mode = this.currentQueueMode;
            if (mode === 'dine_in' || mode === 'dinein') {
              this.loadDineInReservations();
            }
          } catch (e) { console.error(e); this.queueTickets = []; }
        },

        async loadBookings() {
          try {
            const branchIds = this.bookingBranchFilter ? [this.bookingBranchFilter] : this.accessibleBranches.map(b => b.id);
            let allBookings = [];
            for (const bid of branchIds) {
              try {
                const data = await api(`/api/dashboard/bookings/${bid}?date=${this.bookingDate}`);
                const branch = this.branches.find(b => b.id === bid);
                (data.appointments || []).forEach(a => {
                  a.branchName = branch?.name || '';
                  allBookings.push(a);
                });
              } catch (e) { console.error(e); }
            }
            if (this.bookingServiceFilter) {
              allBookings = allBookings.filter(a => a.serviceId === this.bookingServiceFilter);
            }
            this.bookings = allBookings;
          } catch (e) { console.error(e); this.bookings = []; }
        },

        async loadJourneys() {
          if (!this.selectedBranchId) return;
          try {
            const data = await api(`/api/dashboard/journeys/${this.selectedBranchId}`);
            this.journeys = data.journeys || [];
          } catch (e) { console.error(e); this.journeys = []; }
        },

        async loadReportFilters() {
          try {
            const params = new URLSearchParams();
            if (this.reportFilters.branchId) params.set('branchId', this.reportFilters.branchId);
            const data = await api(`/api/reports/${this.org.id}/filters?${params}`);
            this.reportFilterOptions = data;
            if (!this.reportFilters.startDate) {
              const d = new Date(); d.setDate(d.getDate() - 30);
              this.reportFilters.startDate = d.toISOString().split('T')[0];
              this.reportFilters.endDate = new Date().toISOString().split('T')[0];
            }
          } catch (e) { console.error(e); }
        },

        async loadReportData() {
          this.reportLoading = true;
          try {
            const params = new URLSearchParams();
            if (this.reportFilters.startDate) params.set('startDate', this.reportFilters.startDate);
            if (this.reportFilters.endDate) params.set('endDate', this.reportFilters.endDate);
            if (this.reportFilters.branchId) params.set('branchId', this.reportFilters.branchId);
            if (this.reportFilters.serviceId) params.set('serviceId', this.reportFilters.serviceId);
            if (this.reportFilters.deskId) params.set('deskId', this.reportFilters.deskId);
            if (this.reportFilters.staffId) params.set('staffId', this.reportFilters.staffId);
            if (this.reportFilters.source) params.set('source', this.reportFilters.source);
            const data = await api(`/api/reports/${this.org.id}/summary?${params}`);
            this.reportData = data;
            if (!data.reservationStats && this.reportActiveTab === 'dinein') {
              this.reportActiveTab = 'overview';
            }
          } catch (e) { console.error(e); this.showToast('Failed to load report', 'error'); }
          this.reportLoading = false;
        },

        async onReportBranchChange() {
          this.reportFilters.serviceId = '';
          this.reportFilters.deskId = '';
          if (this.reportActiveTab === 'dinein') this.reportActiveTab = 'overview';
          await this.loadReportFilters();
          await this.loadReportData();
        },

        async exportReportCSV() {
          const params = new URLSearchParams();
          if (this.reportFilters.startDate) params.set('startDate', this.reportFilters.startDate);
          if (this.reportFilters.endDate) params.set('endDate', this.reportFilters.endDate);
          if (this.reportFilters.branchId) params.set('branchId', this.reportFilters.branchId);
          if (this.reportFilters.serviceId) params.set('serviceId', this.reportFilters.serviceId);
          if (this.reportFilters.deskId) params.set('deskId', this.reportFilters.deskId);
          if (this.reportFilters.staffId) params.set('staffId', this.reportFilters.staffId);
          if (this.reportFilters.source) params.set('source', this.reportFilters.source);
          try {
            const response = await fetch(`/api/reports/${this.org.id}/export?${params}`);
            if (!response.ok) throw new Error('Export failed');
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tiqkets-report-${this.reportFilters.startDate || 'all'}-to-${this.reportFilters.endDate || 'all'}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
            this.showToast('Report exported', 'success');
          } catch (e) { this.showToast('Export failed', 'error'); }
        },

        getReportPeakHour() {
          if (!this.reportData?.hourly) return '-';
          const peak = this.reportData.hourly.reduce((max, h) => h.total > max.total ? h : max, { hour: 0, total: 0 });
          if (peak.total === 0) return '-';
          const h = peak.hour;
          return `${h > 12 ? h - 12 : h || 12}${h >= 12 ? 'PM' : 'AM'} (${peak.total})`;
        },

        getReportBusiestDay() {
          if (!this.reportData?.byWeekday) return '-';
          const peak = this.reportData.byWeekday.reduce((max, d) => d.total > max.total ? d : max, { dayName: '-', total: 0 });
          return peak.total > 0 ? `${peak.dayName} (${peak.total})` : '-';
        },

        reportBarWidth(value, max) {
          if (!max || max === 0 || !value || value === 0) return '0%';
          return Math.max(4, (value / max) * 100) + '%';
        },

        async loadStats() {
          try {
            if (this.overviewBranchFilter) {
              const data = await api(`/api/branches/${this.overviewBranchFilter}/stats`);
              this.stats = data;
            } else {
              let totalWaiting = 0, totalServed = 0, totalNoShow = 0;
              let waitSum = 0, waitSamples = 0;
              for (const b of this.accessibleBranches) {
                try {
                  const data = await api(`/api/branches/${b.id}/stats`);
                  totalWaiting += (data.todayWaiting || 0);
                  totalServed += (data.todayServed || 0);
                  totalNoShow += (data.todayNoShow || 0);
                  const n = Number(data.waitSampleCount) || 0;
                  if (n > 0) {
                    waitSum += Number(data.waitSampleSum) || 0;
                    waitSamples += n;
                  }
                } catch (e) { console.error(e); }
              }
              this.stats = {
                todayWaiting: totalWaiting,
                todayServed: totalServed,
                todayNoShow: totalNoShow,
                averageWaitTime: waitSamples > 0 ? Math.round((waitSum / waitSamples) * 10) / 10 : 0
              };
            }
          } catch (e) { console.error(e); this.stats = {}; }
        },

        async loadSubscription() {
          try {
            const data = await api(`/api/billing/subscription/${this.org.id}`);
            this.subscription = data.subscription;
          } catch (e) { console.error(e); }
        },

        // Calendar-day diff from today until the trial end date (both
        // normalized to local midnight) — so a trial ending any time
        // today reads as "expires today" and any time tomorrow reads as
        // "expires tomorrow", regardless of hour. 0 = today, negative =
        // already past end of day. Mirrors the mobile dashboard helper.
        trialDaysRemaining() {
          if (!this.subscription || !this.subscription.trialEndDate) return null;
          const end = new Date(this.subscription.trialEndDate);
          if (isNaN(end.getTime())) return null;
          const endDay = new Date(end.getFullYear(), end.getMonth(), end.getDate());
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          return Math.round((endDay.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
        },

        async loadPlanLimits() {
          if (!this.org?.id) return;
          try {
            const data = await api(`/api/dashboard/plan-limits/${this.org.id}`);
            this.planLimits = data;
          } catch (e) {
            // Non-billing-viewers (no org.billing.view perm) get 403; that's
            // fine — we just leave the widget hidden for them.
            this.planLimits = null;
          }
        },

        // Build the four usage tiles: branches, staff users, desks, daily
        // tickets. Caps of null mean "unlimited" — display infinity. We
        // mark a metric as nearCap at >=80% utilisation and atCap at >=100%.
        planUsageMetrics() {
          if (!this.planLimits || !this.planLimits.enforced) return [];
          const u = this.planLimits.usage || {};
          const rows = [
            { key: 'branches', label: 'Branches', current: u.branches?.current ?? 0, cap: u.branches?.cap ?? null },
            { key: 'staff', label: 'Staff Users', current: u.staffUsers?.current ?? 0, cap: u.staffUsers?.cap ?? null },
            { key: 'desks', label: 'Desks', current: u.desks?.current ?? 0, cap: u.desks?.cap ?? null },
            { key: 'tickets', label: 'Tickets Today', current: u.dailyTickets?.current ?? 0, cap: u.dailyTickets?.cap ?? null },
          ];
          return rows.map(r => {
            const pct = r.cap === null ? 0 : Math.min(100, Math.round((r.current / Math.max(1, r.cap)) * 100));
            return { ...r, pct, atCap: r.cap !== null && r.current >= r.cap, nearCap: r.cap !== null && r.current / r.cap >= 0.8 };
          });
        },

        async loadPlans() {
          try {
            const data = await api('/api/billing/plans');
            this.plans = data.plans || [];
          } catch (e) { console.error(e); }
        },

        async loadPayments() {

            this.payments = data.payments || [];
          } catch (e) {
