<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIQKETS - Centre Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <!--
    Load `country-state-city` (the same ISO catalogue used by the mobile app)
    as an ES module, then expose it on `window.CSC` so the Alpine signup
    form can build cascading Country → State → City pickers and a phone
    field with an ISD dial-code prefix. The library is small (~250 countries
    + states + cities) and pure JS, so a single CDN fetch is enough — no
    bundler / build step required for the web dashboard.
  -->
  <script type="module">
    import * as CSC from 'https://esm.run/country-state-city@3.2.1';
    window.CSC = CSC;
    // Notify any Alpine component that the catalogue is now queryable.
    // Alpine evaluates `cscReady` reactively so the cascading selects
    // populate the moment the import resolves.
    window.dispatchEvent(new CustomEvent('csc-ready'));
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Nunito', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#8c1867', light: '#a83d82', dark: '#6a1250', 50: '#fdf2f9', 100: '#fce7f4', 200: '#f9cee9', 300: '#f5a6d5', 400: '#ed6db4', 500: '#e24595', 600: '#d02574', 700: '#b4185b', 800: '#8c1867', 900: '#751555' },
            secondary: { DEFAULT: '#1d499b', light: '#2a5cc0' },
            gold: '#ffd700',
            surface: { DEFAULT: '#f8f9fc', card: '#ffffff', dark: '#1a1025' }
          }
        }
      }
    }
  </script>
  <style>
    /* =========================================================
       TIQKETS — Centre Dashboard Design System
       Single brand colour: #8c1867 (magenta).
       Neutrals: slate. Semantic colours used only for status.
       ========================================================= */
    :root {
      --brand: #8c1867;
      --brand-dark: #6a1250;
      --brand-50: #fdf2f9;
      --brand-100: #fce7f4;
      --ink-900: #0f172a;
      --ink-700: #334155;
      --ink-500: #64748b;
      --ink-400: #94a3b8;
      --ink-300: #cbd5e1;
      --ink-200: #e2e8f0;
      --ink-100: #eef0f4;
      --ink-50:  #f7f8fb;
      --surface: #ffffff;
      --surface-muted: #f7f8fb;
      --bg-root: #f4f5f8;
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-xs: 0 1px 2px rgba(15,23,42,0.04);
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.04);
      --shadow-md: 0 4px 12px rgba(15,23,42,0.06);
    }

    [x-cloak] { display: none !important; }
    body { background: var(--bg-root); color: var(--ink-900); }

    /* ---------- Sidebar (light, refined) ---------- */
    .sidebar-nav { display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; transition: background-color .15s ease, color .15s ease; cursor: pointer; color: var(--ink-700); position: relative; }
    .sidebar-nav:hover { background: var(--ink-50); color: var(--ink-900); }
    .sidebar-nav.active { background: var(--brand-50); color: var(--brand); font-weight: 600; }
    .sidebar-nav.active::before { content:''; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius: 0 2px 2px 0; background: var(--brand); }

    /* ---------- Cards ---------- */
    .dash-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--ink-100); padding: 20px; box-shadow: var(--shadow-xs); transition: border-color .15s ease, box-shadow .15s ease; }
    .dash-card:hover { border-color: var(--ink-200); box-shadow: var(--shadow-sm); }
    .dash-card-flat { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--ink-100); overflow: hidden; }

    /* ---------- Stat card (single, monochrome) ---------- */
    .stat-card { position: relative; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--ink-100); padding: 20px; transition: border-color .15s ease, box-shadow .15s ease; }
    .stat-card:hover { border-color: var(--ink-200); box-shadow: var(--shadow-sm); }
    .stat-card .stat-icon { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--ink-50); color: var(--ink-500); font-size: 14px; }
    .stat-card.is-primary .stat-icon { background: var(--brand-50); color: var(--brand); }
    .stat-card .stat-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-500); }
    .stat-card .stat-value { font-size: 30px; font-weight: 700; color: var(--ink-900); line-height: 1.1; margin-top: 14px; }
    .stat-card .stat-unit { font-size: 14px; color: var(--ink-400); font-weight: 500; margin-left: 4px; }
    .stat-card .stat-sub { font-size: 12px; color: var(--ink-400); margin-top: 6px; }
    /* Neutralise legacy stat-gradient classes — keep markup compatible */
    .stat-gradient::before { content: none !important; }
    .stat-gradient { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--ink-100); padding: 20px; }

    /* ---------- Inputs ---------- */
    .input-field { width: 100%; border: 1px solid var(--ink-200); border-radius: var(--radius-md); padding: 10px 14px; font-size: 14px; outline: none; transition: border-color .15s ease, box-shadow .15s ease; background: var(--surface); color: var(--ink-900); }
    .input-field::placeholder { color: var(--ink-400); }
    .input-field:hover { border-color: var(--ink-300); }
    .input-field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(140,24,103,0.12); }

    /* ---------- Tables ---------- */
    .table-header { text-align: left; font-size: 11px; font-weight: 600; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 18px; background: var(--ink-50); border-bottom: 1px solid var(--ink-100); }
    .table-cell { padding: 14px 18px; font-size: 14px; color: var(--ink-700); border-bottom: 1px solid var(--ink-100); }

    /* ---------- Badges (status) ---------- */
    .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.01em; }
    .badge-neutral { background: var(--ink-50); color: var(--ink-700); border: 1px solid var(--ink-100); }
    .badge-brand { background: var(--brand-50); color: var(--brand); border: 1px solid var(--brand-100); }

    /* ---------- Modal ---------- */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.45); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal-content { background: var(--surface); border-radius: var(--radius-lg); box-shadow: 0 24px 48px rgba(15,23,42,0.18); max-width: 32rem; width: 100%; margin: 0 16px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--ink-100); }

    /* ---------- Toast ---------- */
    .toast { position: fixed; top: 20px; right: 20px; z-index: 100; padding: 12px 18px; border-radius: var(--radius-md); box-shadow: 0 16px 32px rgba(15,23,42,0.18); color: #fff; font-weight: 600; font-size: 14px; }

    /* ---------- Queue Tabs (unified, brand-only) ---------- */
    .queue-tab { position: relative; display: flex; flex-direction: row; align-items: center; gap: 4px; padding: 12px 20px; border-radius: var(--radius-md); font-size: 12px; font-weight: 600; transition: background-color .15s ease, color .15s ease, border-color .15s ease; cursor: pointer; border: 1px solid var(--ink-100); user-select: none; background: var(--surface); color: var(--ink-500); }
    .queue-tab .tab-count { font-size: 22px; font-weight: 700; line-height: 1; color: var(--ink-700); }
    .queue-tab .tab-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.1; }
    .queue-tab:hover { border-color: var(--ink-200); background: var(--ink-50); }
    .queue-tab.tab-waiting,
    .queue-tab.tab-called,
    .queue-tab.tab-serving,
    .queue-tab.tab-completed { background: var(--brand-50); color: var(--brand); border-color: var(--brand-100); box-shadow: none; }
    .queue-tab.tab-waiting .tab-count,
    .queue-tab.tab-called .tab-count,
    .queue-tab.tab-serving .tab-count,
    .queue-tab.tab-completed .tab-count { color: var(--brand); }
    .queue-tab.tab-waiting::after,
    .queue-tab.tab-called::after,
    .queue-tab.tab-serving::after,
    .queue-tab.tab-completed::after { content:''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 28px; height: 2px; border-radius: 999px; background: var(--brand); }

    /* ---------- Ticket Card ---------- */
    .ticket-card { background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--ink-100); padding: 16px; transition: border-color .15s ease, box-shadow .15s ease; }
    .ticket-card:hover { box-shadow: var(--shadow-sm); border-color: var(--ink-200); }
    .ticket-card.ticket-waiting { border-left: 3px solid var(--brand); }
    .ticket-card.ticket-called { border-left: 3px solid var(--ink-700); }
    .ticket-card.ticket-serving { border-left: 3px solid var(--brand); }
    .ticket-card.ticket-completed { border-left: 3px solid var(--ink-300); }
    .ticket-card.ticket-no_show { border-left: 3px solid #dc2626; }

    /* ---------- Queue Action Buttons (one accent: brand) ---------- */
    .q-action { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-md); font-size: 12px; font-weight: 600; transition: background-color .15s ease, border-color .15s ease, color .15s ease; border: 1px solid transparent; cursor: pointer; }
    .q-action-call { background: var(--surface); color: var(--ink-900); border-color: var(--ink-200); }
    .q-action-call:hover { background: var(--ink-50); border-color: var(--ink-300); }
    .q-action-serve { background: var(--brand); color: #fff; border-color: var(--brand); }
    .q-action-serve:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .q-action-done { background: var(--ink-900); color: #fff; border-color: var(--ink-900); }
    .q-action-done:hover { background: #000; }
    .q-action-noshow { background: var(--surface); color: var(--ink-500); border-color: var(--ink-200); }
    .q-action-noshow:hover { background: var(--ink-50); color: #dc2626; border-color: #fecaca; }

    /* ---------- Detail Panel Actions ---------- */
    .detail-action { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; border: 1px solid var(--ink-200); background: var(--surface); color: var(--ink-700); cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
    .detail-action:hover { background: var(--ink-50); border-color: var(--ink-300); color: var(--ink-900); }
    .detail-action i { font-size: 14px; color: var(--ink-500); }

    /* ---------- Timeline ---------- */
    .timeline-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; flex-shrink: 0; }
    .timeline-dot.active { background: var(--brand); border-color: var(--brand); }
    .timeline-dot.pending { background: var(--surface); border-color: var(--ink-300); }
    .timeline-line { width: 2px; height: 22px; background: var(--ink-200); margin-left: 4px; }

    /* ---------- Action buttons in tables ---------- */
    .action-btn { padding: 6px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; transition: background-color .15s ease, color .15s ease; }

    /* ---------- Scrollbar ---------- */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--ink-200); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-300); }

    /* ---------- Plan card highlight ---------- */
    .plan-popular { border: 1.5px solid var(--brand) !important; }

    /* ---------- Buttons (single accent) ---------- */
    .btn-primary { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; color: #fff; background: var(--brand); transition: background-color .15s ease; border: none; cursor: pointer; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-secondary { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; color: var(--ink-900); background: var(--surface); border: 1px solid var(--ink-200); transition: background-color .15s ease, border-color .15s ease; cursor: pointer; }
    .btn-secondary:hover { background: var(--ink-50); border-color: var(--ink-300); }
    .btn-ghost { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; color: var(--ink-700); background: transparent; border: 1px solid transparent; transition: background-color .15s ease, color .15s ease; cursor: pointer; }
    .btn-ghost:hover { background: var(--ink-50); color: var(--ink-900); }
    .btn-danger { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; color: #dc2626; background: var(--surface); border: 1px solid #fecaca; transition: background-color .15s ease, border-color .15s ease; cursor: pointer; }
    .btn-danger:hover { background: #fef2f2; border-color: #f87171; }

    /* ---------- Welcome banner ---------- */
    .welcome-banner { background: var(--surface); border: 1px solid var(--ink-100); border-radius: var(--radius-lg); padding: 22px 24px; }
    .welcome-banner .accent-bar { width: 3px; height: 36px; border-radius: 2px; background: var(--brand); }

    /* ---------- Top header ---------- */
    .top-header { background: var(--surface); border-bottom: 1px solid var(--ink-100); }

    /* ---------- Status chips (semantic — only place colour is allowed) ---------- */
    .status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid; }
    .status-chip-active { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .status-chip-paused { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .status-chip-ended { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .status-chip-dot { width: 6px; height: 6px; border-radius: 50%; }
  </style>
</head>
<body class="bg-surface font-sans antialiased" x-data="dashboard()" x-init="init()" x-cloak>

  <!--
    Shared country picker modal — used by both the Country field and the
    dial-code button on the sign-up form. `pickerMode` is 'country' | 'dial'
    | 'none'; the same list+search is reused, and onSelect routes to the
    right handler. Lives at <body> root so it overlays the entire screen.
  -->
  <div x-show="pickerMode !== 'none'"
       x-transition.opacity
       @keydown.escape.window="closePicker()"
       class="fixed inset-0 z-[100] flex items-center justify-center p-4"
       style="display: none;">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="closePicker()"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
        <h3 class="text-base font-bold text-gray-900"
            x-text="pickerMode === 'dial' ? 'Select country code' : 'Select country'"></h3>
        <button type="button" @click="closePicker()" class="text-gray-400 hover:text-gray-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div class="px-5 py-3 border-b border-gray-100">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input type="text" x-model="pickerQuery"
                 x-ref="pickerSearchInput"
                 placeholder="Search…"
                 class="w-full border border-gray-200 rounded-lg pl-9 pr-3 py-2 text-sm bg-gray-50 focus:bg-white focus:border-brand focus:ring-2 focus:ring-brand/20 outline-none">
        </div>
      </div>
      <div class="flex-1 overflow-y-auto">
        <template x-for="c in pickerCountries" :key="c.isoCode + '-pick'">
          <button type="button"
                  @click="selectPickerCountry(c)"
                  class="w-full flex items-center gap-3 px-5 py-3 text-left hover:bg-gray-50 border-b border-gray-100 last:border-b-0 transition-colors"
                  :class="registerForm.country === c.isoCode ? 'bg-brand/5' : ''">
            <img :src="flagUrl(c.isoCode)" :alt="c.name" class="w-7 h-5 rounded-sm object-cover flex-shrink-0">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-gray-900 truncate" x-text="c.name"></div>
              <template x-if="c.phonecode">
                <div class="text-xs text-gray-500" x-text="'+' + String(c.phonecode).replace(/^\+/, '')"></div>
              </template>
            </div>
            <template x-if="registerForm.country === c.isoCode">
              <i class="fa-solid fa-check text-brand text-sm"></i>
            </template>
          </button>
        </template>
        <template x-if="pickerCountries.length === 0">
          <div class="text-center text-sm text-gray-500 py-10" x-text="pickerQuery ? ('No matches for &quot;' + pickerQuery + '&quot;') : 'Loading…'"></div>
        </template>
      </div>
    </div>
  </div>


  <!-- Toast Notifications -->
  <div id="tiqkets-web-dashboard" data-testid="web-dashboard"></div>
  <div x-show="toast.show" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-[-8px]" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
    class="toast" :class="toast.type === 'success' ? 'bg-gradient-to-r from-green-500 to-emerald-600' : toast.type === 'error' ? 'bg-gradient-to-r from-red-500 to-rose-600' : 'bg-gradient-to-r from-brand to-brand-dark'">
    <i :class="toast.type === 'success' ? 'fa-solid fa-check-circle' : toast.type === 'error' ? 'fa-solid fa-exclamation-circle' : 'fa-solid fa-info-circle'" class="mr-2"></i>
    <span x-text="toast.message"></span>
  </div>

  <!-- AUTH PAGE (SIGN IN / SIGN UP) -->
  <template x-if="!loggedIn">
    <div class="min-h-screen flex">
      <!-- Left Panel - Branding -->
      <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-brand via-brand-dark to-purple-900 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10">
          <div class="absolute top-20 left-10 w-64 h-64 rounded-full bg-white/20 blur-3xl"></div>
          <div class="absolute bottom-20 right-10 w-80 h-80 rounded-full bg-gold/20 blur-3xl"></div>
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 rounded-full bg-white/10 blur-3xl"></div>
        </div>
        <div class="relative z-10 flex flex-col justify-center items-center w-full px-16 text-center">
          <img src="/assets/images/logo-white.png" alt="TIQKETS" class="w-24 h-24 mb-6 drop-shadow-2xl">
          <h1 class="text-4xl font-extrabold text-white mb-3 tracking-tight">TIQKETS</h1>
          <p class="text-xl text-white/80 font-semibold mb-2">Smart Queue Management for Your Centre</p>
          <p class="text-base text-white/60 max-w-sm leading-relaxed">Eliminate physical waiting. Give your customers complete control and transparency over their queue position.</p>
          <div class="mt-12 grid grid-cols-3 gap-6 text-center">
            <div>
              <div class="text-3xl font-extrabold text-gold">6+</div>
              <div class="text-xs text-white/60 mt-1">Queue Modes</div>
            </div>
            <div>
              <div class="text-3xl font-extrabold text-gold">24/7</div>
              <div class="text-xs text-white/60 mt-1">Availability</div>
            </div>
            <div>
              <div class="text-3xl font-extrabold text-gold">Real-time</div>
              <div class="text-xs text-white/60 mt-1">Updates</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Panel - Auth Forms -->
      <div class="w-full lg:w-1/2 flex items-center justify-center bg-gray-50 px-6 py-12">
        <div class="w-full max-w-md">
          <!-- Logo for mobile -->
          <div class="lg:hidden text-center mb-8">
            <img src="/assets/images/logo-color.png" alt="TIQKETS" class="w-16 h-16 mx-auto mb-3">
            <h1 class="text-2xl font-extrabold text-gray-900">TIQKETS</h1>
            <p class="text-sm text-gray-500 mt-1">Smart Queue Management for Your Centre</p>
          </div>

          <!-- SIGN IN FORM -->
          <div x-show="authMode === 'signin'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
            <div class="mb-8">
              <h2 class="text-2xl font-extrabold text-gray-900">Welcome back</h2>
              <p class="text-gray-500 mt-1 text-sm">Sign in to manage your centre</p>
            </div>
            <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8">
              <form @submit.prevent="login()">
                <div class="mb-5">
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i class="fa-solid fa-envelope text-gray-400 text-sm"></i>
                    </div>
                    <input type="email" x-model="loginForm.email" class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white" placeholder="you@yourcentre.com" required>
                  </div>
                </div>
                <div class="mb-6">
                  <div class="flex items-center justify-between mb-2">
                    <label class="block text-sm font-semibold text-gray-700">Password</label>
                    <a href="#" class="text-xs text-brand hover:text-brand-dark font-medium">Forgot password?</a>
                  </div>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
                    </div>
                    <input type="password" x-model="loginForm.password" class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white" placeholder="Enter your password" required>
                  </div>
                </div>
                <div x-show="loginError" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm flex items-center gap-2">
                  <i class="fa-solid fa-circle-exclamation"></i>
                  <span x-text="loginError"></span>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-brand to-brand-dark text-white py-3 rounded-xl font-bold text-sm hover:shadow-lg transition-all duration-200 disabled:opacity-50" :disabled="loginLoading">
                  <span x-show="!loginLoading">Sign In</span>
                  <span x-show="loginLoading"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Signing in...</span>
                </button>
              </form>
              <div class="mt-6 text-center">
                <p class="text-sm text-gray-500">Don't have an account? <button @click="authMode = 'signup'" class="text-brand font-bold hover:text-brand-dark transition-colors">Sign Up</button></p>
              </div>
            </div>
            <div class="mt-5 p-3.5 bg-white/80 border border-gray-200 rounded-xl text-xs text-gray-500">
              <p class="font-bold text-gray-600 mb-1"><i class="fa-solid fa-circle-info text-brand mr-1"></i>Demo Credentials</p>
              <p>Email: demo@tiqkets.com &nbsp;|&nbsp; Password: demo123</p>
            </div>
          </div>

          <!-- SIGN UP FORM -->
          <div x-show="authMode === 'signup'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
            <div class="mb-6">
              <h2 class="text-2xl font-extrabold text-gray-900">Create your account</h2>
              <p class="text-gray-500 mt-1 text-sm">Set up your centre on Tiqkets in minutes</p>
            </div>
            <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8">
              <form @submit.prevent="register()">
                <div class="mb-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Centre Name</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i class="fa-solid fa-building text-gray-400 text-sm"></i>
                    </div>
                    <input type="text" x-model="registerForm.name" class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white" placeholder="e.g. City Hospital, ABC Salon" required>
                  </div>
                </div>
                <div class="mb-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i class="fa-solid fa-envelope text-gray-400 text-sm"></i>
                    </div>
                    <input type="email" x-model="registerForm.email" class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white" placeholder="you@centre.com" required>
                  </div>
                </div>
                <div class="mb-4">
                  <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                    <!--
                      Phone field = ISD dial-code <select> on the left + a
                      plain phone-number <input> on the right. Selecting a
                      different dial code also updates the Country picker
                      below (and clears state/city if the country actually
                      changed), so the two stay in lock-step.
                    -->
                    <!--
                      Dial-code = button-triggered popover (mirrors mobile).
                      Native <select> can't show flag <img>s, and Windows
                      browsers render flag emoji as plain letters — so we
                      use a custom dropdown with flagcdn.com images + a
                      search box. Selecting also syncs the Country picker.
                    -->
                    <div class="flex gap-0 items-stretch">
                      <button type="button"
                              @click="openPicker('dial')"
                              :disabled="!cscReady"
                              class="flex items-center gap-2 border border-gray-300 rounded-l-xl px-3 py-3 text-sm bg-gray-50 hover:bg-white focus:bg-white focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all disabled:opacity-60"
                              style="min-width: 110px;">
                        <template x-if="registerForm.country">
                          <img :src="flagUrl(registerForm.country)" :alt="registerForm.countryName" class="w-6 h-4 rounded-sm object-cover flex-shrink-0">
                        </template>
                        <span class="font-semibold text-gray-900" x-text="registerForm.dialCode ? ('+' + registerForm.dialCode) : '+--'"></span>
                        <i class="fa-solid fa-chevron-down text-gray-400 text-xs ml-auto"></i>
                      </button>
                      <input type="tel" x-model="registerForm.phone" class="flex-1 min-w-0 border border-l-0 border-gray-300 rounded-r-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white" placeholder="98765 43210" required>
                    </div>
                  </div>
                </div>
                <div class="mb-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
                    </div>
                    <input type="password" x-model="registerForm.password" class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white" placeholder="Min 6 characters" required minlength="6">
                  </div>
                </div>
                <div class="mb-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i class="fa-solid fa-tag text-gray-400 text-sm"></i>
                    </div>
                    <select x-model="registerForm.category" class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white appearance-none" required>
                      <option value="">Select your centre type</option>
                      <option value="healthcare">Healthcare / Hospital / Clinic</option>
                      <option value="salon">Salon / Spa / Beauty</option>
                      <option value="restaurant">Restaurant / Cafe / Dine-in</option>
                      <option value="government">Government / Public Office</option>
                      <option value="banking">Banking / Financial Services</option>
                      <option value="education">Education / University</option>
                      <option value="retail">Retail / Shopping</option>
                      <option value="telecom">Telecom / Service Centre</option>
                      <option value="other">Other</option>
                    </select>
                  </div>
                </div>
                <!--
                  Country → State → City cascading selects. State and City
                  populate from the selected Country; they auto-fall-back to
                  a free-text input for countries that aren't sub-divided in
                  the catalogue (small territories, etc.) so the user is
                  never trapped on an empty dropdown.
                -->
                <div class="mb-4">
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Country</label>
                  <!--
                    Country = button-triggered popover (same widget as the
                    dial code) so we can show a real flag image + the full
                    country name, with type-ahead search over 250 options.
                  -->
                  <button type="button"
                          @click="openPicker('country')"
                          :disabled="!cscReady"
                          class="w-full flex items-center gap-3 border border-gray-300 rounded-xl px-4 py-3 text-sm bg-gray-50 hover:bg-white focus:bg-white focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all disabled:opacity-60">
                    <template x-if="registerForm.country">
                      <img :src="flagUrl(registerForm.country)" :alt="registerForm.countryName" class="w-6 h-4 rounded-sm object-cover flex-shrink-0">
                    </template>
                    <template x-if="!registerForm.country">
                      <i class="fa-solid fa-earth-asia text-gray-400 text-sm w-6 text-center"></i>
                    </template>
                    <span class="flex-1 text-left" :class="registerForm.country ? 'text-gray-900 font-medium' : 'text-gray-400'"
                          x-text="registerForm.countryName || 'Select country'"></span>
                    <i class="fa-solid fa-chevron-down text-gray-400 text-xs"></i>
                  </button>
                  <!--
                    Surface the derived timezone so the owner sees, at
                    signup, exactly what locale their working hours /
                    booking slots will run in. They can change it later
                    from per-branch settings.
                  -->
                  <template x-if="registerForm.timezone">
                    <p class="mt-1.5 text-xs text-gray-500 flex items-center gap-1.5">
                      <i class="fa-regular fa-clock text-[10px]"></i>
                      <span>Timezone: <span class="font-medium text-gray-700" x-text="registerForm.timezone"></span></span>
                    </p>
                  </template>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                  <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">State / Region</label>
                    <select x-model="registerForm.state"
                            @change="onStateChange()"
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white appearance-none"
                            :disabled="!registerForm.country || registerStates.length === 0">
                      <option value="" x-text="!registerForm.country ? 'Select country first' : (registerStates.length === 0 ? 'No states available' : 'Select state')"></option>
                      <template x-for="s in registerStates" :key="s.isoCode">
                        <option :value="s.isoCode" x-text="s.name"></option>
                      </template>
                    </select>
                  </div>
                  <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">City</label>
                    <!--
                      Render a free-text input when the catalogue has no
                      cities for the chosen country/state (small territories
                      or country-only addresses) so the user can still type.
                    -->
                    <template x-if="registerCities.length > 0">
                      <select x-model="registerForm.city"
                              class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white appearance-none"
                              required>
                        <option value="">Select city</option>
                        <template x-for="city in registerCities" :key="city">
                          <option :value="city" x-text="city"></option>
                        </template>
                      </select>
                    </template>
                    <template x-if="registerCities.length === 0">
                      <input type="text" x-model="registerForm.city"
                             class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white disabled:opacity-60"
                             :placeholder="!registerForm.country ? 'Select country first' : 'Type city name'"
                             :disabled="!registerForm.country"
                             required>
                    </template>
                  </div>
                </div>
                <div class="mb-5">
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Address</label>
                  <div class="relative">
                    <div class="absolute top-3 left-0 pl-3.5 flex items-start pointer-events-none">
                      <i class="fa-solid fa-location-dot text-gray-400 text-sm"></i>
                    </div>
                    <textarea x-model="registerForm.address" rows="2" class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white resize-none" placeholder="Full address of your centre"></textarea>
                  </div>
                </div>
                <div x-show="registerError" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm flex items-center gap-2">
                  <i class="fa-solid fa-circle-exclamation"></i>
                  <span x-text="registerError"></span>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-brand to-brand-dark text-white py-3 rounded-xl font-bold text-sm hover:shadow-lg transition-all duration-200 disabled:opacity-50" :disabled="registerLoading">
                  <span x-show="!registerLoading">Create Centre Account</span>
                  <span x-show="registerLoading"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Creating account...</span>
                </button>
                <p class="text-xs text-gray-400 text-center mt-3">By signing up, you agree to our Terms of Service</p>
              </form>
              <div class="mt-5 text-center">
                <p class="text-sm text-gray-500">Already have an account? <button @click="authMode = 'signin'" class="text-brand font-bold hover:text-brand-dark transition-colors">Sign In</button></p>
              </div>
            </div>
          </div>

          <!-- VERIFY EMAIL (OTP) FORM -->
          <div x-show="authMode === 'verify'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
            <div class="mb-6">
              <h2 class="text-2xl font-extrabold text-gray-900">Verify your email</h2>
              <p class="text-gray-500 mt-1 text-sm">
                Enter the 6-digit code we sent to
                <span class="font-semibold text-gray-700" x-text="pendingVerify.email || 'your email'"></span>.
                The code expires in 10 minutes.
              </p>
            </div>
            <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8">
              <form @submit.prevent="verifyEmailOtp()">
                <div class="mb-5">
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Verification Code</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <i class="fa-solid fa-shield-halved text-gray-400 text-sm"></i>
                    </div>
                    <input
                      type="text"
                      inputmode="numeric"
                      autocomplete="one-time-code"
                      maxlength="6"
                      pattern="[0-9]{6}"
                      x-model="verifyForm.code"
                      @input="verifyForm.code = (verifyForm.code || '').replace(/\D+/g, '').slice(0, 6)"
                      class="w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 text-lg tracking-[0.4em] font-mono focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition-all bg-gray-50 focus:bg-white"
                      placeholder="123456"
                      required>
                  </div>
                </div>
                <div x-show="verifyError" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm flex items-center gap-2">
                  <i class="fa-solid fa-circle-exclamation"></i>
                  <span x-text="verifyError"></span>
                </div>
                <div x-show="verifyInfo" class="mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-700 text-sm flex items-center gap-2">
                  <i class="fa-solid fa-circle-check"></i>
                  <span x-text="verifyInfo"></span>
                </div>
                <button
                  type="submit"
                  class="w-full bg-gradient-to-r from-brand to-brand-dark text-white py-3 rounded-xl font-bold text-sm hover:shadow-lg transition-all duration-200 disabled:opacity-50"
                  :disabled="verifyLoading || (verifyForm.code || '').length !== 6">
                  <span x-show="!verifyLoading">Verify &amp; Continue</span>
                  <span x-show="verifyLoading"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Verifying...</span>
                </button>
                <div class="flex items-center justify-between mt-4 text-sm">
                  <button
                    type="button"
                    @click="resendEmailOtp()"
                    :disabled="resendLoading || resendCooldown > 0"
                    class="text-brand font-semibold hover:text-brand-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <span x-show="!resendLoading && resendCooldown === 0">Resend code</span>
                    <span x-show="resendLoading"><i class="fa-solid fa-spinner fa-spin mr-1"></i>Sending...</span>
                    <span x-show="!resendLoading && resendCooldown > 0">Resend in <span x-text="resendCooldown"></span>s</span>
                  </button>
                  <button
                    type="button"
                    @click="cancelVerify()"
                    class="text-gray-500 font-semibold hover:text-gray-700 transition-colors">
                    Wrong email? Start over
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- DASHBOARD LAYOUT -->
  <template x-if="loggedIn">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar (clean, light, brand-only accent) -->
      <aside class="w-[248px] bg-white border-r border-[var(--ink-100)] flex flex-col flex-shrink-0 z-40">
        <!-- Brand Header -->
        <div class="px-5 pt-6 pb-5 border-b border-[var(--ink-100)]">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-[10px] flex items-center justify-center" style="background: var(--brand);">
              <img src="/assets/images/logo-white.png" alt="TIQKETS" class="w-7 h-7 object-contain">
            </div>
            <div class="min-w-0 flex-1">
              <h2 class="font-bold text-sm leading-tight truncate" style="color: var(--ink-900); letter-spacing: 0.02em;" x-text="org?.name || 'TIQKETS'"></h2>
              <p class="text-[11px] font-medium" style="color: var(--ink-400);">Centre Dashboard</p>
            </div>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
          <template x-for="item in visibleMenuItems" :key="item.id">
            <button @click="currentPage = item.id; if(item.id !== 'billing') loadPageData()" class="sidebar-nav w-full" :class="{ 'active': currentPage === item.id }">
              <i :class="item.icon" class="text-sm w-4 text-center flex-shrink-0"></i>
              <span class="flex-1 text-left" x-text="item.label"></span>
            </button>
          </template>
        </nav>

        <!-- User Profile & Sign Out -->
        <div class="px-3 pb-4 pt-3 border-t border-[var(--ink-100)]">
          <button @click="openProfile()" class="w-full flex items-center gap-3 px-2 py-2 mb-1 rounded-[10px] hover:bg-[var(--ink-50)] transition-colors group">
            <div class="w-8 h-8 rounded-lg overflow-hidden flex-shrink-0" x-show="!currentUser.profilePictureUrl">
              <div class="w-full h-full text-white flex items-center justify-center text-xs font-bold" style="background: var(--brand);" x-text="(currentUser.name || org?.name || 'T').charAt(0)"></div>
            </div>
            <img x-show="currentUser.profilePictureUrl" :src="currentUser.profilePictureUrl" class="w-8 h-8 rounded-lg object-cover flex-shrink-0">
            <div class="min-w-0 flex-1 text-left">
              <p class="text-xs font-semibold truncate" style="color: var(--ink-900);" x-text="currentUser.name || org?.name || 'Centre'"></p>
              <p class="text-[10px] truncate" style="color: var(--ink-400);" x-text="formatRole(currentUser.role)"></p>
            </div>
            <i class="fa-solid fa-chevron-right text-[10px] group-hover:opacity-100 opacity-40 transition-opacity" style="color: var(--ink-400);"></i>
          </button>
          <button @click="logout()" class="sidebar-nav w-full" style="color: var(--ink-500);">
            <i class="fa-solid fa-right-from-bracket text-sm w-4 text-center flex-shrink-0"></i>
            <span class="flex-1 text-left">Sign Out</span>
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto bg-surface">
        <!-- Top Bar -->
        <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-xl border-b border-gray-100/80 px-8 py-4">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-xl font-extrabold text-gray-900" x-text="visibleMenuItems.find(m => m.id === currentPage)?.label || currentPage"></h1>
              <p class="text-xs text-gray-400 mt-0.5" x-text="getPageDescription()"></p>
            </div>
            <div class="flex items-center gap-3">
              <!-- Overview: Branch dropdown with All Branches -->
              <template x-if="currentPage === 'overview'">
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-building text-gray-400 text-xs"></i></div>
                  <select x-model="overviewBranchFilter" @change="loadStats()" class="pl-8 pr-8 py-2 rounded-xl border text-xs font-semibold outline-none appearance-none cursor-pointer transition-all min-w-[160px]" :class="overviewBranchFilter ? 'border-brand bg-brand-50/40 text-brand' : 'border-gray-200 bg-gray-50/80 text-gray-700 hover:border-gray-300'">
                    <option value="">All Branches</option>
                    <template x-for="b in accessibleBranches" :key="b.id">
                      <option :value="b.id" x-text="b.name"></option>
                    </template>
                  </select>
                  <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none"><i class="fa-solid fa-chevron-down text-[10px]" :class="overviewBranchFilter ? 'text-brand' : 'text-gray-400'"></i></div>
                </div>
              </template>

              <!-- Queue: Branch + Service + Desk dropdowns -->
              <template x-if="currentPage === 'queue'">
                <div class="flex items-center gap-2">
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-building text-gray-400 text-xs"></i></div>
                    <select x-model="selectedBranchId" @change="queueServiceFilter = ''; queueDeskFilter = ''; onBranchChange()" class="pl-8 pr-8 py-2 rounded-xl border text-xs font-semibold outline-none appearance-none cursor-pointer transition-all min-w-[140px]" :class="'border-gray-200 bg-gray-50/80 text-gray-700 hover:border-gray-300'">
                      <template x-for="b in accessibleBranches" :key="b.id">
                        <option :value="b.id" x-text="b.name"></option>
                      </template>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none"><i class="fa-solid fa-chevron-down text-gray-400 text-[10px]"></i></div>
                  </div>
                  <div class="relative">
                    <select x-model="queueServiceFilter" @change="queueDeskFilter = ''" class="pl-3 pr-7 py-2 rounded-xl border text-xs font-semibold outline-none appearance-none cursor-pointer transition-all min-w-[130px]" :class="queueServiceFilter ? 'border-brand bg-brand-50/40 text-brand' : 'border-gray-200 bg-gray-50/80 text-gray-700 hover:border-gray-300'">
                      <option value="">All Services</option>
                      <template x-for="svc in accessibleServicesFor(selectedBranch)" :key="svc.id">
                        <option :value="svc.id" x-text="svc.name"></option>
                      </template>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-[8px] pointer-events-none" :class="queueServiceFilter ? 'text-brand' : 'text-gray-400'"></i>
                  </div>
                  <div class="relative">
                    <select x-model="queueDeskFilter" class="pl-3 pr-7 py-2 rounded-xl border text-xs font-semibold outline-none appearance-none cursor-pointer transition-all min-w-[120px]" :class="queueDeskFilter ? 'border-blue-500 bg-blue-50/40 text-blue-600' : 'border-gray-200 bg-gray-50/80 text-gray-700 hover:border-gray-300'">
                      <option value="">All Desks</option>
                      <template x-for="desk in getDesksForQueueFilter()" :key="desk.id">
                        <option :value="desk.id" x-text="desk.name"></option>
                      </template>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-[8px] pointer-events-none" :class="queueDeskFilter ? 'text-blue-500' : 'text-gray-400'"></i>
                  </div>
                  <template x-if="queueServiceFilter || queueDeskFilter">
                    <button @click="queueServiceFilter = ''; queueDeskFilter = ''" class="px-2 py-1.5 rounded-lg text-[10px] font-bold bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all"><i class="fa-solid fa-times"></i></button>
                  </template>
                </div>
              </template>

                      <template x-for="b in accessibleBranches" :key="b.id">

                  <div class="relative">

                  <template x-if="bookingBranchFilter || bookingServiceFilter">
                    <button @click="bookingBranchFilter = ''; bookingServiceFilter = ''" class="px-2 py-1.5 rounded-lg text-[10px] font-bold bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all"><i class="fa-solid fa-times"></i></button>
                  </template>
                </div>
              </template>

              <!-- Settings: Branch + Service dropdowns -->
              <template x-if="currentPage === 'settings'">
                <div class="flex items-center gap-2">
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-building text-gray-400 text-xs"></i></div>
                    <select x-model="selectedBranchId" @change="settingsServiceFilter = ''; onBranchChange()" class="pl-8 pr-8 py-2 rounded-xl border text-xs font-semibold outline-none appearance-none cursor-pointer transition-all min-w-[140px] border-gray-200 bg-gray-50/80 text-gray-700 hover:border-gray-300">
                      <template x-for="b in accessibleBranches" :key="b.id">
                        <option :value="b.id" x-text="b.name"></option>
                      </template>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none"><i class="fa-solid fa-chevron-down text-gray-400 text-[10px]"></i></div>
                  </div>
                  <div class="relative">
                    <select x-model="settingsServiceFilter" @change="loadSettingsForm(); loadAnnouncementDevices()" class="pl-3 pr-7 py-2 rounded-xl border text-xs font-semibold outline-none appearance-none cursor-pointer transition-all min-w-[130px]" :class="settingsServiceFilter ? 'border-blue-500 bg-blue-50/40 text-blue-600' : 'border-gray-200 bg-gray-50/80 text-gray-700 hover:border-gray-300'">
