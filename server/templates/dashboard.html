                  <i class="fa-solid fa-check mr-1.5"></i>Assign Table
                </button>
              </div>
            </div>
          </div>

          <!-- PLAN CHANGE CONFIRMATION MODAL -->
          <!-- In-app replacement for window.confirm. The header colour and CTA
               style change with planChangeContext.tone so an upgrade looks
               affirmative (brand) and a downgrade looks cautionary (amber). -->
          <div x-show="showPlanChangeModal && planChangeContext" x-cloak class="modal-overlay" @click.self="!planChangeBusy && (showPlanChangeModal = false)">
            <div class="modal-content" style="max-width: 32rem;" @click.stop>
              <!-- Header -->
              <div class="px-6 py-5 border-b border-gray-100 flex items-start justify-between gap-4"
                   :class="planChangeContext?.tone === 'amber' ? 'bg-amber-50/60' : 'bg-brand-50/40'">
                <div class="flex items-start gap-3">
                  <div class="w-11 h-11 rounded-2xl flex items-center justify-center flex-shrink-0"
                       :class="planChangeContext?.tone === 'amber' ? 'bg-amber-100 text-amber-700' : 'bg-brand/10 text-brand'">
                    <i class="fa-solid" :class="planChangeContext?.tone === 'amber' ? 'fa-clock-rotate-left' : 'fa-arrow-trend-up'"></i>
                  </div>
                  <div>
                    <h3 class="text-lg font-black text-gray-900" x-text="planChangeContext?.title || 'Confirm plan change'"></h3>
                    <p class="text-xs text-gray-500 mt-0.5" x-text="planChangeContext?.subtitle || ''"></p>
                  </div>
                </div>
                <button @click="showPlanChangeModal = false" :disabled="planChangeBusy" class="w-8 h-8 rounded-lg hover:bg-white/60 flex items-center justify-center text-gray-400 disabled:opacity-40">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>

              <!-- Body -->
              <div class="px-6 py-5">
                <p class="text-sm text-gray-600 leading-relaxed" x-text="planChangeContext?.explanation || ''"></p>

                <!-- Plan transition pill -->
                <div class="mt-5 flex items-center justify-between gap-3 p-4 rounded-2xl bg-gray-50 border border-gray-100">
                  <div class="text-center flex-1 min-w-0">
                    <p class="text-[10px] uppercase tracking-wide font-bold text-gray-400">Current</p>
                    <p class="text-sm font-bold text-gray-900 mt-0.5 truncate" x-text="planChangeContext?.currentPlanName || '—'"></p>
                  </div>
                  <i class="fa-solid fa-arrow-right text-gray-300"></i>
                  <div class="text-center flex-1 min-w-0">
                    <p class="text-[10px] uppercase tracking-wide font-bold text-gray-400">New</p>
                    <p class="text-sm font-bold mt-0.5 truncate"
                       :class="planChangeContext?.tone === 'amber' ? 'text-amber-700' : 'text-brand'"
                       x-text="planChangeContext?.newPlanName || '—'"></p>
                  </div>
                </div>

                <!-- Period dates -->
                <div class="mt-4 grid grid-cols-2 gap-3">
                  <div class="p-3 rounded-xl border border-gray-100 bg-white">
                    <p class="text-[10px] uppercase tracking-wide font-bold text-gray-400" x-text="planChangeContext?.periodStartLabel || 'Starts on'"></p>
                    <p class="text-sm font-bold text-gray-900 mt-1" x-text="planChangeContext?.periodStart || '—'"></p>
                  </div>
                  <div class="p-3 rounded-xl border border-gray-100 bg-white">
                    <p class="text-[10px] uppercase tracking-wide font-bold text-gray-400" x-text="planChangeContext?.periodEndLabel || 'Ends on'"></p>
                    <p class="text-sm font-bold text-gray-900 mt-1" x-text="planChangeContext?.periodEnd || '—'"></p>
                  </div>
                </div>

                <!-- Pricing breakdown (only when payment is involved) -->
                <template x-if="planChangeContext?.lineItems && planChangeContext.lineItems.length">
                  <div class="mt-4 p-4 rounded-xl border border-gray-100 bg-white">
                    <p class="text-[10px] uppercase tracking-wide font-bold text-gray-400 mb-2.5">Payment Breakdown</p>
                    <template x-for="(item, idx) in planChangeContext.lineItems" :key="idx">
                      <div class="flex items-center justify-between py-1.5 text-sm" :class="item.emphasize ? 'border-t border-gray-100 mt-1.5 pt-2.5 font-bold text-gray-900' : 'text-gray-600'">
                        <span x-text="item.label"></span>
                        <span x-text="item.value"></span>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <!-- Footer -->
              <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex justify-end gap-3 rounded-b-[var(--radius-lg)]">
                <button @click="showPlanChangeModal = false" :disabled="planChangeBusy"
                        class="px-4 py-2 rounded-xl text-sm font-bold text-gray-600 hover:bg-white border border-gray-200 transition-colors disabled:opacity-40">
                  Cancel
                </button>
                <button @click="confirmPlanChange()" :disabled="planChangeBusy"
                        class="px-5 py-2 rounded-xl text-sm font-bold text-white transition-all shadow-sm disabled:opacity-60"
                        :class="planChangeContext?.tone === 'amber' ? 'bg-amber-600 hover:bg-amber-700' : 'bg-gradient-to-r from-brand to-brand-dark hover:shadow-lg'">
                  <i x-show="planChangeBusy" class="fa-solid fa-spinner fa-spin mr-1.5"></i>
                  <span x-text="planChangeContext?.confirmLabel || 'Confirm'"></span>
                </button>
              </div>
            </div>
          </div>

          <!-- GENERIC IN-APP CONFIRM MODAL (replaces window.confirm) -->
          <div x-show="showConfirmModal" x-cloak class="modal-overlay" @click.self="showConfirmModal = false">
            <div class="modal-content" style="max-width: 26rem;" @click.stop>
              <div class="px-6 py-5">
                <h3 class="text-lg font-black text-gray-900" x-text="confirmContext.title || 'Are you sure?'"></h3>
                <p class="text-sm text-gray-600 leading-relaxed mt-2" x-text="confirmContext.message || ''"></p>
              </div>
              <div class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex justify-end gap-3 rounded-b-[var(--radius-lg)]">
                <button @click="showConfirmModal = false" class="px-4 py-2 rounded-xl text-sm font-bold text-gray-600 hover:bg-white border border-gray-200 transition-colors" x-text="confirmContext.cancelLabel || 'Cancel'"></button>
                <button @click="resolveConfirm()" class="px-5 py-2 rounded-xl text-sm font-bold text-white transition-all shadow-sm"
                        :class="confirmContext.tone === 'danger' ? 'bg-red-600 hover:bg-red-700' : (confirmContext.tone === 'amber' ? 'bg-amber-600 hover:bg-amber-700' : 'bg-gradient-to-r from-brand to-brand-dark hover:shadow-lg')"
                        x-text="confirmContext.confirmLabel || 'Confirm'"></button>
              </div>
            </div>
          </div>

          <!-- BRANCHES PAGE -->
          <div x-show="currentPage === 'branches'" x-transition>
            <div class="flex justify-between items-center mb-6">
              <p class="text-sm text-gray-500"><span class="font-bold text-gray-700" x-text="branches.length"></span> branches configured</p>
              <button x-show="hasPerm('org.branches.create')" @click="openBranchModal()" class="btn-primary"><i class="fa-solid fa-plus mr-2"></i>Add Branch</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              <template x-for="b in branches" :key="b.id">
                <div class="dash-card hover:shadow-md transition-all duration-200 group">
                  <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center gap-3">
                      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-brand-50 to-purple-50 text-brand flex items-center justify-center border border-brand-100/50"><i class="fa-solid fa-building"></i></div>
                      <div>
                        <h4 class="font-bold text-gray-900 text-sm" x-text="b.name"></h4>
                        <p class="text-[11px] text-gray-400" x-text="b.address || 'No address set'"></p>
                      </div>
                    </div>
                    <div class="flex gap-1 transition-opacity" :class="b.isActive ? 'opacity-0 group-hover:opacity-100' : 'opacity-100'">
                      <button x-show="hasPerm('org.branches.edit')" @click="toggleBranch(b.id, b.isActive)" class="w-8 h-8 rounded-lg flex items-center justify-center transition-colors" :class="b.isActive ? 'hover:bg-orange-50 text-gray-400 hover:text-orange-500' : 'bg-green-50 text-green-500 hover:bg-green-100'" :title="b.isActive ? 'Deactivate branch' : 'Activate branch'"><i class="fa-solid text-xs" :class="b.isActive ? 'fa-pause' : 'fa-play'"></i></button>
                      <button x-show="hasPerm('org.branches.edit')" @click="openBranchModal(b)" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                      <button x-show="hasPerm('org.branches.delete')" @click="deleteBranch(b.id)" class="w-8 h-8 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-500 flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                  </div>
                  <div class="flex flex-wrap gap-1.5 mb-4">
                    <template x-for="svc in (b.services || [])" :key="svc.id">
                      <span class="badge bg-brand-50/80 text-brand border border-brand-100/50" x-text="svc.name"></span>
                    </template>
                    <span x-show="!b.services || b.services.length === 0" class="text-[11px] text-gray-300 italic">No services added</span>
                  </div>
                  <div class="flex items-center gap-2 mb-3">
                    <button @click="showQRModal = true; qrBranch = b" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-xl bg-gray-50 hover:bg-gray-100 text-gray-500 hover:text-gray-700 border border-gray-100 transition-all text-xs font-bold">
                      <i class="fa-solid fa-qrcode text-sm"></i>
                      <span>Download QR Code</span>
                    </button>
                  </div>
                  <div class="flex items-center justify-between pt-3 border-t border-gray-100/80">
                    <span class="text-[11px] text-gray-400" x-text="(b.city || '') + (b.state ? ', ' + b.state : '')"></span>
                    <span class="badge" :class="b.isActive ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-gray-100 text-gray-500 border border-gray-200'" x-text="b.isActive ? 'Active' : 'Inactive'"></span>
                  </div>
                </div>
              </template>
            </div>
            <div x-show="branches.length === 0" class="text-center py-20">
              <div class="w-20 h-20 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-4"><i class="fa-solid fa-building text-3xl text-gray-300"></i></div>
              <p class="text-base font-bold text-gray-400">No branches yet</p>
              <p class="text-sm text-gray-300 mt-1 mb-4">Create your first branch to start managing queues</p>
              <button @click="openBranchModal()" class="btn-primary">Create First Branch</button>
            </div>
          </div>

          <!-- SERVICES PAGE -->
          <div x-show="currentPage === 'services'" x-transition>
            <div class="flex justify-between items-center mb-6">
              <div class="flex items-center gap-3">
                <span class="text-sm text-gray-500">Manage services and desks across your branches</span>
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-brand-50 text-brand text-[11px] font-bold border border-brand-100/40">
                  <i class="fa-solid fa-layer-group text-[9px]"></i>
                  <span x-text="accessibleBranches.reduce((t,b) => t + (b.services||[]).length, 0) + ' total'"></span>
                </span>
              </div>
              <button x-show="hasPerm('org.services.create')" @click="openServiceModal()" class="btn-primary"><i class="fa-solid fa-plus mr-2"></i>Add Service</button>
            </div>

            <template x-for="branch in accessibleBranches" :key="branch.id">
              <div class="mb-8">

                    <h3 class="text-sm font-extrabold text-gray-900" x-text="branch.name"></h3>
                    <p class="text-[11px] text-gray-400" x-text="(branch.services || []).length + ' service' + ((branch.services || []).length !== 1 ? 's' : '') + (branch.address ? ' \u00B7 ' + branch.address : '')"></p>
                  </div>
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-bold" :class="branch.isActive ? 'bg-green-50 text-green-600 border border-green-100' : 'bg-gray-50 text-gray-400 border border-gray-200'" x-text="branch.isActive ? 'Active' : 'Inactive'"></span>
                </div>

                <!-- Service Cards -->
                <div class="space-y-3" x-show="(branch.services || []).length > 0">
                  <template x-for="svc in (branch.services || [])" :key="svc.id">
                    <div class="rounded-2xl border border-gray-100 bg-white overflow-hidden hover:shadow-md transition-all duration-200">
                      <!-- Service Row -->
                      <div class="flex items-center gap-4 px-5 py-4 group cursor-pointer" @click="toggleServiceExpand(svc.id)">
                        <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" :class="svc.isActive ? 'bg-gradient-to-br from-brand-50 to-purple-50 text-brand' : 'bg-gray-100 text-gray-400'">
                          <i class="fa-solid fa-concierge-bell text-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                          <div class="flex items-center gap-2 mb-0.5">
                            <span class="font-extrabold text-gray-900 text-[13px]" x-text="svc.name"></span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold" :class="svc.isActive ? 'bg-green-50 text-green-600 border border-green-100' : 'bg-gray-50 text-gray-400 border border-gray-200'" x-text="svc.isActive ? 'Active' : 'Inactive'"></span>

                              <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-emerald-50 text-emerald-600 text-[10px] font-bold border border-emerald-100"><i class="fa-solid fa-location-dot text-[8px]"></i>In-Person</span>

                            <span class="text-[11px] font-bold text-gray-700" x-text="(svc.averageWaitTime || 0) + 'm'"></span>

                            <span class="text-[11px] font-bold text-gray-700" x-text="(svc.estimatedDuration || 0) + 'm'"></span>

                          <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-purple-50/60 border border-purple-100/60">
                            <i class="fa-solid fa-list-check text-[9px] text-purple-400"></i>
                            <span class="text-[11px] font-bold text-purple-600" x-text="(svc.inputFields || []).length"></span>
                            <span class="text-[9px] text-purple-400">fields</span>
                          </div>
                          <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-blue-50/60 border border-blue-100/60">
                            <i class="fa-solid fa-desktop text-[9px] text-blue-400"></i>
                            <span class="text-[11px] font-bold text-blue-600" x-text="(svc.desks || []).length"></span>
                            <span class="text-[9px] text-blue-400">desks</span>
                          </div>

                        <span class="text-[10px] text-blue-400"><i class="fa-solid fa-desktop mr-0.5"></i><span class="font-bold" x-text="(svc.desks || []).length"></span> desks</span>

                                </div>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </div>

                  <div class="w-14 h-14 mx-auto rounded-2xl bg-brand-50 flex items-center justify-center mb-3"><i class="fa-solid fa-concierge-bell text-xl text-brand/40"></i></div>
                  <p class="text-sm font-bold text-gray-400">No services in this branch</p>
                  <p class="text-xs text-gray-300 mt-1">Use the "Add Service" button above to get started</p>
                </div>

                <!-- Customer Journeys (Multi-Stage branches only) -->
                <div x-show="hasPerm('org.journeys.view') && isMultiStageBranch(branch)" class="mt-6 pt-6 border-t border-dashed border-gray-200">
                  <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2.5">
                      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-50 to-purple-50 text-indigo-500 flex items-center justify-center border border-indigo-100/50"><i class="fa-solid fa-route text-xs"></i></div>
                      <div>
                        <h4 class="text-xs font-extrabold text-gray-900">Customer Journeys</h4>
                        <p class="text-[11px] text-gray-400">Multi-stage service flows for this branch</p>
                      </div>
                    </div>
                    <button x-show="hasPerm('org.journeys.create')" @click="openJourneyModal(null, branch.id)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white text-[11px] font-bold shadow-sm transition-colors"><i class="fa-solid fa-plus text-[9px]"></i> Add Journey</button>
                  </div>

                  <div class="space-y-3">
                    <template x-for="j in (journeysByBranch[branch.id] || [])" :key="j.id">
                      <div class="dash-card hover:shadow-md transition-all duration-200 group">
                        <div class="flex items-center justify-between mb-4">
                          <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-50 to-purple-50 text-indigo-500 flex items-center justify-center border border-indigo-100/50"><i class="fa-solid fa-route"></i></div>
                            <div>
                              <h4 class="font-bold text-gray-900 text-sm" x-text="j.name"></h4>
                              <p class="text-[11px] text-gray-400" x-text="j.description || 'No description'"></p>
                            </div>
                          </div>
                          <div class="flex items-center gap-2">
                            <span class="badge" :class="j.isActive ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-gray-100 text-gray-500 border border-gray-200'" x-text="j.isActive ? 'Active' : 'Inactive'"></span>
                            <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                              <button x-show="hasPerm('org.journeys.edit')" @click="openJourneyModal(j, branch.id)" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 flex items-center justify-center transition-colors"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                              <button x-show="hasPerm('org.journeys.delete')" @click="deleteJourney(j.id, branch.id)" class="w-8 h-8 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-500 flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                          </div>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap p-3 bg-gray-50/60 rounded-xl border border-gray-100/50">
                          <template x-for="(stage, idx) in (j.stages || [])" :key="idx">
                            <div class="flex items-center gap-2">
                              <span class="px-3.5 py-1.5 rounded-lg text-xs font-bold" :class="stage.isOptional ? 'bg-white text-gray-400 border border-dashed border-gray-300' : 'bg-brand-50 text-brand border border-brand-100'" x-text="stage.serviceName + (stage.isOptional ? ' (Optional)' : '')"></span>
                              <i x-show="idx < (j.stages || []).length - 1" class="fa-solid fa-chevron-right text-gray-300 text-[10px]"></i>
                            </div>
                          </template>
                          <span x-show="!j.stages || j.stages.length === 0" class="text-xs text-gray-400 italic">No stages configured</span>
                        </div>
                      </div>
                    </template>
                    <div x-show="(journeysByBranch[branch.id] || []).length === 0" class="text-center py-10 bg-white rounded-2xl border-2 border-dashed border-gray-200/60">
                      <div class="w-12 h-12 mx-auto rounded-xl bg-indigo-50 flex items-center justify-center mb-3"><i class="fa-solid fa-route text-lg text-indigo-300"></i></div>
                      <p class="text-xs font-bold text-gray-400">No journeys configured</p>
                      <p class="text-[10px] text-gray-300 mt-1">Create multi-stage journeys for complex service flows</p>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <div x-show="accessibleBranches.length === 0" class="text-center py-20">
              <div class="w-20 h-20 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-4"><i class="fa-solid fa-building text-3xl text-gray-300"></i></div>
              <p class="text-base font-bold text-gray-400">No branches yet</p>
              <p class="text-sm text-gray-300 mt-1">Create a branch first, then add services to it</p>
            </div>
          </div>

          <!-- STAFF PAGE -->
          <div x-show="currentPage === 'staff'" x-transition>
            <div class="flex justify-between items-center mb-6">
              <p class="text-sm text-gray-500"><span class="font-bold text-gray-700" x-text="users.length"></span> team members</p>
              <button x-show="hasPerm('org.users.invite')" @click="openUserModal()" class="btn-primary"><i class="fa-solid fa-plus mr-2"></i>Add Staff</button>
            </div>
            <div class="dash-card-flat">
              <table class="w-full">
                <thead>
                  <tr><th class="table-header">Name</th><th class="table-header">Email</th><th class="table-header">Role</th><th class="table-header">Branch</th><th class="table-header">Status</th><th class="table-header text-right">Actions</th></tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                  <template x-for="u in users" :key="u.id">
                    <tr class="hover:bg-brand-50/20 transition-colors group">
                      <td class="table-cell">
                        <div class="flex items-center gap-3">
                          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-50 to-purple-50 text-brand flex items-center justify-center text-xs font-extrabold border border-brand-100/50" x-text="u.name?.charAt(0) || '?'"></div>
                          <span class="font-bold text-gray-900 text-sm" x-text="u.name"></span>
                        </div>
                      </td>
                      <td class="table-cell text-gray-400 text-xs" x-text="u.email"></td>
                      <td class="table-cell">
                        <span class="badge" :class="{
                          'bg-purple-50 text-purple-600 border border-purple-200': u.role === 'admin',
                          'bg-blue-50 text-blue-600 border border-blue-200': u.role === 'location_manager',
                          'bg-green-50 text-green-600 border border-green-200': u.role === 'floor_manager',
                          'bg-orange-50 text-orange-600 border border-orange-200': u.role === 'front_desk',
                          'bg-gray-50 text-gray-600 border border-gray-200': !['admin','location_manager','floor_manager','front_desk'].includes(u.role)
                        }" x-text="formatRole(u.role)"></span>
                      </td>
                      <td class="table-cell text-xs text-gray-500 font-medium">
                        <template x-if="(u.role === 'admin' || u.role === 'location_manager') && u.branchIds && u.branchIds.length > 0">
                          <span x-text="u.branchIds.map(bid => getBranchName(bid)).join(', ')"></span>
                        </template>
                        <template x-if="(u.role !== 'admin' && u.role !== 'location_manager') || !u.branchIds || u.branchIds.length === 0">
                          <span x-text="getBranchName(u.branchId)"></span>
                        </template>
                      </td>
                      <td class="table-cell">
                        <span class="badge" :class="u.isActive !== false ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-gray-100 text-gray-500 border border-gray-200'" x-text="u.isActive !== false ? 'Active' : 'Inactive'"></span>
                      </td>
                      <td class="table-cell text-right">
                        <div class="flex gap-1.5 justify-end transition-opacity">
                          <button x-show="hasPerm('org.users.edit') && canManageStaff(u)" @click="openUserModal(u)" class="w-8 h-8 rounded-lg bg-gray-50 hover:bg-gray-100 text-gray-400 hover:text-gray-600 flex items-center justify-center border border-gray-200 transition-colors"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                          <button x-show="hasPerm('org.users.deactivate') && canManageStaff(u)" @click="deleteUser(u.id)" class="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-400 hover:text-red-600 flex items-center justify-center border border-red-200 transition-colors"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div x-show="users.length === 0" class="text-center py-16">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-4"><i class="fa-solid fa-users text-2xl text-gray-300"></i></div>
                <p class="text-sm font-semibold text-gray-400">No team members yet</p>
                <p class="text-xs text-gray-300 mt-1">Add staff to manage your queues</p>
              </div>
            </div>
          </div>

          <!-- BOOKINGS PAGE -->
          <div x-show="currentPage === 'bookings'" x-transition>
            <!-- Tab navigation -->
            <div class="flex items-center gap-1 mb-6 bg-gray-100/80 rounded-xl p-1">
              <template x-for="tab in [{id:'hours',label:'Working Hours',icon:'fa-solid fa-clock'},{id:'breaks',label:'Breaks',icon:'fa-solid fa-mug-hot'},{id:'holidays',label:'Holidays',icon:'fa-solid fa-umbrella-beach'},{id:'slots',label:'Time Slots',icon:'fa-solid fa-table-cells'},{id:'appointments',label:'Appointments',icon:'fa-solid fa-calendar-check'}]" :key="tab.id">
                <button @click="bookingTab = tab.id; if(tab.id === 'appointments') loadBookings()" class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-lg text-xs font-bold transition-all" :class="bookingTab === tab.id ? 'bg-white text-brand shadow-sm' : 'text-gray-400 hover:text-gray-600'">
                  <i :class="tab.icon" class="text-[10px]"></i>
                  <span x-text="tab.label"></span>
                </button>
              </template>
            </div>

            <!-- WORKING HOURS TAB -->
            <div x-show="bookingTab === 'hours'" x-transition>
              <!-- Schedule override toggle: when ON, the branch ignores its
                   own working hours / breaks / holidays and uses only the
                   manual queue Start/Pause/End controls at the top of the
                   queue page. Useful for one-off late evenings or demos. -->
              <div class="dash-card-flat mb-4" x-show="selectedBranch">
                <div class="flex items-center gap-4">
                  <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
                    :class="getBookingActiveBranch()?.scheduleOverride ? 'bg-amber-50 text-amber-600' : 'bg-gray-50 text-gray-400'">
                    <i class="fa-solid" :class="getBookingActiveBranch()?.scheduleOverride ? 'fa-bolt' : 'fa-calendar-check'"></i>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm font-bold text-gray-900">Schedule controls queue status</div>
                    <p class="text-xs text-gray-400 mt-0.5"
                      x-text="getBookingActiveBranch()?.scheduleOverride
                        ? 'Override ON — schedule is ignored. Queue obeys the manual Start/Pause/End buttons only.'
                        : 'Outside working hours, on holidays, or during breaks the queue is auto-managed. Toggle override to ignore the schedule.'"></p>
                  </div>
                  <button type="button"
                    @click="toggleScheduleOverride()"
                    :disabled="scheduleOverrideUpdating"
                    class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors flex-shrink-0"
                    :class="getBookingActiveBranch()?.scheduleOverride ? 'bg-amber-500' : 'bg-gray-300'">
                    <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
                      :class="getBookingActiveBranch()?.scheduleOverride ? 'translate-x-6' : 'translate-x-1'"></span>
                  </button>
                </div>
              </div>

              <div class="dash-card-flat">
                <div class="flex items-center justify-between mb-5">
                  <div>
                    <h3 class="font-bold text-gray-900">Working Days & Hours</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Set your operating schedule for each day of the week</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-semibold text-gray-400" x-text="getOperatingHours().filter(h => h.isOpen).length + '/7 days open'"></span>
                  </div>
                </div>
                <div x-show="getOperatingHours().length > 0" class="space-y-2">
                  <template x-for="oh in getOperatingHours()" :key="oh.id">
                    <div class="flex items-center gap-4 p-3.5 rounded-xl border transition-all" :class="oh.isOpen ? 'border-gray-200 bg-white' : 'border-gray-100 bg-gray-50/50'">
                      <button @click="toggleDay(oh)" class="flex items-center gap-2.5 min-w-[130px]">
                        <div class="w-5 h-5 rounded flex items-center justify-center text-xs" :class="oh.isOpen ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-400'">
                          <i :class="oh.isOpen ? 'fa-solid fa-check' : 'fa-solid fa-xmark'" class="text-[10px]"></i>
                        </div>
                        <span class="text-sm font-bold" :class="oh.isOpen ? 'text-gray-900' : 'text-gray-400'" x-text="getDayName(oh.dayOfWeek)"></span>
                      </button>
                      <template x-if="oh.isOpen">
                        <div class="flex items-center gap-2 flex-1">
                          <input type="time" :value="oh.openTime" @change="updateHourTime(oh, 'openTime', $event.target.value)" class="px-3 py-2 rounded-lg border border-gray-200 bg-gray-50 text-xs font-semibold text-gray-700 focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none">
                          <span class="text-xs text-gray-400 font-medium">to</span>
                          <input type="time" :value="oh.closeTime" @change="updateHourTime(oh, 'closeTime', $event.target.value)" class="px-3 py-2 rounded-lg border border-gray-200 bg-gray-50 text-xs font-semibold text-gray-700 focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none">
                          <div class="ml-auto flex items-center gap-1.5">
                            <template x-if="oh.breaks && oh.breaks.length > 0">
                              <span class="text-[10px] font-semibold text-amber-500 bg-amber-50 px-2 py-0.5 rounded-full" x-text="oh.breaks.length + ' break' + (oh.breaks.length > 1 ? 's' : '')"></span>
                            </template>
                          </div>
                        </div>
                      </template>
                      <template x-if="!oh.isOpen">
                        <span class="text-xs text-gray-400 font-semibold italic">Closed</span>
                      </template>
                    </div>
                  </template>
                </div>
                <div x-show="getOperatingHours().length === 0" class="text-center py-12">
                  <div class="w-14 h-14 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-3"><i class="fa-solid fa-clock text-xl text-gray-300"></i></div>
                  <p class="text-sm font-semibold text-gray-400">No operating hours set</p>
                  <p class="text-xs text-gray-300 mt-1">Operating hours will appear once configured for this branch</p>
                </div>
              </div>
            </div>

            <!-- BREAKS TAB -->
            <div x-show="bookingTab === 'breaks'" x-transition>
              <div class="dash-card-flat p-6">
                <div class="flex items-center justify-between mb-5">
                  <div>
                    <h3 class="font-bold text-gray-900">Break Times</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Configure break periods for each working day</p>
                  </div>
                  <button x-show="getOperatingHourByDay(selectedBreakDay)?.isOpen" @click="showBreakModal = true; editingBreak = null; breakForm = {name:'',startTime:'12:00',endTime:'12:30'}" class="btn-primary text-xs"><i class="fa-solid fa-plus mr-1.5"></i>Add Break</button>
                </div>
                <!-- Day selector -->
                <div class="flex gap-2 mb-5 overflow-x-auto pb-1">
                  <template x-for="(day, idx) in ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']" :key="idx">
                    <button @click="selectedBreakDay = idx" class="px-4 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap" :class="selectedBreakDay === idx ? 'bg-brand text-white shadow-sm' : (getOperatingHourByDay(idx)?.isOpen ? 'bg-gray-100 text-gray-600 hover:bg-gray-200' : 'bg-gray-50 text-gray-300 cursor-not-allowed')" :disabled="!getOperatingHourByDay(idx)?.isOpen">
                      <span x-text="day"></span>
                    </button>
                  </template>
                </div>
                <!-- Breaks for selected day -->
                <div x-show="getOperatingHourByDay(selectedBreakDay)?.isOpen">
                  <div class="flex items-center justify-between mb-3">
                    <p class="text-xs text-gray-500 font-medium">Breaks for <span class="font-bold text-gray-700" x-text="getDayName(selectedBreakDay)"></span></p>
                  </div>
                  <div class="space-y-2">
                    <template x-for="brk in getBreaksForDay(selectedBreakDay)" :key="brk.id">
                      <div class="flex items-center justify-between p-3.5 rounded-xl border transition-all" :class="brk.isActive !== false ? 'border-gray-200 bg-white' : 'border-gray-100 bg-gray-50/50'">
                        <div class="flex items-center gap-3">
                          <div class="w-9 h-9 rounded-xl flex items-center justify-center" :class="brk.isActive !== false ? 'bg-amber-50 text-amber-500' : 'bg-gray-100 text-gray-300'"><i class="fa-solid fa-mug-hot text-sm"></i></div>
                          <div>
                            <p class="text-sm font-bold" :class="brk.isActive !== false ? 'text-gray-900' : 'text-gray-400 line-through'" x-text="brk.name"></p>
                            <p class="text-xs font-medium" :class="brk.isActive !== false ? 'text-gray-400' : 'text-gray-300'"><span x-text="brk.startTime"></span> – <span x-text="brk.endTime"></span></p>
                          </div>
                        </div>
                        <div class="flex items-center gap-2">
                          <button @click="toggleBreakActive(brk)" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all" :class="brk.isActive !== false ? 'bg-green-50 text-green-500 hover:bg-green-100' : 'bg-gray-100 text-gray-400 hover:bg-gray-200'" :title="brk.isActive !== false ? 'Disable' : 'Enable'"><i :class="brk.isActive !== false ? 'fa-solid fa-toggle-on' : 'fa-solid fa-toggle-off'" class="text-sm"></i></button>
                          <button @click="editingBreak = brk; breakForm = {name:brk.name,startTime:brk.startTime,endTime:brk.endTime}; showBreakModal = true" class="w-8 h-8 rounded-lg bg-gray-100 text-gray-400 hover:bg-blue-50 hover:text-blue-500 flex items-center justify-center transition-all"><i class="fa-solid fa-pen text-xs"></i></button>
                          <button @click="deleteBreak(brk.id)" class="w-8 h-8 rounded-lg bg-gray-100 text-gray-400 hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-all"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                      </div>
                    </template>
                  </div>
                  <div x-show="getBreaksForDay(selectedBreakDay).length === 0" class="text-center py-10">
                    <div class="w-14 h-14 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-3"><i class="fa-solid fa-mug-hot text-xl text-gray-300"></i></div>
                    <p class="text-sm font-semibold text-gray-400">No breaks configured</p>
                    <p class="text-xs text-gray-300 mt-1">Add break periods for this day</p>
                  </div>
                </div>
                <div x-show="!getOperatingHourByDay(selectedBreakDay)?.isOpen" class="text-center py-10">
                  <div class="w-14 h-14 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-3"><i class="fa-solid fa-calendar-xmark text-xl text-gray-300"></i></div>
                  <p class="text-sm font-semibold text-gray-400">This day is closed</p>
                  <p class="text-xs text-gray-300 mt-1">Enable this day in Working Hours to add breaks</p>
                </div>
              </div>
            </div>

            <!-- HOLIDAYS TAB -->
            <div x-show="bookingTab === 'holidays'" x-transition>
              <div class="dash-card-flat p-6">
                <div class="flex items-center justify-between mb-5">
                  <div>
                    <h3 class="font-bold text-gray-900">Holidays</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Mark dates when your centre will be closed</p>
                  </div>
                  <button @click="showHolidayModal = true; editingHoliday = null; holidayForm = {name:'',date:'',isRecurring:false}" class="btn-primary text-xs"><i class="fa-solid fa-plus mr-1.5"></i>Add Holiday</button>
                </div>
                <!-- Compact Calendar view -->
                <div class="mb-5 max-w-sm">
                  <div class="flex items-center justify-between mb-3">
                    <button @click="changeCalendarMonth(-1)" class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-all"><i class="fa-solid fa-chevron-left text-[10px] text-gray-500"></i></button>
                    <span class="text-xs font-bold text-gray-900" x-text="getCalendarTitle()"></span>
                    <button @click="changeCalendarMonth(1)" class="w-7 h-7 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-all"><i class="fa-solid fa-chevron-right text-[10px] text-gray-500"></i></button>
                  </div>
                  <div class="grid grid-cols-7">
                    <template x-for="d in ['S','M','T','W','T','F','S']">
                      <div class="text-center text-[9px] font-bold text-gray-400 py-1" x-text="d"></div>
                    </template>
                  </div>
                  <div class="grid grid-cols-7">
                    <template x-for="cell in getCalendarCells()" :key="cell.key">
                      <div class="w-full h-7 flex items-center justify-center rounded text-[11px] font-semibold transition-all cursor-default" :class="{
                        'text-gray-300': !cell.inMonth,
                        'text-gray-600': cell.inMonth && !cell.isHoliday && !cell.isToday,
                        'bg-brand text-white rounded-full': cell.isToday && !cell.isHoliday,
                        'bg-red-100 text-red-600 rounded-full font-bold': cell.isHoliday,
                      }" :title="cell.holidayName || ''" x-text="cell.day"></div>
                    </template>
                  </div>
                </div>
                <!-- Holiday list -->
                <div class="border-t border-gray-100 pt-4">
                  <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Configured Holidays</p>
                  <div class="space-y-2">
                    <template x-for="h in getHolidays()" :key="h.id">
                      <div class="flex items-center justify-between p-3 rounded-xl border border-gray-200 bg-white">
                        <div class="flex items-center gap-3">
                          <div class="w-9 h-9 rounded-xl flex items-center justify-center" :class="h.isRecurring ? 'bg-purple-50 text-purple-500' : 'bg-red-50 text-red-500'">
                            <i :class="h.isRecurring ? 'fa-solid fa-repeat' : 'fa-solid fa-calendar-day'" class="text-sm"></i>
                          </div>
                          <div>
                            <p class="text-sm font-bold text-gray-900" x-text="h.name"></p>
                            <p class="text-xs text-gray-400 font-medium"><span x-text="formatHolidayDate(h.date)"></span><span x-show="h.isRecurring" class="ml-1.5 text-purple-500 font-semibold">· Recurring yearly</span></p>
                          </div>
                        </div>
                        <button @click="deleteHoliday(h.id)" class="w-8 h-8 rounded-lg bg-gray-100 text-gray-400 hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-all"><i class="fa-solid fa-trash text-xs"></i></button>
                      </div>
                    </template>
                  </div>
                  <div x-show="getHolidays().length === 0" class="text-center py-8">
                    <p class="text-sm font-semibold text-gray-400">No holidays added</p>
                    <p class="text-xs text-gray-300 mt-1">Add holidays when your centre won't accept bookings</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- TIME SLOTS TAB -->
            <div x-show="bookingTab === 'slots'" x-transition>
              <div class="dash-card-flat">
                <div class="flex items-center justify-between mb-5">
                  <div>
                    <h3 class="font-bold text-gray-900">Booking Slots</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Configure slot duration, capacity, and view generated time slots</p>
                  </div>
                </div>
                <!-- Slot settings -->
                <div class="grid grid-cols-2 gap-4 mb-5">
                  <div class="p-4 rounded-xl border border-gray-200 bg-white">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Slot Duration (minutes)</label>
                    <input type="number" x-model.number="slotDuration" @change="saveSlotSettings()" class="w-full px-3 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm font-bold text-gray-700 focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none" min="5" max="120" placeholder="30">
                  </div>
                  <div class="p-4 rounded-xl border border-gray-200 bg-white">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Max Bookings Per Slot</label>
                    <input type="number" x-model.number="slotCapacity" @change="saveSlotSettings()" class="w-full px-3 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm font-bold text-gray-700 focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none" min="1" max="100" placeholder="3">
                  </div>
                </div>
                <!-- Day selector -->
                <div class="flex gap-2 mb-5 overflow-x-auto pb-1">
                  <template x-for="(day, idx) in ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']" :key="idx">
                    <button @click="selectedSlotDay = idx" class="px-4 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap" :class="selectedSlotDay === idx ? 'bg-brand text-white shadow-sm' : (getOperatingHourByDay(idx)?.isOpen ? 'bg-gray-100 text-gray-600 hover:bg-gray-200' : 'bg-gray-50 text-gray-300 cursor-not-allowed')" :disabled="!getOperatingHourByDay(idx)?.isOpen">
                      <span x-text="day"></span>
                    </button>
                  </template>
                </div>
                <!-- Time slot grid -->
                <div x-show="getOperatingHourByDay(selectedSlotDay)?.isOpen">
                  <div class="flex items-center gap-4 mb-3">
                    <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-green-100 border border-green-300"></div><span class="text-[10px] font-semibold text-gray-500">Available</span></div>
                    <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-amber-100 border border-amber-300"></div><span class="text-[10px] font-semibold text-gray-500">During Break</span></div>
                    <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-red-100 border border-red-300"></div><span class="text-[10px] font-semibold text-gray-500">Blocked</span></div>
                  </div>
                  <div class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-8 gap-2">
                    <template x-for="slot in generateTimeSlots(selectedSlotDay)" :key="slot.time">
                      <button @click="!slot.isBreak && toggleSlotBlocked(selectedSlotDay, slot.time)" class="p-2.5 rounded-xl border text-center text-xs font-bold transition-all" :class="slot.isBreak ? 'border-amber-200 bg-amber-50/60 text-amber-600 cursor-not-allowed' : isSlotBlocked(selectedSlotDay, slot.time) ? 'border-red-300 bg-red-50 text-red-600 ring-1 ring-red-200' : 'border-green-200 bg-green-50/60 text-green-700 hover:border-green-300 hover:shadow-sm cursor-pointer'" :disabled="slot.isBreak">
                        <span x-text="slot.time"></span>
                        <p class="text-[9px] font-medium mt-0.5 opacity-70" x-text="slot.isBreak ? 'Break' : isSlotBlocked(selectedSlotDay, slot.time) ? 'Blocked' : 'Open'"></p>
                      </button>
                    </template>
                  </div>
                  <div x-show="generateTimeSlots(selectedSlotDay).length === 0" class="text-center py-8">
                    <p class="text-sm font-semibold text-gray-400">No slots generated</p>
                    <p class="text-xs text-gray-300 mt-1">Adjust slot duration or working hours</p>
                  </div>
                </div>
                <div x-show="!getOperatingHourByDay(selectedSlotDay)?.isOpen" class="text-center py-10">
                  <div class="w-14 h-14 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-3"><i class="fa-solid fa-calendar-xmark text-xl text-gray-300"></i></div>
                  <p class="text-sm font-semibold text-gray-400">This day is closed</p>
                  <p class="text-xs text-gray-300 mt-1">Enable this day in Working Hours first</p>
                </div>
              </div>
            </div>

            <!-- APPOINTMENTS TAB -->
            <div x-show="bookingTab === 'appointments'" x-transition>
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-calendar text-gray-400 text-xs"></i></div>
                    <input type="date" x-model="bookingDate" @change="loadBookings()" class="pl-9 pr-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50/80 text-xs font-semibold text-gray-700 focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none hover:border-gray-300 transition-all">
                  </div>
                </div>
                <button @click="loadBookings()" class="btn-secondary text-xs"><i class="fa-solid fa-arrows-rotate mr-1.5"></i>Refresh</button>
              </div>
              <div class="dash-card-flat">
                <table class="w-full">
                  <thead>
                    <tr>
                      <th class="table-header">Customer</th>
                      <template x-if="!bookingBranchFilter"><th class="table-header">Branch</th></template>
                      <th class="table-header">Service</th>
                      <th class="table-header">Date</th>
                      <th class="table-header">Time</th>
                      <th class="table-header">Status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-gray-50">
                    <template x-for="appt in bookings" :key="appt.id">
                      <tr class="hover:bg-brand-50/20 transition-colors">
                        <td class="table-cell">
                          <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center text-xs font-extrabold" x-text="(appt.customerName || 'N')[0]"></div>
                            <span class="font-bold text-gray-900 text-sm" x-text="appt.customerName || 'N/A'"></span>
                          </div>
                        </td>
                        <template x-if="!bookingBranchFilter"><td class="table-cell text-xs text-gray-500 font-medium" x-text="appt.branchName || '-'"></td></template>
                        <td class="table-cell text-sm text-gray-600" x-text="appt.serviceName || '-'"></td>
                        <td class="table-cell text-xs text-gray-500 font-medium" x-text="appt.appointmentDate ? new Date(appt.appointmentDate).toLocaleDateString() : '-'"></td>
                        <td class="table-cell text-xs font-semibold text-gray-700" x-text="appt.timeSlot || '-'"></td>
                        <td class="table-cell">
                          <span class="badge" :class="{
                            'bg-amber-50 text-amber-600 border border-amber-200': appt.status === 'booked',
                            'bg-green-50 text-green-600 border border-green-200': appt.status === 'checked_in',
                            'bg-red-50 text-red-600 border border-red-200': appt.status === 'cancelled',
                            'bg-gray-100 text-gray-500 border border-gray-200': appt.status === 'completed'
                          }" x-text="appt.status"></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
                <div x-show="bookings.length === 0" class="text-center py-16">
                  <div class="w-16 h-16 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-4"><i class="fa-solid fa-calendar-xmark text-2xl text-gray-300"></i></div>
                  <p class="text-sm font-semibold text-gray-400">No bookings for this date</p>
                  <p class="text-xs text-gray-300 mt-1">Bookings will appear here when customers schedule appointments</p>
                </div>
              </div>
            </div>
          </div>

          <!-- MANUAL ADD TO QUEUE MODAL -->
          <div x-show="showManualAddModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" x-transition @click.self="showManualAddModal = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6">
              <div class="flex items-center justify-between mb-5">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl flex items-center justify-center" :class="{
                    'bg-brand-50 text-brand': currentQueueMode === 'fifo' || !currentQueueMode,
                    'bg-purple-50 text-purple-600': currentQueueMode === 'selective',
                    'bg-teal-50 text-teal-600': currentQueueMode === 'checkin',
                    'bg-orange-50 text-orange-600': currentQueueMode === 'takeaway',
                    'bg-amber-50 text-amber-600': currentQueueMode === 'dine_in' || currentQueueMode === 'dinein',
                    'bg-indigo-50 text-indigo-600': currentQueueMode === 'multi_stage' || currentQueueMode === 'multistage',
                  }"><i class="fa-solid fa-user-plus"></i></div>
                  <div>
                    <h3 class="font-bold text-gray-900">Add to Queue</h3>
                    <p class="text-xs text-gray-400" x-text="getQueueModeLabel(currentQueueMode)"></p>
                  </div>
                </div>
                <button @click="showManualAddModal = false" class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center"><i class="fa-solid fa-xmark text-xs text-gray-500"></i></button>
              </div>

              <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                  <div class="col-span-2" :class="{ 'col-span-1': currentQueueMode === 'dine_in' || currentQueueMode === 'dinein' }">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Customer Name <span class="text-red-400">*</span></label>
                    <input type="text" x-model="manualAddForm.customerName" class="input-field w-full" placeholder="Enter name">
                  </div>
                  <div x-show="currentQueueMode === 'dine_in' || currentQueueMode === 'dinein'">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Party Size</label>
                    <input type="number" x-model="manualAddForm.partySize" class="input-field w-full" placeholder="1" min="1" max="50">
                  </div>
                </div>

                <!-- Order Reference (takeaway only). The dine-in "Table
                     Preference" field was removed per product request — it
                     was never requested from the customer. -->
                <div x-show="currentQueueMode === 'takeaway'">
                  <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Order Reference</label>
                  <input type="text" x-model="manualAddForm.tableOrRef" class="input-field w-full" placeholder="e.g. ORD-123">
                </div>

                <div x-show="currentQueueMode !== 'checkin' && services.length > 0">
                  <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Service</label>
                  <select x-model="manualAddForm.serviceId" @change="onManualServiceChange()" class="input-field w-full">
                    <option value="">Select a service</option>
                    <template x-for="svc in services.filter(s => s.isActive)" :key="svc.id">
                      <option :value="svc.id" x-text="svc.name"></option>
                    </template>
                  </select>
                </div>

                <div x-show="(currentQueueMode === 'multi_stage' || currentQueueMode === 'multistage') && journeys.filter(j => j.isActive).length > 0">
                  <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Journey</label>
                  <select x-model="manualAddForm.journeyId" class="input-field w-full">
                    <option value="">Select a journey</option>
                    <template x-for="j in journeys.filter(j => j.isActive)" :key="j.id">
                      <option :value="j.id" x-text="j.name"></option>
                    </template>
                  </select>
                </div>

                <!--
                  Service-specific custom fields (configured per service in
                  Org → Services → Custom Fields). Mirrors the customer-facing
                  /join/{branchId} PWA flow so the same data is collected
                  whether the customer self-serves or staff add them manually.
                  Visible only when the selected service actually defines
                  custom fields, so simple services keep the lean default form.
                -->
                <template x-if="getManualSelectedServiceFields().length > 0">
                  <div class="space-y-3 p-3 rounded-xl bg-gray-50 border border-gray-100">
                    <div class="flex items-center gap-2">
                      <i class="fa-solid fa-list-check text-xs text-gray-400"></i>
                      <span class="text-[11px] font-bold text-gray-500 uppercase tracking-wide">Service Details</span>
                    </div>
                    <template x-for="field in getManualSelectedServiceFields()" :key="field.id">
                      <div>
                        <template x-if="field.type === 'checkbox'">
                          <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox"
                                   :checked="!!manualAddForm.customFieldValues[field.id]"
                                   @change="manualAddForm.customFieldValues[field.id] = $event.target.checked"
                                   class="w-4 h-4 rounded border-gray-300 text-brand focus:ring-brand">
                            <span class="text-xs font-semibold text-gray-700" x-text="field.label + (field.required ? ' *' : '')"></span>
                          </label>
                        </template>
                        <template x-if="field.type === 'select'">
                          <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
                              <span x-text="field.label"></span><span x-show="field.required" class="text-red-400"> *</span>
                            </label>
                            <select :value="manualAddForm.customFieldValues[field.id] || ''"
                                    @change="manualAddForm.customFieldValues[field.id] = $event.target.value"
                                    class="input-field w-full">
                              <option value="">Select an option</option>
                              <template x-for="opt in (field.options || [])" :key="opt">
                                <option :value="opt" x-text="opt"></option>
                              </template>
                            </select>
                          </div>
                        </template>
                        <template x-if="field.type !== 'checkbox' && field.type !== 'select'">
                          <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
                              <span x-text="field.label"></span><span x-show="field.required" class="text-red-400"> *</span>
                            </label>
                            <input :type="field.type === 'phone' ? 'tel' : (field.type === 'number' ? 'number' : (field.type === 'email' ? 'email' : (field.type === 'date' ? 'date' : 'text')))"
                                   :value="manualAddForm.customFieldValues[field.id] || ''"
                                   @input="manualAddForm.customFieldValues[field.id] = $event.target.value"
                                   :placeholder="field.placeholder || ('Enter ' + (field.label || '').toLowerCase())"
                                   class="input-field w-full">
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>

              </div>

              <template x-if="manualAddError">
                <div class="mt-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 font-medium flex items-center gap-2">
                  <i class="fa-solid fa-circle-exclamation"></i><span x-text="manualAddError"></span>
                </div>
              </template>
              <template x-if="manualAddSuccess">
                <div class="mt-4 p-3 rounded-xl bg-green-50 border border-green-200 text-xs text-green-700 font-medium flex items-center gap-2">
                  <i class="fa-solid fa-circle-check"></i><span x-text="manualAddSuccess"></span>
                </div>
              </template>

              <div class="flex gap-3 mt-6">
                <button @click="showManualAddModal = false" class="btn-secondary flex-1">Cancel</button>
                <button @click="addManualTicket()" class="btn-primary flex-1" :disabled="manualAddLoading">
                  <i class="fa-solid fa-plus mr-1.5" x-show="!manualAddLoading"></i>
                  <i class="fa-solid fa-spinner fa-spin mr-1.5" x-show="manualAddLoading"></i>
                  <span x-text="manualAddLoading ? 'Adding...' : 'Add to Queue'"></span>
                </button>
              </div>
            </div>
          </div>

          <!-- BREAK MODAL -->
          <div x-show="showBreakModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" x-transition @click.self="showBreakModal = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
              <div class="flex items-center justify-between mb-5">
                <h3 class="font-bold text-gray-900" x-text="editingBreak ? 'Edit Break' : 'Add Break'"></h3>
                <button @click="showBreakModal = false" class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center"><i class="fa-solid fa-xmark text-xs text-gray-500"></i></button>
              </div>
              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Break Name</label>
                  <input type="text" x-model="breakForm.name" class="input-field" placeholder="e.g. Lunch Break">
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Start Time</label>
                    <input type="time" x-model="breakForm.startTime" class="input-field">
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">End Time</label>
                    <input type="time" x-model="breakForm.endTime" class="input-field">
                  </div>
                </div>
              </div>
              <div class="flex gap-3 mt-6">
                <button @click="showBreakModal = false" class="btn-secondary flex-1">Cancel</button>
                <button @click="saveBreak()" class="btn-primary flex-1" x-text="editingBreak ? 'Update' : 'Add Break'"></button>
              </div>
            </div>
          </div>

          <!-- HOLIDAY MODAL -->
          <div x-show="showHolidayModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" x-transition @click.self="showHolidayModal = false">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
              <div class="flex items-center justify-between mb-5">
                <h3 class="font-bold text-gray-900" x-text="editingHoliday ? 'Edit Holiday' : 'Add Holiday'"></h3>
                <button @click="showHolidayModal = false" class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center"><i class="fa-solid fa-xmark text-xs text-gray-500"></i></button>
              </div>
              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Holiday Name</label>
                  <input type="text" x-model="holidayForm.name" class="input-field" placeholder="e.g. Christmas Day">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Date</label>
                  <input type="date" x-model="holidayForm.date" class="input-field">
                </div>
                <label class="flex items-center gap-2.5 cursor-pointer">
                  <input type="checkbox" x-model="holidayForm.isRecurring" class="w-4 h-4 rounded border-gray-300 text-brand focus:ring-brand">
                  <span class="text-sm font-medium text-gray-700">Recurring every year</span>
                </label>
              </div>
              <div class="flex gap-3 mt-6">
                <button @click="showHolidayModal = false" class="btn-secondary flex-1">Cancel</button>
                <button @click="saveHoliday()" class="btn-primary flex-1" x-text="editingHoliday ? 'Update' : 'Add Holiday'"></button>
              </div>
            </div>
          </div>

          <!-- SETTINGS PAGE -->
          <div x-show="currentPage === 'settings'" x-transition>
            <div class="space-y-5">

              <!-- Settings Tab Bar -->
              <div class="dash-card-flat overflow-hidden" data-testid="card-settings-tabs">
                <div class="flex items-stretch overflow-x-auto no-scrollbar border-b border-gray-100 bg-gradient-to-br from-gray-50/70 to-white px-2 pt-2 gap-1">
                  <template x-for="tab in settingsTabs" :key="tab.id">
                    <button @click="settingsTab = tab.id"
                            class="group flex items-center gap-2 px-4 py-2.5 rounded-t-xl text-xs font-bold uppercase tracking-wide transition-all whitespace-nowrap border-b-2"
                            :class="settingsTab === tab.id ? 'text-brand border-brand bg-white' : 'text-gray-500 border-transparent hover:text-gray-800 hover:bg-white/70'"
                            :data-testid="'tab-settings-' + tab.id">
                      <i :class="tab.icon" class="text-sm"></i>
                      <span x-text="tab.label"></span>
                    </button>
                  </template>
                </div>
                <div class="flex items-center justify-between gap-3 px-5 py-3.5 bg-white">
                  <div class="min-w-0 flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
                         :class="(settingsTabs.find(t => t.id === settingsTab) || {}).iconBg || 'bg-brand-50 text-brand'">
                      <i :class="(settingsTabs.find(t => t.id === settingsTab) || {}).icon"></i>
                    </div>
                    <div class="min-w-0">
                      <h3 class="font-bold text-gray-900 text-sm truncate" x-text="(settingsTabs.find(t => t.id === settingsTab) || {}).label"></h3>
                      <p class="text-[11px] text-gray-400 truncate" x-text="(settingsTabs.find(t => t.id === settingsTab) || {}).description"></p>
                    </div>
                  </div>
                  <button x-show="['queue_mode','behaviour','display','integrations'].includes(settingsTab)"
                          @click="saveSettings()" class="btn-primary text-xs flex-shrink-0" data-testid="button-save-settings">
                    <i class="fa-solid fa-floppy-disk mr-2"></i>Save changes
                  </button>
                </div>
              </div>

              <!-- Queue Mode Section -->
              <div class="dash-card" x-show="settingsTab === 'queue_mode'">
                <div class="flex items-center gap-3 mb-2">
                  <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand flex items-center justify-center"><i class="fa-solid fa-sliders"></i></div>
                  <div>
                    <h3 class="font-bold text-gray-900">Queue Mode</h3>
                    <p class="text-xs text-gray-400">Choose how your queue processes customers</p>
                  </div>
                </div>
                <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mt-5">
                  <button @click="settingsForm.queueMode = 'fifo'" class="text-left p-4 rounded-xl border-2 transition-all" :class="settingsForm.queueMode === 'fifo' ? 'border-brand bg-brand-50/40 shadow-sm' : 'border-gray-100 hover:border-gray-200 hover:bg-gray-50'">
                    <div class="flex items-center gap-2.5 mb-2">
                      <div class="w-8 h-8 rounded-lg flex items-center justify-center" :class="settingsForm.queueMode === 'fifo' ? 'bg-brand/10 text-brand' : 'bg-gray-100 text-gray-400'"><i class="fa-solid fa-arrow-down-1-9 text-sm"></i></div>
                      <span class="text-sm font-bold" :class="settingsForm.queueMode === 'fifo' ? 'text-brand' : 'text-gray-700'">FIFO</span>
                    </div>
                    <p class="text-[11px] text-gray-400 leading-relaxed">First In, First Out. Customers are served in the order they join.</p>
                  </button>
                  <button @click="settingsForm.queueMode = 'selective'" class="text-left p-4 rounded-xl border-2 transition-all" :class="settingsForm.queueMode === 'selective' ? 'border-brand bg-brand-50/40 shadow-sm' : 'border-gray-100 hover:border-gray-200 hover:bg-gray-50'">
                    <div class="flex items-center gap-2.5 mb-2">
                      <div class="w-8 h-8 rounded-lg flex items-center justify-center" :class="settingsForm.queueMode === 'selective' ? 'bg-brand-100 text-brand' : 'bg-gray-100 text-gray-400'"><i class="fa-solid fa-hand-pointer text-sm"></i></div>
                      <span class="text-sm font-bold" :class="settingsForm.queueMode === 'selective' ? 'text-brand' : 'text-gray-700'">Selective</span>
