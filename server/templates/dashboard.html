                      <template x-for="svc in accessibleServicesFor(selectedBranch)" :key="svc.id">
                        <option :value="svc.id" x-text="svc.name"></option>
                      </template>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-[8px] pointer-events-none" :class="settingsServiceFilter ? 'text-blue-500' : 'text-gray-400'"></i>
                  </div>
                  <template x-if="settingsServiceFilter">
                    <button @click="settingsServiceFilter = ''; loadSettingsForm(); loadAnnouncementDevices()" class="px-2 py-1.5 rounded-lg text-[10px] font-bold bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all"><i class="fa-solid fa-times"></i></button>
                  </template>
                </div>
              </template>

              <!-- Billing: Branch dropdown (unchanged) -->
              <template x-if="currentPage === 'billing'">
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-building text-gray-400 text-xs"></i></div>
                  <select x-model="selectedBranchId" @change="onBranchChange()" class="pl-8 pr-8 py-2 rounded-xl border border-gray-200 bg-gray-50/80 text-xs font-semibold text-gray-700 focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none appearance-none cursor-pointer hover:border-gray-300 transition-all min-w-[160px]">
                    <template x-for="b in accessibleBranches" :key="b.id">
                      <option :value="b.id" x-text="b.name"></option>
                    </template>
                  </select>
                  <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none"><i class="fa-solid fa-chevron-down text-gray-400 text-[10px]"></i></div>
                </div>
              </template>

            </div>
          </div>
        </header>

        <div class="p-8">
          <!-- Scope banner: shows which Branch / Service / Desk the current
               page's filters target, so the user knows exactly where the
               changes they make on this page will be applied. -->
          <div x-show="['queue','bookings','settings'].includes(currentPage)" x-transition
               class="mb-5 flex flex-wrap items-center gap-x-2 gap-y-1.5 px-4 py-2.5 rounded-2xl bg-brand-50/60 border border-brand-100">
            <i class="fa-solid fa-location-crosshairs text-brand text-xs mr-0.5"></i>
            <span class="text-xs font-bold text-gray-700 mr-1">Applying to</span>
            <template x-for="(seg, i) in pageScopeSegments()" :key="i">
              <span class="flex items-center gap-2">
                <template x-if="i > 0"><i class="fa-solid fa-chevron-right text-gray-300 text-[9px]"></i></template>
                <span class="px-2.5 py-1 rounded-lg text-[11px] font-bold"
                  :class="seg.kind === 'branch' ? 'bg-brand text-white' : (seg.kind === 'service' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-600')"
                  x-text="seg.label"></span>
              </span>
            </template>
            <span class="text-[11px] text-gray-400 ml-1 hidden sm:inline" x-text="pageScopeHint()"></span>
          </div>

          <!-- OVERVIEW PAGE -->
          <div x-show="currentPage === 'overview'" x-transition>
            <!-- Trial expiry / expired banner: shown on the last day of trial
                 and any time the subscription is no longer active. Day 14 is
                 explicit ("expires today"); after expiry queues are blocked. -->
            <template x-if="subscription && (
                (subscription.status === 'trialing' && trialDaysRemaining() !== null && trialDaysRemaining() <= 1) ||
                subscription.status === 'expired' || subscription.status === 'cancelled'
              )">
              <div class="dash-card mb-6"
                   :class="(subscription.status === 'expired' || subscription.status === 'cancelled' || trialDaysRemaining() <= 0)
                     ? 'bg-red-50/70 border-red-200'
                     : 'bg-amber-50/70 border-amber-200'">
                <div class="flex items-start justify-between gap-4">
                  <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
                         :class="(subscription.status === 'expired' || subscription.status === 'cancelled' || trialDaysRemaining() <= 0)
                           ? 'bg-red-100 text-red-600'
                           : 'bg-amber-100 text-amber-700'">
                      <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <div>
                      <p class="text-sm font-extrabold"
                         :class="(subscription.status === 'expired' || subscription.status === 'cancelled' || trialDaysRemaining() <= 0)
                           ? 'text-red-700' : 'text-amber-800'"
                         x-text="(subscription.status === 'expired' || subscription.status === 'cancelled')
                           ? 'Your subscription is not active'
                           : (trialDaysRemaining() <= 0 ? 'Your free trial expires today' : 'Your free trial expires tomorrow')">
                      </p>
                      <p class="text-xs mt-0.5"
                         :class="(subscription.status === 'expired' || subscription.status === 'cancelled' || trialDaysRemaining() <= 0)
                           ? 'text-red-600' : 'text-amber-700'">
                        <span x-show="subscription.status === 'trialing'">
                          Subscribe before <span class="font-bold" x-text="subscription.trialEndDate ? new Date(subscription.trialEndDate).toLocaleDateString() : ''"></span>
                          to keep adding customers and processing the queue without interruption.
                        </span>
                        <span x-show="subscription.status !== 'trialing'">
                          New customers can't join the queue and staff can't process tickets until you choose a plan.
                        </span>
                      </p>
                    </div>
                  </div>
                  <button x-show="hasPerm('org.billing.manage')" @click="currentPage = 'billing'"
                          class="px-3 py-1.5 rounded-lg text-xs font-bold text-white bg-brand hover:bg-brand-dark whitespace-nowrap flex-shrink-0">
                    Choose a plan
                  </button>
                </div>
              </div>
            </template>

            <!-- Welcome Banner -->
            <div class="dash-card mb-6 bg-gradient-to-r from-brand-50/50 via-white to-purple-50/30 border-brand-100/50">
              <div class="flex items-center justify-between">
                <div>
                  <h2 class="text-lg font-extrabold text-gray-900">Welcome back, <span class="text-brand" x-text="org?.name || 'there'"></span></h2>
                  <p class="text-sm text-gray-500 mt-1">Here's what's happening at your centre today</p>
                </div>
                <div class="hidden md:flex items-center gap-2">
                  <span class="text-xs text-gray-400"><i class="fa-solid fa-clock mr-1"></i></span>
                  <span class="text-xs font-semibold text-gray-500" x-text="new Date().toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' })"></span>
                </div>
              </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
              <div class="dash-card stat-gradient stat-blue">
                <div class="flex items-center justify-between mb-4">
                  <span class="text-gray-500 text-xs font-semibold uppercase tracking-wide">Today Waiting</span>
                  <div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center"><i class="fa-solid fa-users text-lg"></i></div>
                </div>
                <p class="text-4xl font-black text-gray-900" x-text="stats.todayWaiting || 0"></p>
                <p class="text-xs text-gray-400 mt-2">customers in queue</p>
              </div>
              <div class="dash-card stat-gradient stat-green">
                <div class="flex items-center justify-between mb-4">
                  <span class="text-gray-500 text-xs font-semibold uppercase tracking-wide">Today Served</span>
                  <div class="w-11 h-11 rounded-xl bg-green-50 text-green-500 flex items-center justify-center"><i class="fa-solid fa-check-circle text-lg"></i></div>
                </div>
                <p class="text-4xl font-black text-gray-900" x-text="stats.todayServed || 0"></p>
                <p class="text-xs text-gray-400 mt-2">completed today</p>
              </div>
              <div class="dash-card stat-gradient stat-orange">
                <div class="flex items-center justify-between mb-4">
                  <span class="text-gray-500 text-xs font-semibold uppercase tracking-wide">Avg Wait Time</span>
                  <div class="w-11 h-11 rounded-xl bg-orange-50 text-orange-500 flex items-center justify-center"><i class="fa-solid fa-clock text-lg"></i></div>
                </div>
                <p class="text-4xl font-black text-gray-900"><span x-text="stats.averageWaitTime || 0"></span><span class="text-lg text-gray-400 font-semibold ml-1">min</span></p>
                <p class="text-xs text-gray-400 mt-2">average wait</p>
              </div>
              <div class="dash-card stat-gradient stat-red">
                <div class="flex items-center justify-between mb-4">
                  <span class="text-gray-500 text-xs font-semibold uppercase tracking-wide">No Shows</span>
                  <div class="w-11 h-11 rounded-xl bg-red-50 text-red-500 flex items-center justify-center"><i class="fa-solid fa-user-xmark text-lg"></i></div>
                </div>
                <p class="text-4xl font-black text-gray-900" x-text="stats.todayNoShow || 0"></p>
                <p class="text-xs text-gray-400 mt-2">missed today</p>
              </div>
            </div>

            <!-- Bottom Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <!-- Branches Overview -->
              <div class="dash-card">
                <div class="flex items-center justify-between mb-5">
                  <h3 class="font-bold text-gray-900">Your Branches</h3>
                  <button @click="currentPage = 'branches'; loadPageData()" class="text-xs text-brand font-bold hover:text-brand-dark transition-colors">View All <i class="fa-solid fa-arrow-right ml-1"></i></button>
                </div>
                <div class="space-y-3">
                  <template x-for="b in branches" :key="b.id">
                    <div class="flex items-center justify-between p-3.5 bg-gray-50/80 rounded-xl border border-gray-100/50 hover:bg-gray-50 transition-colors">
                      <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg bg-brand-50 text-brand flex items-center justify-center"><i class="fa-solid fa-building text-sm"></i></div>
                        <div>
                          <p class="font-bold text-sm text-gray-900" x-text="b.name"></p>
                          <p class="text-[11px] text-gray-400" x-text="b.address || 'No address set'"></p>
                        </div>
                      </div>
                      <span class="badge" :class="b.isActive ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-gray-100 text-gray-500 border border-gray-200'" x-text="b.isActive ? 'Active' : 'Inactive'"></span>
                    </div>
                  </template>
                  <div x-show="branches.length === 0" class="text-center py-8">
                    <div class="w-14 h-14 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-3"><i class="fa-solid fa-building text-xl text-gray-300"></i></div>
                    <p class="text-sm text-gray-400 font-medium">No branches yet</p>
                    <p class="text-xs text-gray-300 mt-1">Create your first branch to get started</p>
                  </div>
                </div>
              </div>

              <!-- Subscription -->
              <div class="dash-card">
                <div class="flex items-center justify-between mb-5">
                  <h3 class="font-bold text-gray-900">Subscription</h3>
                  <button @click="currentPage = 'billing'" class="text-xs text-brand font-bold hover:text-brand-dark transition-colors">Manage <i class="fa-solid fa-arrow-right ml-1"></i></button>
                </div>
                <template x-if="subscription">
                  <div>
                    <div class="flex items-center justify-between mb-4 p-4 bg-gradient-to-r from-brand-50/60 to-purple-50/40 rounded-xl border border-brand-100/50">
                      <div>
                        <p class="text-xs text-gray-500 mb-1">Current Plan</p>
                        <p class="text-lg font-extrabold text-gray-900" x-text="subscription.plan?.name || 'Plan'"></p>
                      </div>
                      <span class="badge text-xs" :class="{
                        'bg-green-50 text-green-600 border border-green-200': subscription.status === 'active',
                        'bg-amber-50 text-amber-600 border border-amber-200': subscription.status === 'trialing',
                        'bg-red-50 text-red-600 border border-red-200': subscription.status === 'cancelled'
                      }" x-text="subscription.status === 'trialing' ? 'Free Trial' : subscription.status"></span>
                    </div>
                    <template x-if="subscription.status === 'trialing'">
                      <div class="p-3.5 bg-amber-50/80 rounded-xl border border-amber-200/60 flex items-center gap-3">
                        <div class="w-9 h-9 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-clock"></i></div>
                        <div>
                          <p class="text-xs font-bold text-amber-700">Trial Period</p>
                          <p class="text-[11px] text-amber-600">Ends <span class="font-bold" x-text="subscription.trialEndDate ? new Date(subscription.trialEndDate).toLocaleDateString() : '—'"></span></p>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="!subscription">
                  <div class="text-center py-8">
                    <div class="w-14 h-14 mx-auto rounded-2xl bg-brand-50 flex items-center justify-center mb-3"><i class="fa-solid fa-credit-card text-xl text-brand/50"></i></div>
                    <p class="text-sm text-gray-500 font-medium mb-1">No active subscription</p>
                    <p class="text-xs text-gray-400 mb-4">Start your 24-day free trial today</p>
                    <button @click="currentPage = 'billing'" class="btn-primary text-xs">View Plans</button>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- QUEUE PAGE -->
          <div x-show="currentPage === 'queue'" x-transition>
            <!-- Queue Mode Badge -->
            <div class="flex items-center justify-between mb-5">
              <div class="flex items-center gap-3">
                <span class="badge text-[10px] uppercase tracking-wider" :class="{
                  'bg-brand-50 text-brand border border-brand-200': currentQueueMode === 'fifo',
                  'bg-purple-50 text-purple-600 border border-purple-200': currentQueueMode === 'selective',
                  'bg-teal-50 text-teal-600 border border-teal-200': currentQueueMode === 'checkin',
                  'bg-orange-50 text-orange-600 border border-orange-200': currentQueueMode === 'takeaway',
                  'bg-amber-50 text-amber-700 border border-amber-200': currentQueueMode === 'dine_in' || currentQueueMode === 'dinein',
                  'bg-indigo-50 text-indigo-600 border border-indigo-200': currentQueueMode === 'multi_stage' || currentQueueMode === 'multistage',
                }" x-text="getQueueModeLabel(currentQueueMode)">
                </span>
                <span class="text-xs text-gray-400" x-text="getQueueModeDescription(currentQueueMode)"></span>
              </div>
              <div class="flex items-center gap-3">
                <button @click="loadQueueData()" class="flex items-center gap-1.5 text-xs font-semibold text-gray-400 hover:text-gray-600 transition-colors"><i class="fa-solid fa-arrows-rotate"></i>Refresh</button>
                <button x-show="hasPerm('org.queue.manual_add')" @click="openManualAddModal()" class="btn-primary text-xs"><i class="fa-solid fa-user-plus mr-1.5"></i>Add to Queue</button>
              </div>
            </div>

            <!-- Queue Status Control -->
            <div class="flex items-center gap-3 mb-5 p-3 rounded-xl border transition-all"
              :class="{
                'border-emerald-200 bg-emerald-50/50': getQueueStatus() === 'active',
                'border-amber-200 bg-amber-50/50': getQueueStatus() === 'paused',
                'border-red-200 bg-red-50/50': getQueueStatus() === 'ended',
              }">
              <div class="flex items-center gap-2.5 flex-1 min-w-0">
                <div class="w-2.5 h-2.5 rounded-full flex-shrink-0"
                  :class="{
                    'bg-emerald-500': getQueueStatus() === 'active',
                    'bg-amber-500': getQueueStatus() === 'paused',
                    'bg-red-500': getQueueStatus() === 'ended',
                  }"></div>
                <span class="text-xs font-bold uppercase tracking-wide"
                  :class="{
                    'text-emerald-700': getQueueStatus() === 'active',
                    'text-amber-700': getQueueStatus() === 'paused',
                    'text-red-700': getQueueStatus() === 'ended',
                  }" x-text="getQueueStatus() === 'active' ? 'Booking Open' : getQueueStatus() === 'paused' ? 'Paused' : 'Booking Closed'"></span>
                <div class="w-px h-4 bg-gray-200 flex-shrink-0"></div>
                <span class="text-xs text-gray-500 truncate" x-text="getQueueStatusTargetLabel()"></span>
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <button x-show="hasPerm('org.queue.mode_change')" @click="setQueueStatus('active')" class="px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center gap-1.5"
                  :class="getQueueStatus() === 'active' ? 'bg-emerald-500 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:border-emerald-300 hover:text-emerald-600 hover:bg-emerald-50'"
                  :disabled="queueStatusUpdating">
                  <i class="fa-solid fa-play text-[9px]"></i> Booking Open
                </button>
                <button x-show="hasPerm('org.queue.mode_change')" @click="setQueueStatus('paused')" class="px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center gap-1.5"
                  :class="getQueueStatus() === 'paused' ? 'bg-amber-500 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:border-amber-300 hover:text-amber-600 hover:bg-amber-50'"
                  :disabled="queueStatusUpdating">
                  <i class="fa-solid fa-pause text-[9px]"></i> Pause
                </button>
                <button x-show="hasPerm('org.queue.mode_change')" @click="setQueueStatus('ended')" class="px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all flex items-center gap-1.5"
                  :class="getQueueStatus() === 'ended' ? 'bg-red-500 text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200 hover:border-red-300 hover:text-red-600 hover:bg-red-50'"
                  :disabled="queueStatusUpdating">
                  <i class="fa-solid fa-stop text-[9px]"></i> Booking Closed
                </button>
              </div>
              <template x-if="queueStatusUpdating">
                <div class="flex-shrink-0"><i class="fa-solid fa-spinner fa-spin text-gray-400 text-xs"></i></div>
              </template>
            </div>

            <!-- ======================== CHECK-IN MODE ======================== -->
            <template x-if="currentQueueMode === 'checkin'">
              <div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div class="lg:col-span-2">
                    <div class="dash-card">
                      <div class="flex items-center gap-3 mb-6">
                        <div class="w-12 h-12 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center"><i class="fa-solid fa-qrcode text-xl"></i></div>
                        <div>
                          <h3 class="font-bold text-gray-900 text-base">Check-In Mode</h3>
                          <p class="text-xs text-gray-400">Enter a ticket number or scan a QR code to check in customers</p>
                        </div>
                      </div>
                      <div class="flex gap-3 mb-5">
                        <input type="text" x-model="checkInTicket" @keydown.enter="handleCheckIn()" class="input-field flex-1 text-base font-bold tracking-wider" placeholder="Enter ticket number (e.g. A001)" style="text-transform: uppercase;">
                        <button @click="handleCheckIn()" class="px-6 py-2.5 rounded-xl font-bold text-sm text-white transition-all" style="background: linear-gradient(135deg, #0d9488, #0f766e);" :disabled="!checkInTicket">
                          <i class="fa-solid fa-check mr-2"></i>Check In
                        </button>
                      </div>
                      <template x-if="lastCheckInResult">
                        <div class="p-4 rounded-xl border" :class="lastCheckInResult.success ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'">
                          <div class="flex items-center gap-3">
                            <i :class="lastCheckInResult.success ? 'fa-solid fa-circle-check text-green-500' : 'fa-solid fa-circle-xmark text-red-500'" class="text-xl"></i>
                            <div>
                              <p class="font-bold text-sm" :class="lastCheckInResult.success ? 'text-green-800' : 'text-red-800'" x-text="lastCheckInResult.message"></p>
                              <p x-show="lastCheckInResult.name" class="text-xs mt-0.5" :class="lastCheckInResult.success ? 'text-green-600' : 'text-red-600'" x-text="lastCheckInResult.name"></p>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                  <div class="space-y-4">
                    <div class="dash-card text-center">
                      <div class="w-10 h-10 mx-auto rounded-xl bg-brand-50 text-brand flex items-center justify-center mb-2"><i class="fa-solid fa-users"></i></div>
                      <p class="text-3xl font-black text-gray-900" x-text="queueTickets.length"></p>
                      <p class="text-xs text-gray-400 font-semibold mt-1">Registered Today</p>
                    </div>
                    <div class="dash-card text-center">
                      <div class="w-10 h-10 mx-auto rounded-xl bg-green-50 text-green-600 flex items-center justify-center mb-2"><i class="fa-solid fa-user-check"></i></div>
                      <p class="text-3xl font-black text-gray-900" x-text="queueTickets.filter(t => t.status === 'serving' || t.status === 'completed').length"></p>
                      <p class="text-xs text-gray-400 font-semibold mt-1">Checked In</p>
                    </div>
                  </div>
                </div>
                <div class="mt-6">
                  <h4 class="text-sm font-bold text-gray-700 mb-3">Recent Check-Ins</h4>
                  <div class="space-y-2">
                    <template x-for="ticket in queueTickets.filter(t => t.status === 'serving' || t.status === 'completed').slice(0, 10)" :key="ticket.id">
                      <div class="ticket-card ticket-serving">
                        <div class="flex items-center justify-between">
                          <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg bg-green-50 text-green-600 flex items-center justify-center"><i class="fa-solid fa-user-check text-sm"></i></div>
                            <div>
                              <p class="font-bold text-gray-900 text-sm" x-text="ticket.customerName || 'Walk-in'"></p>
                              <p class="text-[11px] text-gray-400" x-text="'Ticket: ' + ticket.ticketNumber"></p>
                            </div>
                          </div>
                          <span class="text-xs text-gray-400" x-text="getWaitTime(ticket.joinedAt) + ' ago'"></span>
                        </div>
                      </div>
                    </template>
                    <div x-show="queueTickets.filter(t => t.status === 'serving' || t.status === 'completed').length === 0" class="text-center py-10">
                      <div class="w-14 h-14 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-3"><i class="fa-solid fa-user-check text-xl text-gray-300"></i></div>
                      <p class="text-sm font-semibold text-gray-400">No check-ins yet today</p>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <!-- ======================== TAKEAWAY MODE ======================== -->
            <template x-if="currentQueueMode === 'takeaway'">
              <div>
                <div class="flex gap-3 mb-5">
                  <!-- Selected tab uses the brand color for consistency with the rest of the dashboard. -->
                  <button @click="takeawayTab = 'active'" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border" :class="takeawayTab === 'active' ? 'text-white border-brand shadow-md' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'" :style="takeawayTab === 'active' ? 'background: linear-gradient(135deg, #8c1867, #6a1250)' : ''">
                    <i class="fa-solid fa-fire mr-1.5"></i>Active <span class="ml-1 px-1.5 py-0.5 rounded-md text-[10px]" :class="takeawayTab === 'active' ? 'bg-white/20' : 'bg-gray-100'" x-text="queueTickets.filter(t => t.status !== 'completed' && t.status !== 'no_show').length"></span>
                  </button>
                  <button @click="takeawayTab = 'completed'" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all border" :class="takeawayTab === 'completed' ? 'text-white border-brand shadow-md' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'" :style="takeawayTab === 'completed' ? 'background: linear-gradient(135deg, #8c1867, #6a1250)' : ''">
                    <i class="fa-solid fa-circle-check mr-1.5"></i>Completed <span class="ml-1 px-1.5 py-0.5 rounded-md text-[10px]" :class="takeawayTab === 'completed' ? 'bg-white/20' : 'bg-gray-100'" x-text="queueTickets.filter(t => t.status === 'completed').length"></span>
                  </button>
                </div>
                <div class="grid grid-cols-3 gap-4 mb-5">
                  <div class="dash-card text-center py-4" style="border-top: 3px solid #f59e0b;">
                    <p class="text-2xl font-black text-gray-900" x-text="queueTickets.filter(t => t.status === 'waiting').length"></p>
                    <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wide mt-1">Preparing</p>
                  </div>
                  <div class="dash-card text-center py-4" style="border-top: 3px solid #3b82f6;">
                    <p class="text-2xl font-black text-gray-900" x-text="queueTickets.filter(t => t.status === 'called' || t.status === 'serving').length"></p>
                    <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wide mt-1">Ready</p>
                  </div>
                  <div class="dash-card text-center py-4" style="border-top: 3px solid #10b981;">
                    <p class="text-2xl font-black text-gray-900" x-text="queueTickets.filter(t => t.status === 'completed').length"></p>
                    <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wide mt-1">Delivered</p>
                  </div>
                </div>
                <div x-show="takeawayTab === 'active'" class="space-y-3">
                  <template x-for="ticket in queueTickets.filter(t => t.status !== 'completed' && t.status !== 'no_show')" :key="ticket.id">
                    <div class="ticket-card" :class="ticket.status === 'waiting' ? 'ticket-waiting' : 'ticket-called'">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                          <span class="inline-flex items-center justify-center w-12 h-12 rounded-xl font-black text-sm" :class="ticket.status === 'waiting' ? 'bg-amber-50 text-amber-600' : 'bg-blue-50 text-blue-600'" x-text="ticket.ticketNumber"></span>
                          <div>
                            <p class="font-bold text-gray-900 text-sm" x-text="ticket.customerName || 'Order'"></p>
                            <div class="flex items-center gap-2 mt-1">
                              <span class="badge text-[10px]" :class="ticket.status === 'waiting' ? 'bg-amber-50 text-amber-600 border border-amber-200' : 'bg-blue-50 text-blue-600 border border-blue-200'" x-text="ticket.status === 'waiting' ? 'Preparing' : 'Ready for Pickup'"></span>
                              <span class="text-[11px] text-gray-400" x-text="getWaitTime(ticket.joinedAt)"></span>
                            </div>
                          </div>
                        </div>
                        <div class="flex gap-2">
                          <button x-show="ticket.status === 'waiting'" @click="updateTicketStatus(ticket.id, 'called')" class="q-action q-action-call"><i class="fa-solid fa-bell"></i><span class="hidden lg:inline">Ready</span></button>
                          <button x-show="ticket.status === 'called' || ticket.status === 'serving'" @click="updateTicketStatus(ticket.id, 'completed')" class="q-action q-action-done"><i class="fa-solid fa-check"></i><span class="hidden lg:inline">Delivered</span></button>
                          <button x-show="ticket.status === 'waiting' || ticket.status === 'called'" @click="updateTicketStatus(ticket.id, 'no_show')" class="q-action q-action-noshow"><i class="fa-solid fa-times"></i></button>
                        </div>
                      </div>
                    </div>
                  </template>
                  <div x-show="queueTickets.filter(t => t.status !== 'completed' && t.status !== 'no_show').length === 0" class="dash-card text-center py-16">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-50/60 flex items-center justify-center mb-4"><i class="fa-solid fa-bag-shopping text-2xl text-amber-300"></i></div>
                    <p class="text-sm font-bold text-gray-400">No active orders</p>
                    <p class="text-xs text-gray-300 mt-1">New takeaway orders will appear here</p>
                  </div>
                </div>
                <div x-show="takeawayTab === 'completed'" class="space-y-3">
                  <template x-for="ticket in queueTickets.filter(t => t.status === 'completed')" :key="ticket.id">
                    <div class="ticket-card ticket-completed">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                          <span class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gray-100 text-gray-400 font-black text-sm" x-text="ticket.ticketNumber"></span>
                          <div>
                            <p class="font-bold text-gray-500 text-sm" x-text="ticket.customerName || 'Order'"></p>
                            <span class="badge bg-green-50 text-green-600 border border-green-200 text-[10px]">Delivered</span>
                          </div>
                        </div>
                        <span class="text-xs text-gray-400" x-text="getWaitTime(ticket.joinedAt)"></span>
                      </div>
                    </div>
                  </template>
                  <div x-show="queueTickets.filter(t => t.status === 'completed').length === 0" class="dash-card text-center py-16">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-4"><i class="fa-solid fa-circle-check text-2xl text-gray-300"></i></div>
                    <p class="text-sm font-bold text-gray-400">No completed orders yet</p>
                  </div>
                </div>
              </div>
            </template>

            <!-- ======================== DINE IN MODE ======================== -->
            <template x-if="currentQueueMode === 'dine_in' || currentQueueMode === 'dinein'">
              <div>
                <div class="flex gap-2 mb-5 overflow-x-auto pb-1">
                  <!--
                    All dine-in tabs share the same selected style: brand
                    gradient fill + white text, so the active tab matches
                    the rest of the org dashboard's theme (#8c1867).
                    Per-tab accent colours used to be purple/blue/amber/
                    gray — replaced with a single brand treatment.
                  -->
                  <button @click="dineInTab = 'waiting'" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all border whitespace-nowrap" :class="dineInTab === 'waiting' ? 'text-white border-brand shadow-lg' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'" :style="dineInTab === 'waiting' ? 'background: linear-gradient(135deg, #8c1867, #6a1250)' : ''">
                    <i class="fa-solid fa-clock mr-1.5"></i>Waiting <span class="ml-1 px-1.5 py-0.5 rounded-md text-[10px]" :class="dineInTab === 'waiting' ? 'bg-white/20' : 'bg-gray-100'" x-text="queueTickets.filter(t => t.status === 'waiting').length"></span>
                  </button>
                  <button @click="dineInTab = 'called'" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all border whitespace-nowrap" :class="dineInTab === 'called' ? 'text-white border-brand shadow-lg' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'" :style="dineInTab === 'called' ? 'background: linear-gradient(135deg, #8c1867, #6a1250)' : ''">
                    <i class="fa-solid fa-bell mr-1.5"></i>Assigned <span class="ml-1 px-1.5 py-0.5 rounded-md text-[10px]" :class="dineInTab === 'called' ? 'bg-white/20' : 'bg-gray-100'" x-text="queueTickets.filter(t => t.status === 'called' || t.status === 'serving').length"></span>
                  </button>
                  <button @click="dineInTab = 'hold'" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all border whitespace-nowrap" :class="dineInTab === 'hold' ? 'text-white border-brand shadow-lg' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'" :style="dineInTab === 'hold' ? 'background: linear-gradient(135deg, #8c1867, #6a1250)' : ''">
                    <i class="fa-solid fa-pause mr-1.5"></i>Hold <span class="ml-1 px-1.5 py-0.5 rounded-md text-[10px]" :class="dineInTab === 'hold' ? 'bg-white/20' : 'bg-gray-100'" x-text="queueTickets.filter(t => t.status === 'hold').length"></span>
                  </button>
                  <button @click="dineInTab = 'completed'" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all border whitespace-nowrap" :class="dineInTab === 'completed' ? 'text-white border-brand shadow-lg' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'" :style="dineInTab === 'completed' ? 'background: linear-gradient(135deg, #8c1867, #6a1250)' : ''">
                    <i class="fa-solid fa-circle-check mr-1.5"></i>Arrived <span class="ml-1 px-1.5 py-0.5 rounded-md text-[10px]" :class="dineInTab === 'completed' ? 'bg-white/20' : 'bg-gray-100'" x-text="queueTickets.filter(t => t.status === 'arrived' || t.status === 'completed' || t.status === 'no_show').length"></span>
                  </button>
                  <button @click="dineInTab = 'reservations'; loadDineInReservations()" class="px-5 py-2.5 rounded-xl text-xs font-bold transition-all border whitespace-nowrap" :class="dineInTab === 'reservations' ? 'text-white border-brand shadow-lg' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'" :style="dineInTab === 'reservations' ? 'background: linear-gradient(135deg, #8c1867, #6a1250)' : ''">
                    <i class="fa-solid fa-calendar-check mr-1.5"></i>Reservations <span class="ml-1 px-1.5 py-0.5 rounded-md text-[10px]" :class="dineInTab === 'reservations' ? 'bg-white/20' : 'bg-gray-100'" x-text="dineInReservations.filter(r => r.status === 'confirmed').length"></span>
                  </button>
                </div>
                <!-- Reservations Tab Content -->
                <div x-show="dineInTab === 'reservations'" class="space-y-3">
                  <template x-for="res in dineInReservations.filter(r => r.status === 'confirmed')" :key="res.id">
                    <div class="ticket-card border-l-4 border-l-purple-400">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                          <span class="inline-flex items-center justify-center w-11 h-11 rounded-xl font-black text-xs bg-purple-50 text-purple-600" x-text="res.confirmationCode"></span>
                          <div>
                            <p class="font-bold text-gray-900 text-sm" x-text="res.customerName"></p>
                            <div class="flex items-center gap-2 mt-1 flex-wrap">
                              <span x-show="res.customerPhone" class="text-[11px] text-gray-400"><i class="fa-solid fa-phone text-[9px] mr-1"></i><span x-text="res.customerPhone"></span></span>
                              <span class="text-[11px] text-purple-500 font-semibold"><i class="fa-solid fa-clock text-[9px] mr-1"></i><span x-text="res.reservationTime"></span></span>
                              <span class="badge text-[9px] bg-purple-50 text-purple-600 border border-purple-100"><span x-text="res.partySize"></span> guests</span>
                              <span x-show="res.specialRequests" class="text-[11px] text-gray-400 italic" x-text="res.specialRequests"></span>
                            </div>
                          </div>
                        </div>
                        <div class="flex gap-2">
                          <button x-show="hasPerm('org.queue.call_specific')" @click="checkinReservation(res.id)" class="q-action q-action-serve"><i class="fa-solid fa-right-to-bracket"></i><span class="hidden lg:inline">Check In</span></button>
                          <button x-show="hasPerm('org.queue.complete')" @click="cancelReservation(res.id)" class="q-action q-action-noshow"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                      </div>
                    </div>
                  </template>
                  <div x-show="dineInReservations.filter(r => r.status === 'confirmed').length === 0" class="dash-card text-center py-16">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-purple-50/60 flex items-center justify-center mb-4">
                      <i class="fa-solid fa-calendar-check text-2xl text-purple-300"></i>
                    </div>
                    <p class="text-sm font-bold text-gray-400">No pending reservations today</p>
                  </div>
                  <!-- Checked-in reservations below -->
                  <template x-if="dineInReservations.filter(r => r.status === 'checked_in').length > 0">
                    <div>
                      <p class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mt-4 mb-2">Already Checked In</p>
                      <template x-for="res in dineInReservations.filter(r => r.status === 'checked_in')" :key="res.id">
                        <div class="ticket-card opacity-60 border-l-4 border-l-green-400 mb-2">
                          <div class="flex items-center justify-between">
                            <div class="flex items-center gap-4">
                              <span class="inline-flex items-center justify-center w-11 h-11 rounded-xl font-black text-xs bg-green-50 text-green-600" x-text="res.confirmationCode"></span>
                              <div>
                                <p class="font-bold text-gray-900 text-sm" x-text="res.customerName"></p>
                                <div class="flex items-center gap-2 mt-1">
                                  <span class="text-[11px] text-green-500 font-semibold"><i class="fa-solid fa-check-circle text-[9px] mr-1"></i>Checked In</span>
                                  <span class="badge text-[9px] bg-purple-50 text-purple-600 border border-purple-100"><span x-text="res.partySize"></span> guests</span>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <!-- Queue Tabs Content (Waiting/Called/Hold/Completed) -->
                <div x-show="dineInTab !== 'reservations'" class="space-y-3">
                  <template x-for="(ticket, index) in getDineInFiltered()" :key="ticket.id">
                    <div class="ticket-card" :class="'ticket-' + ticket.status">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                          <span class="inline-flex items-center justify-center w-11 h-11 rounded-xl font-black text-sm" :class="{
                            'bg-brand-50 text-brand': ticket.status === 'waiting',
                            'bg-blue-50 text-blue-600': ticket.status === 'called' || ticket.status === 'serving',
                            'bg-amber-50 text-amber-600': ticket.status === 'hold',
                            'bg-green-50 text-green-600': ticket.status === 'arrived',
                            'bg-gray-100 text-gray-400': ticket.status === 'completed' || ticket.status === 'no_show',
                          }" x-text="ticket.ticketNumber"></span>
                          <div>
                            <p class="font-bold text-gray-900 text-sm" x-text="ticket.customerName || 'Guest'"></p>
                            <div class="flex items-center gap-2 mt-1">
                              <span x-show="ticket.customerPhone" class="text-[11px] text-gray-400"><i class="fa-solid fa-phone text-[9px] mr-1"></i><span x-text="ticket.customerPhone"></span></span>
                              <span class="text-[11px] text-gray-400"><i class="fa-solid fa-clock text-[9px] mr-1"></i><span x-text="getWaitTime(ticket.joinedAt)"></span></span>
                              <span x-show="ticket.tableNumber" class="badge text-[9px] bg-blue-50 text-blue-600 border border-blue-100">Table <span x-text="ticket.tableNumber"></span></span>
                              <span x-show="ticket.source === 'reservation'" class="badge text-[9px] bg-purple-50 text-purple-600 border border-purple-100"><i class="fa-solid fa-calendar-check text-[8px] mr-1"></i>Reservation</span>
                            </div>
                          </div>
                        </div>
                        <div class="flex gap-2">
                          <button x-show="ticket.status === 'waiting'" @click="openTableAssignModal(ticket)" class="q-action q-action-call"><i class="fa-solid fa-bell"></i><span class="hidden lg:inline">Assign</span></button>
                          <button x-show="ticket.status === 'called'" @click="callAgainTicket(ticket)" class="q-action" style="background: #eef2ff; color: #4338ca; border-color: #c7d2fe;"><i class="fa-solid fa-bullhorn"></i><span class="hidden lg:inline">Call Again</span></button>
                          <button x-show="ticket.status === 'called'" @click="updateTicketStatus(ticket.id, 'arrived')" class="q-action q-action-serve"><i class="fa-solid fa-utensils"></i><span class="hidden lg:inline">Seat</span></button>
                          <button x-show="ticket.status === 'waiting' || ticket.status === 'called'" @click="updateTicketStatus(ticket.id, 'hold')" class="q-action" style="background: #fef3c7; color: #92400e; border-color: #fcd34d;"><i class="fa-solid fa-pause"></i><span class="hidden lg:inline">Hold</span></button>
                          <button x-show="ticket.status === 'hold'" @click="resumeDineInFromHold(ticket.id)" class="q-action q-action-call"><i class="fa-solid fa-play"></i><span class="hidden lg:inline">Resume</span></button>
                          <button x-show="ticket.status === 'serving'" @click="updateTicketStatus(ticket.id, 'completed')" class="q-action q-action-done"><i class="fa-solid fa-check"></i><span class="hidden lg:inline">Done</span></button>
                          <button x-show="ticket.status === 'waiting' || ticket.status === 'called'" @click="updateTicketStatus(ticket.id, 'no_show')" class="q-action q-action-noshow"><i class="fa-solid fa-user-xmark"></i></button>
                        </div>
                      </div>
                    </div>
                  </template>
                  <div x-show="getDineInFiltered().length === 0" class="dash-card text-center py-16">
                    <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center mb-4" :class="dineInTab === 'waiting' ? 'bg-brand-50/60' : dineInTab === 'hold' ? 'bg-amber-50/60' : dineInTab === 'completed' ? 'bg-gray-50' : 'bg-blue-50/60'">
                      <i class="text-2xl" :class="dineInTab === 'waiting' ? 'fa-solid fa-clock text-brand/30' : dineInTab === 'hold' ? 'fa-solid fa-pause text-amber-300' : dineInTab === 'completed' ? 'fa-solid fa-circle-check text-gray-300' : 'fa-solid fa-bell text-blue-300'"></i>
                    </div>
                    <p class="text-sm font-bold text-gray-400" x-text="dineInTab === 'waiting' ? 'No guests waiting' : dineInTab === 'called' ? 'No guests assigned' : dineInTab === 'hold' ? 'No guests on hold' : 'No arrived guests'"></p>
                  </div>
                </div>
              </div>
            </template>

            <!-- ======================== THREE-COLUMN QUEUE VIEW (FIFO / Selective / Multi-Stage) ======================== -->
            <template x-if="currentQueueMode !== 'checkin' && currentQueueMode !== 'takeaway' && currentQueueMode !== 'dine_in' && currentQueueMode !== 'dinein'">
              <div>
                <!-- Multi-Stage: Journey stages bar -->
                <template x-if="currentQueueMode === 'multi_stage' || currentQueueMode === 'multistage'">
                  <div class="mb-4 p-3.5 rounded-xl border border-indigo-100 bg-indigo-50/30">
                    <div class="flex items-center gap-2 mb-2.5">
                      <i class="fa-solid fa-route text-indigo-500 text-sm"></i>
                      <span class="text-xs font-black text-indigo-700 uppercase tracking-wider">Journey Stages</span>
                    </div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <template x-for="(j, jIdx) in journeys.filter(j => j.isActive)" :key="j.id">
                        <div class="flex items-center gap-1.5">
                          <template x-for="(stage, sIdx) in (j.stages || [])" :key="sIdx">
                            <div class="flex items-center gap-1.5">
                              <button @click="selectedStageFilter = (selectedStageFilter === stage.id ? null : stage.id)" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer" :class="selectedStageFilter === stage.id ? 'bg-indigo-600 text-white shadow-md' : (stage.isOptional ? 'bg-white text-gray-400 border border-dashed border-gray-300 hover:border-indigo-300' : 'bg-white text-indigo-600 border border-indigo-200 hover:bg-indigo-50')" x-text="stage.serviceName"></button>
                              <i x-show="sIdx < (j.stages || []).length - 1" class="fa-solid fa-chevron-right text-indigo-200 text-[10px]"></i>
                            </div>
                          </template>
                        </div>
                      </template>
                      <span x-show="journeys.filter(j => j.isActive).length === 0" class="text-xs text-gray-400 italic">No active journeys.</span>
                      <button x-show="selectedStageFilter" @click="selectedStageFilter = null" class="ml-2 px-2.5 py-1 rounded-lg text-[10px] font-bold bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all"><i class="fa-solid fa-times mr-1"></i>Clear Filter</button>
                    </div>
                  </div>
                </template>

                <!-- Selective mode notice -->
                <div x-show="currentQueueMode === 'selective'" class="mb-4 p-3 rounded-xl bg-purple-50 border border-purple-100 flex items-center gap-3">
                  <i class="fa-solid fa-hand-pointer text-purple-500"></i>
                  <p class="text-xs text-purple-700 font-medium">Selective Mode: You can call any waiting customer directly, regardless of their position.</p>
                </div>

                <!-- Three-Column Layout -->
                <div class="flex gap-0 dash-card-flat overflow-hidden" style="height: calc(100vh - 260px); min-height: 520px;">

                  <!-- COLUMN 1: Customer List -->
                  <div class="w-64 flex-shrink-0 flex flex-col border-r border-gray-100" style="min-width: 240px;">
                    <div class="flex border-b border-gray-100">
                      <button @click="queueListTab = 'active'" class="flex-1 py-3 text-[11px] font-extrabold transition-all border-b-2" :class="queueListTab === 'active' ? 'border-brand text-brand bg-brand-50/30' : 'border-transparent text-gray-400 hover:text-gray-600'">
                        In Queue
                        <span class="ml-1 px-1.5 py-0.5 rounded-md text-[9px]" :class="queueListTab === 'active' ? 'bg-brand/10 text-brand' : 'bg-gray-100 text-gray-500'" x-text="queueTickets.filter(t => t.status !== 'completed' && t.status !== 'no_show').length"></span>
                      </button>
                      <button @click="queueListTab = 'completed'; selectedTicket = null" class="flex-1 py-3 text-[11px] font-extrabold transition-all border-b-2" :class="queueListTab === 'completed' ? 'border-gray-600 text-gray-600 bg-gray-50' : 'border-transparent text-gray-400 hover:text-gray-600'">
                        Completed
                        <span class="ml-1 px-1.5 py-0.5 rounded-md text-[9px]" :class="queueListTab === 'completed' ? 'bg-gray-200 text-gray-600' : 'bg-gray-100 text-gray-500'" x-text="queueTickets.filter(t => t.status === 'completed' || t.status === 'no_show').length"></span>
                      </button>
                    </div>
                    <div class="px-3 py-2.5 border-b border-gray-50">
                      <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-300 text-[10px]"></i>
                        <input type="text" x-model="queueSearch" class="w-full border border-gray-200 rounded-lg py-1.5 pl-7 pr-2 text-[11px] outline-none focus:border-brand focus:ring-2 focus:ring-brand/10 bg-gray-50/50" placeholder="Search...">
                      </div>
                    </div>
                    <div class="flex-1 overflow-y-auto">
                      <template x-for="(ticket, idx) in getQueueListFiltered()" :key="ticket.id">
                        <div @click="selectTicket(ticket)" class="px-3 py-2.5 cursor-pointer border-b border-gray-50/80 transition-all" :class="selectedTicket?.id === ticket.id ? 'bg-brand-50/50 border-l-[3px] border-l-brand' : 'hover:bg-gray-50/60 border-l-[3px] border-l-transparent'">
                          <div class="flex items-center gap-2.5 min-w-0">
                            <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg font-black text-[10px] flex-shrink-0" :class="{
                              'bg-brand-50 text-brand': ticket.status === 'waiting',
                              'bg-blue-50 text-blue-600': ticket.status === 'called',
                              'bg-emerald-50 text-emerald-600': ticket.status === 'serving',
                              'bg-amber-50 text-amber-600': ticket.status === 'hold',
                              'bg-gray-100 text-gray-400': ticket.status === 'completed' || ticket.status === 'no_show',
                            }" x-text="ticket.ticketNumber"></span>
                            <div class="min-w-0 flex-1">
                              <div class="flex items-center justify-between gap-1">
                                <p class="font-bold text-[12px] text-gray-900 truncate" x-text="ticket.customerName || 'Walk-in'"></p>
                                <span class="badge text-[8px] flex-shrink-0 px-1.5 py-0.5" :class="getStatusBadgeClass(ticket.status)" x-text="getStatusLabel(ticket.status)"></span>
                              </div>
                              <div class="flex items-center gap-1.5 mt-0.5">
                                <span class="text-[10px] text-gray-400" x-text="formatTime(ticket.joinedAt)"></span>
                                <span x-show="ticket.serviceName" class="text-[10px] text-gray-300">|</span>
                                <span x-show="ticket.serviceName" class="text-[10px] text-gray-400 truncate" x-text="ticket.serviceName"></span>
                                <template x-if="ticket.deskName">
                                  <span class="text-[9px] text-blue-500 font-semibold flex items-center gap-0.5 flex-shrink-0"><i class="fa-solid fa-desktop text-[7px]"></i><span x-text="ticket.deskName"></span></span>
                                </template>
                              </div>
                            </div>
                          </div>
                        </div>
                      </template>
                      <div x-show="getQueueListFiltered().length === 0" class="text-center py-10 px-3">
                        <div class="w-10 h-10 mx-auto rounded-xl bg-gray-50 flex items-center justify-center mb-2">
                          <i class="fa-solid fa-users text-gray-300 text-sm"></i>
                        </div>
                        <p class="text-[11px] font-semibold text-gray-400" x-text="queueListTab === 'active' ? 'No customers in queue' : 'No completed tickets'"></p>
                      </div>
                    </div>
                  </div>

                  <!-- COLUMN 2: Customer Details / Fields -->
                  <div class="flex-1 flex flex-col min-w-0 border-r border-gray-100">
                    <template x-if="selectedTicket">
                      <div class="flex-1 overflow-y-auto p-5">
                        <!-- Customer Header -->
                        <div class="flex justify-between items-start mb-5">
                          <div>
                            <h2 class="text-lg font-black text-gray-900" x-text="selectedTicket.customerName || 'Walk-in Customer'"></h2>
                            <div class="flex items-center gap-2 mt-1">
                              <span class="inline-flex items-center justify-center px-3 py-1 rounded-lg font-black text-xs tracking-wide" :class="{
                                'bg-brand-50 text-brand': selectedTicket.status === 'waiting',
                                'bg-blue-50 text-blue-600': selectedTicket.status === 'called',
                                'bg-emerald-50 text-emerald-600': selectedTicket.status === 'serving',
                                'bg-amber-50 text-amber-600': selectedTicket.status === 'hold',
                                'bg-gray-100 text-gray-400': selectedTicket.status === 'completed' || selectedTicket.status === 'no_show',
                              }" x-text="selectedTicket.ticketNumber"></span>
                              <span class="badge text-[9px]" :class="getStatusBadgeClass(selectedTicket.status)" x-text="getStatusLabel(selectedTicket.status)"></span>
                              <span x-show="selectedTicket.source" class="badge text-[8px] bg-gray-100 text-gray-500" x-text="(selectedTicket.source || 'app').toUpperCase()"></span>
                            </div>
                          </div>
                          <div class="text-right">
                            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Wait Time</p>
                            <p class="text-sm font-black mt-0.5" :class="{'text-brand': selectedTicket.status === 'waiting', 'text-blue-600': selectedTicket.status === 'called', 'text-emerald-600': selectedTicket.status === 'serving', 'text-gray-500': selectedTicket.status === 'completed' || selectedTicket.status === 'no_show'}" x-text="getWaitTime(selectedTicket.joinedAt)"></p>
                          </div>
                        </div>

                        <!-- Info Fields -->
                        <div class="space-y-3">
                          <div class="grid grid-cols-2 gap-3">
                            <div class="p-3 rounded-xl border border-gray-100 bg-gray-50/30">
                              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1"><i class="fa-solid fa-phone text-[9px] mr-1 text-brand/50"></i>Phone</label>
                              <p class="text-sm font-semibold text-gray-800" x-text="selectedTicket.customerPhone || '-'"></p>
                            </div>
                            <div class="p-3 rounded-xl border border-gray-100 bg-gray-50/30">
                              <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1"><i class="fa-solid fa-envelope text-[9px] mr-1 text-brand/50"></i>Email</label>
                              <p class="text-sm font-semibold text-gray-800 truncate" x-text="selectedTicket.customerEmail || '-'"></p>
                            </div>
                          </div>
                          <div class="p-3 rounded-xl border border-gray-100 bg-gray-50/30">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1"><i class="fa-solid fa-concierge-bell text-[9px] mr-1 text-brand/50"></i>Service Requested</label>
                            <p class="text-sm font-semibold text-gray-800" x-text="selectedTicket.serviceName || '-'"></p>
                          </div>
                          <template x-if="selectedTicket.deskName">
                            <div class="p-3 rounded-xl border border-blue-100 bg-blue-50/30">
                              <label class="text-[10px] font-bold text-blue-400 uppercase tracking-wider block mb-1"><i class="fa-solid fa-desktop text-[9px] mr-1 text-blue-400"></i>Assigned Desk</label>
                              <p class="text-sm font-semibold text-blue-700" x-text="selectedTicket.deskName"></p>
                            </div>
                          </template>
                        </div>

                        <!-- Custom Form Data -->
                        <template x-if="selectedTicket.formData && Object.keys(selectedTicket.formData).length > 0">
                          <div class="mt-4">
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-wider mb-2">Additional Information</p>
                            <div class="space-y-2">
                              <template x-for="[key, value] in Object.entries(selectedTicket.formData)" :key="key">
                                <div class="p-3 rounded-xl border border-gray-100 bg-gray-50/30">
                                  <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1" x-text="key.replace(/([A-Z])/g, ' $1').replace(/_/g, ' ').replace(/^./, s => s.toUpperCase())"></label>
                                  <p class="text-sm font-semibold text-gray-800" x-text="value || '-'"></p>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>

                        <!-- Multi-Stage Journey Progress -->
                        <template x-if="(currentQueueMode === 'multi_stage' || currentQueueMode === 'multistage') && selectedTicket.journeyId">
                          <div class="mt-4 p-3.5 rounded-xl bg-indigo-50/40 border border-indigo-100">
                            <div class="flex items-center gap-2 mb-2">
                              <i class="fa-solid fa-route text-indigo-500 text-sm"></i>
                              <span class="text-xs font-bold text-indigo-700">Journey Progress</span>
                            </div>
                            <div class="flex items-center gap-1.5 flex-wrap mb-2">
                              <template x-for="(sh, shIdx) in (selectedTicket.stageHistory || [])" :key="sh.stageId || shIdx">
                                <div class="flex items-center gap-1.5">
                                  <span class="px-2 py-1 rounded-md text-[10px] font-bold" :class="sh.completedAt ? 'bg-green-100 text-green-700' : (sh.skipped ? 'bg-gray-100 text-gray-400 line-through' : 'bg-indigo-100 text-indigo-600 ring-2 ring-indigo-300')">
                                    <i :class="sh.completedAt ? 'fa-solid fa-check text-[8px] mr-0.5' : (sh.skipped ? 'fa-solid fa-forward text-[8px] mr-0.5' : 'fa-solid fa-spinner text-[8px] mr-0.5')"></i>
                                    <span x-text="sh.stageName"></span>
                                  </span>
                                  <i x-show="shIdx < (selectedTicket.stageHistory || []).length - 1" class="fa-solid fa-arrow-right text-indigo-200 text-[8px]"></i>
                                </div>
                              </template>
                            </div>
                            <p class="text-[10px] text-indigo-500 font-semibold">
                              Currently at: <span class="font-black" x-text="selectedTicket.currentStageName || 'Stage ' + ((selectedTicket.currentStageIndex || 0) + 1)"></span>
                            </p>
                          </div>
                        </template>

                        <template x-if="selectedTicket.notes">
                          <div class="mt-4 p-3 rounded-xl border border-amber-100 bg-amber-50/30">
                            <label class="text-[10px] font-bold text-amber-600 uppercase tracking-wider block mb-1"><i class="fa-solid fa-sticky-note text-[9px] mr-1"></i>Notes</label>
                            <p class="text-sm text-gray-700" x-text="selectedTicket.notes"></p>
                          </div>
                        </template>
                      </div>
                    </template>

                    <!-- No Selection State -->
                    <template x-if="!selectedTicket">
                      <div class="flex-1 flex items-center justify-center">
                        <div class="text-center px-6">
                          <div class="w-16 h-16 mx-auto rounded-2xl bg-brand-50/30 flex items-center justify-center mb-4">
                            <i class="fa-solid fa-id-card text-2xl text-brand/20"></i>
                          </div>
                          <p class="text-sm font-bold text-gray-400">Customer Details</p>
                          <p class="text-xs text-gray-300 mt-1">Select a customer to view their information</p>
                        </div>
                      </div>
                    </template>
                  </div>

                  <!-- COLUMN 3: Actions + Timeline -->
                  <div class="w-64 flex-shrink-0 flex flex-col" style="min-width: 240px;">
                    <template x-if="selectedTicket">
                      <div class="flex-1 flex flex-col">
                        <!-- Actions Area -->
                        <div class="flex-1 overflow-y-auto p-4">
                          <p class="text-[10px] font-black text-gray-400 uppercase tracking-wider mb-3">Quick Actions</p>

                          <!-- Primary Action Buttons -->
                          <div class="space-y-2 mb-5">
                            <!-- Call -->
                            <button x-show="selectedTicket.status === 'waiting' && canCallTicket(selectedTicket)" @click="detailAction('called')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-white transition-all shadow-sm hover:shadow-md" style="background: linear-gradient(135deg, #3b82f6, #2563eb);">
                              <i class="fa-solid fa-bullhorn text-sm"></i><span>Call Customer</span>
                            </button>
                            <!-- Call Again -->
                            <button x-show="selectedTicket.status === 'called'" @click="detailAction('called')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-white transition-all shadow-sm hover:shadow-md" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">
                              <i class="fa-solid fa-bullhorn text-sm"></i><span>Call Again</span>
                            </button>
                            <!-- Serve -->
                            <button x-show="selectedTicket.status === 'called'" @click="detailAction('serving')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-white transition-all shadow-sm hover:shadow-md" style="background: linear-gradient(135deg, #10b981, #059669);">
                              <i class="fa-solid fa-play text-sm"></i><span>Start Serving</span>
                            </button>
                            <!-- Resume -->
                            <button x-show="selectedTicket.status === 'hold'" @click="detailAction('resume')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-white transition-all shadow-sm hover:shadow-md" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                              <i class="fa-solid fa-play text-sm"></i><span>Resume Service</span>
                            </button>
                            <!-- Finish & Call Next -->
                            <button x-show="selectedTicket.status === 'serving'" @click="finishAndCallNext()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold border-2 border-brand text-brand hover:bg-brand-50 transition-all">
                              <i class="fa-solid fa-forward-step text-sm"></i><span>Finish & Call Next</span>
                            </button>
                            <!-- Finish -->
                            <button x-show="selectedTicket.status === 'serving' || selectedTicket.status === 'called'" @click="detailAction('completed')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-white transition-all shadow-sm hover:shadow-md" style="background: linear-gradient(135deg, #8c1867, #6a1250);">
                              <i class="fa-solid fa-check-double text-sm"></i><span>Finish</span>
                            </button>
                          </div>

                          <!-- Multi-Stage: Stage Navigation -->
                          <template x-if="(currentQueueMode === 'multi_stage' || currentQueueMode === 'multistage') && selectedTicket.journeyId && selectedTicket.status !== 'completed' && selectedTicket.status !== 'no_show'">
                            <div class="mb-5">
                              <p class="text-[10px] font-black text-indigo-500 uppercase tracking-wider mb-2"><i class="fa-solid fa-route mr-1"></i>Stage Navigation</p>
                              <div class="space-y-2">
                                <button x-show="hasPerm('org.queue.move_stage')" @click="moveTicketToNextStage()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 transition-all">
                                  <i class="fa-solid fa-arrow-right text-xs"></i><span>Move to Next Stage</span>
                                </button>
                                <div class="relative">
                                  <select @change="moveTicketToStage($event.target.value); $event.target.value = ''" class="w-full px-4 py-2.5 rounded-xl text-xs font-bold bg-white text-gray-700 border border-gray-200 hover:border-indigo-300 transition-all appearance-none cursor-pointer pr-8">
                                    <option value="">Jump to Stage...</option>
                                    <template x-for="j in journeys.filter(j => j.isActive && j.id === selectedTicket.journeyId)" :key="j.id">
                                      <template x-for="(stage, sIdx) in (j.stages || [])" :key="stage.id">
                                        <option :value="stage.id + '|' + sIdx + '|' + stage.serviceName" :disabled="sIdx <= (selectedTicket.currentStageIndex || 0)" x-text="stage.serviceName + (sIdx <= (selectedTicket.currentStageIndex || 0) ? ' (done)' : '')"></option>
                                      </template>
                                    </template>
                                  </select>
                                  <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-[10px] pointer-events-none"></i>
                                </div>
                                <button x-show="hasPerm('org.queue.complete')" @click="finishAtCurrentStage()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 transition-all">
                                  <i class="fa-solid fa-flag-checkered text-xs"></i><span>Finish at Current Stage</span>
                                </button>
                              </div>
                            </div>
                          </template>

                          <!-- Secondary Actions -->
                          <div x-show="selectedTicket.status !== 'completed' && selectedTicket.status !== 'no_show'">
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-wider mb-2">More Actions</p>
                            <div class="space-y-1.5">
                              <button x-show="hasPerm('org.queue.allocate_table')" @click="showAssignModal = true; assignServiceId = ''" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-gray-600 border border-gray-200 bg-white hover:bg-gray-50 hover:border-gray-300 transition-all">
                                <i class="fa-solid fa-user-tag text-brand text-xs"></i><span>Assign To</span>
                              </button>
                              <button @click="detailAction('no_show')" x-show="selectedTicket.status !== 'serving'" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-gray-600 border border-gray-200 bg-white hover:bg-gray-50 hover:border-gray-300 transition-all">
                                <i class="fa-solid fa-user-xmark text-amber-500 text-xs"></i><span>No Show</span>
                              </button>
                              <button @click="detailAction('hold')" x-show="selectedTicket.status === 'waiting' || selectedTicket.status === 'called'" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-gray-600 border border-gray-200 bg-white hover:bg-gray-50 hover:border-gray-300 transition-all">
                                <i class="fa-solid fa-pause-circle text-amber-500 text-xs"></i><span>Service Paused</span>
                              </button>
                              <button x-show="hasPerm('org.queue.complete')" @click="detailAction('cancel')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold text-red-500 border border-red-200 bg-white hover:bg-red-50 hover:border-red-300 transition-all">
                                <i class="fa-solid fa-ban text-xs"></i><span>Cancel</span>
                              </button>
                            </div>
                          </div>

                          <!-- Timeline -->
                          <div class="mt-5 pt-4 border-t border-gray-100">
                            <p class="text-[10px] font-black text-gray-400 uppercase tracking-wider mb-3">Timeline</p>
                            <div class="pl-0.5">
                              <template x-for="(event, eIdx) in getTicketTimeline(selectedTicket)" :key="event.label + eIdx">
                                <div class="flex items-start gap-2.5">
                                  <div class="flex flex-col items-center">
                                    <div class="w-2.5 h-2.5 rounded-full border-2 flex-shrink-0" :class="event.active ? 'bg-brand border-brand' : 'bg-gray-200 border-gray-300'"></div>
                                    <div x-show="!event.last" class="w-0.5 h-5 bg-gray-200 mt-0.5"></div>
                                  </div>
                                  <div class="pb-0.5 -mt-0.5">
                                    <p class="text-[11px] font-bold" :class="event.active ? 'text-gray-700' : 'text-gray-400'" x-text="event.label"></p>
                                    <p class="text-[10px]" :class="event.active ? 'text-gray-400' : 'text-gray-300'" x-text="event.time || 'Pending'"></p>
                                  </div>
                                </div>
                              </template>
                            </div>
                          </div>
                        </div>
                      </div>
                    </template>

                    <!-- No Selection State -->
                    <template x-if="!selectedTicket">
                      <div class="flex-1 flex items-center justify-center">
                        <div class="text-center px-4">
                          <div class="w-14 h-14 mx-auto rounded-2xl bg-brand-50/30 flex items-center justify-center mb-3">
                            <i class="fa-solid fa-wand-magic-sparkles text-xl text-brand/20"></i>
                          </div>
                          <p class="text-xs font-bold text-gray-400">Actions</p>
                          <p class="text-[11px] text-gray-300 mt-1">Select a customer to manage their queue</p>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Assign To Modal -->
          <div x-show="showAssignModal" x-cloak class="modal-overlay" @click.self="showAssignModal = false">
            <div class="modal-content p-6" @click.stop>
              <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-black text-gray-900">Assign To Service</h3>
                <button @click="showAssignModal = false" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <p class="text-sm text-gray-500 mb-4">Reassign this customer to a different service.</p>
              <select x-model="assignServiceId" class="input-field mb-5">
                <option value="">Select a service...</option>
                <template x-for="svc in services.filter(s => s.isActive)" :key="svc.id">
                  <option :value="svc.id" x-text="svc.name"></option>
                </template>
              </select>
              <div class="flex justify-end gap-3">
                <button @click="showAssignModal = false" class="px-4 py-2 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition-colors">Cancel</button>
                <button x-show="hasPerm('org.queue.allocate_table')" @click="reassignTicket()" class="px-5 py-2 rounded-xl text-sm font-bold text-white transition-all shadow-sm" style="background: linear-gradient(135deg, #8c1867, #6a1250);" :disabled="!assignServiceId">Assign</button>
              </div>
            </div>
          </div>

          <!-- TABLE ASSIGNMENT MODAL (Dine In) -->
          <div x-show="showTableAssignModal" x-cloak class="modal-overlay" @click.self="showTableAssignModal = false">
            <div class="modal-content p-6" style="max-width: 420px;" @click.stop>
              <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-black text-gray-900">Assign Table</h3>
                <button @click="showTableAssignModal = false" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="p-4 rounded-xl bg-amber-50/60 border border-amber-100 mb-5">
                <div class="flex items-center gap-3">
                  <span class="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center font-black text-sm text-amber-700" x-text="tableAssignTicketNumber"></span>
                  <div>
                    <p class="font-bold text-gray-900 text-sm" x-text="tableAssignCustomerName || 'Guest'"></p>
                    <p class="text-xs text-gray-500">Assigning table for this guest</p>
                  </div>
                </div>
              </div>
              <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Table Number</label>
