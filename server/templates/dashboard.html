                  <button @click="settingsForm.queueMode = 'checkin'" class="text-left p-4 rounded-xl border-2 transition-all" :class="settingsForm.queueMode === 'checkin' ? 'border-brand bg-brand-50/40 shadow-sm' : 'border-gray-100 hover:border-gray-200 hover:bg-gray-50'">
                    <div class="flex items-center gap-2.5 mb-2">
                      <div class="w-8 h-8 rounded-lg flex items-center justify-center" :class="settingsForm.queueMode === 'checkin' ? 'bg-brand-100 text-brand' : 'bg-gray-100 text-gray-400'"><i class="fa-solid fa-qrcode text-sm"></i></div>
                      <span class="text-sm font-bold" :class="settingsForm.queueMode === 'checkin' ? 'text-brand' : 'text-gray-700'">Check-in</span>
                    </div>
                    <p class="text-[11px] text-gray-400 leading-relaxed">Scan ticket or enter number to mark customer as arrived.</p>
                  </button>
                  <button @click="settingsForm.queueMode = 'dine_in'" class="text-left p-4 rounded-xl border-2 transition-all" :class="settingsForm.queueMode === 'dine_in' || settingsForm.queueMode === 'dinein' ? 'border-brand bg-brand-50/40 shadow-sm' : 'border-gray-100 hover:border-gray-200 hover:bg-gray-50'">
                    <div class="flex items-center gap-2.5 mb-2">
                      <div class="w-8 h-8 rounded-lg flex items-center justify-center" :class="settingsForm.queueMode === 'dine_in' || settingsForm.queueMode === 'dinein' ? 'bg-brand-100 text-brand' : 'bg-gray-100 text-gray-400'"><i class="fa-solid fa-utensils text-sm"></i></div>
                      <span class="text-sm font-bold" :class="settingsForm.queueMode === 'dine_in' || settingsForm.queueMode === 'dinein' ? 'text-brand' : 'text-gray-700'">Dine In</span>
                    </div>
                    <p class="text-[11px] text-gray-400 leading-relaxed">Restaurant mode with waiting, called, hold, and seating stages.</p>
                  </button>
                  <button @click="settingsForm.queueMode = 'takeaway'" class="text-left p-4 rounded-xl border-2 transition-all" :class="settingsForm.queueMode === 'takeaway' ? 'border-brand bg-brand-50/40 shadow-sm' : 'border-gray-100 hover:border-gray-200 hover:bg-gray-50'">
                    <div class="flex items-center gap-2.5 mb-2">
                      <div class="w-8 h-8 rounded-lg flex items-center justify-center" :class="settingsForm.queueMode === 'takeaway' ? 'bg-brand-100 text-brand' : 'bg-gray-100 text-gray-400'"><i class="fa-solid fa-bag-shopping text-sm"></i></div>
                      <span class="text-sm font-bold" :class="settingsForm.queueMode === 'takeaway' ? 'text-brand' : 'text-gray-700'">Takeaway</span>
                    </div>
                    <p class="text-[11px] text-gray-400 leading-relaxed">Order-based flow with preparing, ready, and delivered stages.</p>
                  </button>
                  <button @click="settingsForm.queueMode = 'multi_stage'" class="text-left p-4 rounded-xl border-2 transition-all" :class="settingsForm.queueMode === 'multi_stage' || settingsForm.queueMode === 'multistage' ? 'border-brand bg-brand-50/40 shadow-sm' : 'border-gray-100 hover:border-gray-200 hover:bg-gray-50'">
                    <div class="flex items-center gap-2.5 mb-2">
                      <div class="w-8 h-8 rounded-lg flex items-center justify-center" :class="settingsForm.queueMode === 'multi_stage' || settingsForm.queueMode === 'multistage' ? 'bg-brand-100 text-brand' : 'bg-gray-100 text-gray-400'"><i class="fa-solid fa-route text-sm"></i></div>
                      <span class="text-sm font-bold" :class="settingsForm.queueMode === 'multi_stage' || settingsForm.queueMode === 'multistage' ? 'text-brand' : 'text-gray-700'">Multi-Stage</span>
                    </div>
                    <p class="text-[11px] text-gray-400 leading-relaxed">Complex journeys with multiple stages (e.g. Hospital, Labs).</p>
                  </button>
                </div>
              </div>

              <!-- Queue Behaviour -->
              <div class="dash-card" x-show="settingsTab === 'behaviour'">
                <div class="flex items-center gap-3 mb-5">
                  <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand flex items-center justify-center"><i class="fa-solid fa-gears"></i></div>
                  <div>
                    <h3 class="font-bold text-gray-900">Queue Behaviour</h3>
                    <p class="text-xs text-gray-400">Control queue processing and notifications</p>
                  </div>
                </div>
                <div class="space-y-4">
                  <div class="grid grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Notification Mode</label>
                      <select x-model="settingsForm.notificationMode" class="input-field">
                        <option value="all">All Notifications</option>
                        <option value="turn_only">Turn Only</option>
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Max Queue Size</label>
                      <input type="number" x-model="settingsForm.maxQueueSize" class="input-field" min="1" placeholder="100">
                    </div>
                  </div>
                  <div class="flex items-center gap-3 p-4 rounded-xl border border-gray-100 bg-gray-50/50 hover:bg-gray-50 transition-colors">
                    <input type="checkbox" x-model="settingsForm.autoCallNext" class="w-4 h-4 text-brand rounded border-gray-300 focus:ring-brand" id="autoCall">
                    <div>
                      <label for="autoCall" class="text-sm font-semibold text-gray-700 cursor-pointer">Auto-call next customer</label>
                      <p class="text-[11px] text-gray-400 mt-0.5">Automatically call the next waiting customer when the current one is marked as done</p>
                    </div>
                  </div>

                  <!--
                    AI wait-time prediction toggle (organization-level).
                    Mirrors the mobile/Expo OrgSettingsScreen toggle so the
                    web dashboard is at parity. Saves immediately on flip
                    via PUT /api/organizations/:id (no "Save settings"
                    button required) because the rest of this card is
                    branch-scoped and committing this one as part of the
                    branch save would be misleading.
                  -->
                  <div class="flex items-start gap-3 p-4 rounded-xl border border-gray-100 bg-gray-50/50 hover:bg-gray-50 transition-colors" x-show="currentUser.role === 'admin'">
                    <input
                      type="checkbox"
                      :checked="org && org.aiWaitPredictionEnabled !== false"
                      @change="toggleAiWaitPrediction($event.target.checked)"
                      :disabled="aiWaitPredictionSaving"
                      class="w-4 h-4 text-brand rounded border-gray-300 focus:ring-brand mt-0.5"
                      id="aiWaitPrediction"
                      data-testid="checkbox-ai-wait-prediction">
                    <div class="flex-1">
                      <label for="aiWaitPrediction" class="text-sm font-semibold text-gray-700 cursor-pointer flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-brand text-xs"></i>
                        AI wait-time predictions
                        <span x-show="aiWaitPredictionSaving" class="text-[10px] text-gray-400 font-normal">Saving…</span>
                      </label>
                      <p class="text-[11px] text-gray-400 mt-0.5" x-show="org && org.aiWaitPredictionEnabled !== false">Customers see a live ETA learned from your branch's actual service times. Auto-updates as the queue moves.</p>
                      <p class="text-[11px] text-gray-400 mt-0.5" x-show="org && org.aiWaitPredictionEnabled === false">Customers see the static service estimate (service duration × position).</p>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Announcement Devices -->
              <div class="dash-card" x-show="settingsTab === 'display'">
                <div class="flex items-center justify-between mb-5 gap-3">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand flex items-center justify-center"><i class="fa-solid fa-bullhorn"></i></div>
                    <div>
                      <h3 class="font-bold text-gray-900">Announcement Devices</h3>
                      <p class="text-xs text-gray-400">Dedicated speaker pages that auto-announce called tickets</p>
                    </div>
                  </div>
                  <label class="relative inline-flex items-center cursor-pointer" :title="branchAnnouncementsEnabled ? 'Broadcasting to all devices' : 'Player devices will not receive announcements'">
                    <input type="checkbox" x-model="branchAnnouncementsEnabled" @change="toggleBranchAnnouncements()" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-brand after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                    <span class="ml-2 text-xs font-bold" :class="branchAnnouncementsEnabled ? 'text-brand' : 'text-gray-400'" x-text="branchAnnouncementsEnabled ? 'ENABLED' : 'DISABLED'"></span>
                  </label>
                </div>

                <!-- Announcement language for this branch -->
                <div class="mb-4 p-4 rounded-xl border border-gray-100 bg-gradient-to-br from-brand-50/40 to-brand-50/10">
                  <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <i class="fa-solid fa-language text-brand"></i>
                      <div class="min-w-0">
                        <p class="text-sm font-bold text-gray-800">Announcement Language</p>
                        <p class="text-[11px] text-gray-500">Pick the language used when calling tickets at this branch</p>
                      </div>
                    </div>
                    <select :value="branchAnnouncementLanguage" @change="saveBranchAnnouncementLanguage($event.target.value)" :disabled="savingAnnLang" class="px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white font-semibold text-gray-700 disabled:opacity-50" data-testid="select-branch-announcement-language">
                      <template x-for="lang in SUPPORTED_LANGUAGES" :key="lang.code">
                        <option :value="lang.code" x-text="lang.label"></option>
                      </template>
                    </select>
                  </div>
                  <template x-if="branchAnnouncementLanguage !== 'en'">
                    <div class="flex items-center justify-between gap-3 p-3 rounded-lg bg-white/70 border border-gray-100">
                      <div class="min-w-0">
                        <p class="text-sm font-semibold text-gray-700">Also announce in English</p>
                        <p class="text-[11px] text-gray-500" x-text="branchAlsoAnnounceInEnglish ? 'Each call plays once in ' + languageLabel(branchAnnouncementLanguage) + ', then once in English.' : 'Each call plays twice in ' + languageLabel(branchAnnouncementLanguage) + '.'"></p>
                      </div>
                      <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" :checked="branchAlsoAnnounceInEnglish" @change="saveAlsoAnnounceInEnglish($event.target.checked)" :disabled="savingAnnLang" class="sr-only peer" data-testid="switch-also-announce-english">
                        <div class="w-10 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-brand after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                      </label>
                    </div>
                  </template>
                </div>

                <!-- Announcer (which logged-in staff device plays the audio) -->
                <div class="mb-4 p-4 rounded-xl border border-gray-100 bg-gradient-to-br from-brand-50/40 to-brand-50/10">
                  <div class="flex items-center justify-between gap-3 flex-wrap mb-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <i class="fa-solid fa-headset text-brand"></i>
                      <div class="min-w-0">
                        <p class="text-sm font-bold text-gray-800">Announcer Device</p>
                        <p class="text-[11px] text-gray-500">Pick a logged-in staff member — only their device will play the call audio</p>
                      </div>
                    </div>
                    <select :disabled="savingAnnouncer" @change="saveBranchAnnouncer($event.target.value)" class="px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white font-semibold text-gray-700 disabled:opacity-50 max-w-full" data-testid="select-branch-announcer">
                      <option value="" :selected="!branchAnnouncerUserId">None — no specific device</option>
                      <template x-for="u in branchStaffOptions" :key="u.id">
                        <option :value="u.id" :selected="u.id === branchAnnouncerUserId" x-text="u.name + (u.email ? ' (' + u.email + ')' : '')"></option>
                      </template>
                      <template x-if="branchAnnouncerUserId && !branchStaffOptions.some(u => u.id === branchAnnouncerUserId)">
                        <option :value="branchAnnouncerUserId" selected x-text="'Current: ' + branchAnnouncerLabel"></option>
                      </template>
                    </select>
                  </div>
                  <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-white/70 border border-gray-100">
                    <i class="fa-solid" :class="branchAnnouncerUserId ? 'fa-circle-check text-brand' : 'fa-circle-info text-gray-400'"></i>
                    <p class="text-[11px] text-gray-600 min-w-0 flex-1 truncate" x-text="branchAnnouncerLabel" data-testid="text-announcer-current"></p>
                  </div>
                  <template x-if="branchStaffOptions.length === 0">
                    <p class="text-[11px] text-amber-600 mt-2"><i class="fa-solid fa-triangle-exclamation mr-1"></i>No staff assigned to this branch yet — assign team members from the Staff page first.</p>
                  </template>
                </div>

                <!-- Add device row. New devices inherit the branch
                     announcement language above and the currently-selected
                     service scope from the page header (no service = device
                     receives every call at the branch). -->
                <div class="flex flex-col md:flex-row gap-2 mb-2 p-3 rounded-xl border border-dashed border-gray-200 bg-gray-50/40">
                  <input x-model="newDeviceName" type="text" placeholder="Device name (e.g. Reception Speaker)" maxlength="80" class="flex-1 px-3 py-2 rounded-lg border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-100 focus:border-brand" />
                  <button @click="createAnnouncementDevice()" :disabled="!newDeviceName.trim() || creatingDevice" class="px-4 py-2 rounded-lg bg-brand text-white text-sm font-bold hover:bg-brand-dark disabled:opacity-50 disabled:cursor-not-allowed transition">
                    <i class="fa-solid fa-plus mr-1"></i> Add device
                  </button>
                </div>
                <p class="text-[11px] text-gray-500 mb-4 px-1">
                  <i class="fa-solid fa-circle-info text-brand-400 mr-1"></i>
                  New device language follows the <span class="font-bold">Announcement Language</span> above. Scope:
                  <template x-if="settingsServiceFilter">
                    <span class="font-bold text-blue-600" x-text="(selectedBranch?.services || []).find(s => s.id === settingsServiceFilter)?.name || 'Selected service'"></span>
                  </template>
                  <template x-if="!settingsServiceFilter">
                    <span class="font-bold">All services at this branch</span>
                  </template>.
                </p>

                <!-- Loading -->
                <template x-if="loadingDevices">
                  <div class="text-center py-6 text-gray-400 text-sm"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Loading devices...</div>
                </template>

                <!-- Empty state -->
                <template x-if="!loadingDevices && announcementDevices.length === 0">
                  <div class="text-center py-8 text-gray-400">
                    <i class="fa-solid fa-volume-off text-3xl mb-2 text-gray-300"></i>
                    <p class="text-sm">No announcement devices yet. Add one above to get started.</p>
                  </div>
                </template>

                <!-- Device list -->
                <template x-if="!loadingDevices && announcementDevices.length > 0">
                  <div class="space-y-3">
                    <template x-for="dev in announcementDevices" :key="dev.id">
                      <div class="p-4 rounded-xl border border-gray-100 bg-white hover:border-brand-100 transition-colors">
                        <!-- Header: device name + scope/language/state badges + lifecycle actions -->
                        <div class="flex flex-col md:flex-row md:items-center gap-3 mb-3">
                          <div class="flex items-center gap-3 flex-1 min-w-0">
                            <div class="w-9 h-9 rounded-lg flex items-center justify-center text-sm shrink-0" :class="dev.isActive ? 'bg-brand-50 text-brand' : 'bg-gray-100 text-gray-400'">
                              <i class="fa-solid fa-volume-high"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                              <div class="flex items-center gap-2 flex-wrap">
                                <p class="text-sm font-bold text-gray-800 truncate" x-text="dev.deviceName"></p>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase bg-brand-50 text-brand" x-text="languageLabel(dev.language)"></span>
                                <template x-if="dev.serviceId">
                                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase bg-blue-50 text-blue-600" x-text="(selectedBranch?.services || []).find(s => s.id === dev.serviceId)?.name || 'Service'"></span>
                                </template>
                                <template x-if="!dev.serviceId">
                                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase bg-gray-100 text-gray-500">All services</span>
                                </template>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase" :class="dev.isActive ? 'bg-brand-50 text-brand' : 'bg-gray-100 text-gray-500'" x-text="dev.isActive ? 'Active' : 'Paused'"></span>
                              </div>
                            </div>
                          </div>
                          <div class="flex items-center gap-1.5 flex-wrap">
                            <button @click="toggleDeviceActive(dev)" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition" :class="dev.isActive ? 'bg-amber-50 text-amber-600 hover:bg-amber-100' : 'bg-brand-50 text-brand hover:bg-brand-100'" :title="dev.isActive ? 'Pause' : 'Resume'">
                              <i class="fa-solid" :class="dev.isActive ? 'fa-pause' : 'fa-play'"></i>
                            </button>
                            <button @click="regenerateDeviceToken(dev)" class="px-2.5 py-1.5 rounded-lg bg-gray-50 text-gray-600 text-xs font-bold hover:bg-gray-100 transition" title="Regenerate URL token (current links will stop working)"><i class="fa-solid fa-arrows-rotate"></i></button>
                            <button @click="deleteAnnouncementDevice(dev)" class="px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 text-xs font-bold hover:bg-red-100 transition" title="Delete device"><i class="fa-solid fa-trash"></i></button>
                          </div>
                        </div>

                        <!-- URL rows: bigger, readable URL with inline copy / open buttons -->
                        <div class="space-y-2">
                          <!-- Audio link -->
                          <div class="flex items-center gap-2 p-2.5 rounded-lg bg-brand-50/40 border border-brand-100/60">
                            <div class="flex items-center gap-2 shrink-0">
                              <div class="w-7 h-7 rounded-md bg-brand-100 text-brand flex items-center justify-center"><i class="fa-solid fa-volume-high text-xs"></i></div>
                              <span class="text-xs font-bold text-brand-700 uppercase tracking-wider">Audio</span>
                            </div>
                            <code class="flex-1 px-3 py-2 rounded-md bg-white border border-brand-100/40 text-sm font-mono text-gray-700 truncate" x-text="playerUrlFor(dev)" :title="playerUrlFor(dev)"></code>
                            <button @click="copyPlayerUrl(dev)" class="w-9 h-9 rounded-md bg-white border border-brand-100/60 text-brand hover:bg-brand-100 transition flex items-center justify-center shrink-0" title="Copy audio link"><i class="fa-solid fa-copy text-sm"></i></button>
                            <button @click="openPlayerUrl(dev)" class="w-9 h-9 rounded-md bg-brand text-white hover:bg-brand-dark transition flex items-center justify-center shrink-0" title="Open audio player in new tab"><i class="fa-solid fa-arrow-up-right-from-square text-sm"></i></button>
                          </div>
                          <!-- TV link -->
                          <div class="flex items-center gap-2 p-2.5 rounded-lg bg-blue-50/40 border border-blue-100/60">
                            <div class="flex items-center gap-2 shrink-0">
                              <div class="w-7 h-7 rounded-md bg-blue-100 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-tv text-xs"></i></div>
                              <span class="text-xs font-bold text-blue-700 uppercase tracking-wider">TV</span>
                            </div>
                            <code class="flex-1 px-3 py-2 rounded-md bg-white border border-blue-100/40 text-sm font-mono text-gray-700 truncate" x-text="tvUrlFor(dev)" :title="tvUrlFor(dev)"></code>
                            <button @click="copyTvUrl(dev)" class="w-9 h-9 rounded-md bg-white border border-blue-100/60 text-blue-600 hover:bg-blue-100 transition flex items-center justify-center shrink-0" title="Copy TV link"><i class="fa-solid fa-copy text-sm"></i></button>
                            <button @click="openTvUrl(dev)" class="w-9 h-9 rounded-md bg-blue-600 text-white hover:bg-blue-700 transition flex items-center justify-center shrink-0" title="Open TV display in new tab"><i class="fa-solid fa-arrow-up-right-from-square text-sm"></i></button>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <!-- Operations Alerts -->
              <div class="dash-card" data-testid="card-operations-alerts" x-show="settingsTab === 'alerts'">
                <div class="flex items-center justify-between mb-5 gap-3">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand flex items-center justify-center"><i class="fa-solid fa-bell"></i></div>
                    <div>
                      <h3 class="font-bold text-gray-900">Operations Alerts</h3>
                      <p class="text-xs text-gray-400">Notify team members when the queue opens/closes or thresholds are exceeded</p>
                    </div>
                  </div>
                </div>

                <!-- Thresholds -->
                <div class="mb-4 p-4 rounded-xl border border-gray-100 bg-gradient-to-br from-brand-50/40 to-brand-50/10">
                  <div class="flex items-center gap-2.5 mb-3">
                    <i class="fa-solid fa-gauge text-brand"></i>
                    <div class="min-w-0">
                      <p class="text-sm font-bold text-gray-800">Alert Thresholds</p>
                      <p class="text-[11px] text-gray-500">Trigger when value exceeds Max. Re-arm only after dropping below Min (hysteresis).</p>
                    </div>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="p-3 rounded-lg bg-white/70 border border-gray-100">
                      <p class="text-[11px] font-bold uppercase text-gray-500 mb-2">Waiting count (people)</p>
                      <div class="flex items-center gap-2">
                        <div class="flex-1">
                          <label class="text-[10px] text-gray-500">Max (alert)</label>
                          <input type="number" min="0" x-model.number="alertThresholds.waitingCountMax" class="w-full px-2 py-1.5 rounded-lg border border-gray-200 text-sm" data-testid="input-threshold-waiting-max" />
                        </div>
                        <div class="flex-1">
                          <label class="text-[10px] text-gray-500">Min (re-arm)</label>
                          <input type="number" min="0" x-model.number="alertThresholds.waitingCountMin" class="w-full px-2 py-1.5 rounded-lg border border-gray-200 text-sm" data-testid="input-threshold-waiting-min" />
                        </div>
                      </div>
                    </div>
                    <div class="p-3 rounded-lg bg-white/70 border border-gray-100">
                      <p class="text-[11px] font-bold uppercase text-gray-500 mb-2">Average wait time (minutes)</p>
                      <div class="flex items-center gap-2">
                        <div class="flex-1">
                          <label class="text-[10px] text-gray-500">Max (alert)</label>
                          <input type="number" min="0" x-model.number="alertThresholds.avgWaitTimeMaxMinutes" class="w-full px-2 py-1.5 rounded-lg border border-gray-200 text-sm" data-testid="input-threshold-avgwait-max" />
                        </div>
                        <div class="flex-1">
                          <label class="text-[10px] text-gray-500">Min (re-arm)</label>
                          <input type="number" min="0" x-model.number="alertThresholds.avgWaitTimeMinMinutes" class="w-full px-2 py-1.5 rounded-lg border border-gray-200 text-sm" data-testid="input-threshold-avgwait-min" />
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="mt-3 flex justify-end">
                    <button @click="saveAlertThresholds()" :disabled="savingAlertThresholds" class="px-3 py-1.5 rounded-lg bg-brand text-white text-xs font-bold hover:bg-brand-dark disabled:opacity-50" data-testid="button-save-thresholds">
                      <i class="fa-solid fa-save mr-1"></i> Save thresholds
                    </button>
                  </div>
                </div>

                <!-- Add recipient row -->

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-2">
                    <input x-model="newAlertRecipient.name" type="text" placeholder="Recipient name (e.g. Branch Manager)" maxlength="80" class="px-3 py-2 rounded-lg border border-gray-200 text-sm" data-testid="input-recipient-name" />

                  <div class="mb-2">
                    <select x-model="newAlertRecipient.userId" class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm bg-white" data-testid="select-recipient-user">

                      <template x-for="m in alertTeamMembers" :key="m.id">

                    </select>
                  </div>
                  <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-2 text-sm">

                      <input type="checkbox" x-model="newAlertRecipient.sendViaWhatsapp" class="rounded border-gray-300 text-brand" data-testid="checkbox-recipient-wa" />
                      <span><i class="fa-brands fa-whatsapp text-brand"></i> WhatsApp</span>
                    </label>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer">
                      <input type="checkbox" x-model="newAlertRecipient.sendViaPush" class="rounded border-gray-300 text-brand" data-testid="checkbox-recipient-push" />
                      <span><i class="fa-solid fa-mobile-screen text-brand"></i> Mobile app push</span>
                    </label>
                  </div>
                  <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-3 text-sm">
                    <span class="font-bold text-gray-500 uppercase text-xs">Triggers:</span>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer">
                      <input type="checkbox" x-model="newAlertRecipient.alertOnQueueOpenClose" class="rounded border-gray-300" />
                      <span>Queue opens/closes</span>
                    </label>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer">
                      <input type="checkbox" x-model="newAlertRecipient.alertOnWaitingCountMax" class="rounded border-gray-300" />
                      <span>Waiting &gt; max</span>
                    </label>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer">
                      <input type="checkbox" x-model="newAlertRecipient.alertOnAvgWaitTimeMax" class="rounded border-gray-300" />
                      <span>Avg wait &gt; max</span>
                    </label>
                  </div>
                  <div class="flex justify-end">
                    <button @click="createAlertRecipient()" :disabled="creatingRecipient || !newAlertRecipient.name.trim()" class="px-4 py-2 rounded-lg bg-brand text-white text-sm font-bold hover:bg-brand-dark disabled:opacity-50" data-testid="button-add-recipient">
                      <i class="fa-solid fa-plus mr-1"></i> Add recipient
                    </button>
                  </div>
                </div>

                <!-- Loading -->
                <template x-if="loadingAlertRecipients">
                  <div class="text-center py-6 text-gray-400 text-sm"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Loading recipients...</div>

                <!-- Empty state -->
                <template x-if="!loadingAlertRecipients && alertRecipients.length === 0">
                  <div class="text-center py-8 text-gray-400">
                    <i class="fa-regular fa-bell-slash text-3xl mb-2 text-gray-300"></i>
                    <p class="text-sm">No alert recipients yet. Add a team member to start receiving alerts.</p>
                  </div>
                </template>

                <!-- Recipient list -->
                <template x-if="!loadingAlertRecipients && alertRecipients.length > 0">
                  <div class="space-y-2">
                    <template x-for="r in alertRecipients" :key="r.id">
                      <div class="p-3 rounded-xl border border-gray-100 bg-white hover:border-brand-100 transition-colors" :data-testid="'row-recipient-' + r.id">
                        <div class="flex items-start gap-3">
                          <div class="w-9 h-9 rounded-lg flex items-center justify-center text-sm flex-shrink-0" :class="r.isActive ? 'bg-brand-50 text-brand' : 'bg-gray-100 text-gray-400'">
                            <i class="fa-solid fa-user-bell"></i>
                          </div>
                          <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 flex-wrap mb-1">
                              <p class="text-sm font-bold text-gray-800 truncate" x-text="r.name"></p>
                              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase" :class="r.isActive ? 'bg-brand-50 text-brand' : 'bg-gray-100 text-gray-500'" x-text="r.isActive ? 'Active' : 'Paused'"></span>
                              <template x-if="r.userId">
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded uppercase bg-brand-50 text-brand" x-text="alertUserLabel(r.userId)"></span>
                              </template>
                            </div>
                            <div class="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-gray-500 mb-2">
                              <template x-if="r.phoneNumber"><span><i class="fa-brands fa-whatsapp mr-1 text-brand"></i><span x-text="r.phoneNumber"></span></span></template>
                              <template x-if="r.sendViaPush"><span><i class="fa-solid fa-mobile-screen mr-1 text-brand"></i>Mobile app push</span></template>
                            </div>
                            <div class="flex flex-wrap gap-x-4 gap-y-1.5 text-[11px]">
                              <label class="inline-flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" :checked="r.sendViaWhatsapp" @change="updateAlertRecipient(r, { sendViaWhatsapp: $event.target.checked })" class="rounded border-gray-300 text-brand" />
                                <span class="text-gray-600"><i class="fa-brands fa-whatsapp text-brand"></i> WhatsApp</span>
                              </label>
                              <label class="inline-flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" :checked="r.sendViaPush" @change="updateAlertRecipient(r, { sendViaPush: $event.target.checked })" class="rounded border-gray-300 text-brand" />
                                <span class="text-gray-600"><i class="fa-solid fa-mobile-screen text-brand"></i> Push</span>
                              </label>
                              <span class="text-gray-300">|</span>
                              <label class="inline-flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" :checked="r.alertOnQueueOpenClose" @change="updateAlertRecipient(r, { alertOnQueueOpenClose: $event.target.checked })" class="rounded border-gray-300" />
                                <span class="text-gray-600">Open/Close</span>
                              </label>
                              <label class="inline-flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" :checked="r.alertOnWaitingCountMax" @change="updateAlertRecipient(r, { alertOnWaitingCountMax: $event.target.checked })" class="rounded border-gray-300" />
                                <span class="text-gray-600">Waiting</span>
                              </label>
                              <label class="inline-flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" :checked="r.alertOnAvgWaitTimeMax" @change="updateAlertRecipient(r, { alertOnAvgWaitTimeMax: $event.target.checked })" class="rounded border-gray-300" />
                                <span class="text-gray-600">Avg wait</span>
                              </label>
                            </div>
                          </div>
                          <div class="flex items-center gap-1.5 flex-wrap flex-shrink-0">
                            <button @click="testAlertRecipient(r)" class="px-2.5 py-1.5 rounded-lg bg-brand-50 text-brand text-xs font-bold hover:bg-brand-100 transition" title="Send a test alert" :data-testid="'button-test-recipient-' + r.id"><i class="fa-solid fa-paper-plane mr-1"></i>Test</button>
                            <button @click="updateAlertRecipient(r, { isActive: !r.isActive })" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition" :class="r.isActive ? 'bg-amber-50 text-amber-600 hover:bg-amber-100' : 'bg-brand-50 text-brand hover:bg-brand-100'" :title="r.isActive ? 'Pause' : 'Resume'">
                              <i class="fa-solid" :class="r.isActive ? 'fa-pause' : 'fa-play'"></i>
                            </button>
                            <button @click="deleteAlertRecipient(r)" class="px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 text-xs font-bold hover:bg-red-100 transition" title="Remove recipient" :data-testid="'button-delete-recipient-' + r.id"><i class="fa-solid fa-trash"></i></button>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <!-- API Integration -->
              <div class="dash-card" x-show="settingsTab === 'integrations'">
                <div class="flex items-center gap-3 mb-5">
                  <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand flex items-center justify-center"><i class="fa-solid fa-code"></i></div>
                  <div>
                    <h3 class="font-bold text-gray-900">API Integration</h3>
                    <p class="text-xs text-gray-400">Connect external systems to your queue</p>
                  </div>
                </div>
                <div class="space-y-3">
                  <div class="flex items-center justify-between p-4 rounded-xl border border-gray-100 bg-gray-50/50 hover:bg-gray-50 transition-colors">
                    <div class="flex items-center gap-3">
                      <div class="w-8 h-8 rounded-lg bg-brand-50 text-brand flex items-center justify-center"><i class="fa-solid fa-plug text-sm"></i></div>
                      <div>
                        <p class="text-sm font-semibold text-gray-700">Enable API Access</p>
                        <p class="text-[11px] text-gray-400">Allow third-party systems to interact with your queue</p>
                      </div>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" x-model="settingsForm.apiEnabled" class="sr-only peer">
                      <div class="w-10 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-brand after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                    </label>
                  </div>
                  <div x-show="settingsForm.apiEnabled" x-transition class="space-y-3">
                    <div class="p-4 rounded-xl border border-gray-100 bg-white">
                      <div class="flex items-center justify-between mb-3">
                        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">API Key</p>
                        <button @click="generateApiKey()" class="text-[11px] font-bold text-brand hover:text-brand-dark transition-colors"><i class="fa-solid fa-arrows-rotate mr-1"></i>Regenerate</button>
                      </div>
                      <div class="flex items-center gap-2">
                        <code class="flex-1 px-3 py-2.5 rounded-lg bg-gray-50 border border-gray-200 text-xs font-mono text-gray-600 truncate" x-text="settingsForm.apiKey || 'No key generated'"></code>
                        <button x-show="settingsForm.apiKey" @click="navigator.clipboard.writeText(settingsForm.apiKey); showToast('API key copied!', 'success')" class="px-3 py-2.5 rounded-lg bg-brand-50 text-brand text-xs font-bold hover:bg-brand-100 transition-colors"><i class="fa-solid fa-copy"></i></button>
                      </div>
                    </div>
                    <div x-show="settingsForm.apiSecret" class="p-4 rounded-xl border border-gray-100 bg-white">
                      <div class="flex items-center justify-between mb-3">
                        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">API Secret</p>
                        <button @click="showApiSecret = !showApiSecret" class="text-[11px] font-bold text-gray-400 hover:text-gray-600 transition-colors" x-text="showApiSecret ? 'Hide' : 'Show'"></button>
                      </div>
                      <code class="block px-3 py-2.5 rounded-lg bg-gray-50 border border-gray-200 text-xs font-mono text-gray-600 truncate" x-text="showApiSecret ? settingsForm.apiSecret : '••••••••••••••••••••'"></code>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ===== MESSAGES TAB (WhatsApp templates) ===== -->
              <div x-show="settingsTab === 'messages'" class="space-y-5">

                <!-- Templates card -->
                <div class="dash-card-flat">
                  <div class="px-6 py-5 border-b border-gray-100 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                      <div class="w-11 h-11 rounded-xl bg-brand-50 text-brand flex items-center justify-center"><i class="fa-brands fa-whatsapp text-lg"></i></div>
                      <div>
                        <p class="text-[10px] font-bold tracking-wider text-gray-400 uppercase">Active queue mode</p>
                        <h3 class="font-bold text-gray-900 leading-tight" x-text="waModeLabel(waOrgMode)"></h3>
                        <p class="text-xs text-gray-400 mt-0.5" x-show="!selectedBranch">Select a branch first to load its messages.</p>
                      </div>
                    </div>
                    <div class="text-xs text-gray-500">
                      <span x-text="waCurrentTriggers().length"></span> templates ·
                      <span class="font-semibold" x-text="waModifiedCount() + ' modified'"></span>
                    </div>
                  </div>

                  <!-- Language pills -->
                  <div class="px-6 py-4 border-b border-gray-100 flex flex-wrap items-center gap-2">
                    <span class="text-[10px] font-bold tracking-wider text-gray-500 uppercase mr-1">Language:</span>
                    <template x-for="l in waLanguages" :key="l.code">
                      <button
                        @click="waLang = l.code"
                        :class="`px-3 py-1.5 rounded-full text-xs font-semibold border transition ${waLang === l.code ? 'bg-brand text-white border-brand' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-300'}`">
                        <span x-text="l.flag + ' ' + l.label"></span>
                      </button>
                    </template>
                  </div>

                  <!-- Templates table -->
                  <div class="overflow-x-auto">
                    <table class="w-full">
                      <thead>
                        <tr>
                          <th class="table-header w-12">S. No.</th>
                          <th class="table-header w-48">Trigger Point</th>
                          <th class="table-header">Message Content</th>
                          <th class="table-header w-28">Status</th>
                          <th class="table-header w-16"></th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-gray-50">
                        <template x-for="(t, idx) in waCurrentTriggers()" :key="t.key">
                          <tr class="hover:bg-brand-50/20 transition-colors">
                            <td class="table-cell text-gray-400" x-text="idx + 1"></td>
                            <td class="table-cell font-semibold text-gray-900" x-text="t.label"></td>
                            <td class="table-cell">
                              <div class="text-sm text-gray-700 line-clamp-2" style="max-width: 720px;"
                                   :dir="waLang === 'ar' ? 'rtl' : 'ltr'"
                                   x-text="waGetTemplate(waOrgMode, t.key, waLang)"></div>
                            </td>
                            <td class="table-cell">
                              <span class="badge"
                                    :class="waIsModified(waOrgMode, t.key, waLang) ? 'bg-amber-50 text-amber-600 border border-amber-200' : 'bg-gray-50 text-gray-500 border border-gray-200'"
                                    x-text="waIsModified(waOrgMode, t.key, waLang) ? 'Modified' : 'Default'"></span>
                            </td>
                            <td class="table-cell text-right">
                              <button @click="waOpenEdit(t)" class="w-9 h-9 rounded-lg bg-gray-50 hover:bg-brand-50 hover:text-brand text-gray-500 inline-flex items-center justify-center" title="Edit template">
                                <i class="fa-solid fa-pen text-xs"></i>
                              </button>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <div x-show="waCurrentTriggers().length === 0" class="text-center py-12">
                      <div class="w-14 h-14 mx-auto rounded-2xl bg-gray-50 flex items-center justify-center mb-3"><i class="fa-brands fa-whatsapp text-xl text-gray-300"></i></div>
                      <p class="text-sm font-semibold text-gray-400">No message triggers for this queue mode</p>
                    </div>
                  </div>
                </div>

                <!-- Quick reference chips -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                  <div class="rounded-xl border border-gray-100 bg-white p-3.5">
                    <div class="text-xs font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-code text-brand"></i> Dynamic variables</div>
                    <div class="text-[11px] text-gray-500 mt-1 leading-relaxed">Use placeholders like <code class="text-brand font-mono">{{customer_name}}</code></div>
                  </div>
                  <div class="rounded-xl border border-gray-100 bg-white p-3.5">
                    <div class="text-xs font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-paper-plane text-brand"></i> Auto send</div>
                    <div class="text-[11px] text-gray-500 mt-1 leading-relaxed">Messages are sent automatically on queue events</div>
                  </div>
                  <div class="rounded-xl border border-gray-100 bg-white p-3.5">
                    <div class="text-xs font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-rotate-left text-brand"></i> Reset feature</div>
                    <div class="text-[11px] text-gray-500 mt-1 leading-relaxed">Restore any template to its default content</div>
                  </div>
                  <div class="rounded-xl border border-gray-100 bg-white p-3.5">
                    <div class="text-xs font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-circle-check text-brand"></i> Status indicator</div>
                    <div class="text-[11px] text-gray-500 mt-1 leading-relaxed">See which templates are modified</div>
                  </div>
                </div>

                <!-- Edit modal (lives inside settings page so it disappears on navigation) -->
                <div x-show="waEditOpen" x-transition.opacity
                     class="fixed inset-0 z-40 flex items-center justify-center p-4"
                     @keydown.escape.window="waCloseEdit()">
                  <div class="absolute inset-0"
                       style="background: rgba(15,23,42,0.5); backdrop-filter: blur(4px);"
                       @click="waCloseEdit()"></div>
                  <div class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                      <div>
                        <div class="text-[10px] font-bold tracking-wider text-gray-500 uppercase" x-text="waModeLabel(waOrgMode) + ' · ' + waLangLabel(waLang)"></div>
                        <h3 class="text-lg font-bold text-gray-900" x-text="waEditing ? waEditing.label : ''"></h3>
                      </div>
                      <button @click="waCloseEdit()" class="w-9 h-9 rounded-lg hover:bg-gray-50 text-gray-400 inline-flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                      </button>
                    </div>
                    <div class="px-6 py-5 space-y-4">
                      <div>
                        <div class="text-[10px] font-bold tracking-wider text-gray-500 uppercase mb-2">Available variables · click to insert</div>
                        <div class="flex flex-wrap gap-2">
                          <template x-for="v in waCurrentVariables()" :key="v">
                            <button @click="waInsertVariable(v)"
                                    class="px-2.5 py-1 rounded-md bg-brand-50 text-brand text-xs font-mono font-semibold hover:bg-brand hover:text-white transition"
                                    x-text="'{{' + v + '}}'"></button>
                          </template>
                        </div>
                      </div>
                      <div>
                        <div class="text-[10px] font-bold tracking-wider text-gray-500 uppercase mb-2">Message content</div>
                        <textarea
                          x-ref="waOrgTextarea"
                          x-model="waEditDraft"
                          rows="8"
                          class="input-field w-full font-mono text-sm leading-relaxed"
                          style="resize: vertical; min-height: 180px;"
                          :dir="waLang === 'ar' ? 'rtl' : 'ltr'"></textarea>
                        <div class="mt-2 text-xs text-gray-500">
                          Tip: WhatsApp supports <code>*bold*</code>, <code>_italic_</code> and emojis. Variables look like <code class="text-brand">{{customer_name}}</code>.
                        </div>
                      </div>
                      <div class="rounded-xl border border-gray-100 bg-gray-50 p-3">
                        <div class="text-[10px] font-bold tracking-wider text-gray-500 uppercase mb-2">Preview (with sample data)</div>
                        <div class="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed"
                             :dir="waLang === 'ar' ? 'rtl' : 'ltr'"
                             x-text="waRenderPreview(waEditDraft)"></div>
                      </div>
                    </div>
                    <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-between gap-2">
                      <button @click="waResetEdit()" class="btn-secondary text-xs">
                        <i class="fa-solid fa-rotate-left mr-1.5"></i>Reset to default
                      </button>
                      <div class="flex gap-2">
                        <button @click="waCloseEdit()" class="btn-secondary text-xs">Cancel</button>
                        <button @click="waSaveEdit()" class="btn-primary text-xs">
                          <i class="fa-solid fa-check mr-1.5"></i>Save
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <!-- REPORTS PAGE -->
          <div x-show="currentPage === 'reports'" x-transition>

            <!-- Page Header -->
            <div class="flex items-center justify-between mb-6">
              <div>
                <h2 class="text-xl font-black text-gray-900">Reports & Analytics</h2>
                <p class="text-xs text-gray-400 mt-0.5">Analyze your queue performance, staff productivity, and customer insights</p>
              </div>
              <div x-show="reportData" class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[11px] font-bold border" :class="{
                  'bg-gray-50 text-gray-600 border-gray-200': reportQueueMode === 'all',
                  'bg-blue-50 text-blue-700 border-blue-200': reportQueueMode === 'fifo',
                  'bg-violet-50 text-violet-700 border-violet-200': reportQueueMode === 'selective',
                  'bg-purple-50 text-purple-700 border-purple-200': reportIsDineIn,
                  'bg-orange-50 text-orange-700 border-orange-200': reportIsTakeaway,
                  'bg-cyan-50 text-cyan-700 border-cyan-200': reportIsMultiStage,
                  'bg-teal-50 text-teal-700 border-teal-200': reportIsCheckin
                }">
                  <i class="fa-solid" :class="{
                    'fa-globe': reportQueueMode === 'all',
                    'fa-list-ol': reportQueueMode === 'fifo',
                    'fa-hand-pointer': reportQueueMode === 'selective',
                    'fa-utensils': reportIsDineIn,
                    'fa-bag-shopping': reportIsTakeaway,
                    'fa-layer-group': reportIsMultiStage,
                    'fa-location-dot': reportIsCheckin
                  }"></i>
                  <span x-text="reportQueueMode === 'all' ? 'All Branches' : reportModeLabel + ' Mode'"></span>
                </span>
              </div>
            </div>

            <!-- Filters Bar -->
            <div class="dash-card mb-6" style="border-top: 3px solid #8c1867;">
              <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 items-end">
                <div>
                  <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Start Date</label>
                  <input type="date" x-model="reportFilters.startDate" class="input-field text-sm w-full h-10">
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">End Date</label>
                  <input type="date" x-model="reportFilters.endDate" class="input-field text-sm w-full h-10">
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Branch</label>
                  <select x-model="reportFilters.branchId" @change="onReportBranchChange()" class="input-field text-sm w-full h-10">
                    <option value="">All Branches</option>
                    <template x-for="b in reportFilterOptions.branches" :key="b.id">
                      <option :value="b.id" x-text="b.name"></option>
                    </template>
                  </select>
                </div>
                <div x-show="reportFilterOptions.services.length > 0">
