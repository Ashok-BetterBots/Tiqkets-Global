                  </div>
                  <div class="p-4 rounded-xl border border-gray-200 bg-white">
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Max Bookings Per Slot</label>
                    <input type="number" x-model.number="slotCapacity" @change="saveSlotSettings()" class="w-full px-3 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm font-bold text-gray-700 focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none" min="1" max="100" placeholder="3">
                  </div>
                </div>

                <div class="flex gap-2 mb-5 overflow-x-auto pb-1">
                  <template x-for="(day, idx) in ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']" :key="idx">
                    <button @click="selectedSlotDay = idx" class="px-4 py-2 rounded-lg text-xs font-bold transition-all whitespace-nowrap" :class="selectedSlotDay === idx ? 'bg-brand text-white shadow-sm' : (getOperatingHourByDay(idx)?.isOpen ? 'bg-gray-100 text-gray-600 hover:bg-gray-200' : 'bg-gray-50 text-gray-300 cursor-not-allowed')" :disabled="!getOperatingHourByDay(idx)?.isOpen">
                      <span x-text="day"></span>
                    </button>
                  </template>
                </div>
                <!-- Time slot grid -->
                <div x-show="getOperatingHourByDay(selectedSlotDay)?.isOpen">
                  <div class="flex items-center gap-4 mb-3">
                    <div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded bg-green-100 border border-green-300"></div><span class="text-[10px] font-semibold text-gray-500">Available</span></div>

                        <p class="text-[9px] font-medium mt-0.5 opacity-70" x-text="slot.isBreak ? 'Break' : isSlotBlocked(selectedSlotDay, slot.time) ? 'Blocked' : 'Open'"></p>

                  </div>
                </div>

                        <td class="table-cell text-xs font-semibold text-gray-700" x-text="appt.timeSlot || '-'"></td>
                        <td class="table-cell">
                          <span class="badge" :class="{
                            'bg-amber-50 text-amber-600 border border-amber-200': appt.status === 'booked',
                            'bg-green-50 text-green-600 border border-green-200': appt.status === 'checked_in',
                            'bg-red-50 text-red-600 border border-red-200': appt.status === 'cancelled',
                            'bg-gray-100 text-gray-500 border border-gray-200': appt.status === 'completed'

          <div>
            <div class="flex items-center justify-between mb-3">
              <label class="text-sm font-semibold text-gray-700">Stages</label>
              <button @click="journeyForm.stages.push({ serviceName: '', isOptional: false, stageOrder: journeyForm.stages.length + 1 })" class="text-xs text-brand font-bold hover:text-brand-dark transition-colors"><i class="fa-solid fa-plus mr-1"></i>Add Stage</button>
            </div>
            <div class="space-y-2">
              <template x-for="(stage, idx) in journeyForm.stages" :key="idx">
                <div class="flex items-center gap-2.5 p-3 bg-gray-50/80 rounded-xl border border-gray-100">
                  <div class="w-7 h-7 rounded-lg bg-brand-50 text-brand flex items-center justify-center text-xs font-bold flex-shrink-0" x-text="idx + 1"></div>
                  <input x-model="stage.serviceName" class="input-field flex-1 text-sm" placeholder="Stage name (e.g. Doctor, Lab, Pharmacy)">
                  <label class="flex items-center gap-1.5 text-xs text-gray-500 whitespace-nowrap cursor-pointer">
                    <input type="checkbox" x-model="stage.isOptional" class="w-3.5 h-3.5 text-brand rounded border-gray-300">Optional
                  </label>
                  <button @click="journeyForm.stages.splice(idx, 1)" class="w-7 h-7 rounded-lg hover:bg-red-50 text-gray-300 hover:text-red-500 flex items-center justify-center transition-colors"><i class="fa-solid fa-times text-xs"></i></button>
                </div>
              </template>
            </div>
          </div>
        </div>
        <div class="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50/50">
          <button @click="showJourneyModal = false" class="btn-secondary">Cancel</button>
          <button @click="saveJourney()" class="btn-primary" x-text="journeyForm.id ? 'Update Journey' : 'Create Journey'"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- QR CODE MODAL (global scope) -->
  <div x-show="showQRModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" x-transition @click.self="showQRModal = false">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-bold text-gray-900">Download QR Code</h3>
        <button @click="showQRModal = false" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-gray-400 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="text-center mb-5">
        <div class="w-48 h-48 mx-auto bg-white rounded-xl border-2 border-gray-100 p-2 mb-3">
          <img :src="'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(window.location.origin + '/join/' + (qrBranch?.id || '')) + '&margin=20&format=png'" class="w-full h-full" alt="QR Code">
        </div>
        <p class="text-sm font-bold text-gray-900" x-text="qrBranch?.name || ''"></p>
        <p class="text-[11px] text-gray-400 mt-0.5">Scan to join the queue</p>
      </div>
      <div class="space-y-2 mb-5">
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Download Format</p>
        <div class="grid grid-cols-3 gap-2">
          <button @click="qrFormat = 'png'" class="p-2.5 rounded-xl border-2 text-xs font-bold text-center transition-all" :class="qrFormat === 'png' ? 'border-brand bg-brand-50/40 text-brand' : 'border-gray-100 text-gray-500 hover:border-gray-200'">PNG</button>
          <button @click="qrFormat = 'jpeg'" class="p-2.5 rounded-xl border-2 text-xs font-bold text-center transition-all" :class="qrFormat === 'jpeg' ? 'border-brand bg-brand-50/40 text-brand' : 'border-gray-100 text-gray-500 hover:border-gray-200'">JPEG</button>
          <button @click="qrFormat = 'pdf'" class="p-2.5 rounded-xl border-2 text-xs font-bold text-center transition-all" :class="qrFormat === 'pdf' ? 'border-brand bg-brand-50/40 text-brand' : 'border-gray-100 text-gray-500 hover:border-gray-200'">PDF</button>
        </div>
      </div>
      <div class="flex gap-2">
        <button @click="showQRModal = false" class="flex-1 py-3 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition-all">Cancel</button>
        <button @click="downloadQR()" class="btn-primary flex-1 justify-center">
          <i class="fa-solid fa-download"></i>
          <span>Download</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const BASE = '';

    async function api(path, options = {}) {
      const res = await fetch(BASE + path, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: 'Request failed' }));
        throw new Error(err.error || 'Request failed');
      }
      return res.json();
    }

    function dashboard() {
      return {
        loggedIn: false,
        org: null,
        authMode: 'signin',
        loginForm: { email: '', password: '' },
        loginError: '',
        loginLoading: false,
        registerForm: { name: '', email: '', phone: '', password: '', category: '', city: '', state: '', address: '' },
        registerError: '',
        registerLoading: false,
        currentPage: 'overview',
        toast: { show: false, message: '', type: 'success' },
        currentUser: { id: null, role: 'admin', name: '', email: '', branchId: '', branchIds: [], assignedServiceIds: [], profilePictureUrl: '' },
        showUserPassword: false,
        showProfileModal: false,
        profileForm: {},
        profilePasswordForm: { currentPassword: '', newPassword: '', confirmPassword: '' },
        profileSaving: false,
        profilePictureSaving: false,

        get visibleMenuItems() {
            const role = this.currentUser?.role || 'admin';
            const allItems = [
                { id: 'overview', label: 'Overview', icon: 'fa-solid fa-chart-pie', roles: ['admin', 'location_manager'] },
                { id: 'queue', label: 'Queue', icon: 'fa-solid fa-list-ol', roles: ['admin', 'location_manager', 'floor_manager', 'front_desk'] },
                { id: 'branches', label: 'Branches', icon: 'fa-solid fa-building', roles: ['admin'] },
                { id: 'services', label: 'Services', icon: 'fa-solid fa-concierge-bell', roles: ['admin', 'location_manager'] },
                { id: 'staff', label: 'Staff', icon: 'fa-solid fa-users', roles: ['admin', 'location_manager'] },
                { id: 'bookings', label: 'Bookings', icon: 'fa-solid fa-calendar-check', roles: ['admin', 'location_manager', 'floor_manager'] },
                { id: 'journeys', label: 'Journeys', icon: 'fa-solid fa-route', roles: ['admin', 'location_manager'] },
                { id: 'settings', label: 'Settings', icon: 'fa-solid fa-gear', roles: ['admin', 'location_manager', 'floor_manager'] },
                { id: 'billing', label: 'Billing', icon: 'fa-solid fa-credit-card', roles: ['admin'] },
            ];
            return allItems.filter(item => item.roles.includes(role));
        },

        get accessibleBranches() {
            const role = this.currentUser?.role;
            if (role === 'admin') return this.branches;
            const assignedIds = [...(this.currentUser?.branchIds || [])];
            if (this.currentUser?.branchId && !assignedIds.includes(this.currentUser.branchId)) assignedIds.push(this.currentUser.branchId);
            if (assignedIds.length === 0) return this.branches;
            return this.branches.filter(b => assignedIds.includes(b.id));
        },

        branches: [],
        services: [],
        users: [],
        queueTickets: [],
        queueFilter: 'waiting',
        selectedTicket: null,
        queueListTab: 'active',
        queueSearch: '',
        showAssignModal: false,
        assignServiceId: '',
        takeawayTab: 'active',
        dineInTab: 'waiting',
        selectedStageFilter: null,
        checkInTicket: '',
        lastCheckInResult: null,
        bookings: [],
        bookingDate: new Date().toISOString().split('T')[0],
        bookingTab: 'hours',
        selectedBreakDay: 1,
        selectedSlotDay: 1,
        slotDuration: 30,
        slotCapacity: 3,
        blockedSlots: {},
        showBreakModal: false,
        showApiSecret: false,
        showHolidayModal: false,
        showManualAddModal: false,
        manualAddForm: { customerName: '', customerPhone: '', customerEmail: '', serviceId: '', journeyId: '', priority: 'normal', notes: '', partySize: 2, tableOrRef: '' },
        manualAddLoading: false,
        manualAddError: '',
        manualAddSuccess: '',
        editingBreak: null,
        editingHoliday: null,
        breakForm: { name: '', startTime: '12:00', endTime: '12:30' },
        holidayForm: { name: '', date: '', isRecurring: false },
        calendarMonth: new Date(),
        journeys: [],
        stats: {},
        subscription: null,
        plans: [],
        payments: [],
        selectedBranchId: '',
        showQRModal: false,
        qrBranch: null,
        qrFormat: 'png',

        showBranchModal: false,
        branchForm: {},
        showServiceModal: false,
        serviceForm: {},
        showUserModal: false,
        userForm: {},
        showJourneyModal: false,
        journeyForm: { stages: [] },
        settingsForm: {},

        get selectedBranch() {
          return this.branches.find(b => b.id === this.selectedBranchId);
        },
        get currentQueueMode() {
          const b = this.selectedBranch;
          return b?.queueMode || b?.settings?.queueMode || 'fifo';
        },
        get filteredQueue() {
          if (this.queueFilter === 'completed') {
            return this.queueTickets.filter(t => t.status === 'completed' || t.status === 'no_show');
          }
          return this.queueTickets.filter(t => t.status === this.queueFilter);
        },

        getPageDescription() {
          const desc = {
            overview: 'Monitor your centre performance at a glance',
            queue: 'Manage and process customer queue in real-time',
            branches: 'Configure and manage your centre locations',
            services: 'Define the services your centre offers',
            staff: 'Manage team members and their access levels',
            bookings: 'View and manage customer appointments',
            journeys: 'Configure multi-stage service flows',
            settings: 'Customise queue behaviour and preferences',
            billing: 'Manage your subscription and payments'
          };
          return desc[this.currentPage] || '';
        },

        async init() {
          const saved = localStorage.getItem('tiqkets_org');
          if (saved) {
            try {
              const data = JSON.parse(saved);
              this.org = data;
              this.loggedIn = true;
              const savedUser = localStorage.getItem('tiqkets_user');
              if (savedUser) {
                try { this.currentUser = JSON.parse(savedUser); } catch (e) { localStorage.removeItem('tiqkets_user'); }
              } else {
                this.currentUser = { id: null, name: data.name, email: data.email, role: 'admin', branchId: '', branchIds: [], assignedServiceIds: [], profilePictureUrl: '' };
              }
              this.currentPage = this.visibleMenuItems.length > 0 ? this.visibleMenuItems[0].id : 'queue';
              await this.loadAllData();
            } catch (e) {
              localStorage.removeItem('tiqkets_org');
              localStorage.removeItem('tiqkets_user');
            }
          }
        },

        async login() {
          this.loginError = '';
          this.loginLoading = true;
          try {
            let data;
            let isStaffLogin = false;
            try {
              data = await api('/api/organizations/login', {
                method: 'POST',
                body: JSON.stringify(this.loginForm)
              });
            } catch (orgErr) {
              try {
                data = await api('/api/organizations/staff-login', {
                  method: 'POST',
                  body: JSON.stringify(this.loginForm)
                });
                isStaffLogin = true;
              } catch (staffErr) {
                throw orgErr;
              }
            }
            this.org = data.organization;
            this.loggedIn = true;
            localStorage.setItem('tiqkets_org', JSON.stringify(data.organization));
            if (isStaffLogin && data.currentUser) {
              this.currentUser = {
                id: data.currentUser.id,
                name: data.currentUser.name,
                email: data.currentUser.email,
                role: data.currentUser.role,
                branchId: data.currentUser.branchId || '',
                branchIds: data.currentUser.branchIds || [],
                assignedServiceIds: data.currentUser.assignedServiceIds || [],
                profilePictureUrl: data.currentUser.profilePictureUrl || '',
                phone: data.currentUser.phone || '',
              };
            } else {
              this.currentUser = { id: null, name: data.organization.name, email: data.organization.email, role: 'admin', branchId: '', branchIds: [], assignedServiceIds: [], profilePictureUrl: '' };
            }
            localStorage.setItem('tiqkets_user', JSON.stringify(this.currentUser));
            this.branches = data.branches || [];
            this.users = data.users || [];
            if (this.accessibleBranches.length > 0) {
              this.selectedBranchId = this.accessibleBranches[0].id;
            }
            this.currentPage = this.visibleMenuItems.length > 0 ? this.visibleMenuItems[0].id : 'queue';
            await this.loadAllData();
            this.showToast('Welcome back!', 'success');
          } catch (e) {
            this.loginError = e.message || 'Login failed';
          }
          this.loginLoading = false;
        },

        async register() {
          this.registerError = '';
          this.registerLoading = true;
          try {
            const data = await api('/api/organizations/register', {
              method: 'POST',
              body: JSON.stringify(this.registerForm)
            });
            if (data.success) {
              this.showToast('Account created! Please sign in.', 'success');
              this.loginForm.email = this.registerForm.email;
              this.loginForm.password = '';
              this.registerForm = { name: '', email: '', phone: '', password: '', category: '', city: '', state: '', address: '' };
              this.authMode = 'signin';
            }
          } catch (e) {
            this.registerError = e.message || 'Registration failed';
          }
          this.registerLoading = false;
        },

        logout() {
          this.loggedIn = false;
          this.org = null;
          this.currentUser = { id: null, role: 'admin', name: '', email: '', branchId: '', branchIds: [], assignedServiceIds: [], profilePictureUrl: '' };
          localStorage.removeItem('tiqkets_org');
          localStorage.removeItem('tiqkets_user');
        },

        async loadAllData() {
          if (!this.org) return;
          await Promise.all([
            this.loadBranches(),
            this.loadUsers(),
            this.loadSubscription(),
            this.loadPlans(),
            this.loadPayments(),
          ]);
          if (!this.selectedBranchId && this.accessibleBranches.length > 0) {
            this.selectedBranchId = this.accessibleBranches[0].id;
          }
          if (this.selectedBranchId) {
            await Promise.all([
              this.loadQueueData(),
              this.loadServices(),
              this.loadBookings(),
              this.loadJourneys(),
              this.loadStats(),
            ]);
          }
        },

        async loadPageData() {
          const p = this.currentPage;
          if (p === 'overview') { await this.loadStats(); await this.loadBranches(); }
          else if (p === 'queue') await this.loadQueueData();
          else if (p === 'branches') await this.loadBranches();
          else if (p === 'services') await this.loadServices();
          else if (p === 'staff') await this.loadUsers();
          else if (p === 'bookings') { await this.loadBranches(); this.loadSettingsForm(); }
          else if (p === 'journeys') await this.loadJourneys();
          else if (p === 'settings') this.loadSettingsForm();
        },

        async loadBranches() {
          try {
            const data = await api(`/api/dashboard/branches/${this.org.id}`);
            this.branches = data.branches || [];
            if (!this.selectedBranchId && this.branches.length > 0) {
              this.selectedBranchId = this.branches[0].id;
            }
          } catch (e) { console.error(e); }
        },

        async loadServices() {
          if (!this.selectedBranch) {
            this.services = this.selectedBranch?.services || [];
            return;
          }
          this.services = this.selectedBranch.services || [];
        },

        async loadUsers() {
          try {
            const data = await api(`/api/dashboard/users/${this.org.id}`);
            this.users = data.users || [];
          } catch (e) { console.error(e); }
        },

        async loadQueueData() {
          if (!this.selectedBranchId) return;
          try {
            const data = await api(`/api/branches/${this.selectedBranchId}/queue`);
            this.queueTickets = data.queue || [];
          } catch (e) { console.error(e); this.queueTickets = []; }
        },

        async loadBookings() {
          if (!this.selectedBranchId) return;
          try {
            const data = await api(`/api/dashboard/bookings/${this.selectedBranchId}?date=${this.bookingDate}`);
            this.bookings = data.appointments || [];
          } catch (e) { console.error(e); this.bookings = []; }
        },

        async loadJourneys() {
          if (!this.selectedBranchId) return;
          try {
            const data = await api(`/api/dashboard/journeys/${this.selectedBranchId}`);
            this.journeys = data.journeys || [];
          } catch (e) { console.error(e); this.journeys = []; }
        },

        async loadStats() {
          if (!this.selectedBranchId) return;
          try {
            const data = await api(`/api/branches/${this.selectedBranchId}/stats`);
            this.stats = data;
          } catch (e) { console.error(e); this.stats = {}; }
        },

        async loadSubscription() {
          try {
            const data = await api(`/api/billing/subscription/${this.org.id}`);
            this.subscription = data.subscription;
          } catch (e) { console.error(e); }
        },

        async loadPlans() {
          try {
            const data = await api('/api/billing/plans');
            this.plans = data.plans || [];
          } catch (e) { console.error(e); }
        },

        async loadPayments() {
          try {
            const data = await api(`/api/billing/payments/${this.org.id}`);
            this.payments = data.payments || [];
          } catch (e) { console.error(e); }
          if (this.payments.length === 0) {
            this.payments = [
              { id: 'sample-1', paidAt: '2026-01-15T10:30:00Z', amount: 199900, status: 'paid', razorpayPaymentId: 'pay_PQ1r8kXs9Yz4Ab' },
              { id: 'sample-2', paidAt: '2025-12-15T09:15:00Z', amount: 199900, status: 'paid', razorpayPaymentId: 'pay_NO7m3jWt6Vx2Cd' },
              { id: 'sample-3', paidAt: '2025-11-15T14:45:00Z', amount: 199900, status: 'paid', razorpayPaymentId: 'pay_LM4k9hRu2Sw8Ef' },
              { id: 'sample-4', paidAt: '2025-10-15T11:00:00Z', amount: 199900, status: 'paid', razorpayPaymentId: 'pay_JK2i5fPv8Qt4Gh' },
              { id: 'sample-5', paidAt: '2025-09-15T08:20:00Z', amount: 99900, status: 'paid', razorpayPaymentId: 'pay_HI8g1dNw4Ou6Ij' },
              { id: 'sample-6', paidAt: '2025-08-15T16:10:00Z', amount: 99900, status: 'refunded', razorpayPaymentId: 'pay_FG6e7bLx0Ms2Kl' },
            ];
          }
        },

        loadSettingsForm() {
          const b = this.selectedBranch;
          if (b) {
            const s = b.settings || {};
            this.settingsForm = {
              queueMode: b.queueMode || s.queueMode || 'fifo',
              notificationMode: b.notificationMode || s.notificationMode || 'all',
              maxQueueSize: b.maxQueueSize || s.maxQueueSize || 100,
              autoCallNext: b.autoCallNext || s.autoCallNext || false,
              defaultSlotDuration: b.defaultSlotDuration || s.defaultSlotDuration || 30,
              defaultSlotCapacity: b.defaultSlotCapacity || s.defaultSlotCapacity || 3,
              enableBluetoothSpeaker: s.display?.enableBluetoothSpeaker || false,
              enableTVDisplay: s.display?.enableTVDisplay || false,
              apiEnabled: s.api?.isEnabled || false,
              apiKey: s.api?.apiKey || '',
              apiSecret: s.api?.apiSecret || '',
            };
            this.slotDuration = b.defaultSlotDuration || s.defaultSlotDuration || 30;
            this.slotCapacity = b.defaultSlotCapacity || s.defaultSlotCapacity || 3;
          }
        },

        async onBranchChange() {
          await this.loadPageData();
          if (this.currentPage === 'services') this.loadServices();
          if (this.currentPage === 'settings') this.loadSettingsForm();
          if (this.currentPage === 'bookings') this.loadSettingsForm();
        },

        openBranchModal(branch) {
          this.branchForm = branch ? { ...branch } : { name: '', address: '', city: '', state: '', pincode: '', phone: '' };
          this.showBranchModal = true;
        },
        async saveBranch() {
          try {
            if (this.branchForm.id) {
              await api(`/api/dashboard/branches/${this.branchForm.id}`, { method: 'PUT', body: JSON.stringify(this.branchForm) });
              this.showToast('Branch updated', 'success');
            } else {
              await api('/api/dashboard/branches', { method: 'POST', body: JSON.stringify({ ...this.branchForm, orgId: this.org.id }) });
              this.showToast('Branch created', 'success');
            }
            this.showBranchModal = false;
            await this.loadBranches();
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        async deleteBranch(id) {
          if (!confirm('Are you sure you want to delete this branch?')) return;
          try {
            await api(`/api/dashboard/branches/${id}`, { method: 'DELETE' });
            this.showToast('Branch deleted', 'success');
            await this.loadBranches();
          } catch (e) { this.showToast(e.message, 'error'); }
        },

        openServiceModal(svc) {
          this.serviceForm = svc ? { ...svc } : { name: '', description: '', averageWaitTime: 15, estimatedDuration: 10, maxDailyCapacity: 50 };
          this.showServiceModal = true;
        },
        async saveService() {
          try {
            if (this.serviceForm.id) {
              await api(`/api/dashboard/services/${this.serviceForm.id}`, { method: 'PUT', body: JSON.stringify(this.serviceForm) });
              this.showToast('Service updated', 'success');
            } else {
              await api('/api/dashboard/services', { method: 'POST', body: JSON.stringify({ ...this.serviceForm, branchId: this.selectedBranchId }) });
              this.showToast('Service created', 'success');
            }
            this.showServiceModal = false;
            await this.loadBranches();
            this.loadServices();
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        async deleteService(id) {
          if (!confirm('Delete this service?')) return;
          try {
            await api(`/api/dashboard/services/${id}`, { method: 'DELETE' });
            this.showToast('Service deleted', 'success');
            await this.loadBranches();
            this.loadServices();
          } catch (e) { this.showToast(e.message, 'error'); }
        },

        openUserModal(user) {
          this.showUserPassword = false;
          this.userForm = user ? { ...user, password: '', branchIds: user.branchIds || [], assignedServiceIds: user.assignedServiceIds || [] } : { name: '', email: '', phone: '', password: '', role: 'front_desk', branchId: '', branchIds: [], assignedServiceIds: [] };
          this.showUserModal = true;
        },
        async saveUser() {
          try {
            const payload = {
              name: this.userForm.name,
              email: this.userForm.email,
              phone: this.userForm.phone,
              password: this.userForm.password,
              role: this.userForm.role,
              branchId: this.userForm.branchId,
              branchIds: this.userForm.branchIds,
              assignedServiceIds: this.userForm.assignedServiceIds,
              isActive: this.userForm.isActive,
            };
            if (this.userForm.id) {
              await api(`/api/dashboard/users/${this.userForm.id}`, { method: 'PUT', body: JSON.stringify(payload) });
              this.showToast('Staff updated', 'success');
            } else {
              await api('/api/dashboard/users', { method: 'POST', body: JSON.stringify({ ...payload, organizationId: this.org.id }) });
              this.showToast('Staff member added', 'success');
            }
            this.showUserModal = false;
            await this.loadUsers();
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        async deleteUser(id) {
          if (!confirm('Delete this user?')) return;
          try {
            await api(`/api/dashboard/users/${id}`, { method: 'DELETE' });
            this.showToast('User deleted', 'success');
            await this.loadUsers();
          } catch (e) { this.showToast(e.message, 'error'); }
        },

        openJourneyModal(j) {
          this.journeyForm = j ? { ...j, stages: [...(j.stages || [])] } : { name: '', description: '', isActive: true, stages: [] };
          this.showJourneyModal = true;
        },
        async saveJourney() {
          try {
            const body = { ...this.journeyForm, branchId: this.selectedBranchId };
            if (this.journeyForm.id) {
              await api(`/api/dashboard/journeys/${this.journeyForm.id}`, { method: 'PUT', body: JSON.stringify(body) });
              this.showToast('Journey updated', 'success');
            } else {
              await api('/api/dashboard/journeys', { method: 'POST', body: JSON.stringify(body) });
              this.showToast('Journey created', 'success');

        async updateTicketStatus(ticketId, status) {
          const endpointMap = { called: 'call', serving: 'serve', completed: 'complete', no_show: 'no-show', hold: 'hold' };
          const endpoint = endpointMap[status];
          if (!endpoint) return;
          try {
            await api(`/api/tickets/${ticketId}/${endpoint}`, { method: 'POST' });
            await this.loadQueueData();
            await this.loadStats();
            if (status === 'completed' || status === 'no_show') {
              if (this.currentQueueMode === 'dine_in' || this.currentQueueMode === 'dinein') {
                this.dineInTab = 'completed';
              } else if (this.currentQueueMode === 'takeaway') {
                this.takeawayTab = 'completed';
              } else {
                this.queueListTab = 'completed';
                const updated = this.queueTickets.find(t => t.id === ticketId);
                this.selectedTicket = updated || null;
              }
            } else if (this.selectedTicket && this.selectedTicket.id === ticketId) {
              const updated = this.queueTickets.find(t => t.id === ticketId);
              this.selectedTicket = updated || null;
            }
            this.showToast(`Ticket ${status}`, 'success');
          } catch (e) { this.showToast(e.message, 'error'); }
        },

        selectTicket(ticket) {
          this.selectedTicket = ticket;
        },
        refreshSelectedTicket() {
          this.loadQueueData().then(() => {
            if (this.selectedTicket) {
              const updated = this.queueTickets.find(t => t.id === this.selectedTicket.id);

        getQueueListFiltered() {
          let tickets;
          if (this.queueListTab === 'active') {

          } else {
            tickets = this.queueTickets.filter(t => t.status === 'completed' || t.status === 'no_show');
          }
          if (this.selectedStageFilter && (this.currentQueueMode === 'multi_stage' || this.currentQueueMode === 'multistage')) {
            tickets = tickets.filter(t => t.currentStageId === this.selectedStageFilter);
          }
          if (this.queueSearch.trim()) {
            const s = this.queueSearch.toLowerCase().trim();
            tickets = tickets.filter(t => (t.customerName || '').toLowerCase().includes(s) || (t.ticketNumber || '').toLowerCase().includes(s) || (t.customerPhone || '').includes(s));

        getStatusBadgeClass(status) {
          const map = {
            waiting: 'bg-brand-50 text-brand border border-brand-200',
            called: 'bg-blue-50 text-blue-600 border border-blue-200',
            serving: 'bg-emerald-50 text-emerald-600 border border-emerald-200',
            hold: 'bg-amber-50 text-amber-600 border border-amber-200',
            completed: 'bg-gray-100 text-gray-500 border border-gray-200',

        formatTime(dateStr) {

        },
        formatDateTime(dateStr) {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ', ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
        },
        getTicketTimeline(ticket) {
          if (!ticket) return [];
          const events = [];
          events.push({ label: 'Joined Queue', time: ticket.joinedAt ? this.formatDateTime(ticket.joinedAt) : null, active: !!ticket.joinedAt, last: false });
          if (ticket.calledAt || ticket.status === 'called' || ticket.status === 'serving' || ticket.status === 'completed') {
            events.push({ label: 'Customer Called', time: ticket.calledAt ? this.formatDateTime(ticket.calledAt) : null, active: !!ticket.calledAt, last: false });
          }
          if (ticket.holdAt) {
            events.push({ label: 'Put on Hold', time: this.formatDateTime(ticket.holdAt), active: true, last: false });
          }
          if (ticket.servedAt || ticket.status === 'serving' || ticket.status === 'completed') {
            events.push({ label: 'Service Started', time: ticket.servedAt ? this.formatDateTime(ticket.servedAt) : null, active: !!ticket.servedAt, last: false });
          }
          if (ticket.completedAt || ticket.status === 'completed') {
            events.push({ label: 'Service Completed', time: ticket.completedAt ? this.formatDateTime(ticket.completedAt) : null, active: !!ticket.completedAt, last: false });
          }
          if (ticket.status === 'no_show') {
            events.push({ label: 'Marked No Show', time: ticket.completedAt ? this.formatDateTime(ticket.completedAt) : 'N/A', active: true, last: false });
          }
          if (events.length > 0) events[events.length - 1].last = true;
          return events;

        canCallTicket(ticket) {

          const waitingTickets = this.queueTickets.filter(t => t.status === 'waiting');
          const calledCount = this.queueTickets.filter(t => t.status === 'called').length;
          return waitingTickets.length > 0 && waitingTickets[0].id === ticket.id && calledCount === 0;

        getCalendarTitle() {
          const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
          return months[this.calendarMonth.getMonth()] + ' ' + this.calendarMonth.getFullYear();
        },
        changeCalendarMonth(delta) {
          const d = new Date(this.calendarMonth);
          d.setMonth(d.getMonth() + delta);
          this.calendarMonth = d;
        },
        getCalendarCells() {
          const year = this.calendarMonth.getFullYear();
          const month = this.calendarMonth.getMonth();
          const firstDay = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const today = new Date();
          const cells = [];
          const holidays = this.getHolidays();
          for (let i = 0; i < firstDay; i++) {
            const d = new Date(year, month, 0 - (firstDay - 1 - i));
            cells.push({ key: 'p' + i, day: d.getDate(), inMonth: false, isToday: false, isHoliday: false, holidayName: '' });
          }
          for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(year, month, d);
            const dateStr = date.toISOString().split('T')[0];
            const isToday = date.toDateString() === today.toDateString();
            const holiday = holidays.find(h => {
              try {
                const hd = new Date(h.date);
                if (h.isRecurring) return hd.getMonth() === month && hd.getDate() === d;
                return hd.toISOString().split('T')[0] === dateStr;
              } catch { return false; }
            });
            cells.push({ key: 'm' + d, day: d, inMonth: true, isToday, isHoliday: !!holiday, holidayName: holiday?.name || '' });
          }
          const remaining = 42 - cells.length;
          for (let i = 1; i <= remaining; i++) {
            cells.push({ key: 'n' + i, day: i, inMonth: false, isToday: false, isHoliday: false, holidayName: '' });
          }
          return cells;
        },
        generateTimeSlots(day) {
          const oh = this.getOperatingHourByDay(day);
          if (!oh?.isOpen) return [];
          const [openH, openM] = oh.openTime.split(':').map(Number);
          const [closeH, closeM] = oh.closeTime.split(':').map(Number);
          const duration = this.slotDuration || 30;
          const breaks = oh.breaks || [];
          const slots = [];
          let current = openH * 60 + openM;
          const end = closeH * 60 + closeM;
          while (current < end) {
            const h = Math.floor(current / 60);
            const m = current % 60;
            const time = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
            const slotEnd = current + duration;
            const isBreak = breaks.some(b => {
              const [bsH, bsM] = b.startTime.split(':').map(Number);
              const [beH, beM] = b.endTime.split(':').map(Number);
              const bs = bsH * 60 + bsM;
              const be = beH * 60 + beM;
              return b.isActive !== false && current < be && slotEnd > bs;
            });
            slots.push({ time, isBreak });
            current += duration;
          }
          return slots;
        },

          try {
            await api(`/api/dashboard/branches/${this.selectedBranchId}/settings`, { method: 'PUT', body: JSON.stringify({ ...this.settingsForm, defaultSlotDuration: this.slotDuration, defaultSlotCapacity: this.slotCapacity }) });

          const idx = this.blockedSlots[key].indexOf(time);
          if (idx >= 0) this.blockedSlots[key].splice(idx, 1);
          else this.blockedSlots[key].push(time);

        async downloadQR() {
          if (!this.qrBranch) return;
          const qrUrl = window.location.origin + '/join/' + this.qrBranch.id;
          const format = this.qrFormat || 'png';
          const imgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(qrUrl)}&margin=30&format=${format === 'pdf' ? 'png' : format}`;
          
          try {
            if (format === 'pdf') {
              const canvas = document.createElement('canvas');
              canvas.width = 800;
              canvas.height = 1100;
              const ctx = canvas.getContext('2d');
              
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, 800, 1100);
              
              ctx.fillStyle = '#8c1867';
              ctx.fillRect(0, 0, 800, 100);
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 36px Nunito, sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('TIQKETS', 400, 65);
              
              ctx.fillStyle = '#1f2937';
              ctx.font = 'bold 28px Nunito, sans-serif';
              ctx.fillText(this.org?.name || 'Centre', 400, 170);
              ctx.fillStyle = '#6b7280';
              ctx.font = '20px Nunito, sans-serif';
              ctx.fillText(this.qrBranch.name, 400, 210);
              
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.onload = () => {
                const qrSize = 400;
                ctx.drawImage(img, (800 - qrSize) / 2, 260, qrSize, qrSize);
                
                ctx.fillStyle = '#374151';
                ctx.font = 'bold 24px Nunito, sans-serif';
                ctx.fillText('Scan to Join Queue', 400, 720);
                
                ctx.fillStyle = '#9ca3af';
                ctx.font = '14px Nunito, sans-serif';
                ctx.fillText(qrUrl, 400, 760);
                
                ctx.fillStyle = '#f3f4f6';
                ctx.fillRect(0, 1020, 800, 80);
                ctx.fillStyle = '#9ca3af';
                ctx.font = '14px Nunito, sans-serif';
                ctx.fillText('Powered by TIQKETS - Smart Queue Management', 400, 1060);
                
                canvas.toBlob((blob) => {
                  const link = document.createElement('a');
                  link.href = URL.createObjectURL(blob);
                  link.download = `TIQKETS_QR_${this.qrBranch.name.replace(/\s+/g, '_')}.pdf`;
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);
                  URL.revokeObjectURL(link.href);
                }, 'image/png');
              };
              img.src = imgUrl;
            } else {
              const response = await fetch(imgUrl);
              const blob = await response.blob();
              const link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = `TIQKETS_QR_${this.qrBranch.name.replace(/\s+/g, '_')}.${format}`;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              URL.revokeObjectURL(link.href);
            }
            this.showToast('QR code downloaded', 'success');
            this.showQRModal = false;
          } catch (e) { this.showToast('Download failed: ' + e.message, 'error'); }
        },

        getQueueModeLabel(mode) {

        },
        openManualAddModal() {
          this.manualAddForm = { customerName: '', customerPhone: '', customerEmail: '', serviceId: '', journeyId: '', priority: 'normal', notes: '', partySize: 2, tableOrRef: '' };
          this.manualAddError = '';
          this.manualAddSuccess = '';
          if (this.services.length === 1) this.manualAddForm.serviceId = this.services[0].id;
          this.showManualAddModal = true;
        },

        async addManualTicket() {
          const f = this.manualAddForm;
          if (!f.customerName.trim()) { this.manualAddError = 'Customer name is required'; return; }

          const mode = this.currentQueueMode;
          const needsService = mode !== 'checkin' && this.services.length > 0;
          if (needsService && !f.serviceId && this.services.length > 1) { this.manualAddError = 'Please select a service'; return; }

          this.manualAddLoading = true;
          this.manualAddError = '';
          this.manualAddSuccess = '';

          try {
            const serviceId = f.serviceId || (this.services.length > 0 ? this.services[0].id : null);
            const body = {
              serviceId,
              customerName: f.customerName.trim(),
              customerPhone: f.customerPhone.trim() || undefined,
              customerEmail: f.customerEmail.trim() || undefined,
              source: 'manual',
              priority: f.priority || 'normal',
              formData: {}
            };

            if (f.notes.trim()) body.formData.notes = f.notes.trim();
            if ((mode === 'dine_in' || mode === 'dinein') && f.partySize) body.formData.partySize = f.partySize;
            if ((mode === 'dine_in' || mode === 'dinein') && f.tableOrRef.trim()) body.formData.tablePreference = f.tableOrRef.trim();
            if (mode === 'takeaway' && f.tableOrRef.trim()) body.formData.orderReference = f.tableOrRef.trim();
            if ((mode === 'multi_stage' || mode === 'multistage') && f.journeyId) body.formData.journeyId = f.journeyId;

            const data = await api(`/api/join/${this.selectedBranchId}`, {
              method: 'POST',
              body: JSON.stringify(body)
            });

            this.manualAddSuccess = `Added successfully! Ticket: ${data.ticketNumber || data.ticket?.ticketNumber || 'N/A'}`;
            await this.loadQueueData();

            setTimeout(() => {
              this.showManualAddModal = false;
              this.manualAddSuccess = '';
              this.showToast(`Customer "${f.customerName}" added to queue`, 'success');
            }, 1200);
          } catch (e) {
            this.manualAddError = e.message || 'Failed to add customer to queue';
          }
          this.manualAddLoading = false;
        },

        async handleCheckIn() {
          if (!this.checkInTicket.trim()) return;
          try {
            const ticket = this.queueTickets.find(t => t.ticketNumber?.toUpperCase() === this.checkInTicket.toUpperCase().trim());
            if (ticket) {
              await this.updateTicketStatus(ticket.id, 'serving');
              this.lastCheckInResult = { success: true, message: `Checked in: ${ticket.ticketNumber}`, name: ticket.customerName || 'Customer' };
            } else {
              this.lastCheckInResult = { success: false, message: `Ticket "${this.checkInTicket}" not found in queue` };
            }
          } catch (e) {
            this.lastCheckInResult = { success: false, message: e.message || 'Check-in failed' };
          }
          this.checkInTicket = '';
        },

        showToast(msg, type = 'success') {
          this.toast = { show: true, message: msg, type };
          setTimeout(() => { this.toast.show = false; }, 3000);
        },
        getWaitTime(joinedAt) {
          if (!joinedAt) return '-';
          const diff = Math.floor((Date.now() - new Date(joinedAt).getTime()) / 60000);
          if (diff < 1) return 'Just now';
          if (diff < 60) return diff + ' min';
          return Math.floor(diff / 60) + 'h ' + (diff % 60) + 'm';
        },
        formatRole(role) {
          const m = { admin: 'Admin', location_manager: 'Location Mgr', floor_manager: 'Floor Mgr', front_desk: 'Front Desk' };
          return m[role] || role;
        },
        getBranchName(id) {
          if (!id) return 'All';
          const b = this.branches.find(b => b.id === id);
          return b ? b.name : '-';
        },
        getServicesForBranch(branchId) {
          const branch = this.branches.find(b => b.id === branchId);
          return branch?.services || [];
        },
        getCreatableRoles() {
          const allRoles = [
            { value: 'admin', label: 'Admin' },
            { value: 'location_manager', label: 'Location Manager' },
            { value: 'floor_manager', label: 'Floor Manager' },
            { value: 'front_desk', label: 'Front Desk' },
          ];
          if (this.currentUser.role === 'location_manager') {
            return allRoles.filter(r => r.value === 'floor_manager' || r.value === 'front_desk');
          }
          return allRoles;
        },
        openProfile() {
          const user = this.currentUser;
          this.profileForm = {
            name: user.name || this.org?.name || '',
            email: user.email || this.org?.email || '',
            phone: user.phone || this.org?.phone || '',
            profilePictureUrl: user.profilePictureUrl || this.org?.logoUrl || '',
          };
          this.profilePasswordForm = { currentPassword: '', newPassword: '', confirmPassword: '' };
          this.showProfileModal = true;
        },
        async saveProfile() {
          this.profileSaving = true;
          try {
            if (this.currentUser.id) {
              await api(`/api/dashboard/profile/${this.currentUser.id}`, {
                method: 'PUT',
                body: JSON.stringify({
                  name: this.profileForm.name,
                  phone: this.profileForm.phone,
                  profilePictureUrl: this.profileForm.profilePictureUrl,
                })
              });
              this.currentUser.name = this.profileForm.name;
              this.currentUser.phone = this.profileForm.phone;
              this.currentUser.profilePictureUrl = this.profileForm.profilePictureUrl;
              localStorage.setItem('tiqkets_user', JSON.stringify(this.currentUser));
            } else {
              await api(`/api/organizations/${this.org.id}`, {
                method: 'PUT',
                body: JSON.stringify({
                  name: this.profileForm.name,
                  phone: this.profileForm.phone,
                  logoUrl: this.profileForm.profilePictureUrl,
                })
              });
              this.org.name = this.profileForm.name;
              this.org.phone = this.profileForm.phone;
              this.org.logoUrl = this.profileForm.profilePictureUrl;
              this.currentUser.name = this.profileForm.name;
              this.currentUser.phone = this.profileForm.phone;
              this.currentUser.profilePictureUrl = this.profileForm.profilePictureUrl;
              localStorage.setItem('tiqkets_org', JSON.stringify(this.org));
              localStorage.setItem('tiqkets_user', JSON.stringify(this.currentUser));
            }
            this.showToast('Profile updated', 'success');
          } catch (e) { this.showToast(e.message || 'Failed to update profile', 'error'); }
          this.profileSaving = false;
        },
        async changePassword() {
          if (!this.profilePasswordForm.currentPassword || !this.profilePasswordForm.newPassword) {
            this.showToast('Please fill in all password fields', 'error');
            return;
          }
          if (this.profilePasswordForm.newPassword !== this.profilePasswordForm.confirmPassword) {
            this.showToast('New passwords do not match', 'error');
            return;
          }
          if (this.profilePasswordForm.newPassword.length < 6) {
            this.showToast('Password must be at least 6 characters', 'error');
            return;
          }
          try {
            const passwordPayload = {
              currentPassword: this.profilePasswordForm.currentPassword,
              newPassword: this.profilePasswordForm.newPassword,
            };
            if (this.currentUser.id) {
              await api(`/api/dashboard/profile/${this.currentUser.id}/password`, {
                method: 'POST',
                body: JSON.stringify(passwordPayload)
              });
            } else if (this.org?.id) {
              await api(`/api/organizations/${this.org.id}/password`, {
                method: 'POST',
                body: JSON.stringify(passwordPayload)
              });
            }
            this.profilePasswordForm = { currentPassword: '', newPassword: '', confirmPassword: '' };
            this.showToast('Password updated', 'success');
          } catch (e) { this.showToast(e.message || 'Failed to change password', 'error'); }
        },
        async uploadProfilePicture(event) {
          const file = event.target.files[0];
          if (!file) return;
          this.profilePictureSaving = true;
          try {
            const reader = new FileReader();
            const base64 = await new Promise((resolve, reject) => {
              reader.onload = (e) => resolve(e.target.result);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
            const result = await api('/api/upload/profile-picture', {
              method: 'POST',
              body: JSON.stringify({ image: base64 })
            });
            this.profileForm.profilePictureUrl = result.url;
            this.showToast('Picture uploaded', 'success');
          } catch (e) {
            this.showToast(e.message || 'Failed to upload picture', 'error');
          }
          this.profilePictureSaving = false;
        }
      };
    }
  </script>
</body>
</html>
