        // Returns the inputFields array configured by the org for the
        // currently-selected service in the manual-add modal. Empty
        // array when no service is picked or it has no custom fields,
        // which causes the dynamic section to collapse in the template.
        getManualSelectedServiceFields() {
          const svc = (this.services || []).find(s => s.id === this.manualAddForm.serviceId);
          return (svc && Array.isArray(svc.inputFields)) ? svc.inputFields : [];
        },

        // Reset captured custom-field values whenever the staff member
        // switches services. Without this we'd carry stale values from
        // a different service's fields (Alpine x-model writes never
        // get cleaned up automatically).
        onManualServiceChange() {
          const fields = this.getManualSelectedServiceFields();
          const fresh = {};
          fields.forEach(f => {
            fresh[f.id] = f.type === 'checkbox' ? false : '';
          });
          this.manualAddForm.customFieldValues = fresh;
        },

        async addManualTicket() {
          const f = this.manualAddForm;
          if (!f.customerName.trim()) { this.manualAddError = 'Customer name is required'; return; }

          const mode = this.currentQueueMode;
          const needsService = mode !== 'checkin' && this.services.length > 0;
          if (needsService && !f.serviceId && this.services.length > 1) { this.manualAddError = 'Please select a service'; return; }

          // Validate org-defined required custom fields for the chosen
          // service. Mirrors the customer-facing /join PWA validation so
          // staff-added tickets carry the same minimum data as self-serve.
          const customFields = this.getManualSelectedServiceFields();
          for (const field of customFields) {
            if (!field.required) continue;
            const v = f.customFieldValues[field.id];
            const empty = field.type === 'checkbox' ? v !== true : (v === undefined || v === null || String(v).trim() === '');
            if (empty) {
              this.manualAddError = `${field.label} is required`;
              return;
            }
          }

          this.manualAddLoading = true;
          this.manualAddError = '';
          this.manualAddSuccess = '';

          try {
            const serviceId = f.serviceId || (this.services.length > 0 ? this.services[0].id : null);
            const body = {
              serviceId,
              customerName: f.customerName.trim(),
              customerPhone: f.customerPhone.trim() || undefined,
              customerEmail: f.customerEmail.trim() || undefined,
              source: 'manual',
              priority: f.priority || 'normal',
              formData: {}
            };

            // Merge org-defined custom field values first so fixed keys
            // (notes / partySize / etc) below take precedence on collision.
            for (const field of customFields) {
              const v = f.customFieldValues[field.id];
              if (field.type === 'checkbox') {
                body.formData[field.id] = !!v;
              } else if (v !== undefined && v !== null && String(v).trim() !== '') {
                body.formData[field.id] = field.type === 'number' ? Number(v) : String(v).trim();
              }
            }

            if (f.notes.trim()) body.formData.notes = f.notes.trim();
            if ((mode === 'dine_in' || mode === 'dinein') && f.partySize) body.formData.partySize = f.partySize;
            if (mode === 'takeaway' && f.tableOrRef.trim()) body.formData.orderReference = f.tableOrRef.trim();
            if ((mode === 'multi_stage' || mode === 'multistage') && f.journeyId) body.formData.journeyId = f.journeyId;

            const data = await api(`/api/join/${this.selectedBranchId}`, {
              method: 'POST',
              body: JSON.stringify(body)
            });

            this.manualAddSuccess = `Added successfully! Ticket: ${data.ticketNumber || data.ticket?.ticketNumber || 'N/A'}`;
            await this.loadQueueData();

            setTimeout(() => {
              this.showManualAddModal = false;
              this.manualAddSuccess = '';
              this.showToast(`Customer "${f.customerName}" added to queue`, 'success');
            }, 1200);
          } catch (e) {
            this.manualAddError = e.message || 'Failed to add customer to queue';
          }
          this.manualAddLoading = false;
        },

        async resumeDineInFromHold(ticketId) {
          try {
            await api(`/api/tickets/${ticketId}/resume`, { method: 'POST' });
            await this.loadQueueData();
            await this.loadStats();
            this.dineInTab = 'waiting';
            this.showToast('Guest moved back to waiting queue', 'success');
          } catch (e) {
            this.showToast(e.message || 'Failed to resume', 'error');
          }
        },

        async loadDineInReservations() {
          try {
            const branchId = this.selectedBranchId;
            if (!branchId) return;
            const today = new Date().toISOString().split('T')[0];
            const data = await api(`/api/branches/${branchId}/reservations?date=${today}`);
            this.dineInReservations = data.reservations || [];
          } catch (e) {
            console.error('Failed to load reservations:', e);
          }
        },

        async checkinReservation(reservationId) {
          try {
            await api(`/api/reservations/${reservationId}/checkin`, { method: 'POST' });
            await this.loadDineInReservations();
            await this.loadQueueData();
            await this.loadStats();
            this.showToast('Guest checked in and added to waiting queue', 'success');
          } catch (e) {
            this.showToast(e.message || 'Failed to check in reservation', 'error');
          }
        },

        async cancelReservation(reservationId) {
          try {
            await api(`/api/reservations/${reservationId}/cancel`, { method: 'POST' });
            await this.loadDineInReservations();
            this.showToast('Reservation cancelled', 'success');
          } catch (e) {
            this.showToast(e.message || 'Failed to cancel reservation', 'error');
          }
        },
        openTableAssignModal(ticket) {
          this.tableAssignTicketId = ticket.id;
          this.tableAssignTicketNumber = ticket.ticketNumber || '';
          this.tableAssignCustomerName = ticket.customerName || 'Guest';
          this.tableAssignNumber = ticket.tableNumber || '';
          this.showTableAssignModal = true;
          this.$nextTick(() => {
            if (this.$refs.tableNumberInput) this.$refs.tableNumberInput.focus();
          });
        },
        async confirmTableAssign() {
          if (!this.tableAssignTicketId) return;
          try {
            const body = { tableNumber: this.tableAssignNumber.trim() || null };
            const deskInfo = this.getSelectedDeskInfo();
            if (deskInfo) {
              body.deskId = deskInfo.id;
              body.deskName = deskInfo.name;
            }
            await api(`/api/tickets/${this.tableAssignTicketId}/call`, { method: 'POST', body: JSON.stringify(body) });
            await this.loadQueueData();
            await this.loadStats();
            this.showTableAssignModal = false;
            this.showToast(`Guest assigned${this.tableAssignNumber.trim() ? ` to Table ${this.tableAssignNumber.trim()}` : ''}`, 'success');
            this.tableAssignTicketId = null;
            this.tableAssignNumber = '';
          } catch (e) {
            this.showToast(e.message || 'Failed to assign table', 'error');
          }
        },
        async handleCheckIn() {
          if (!this.checkInTicket.trim()) return;
          try {
            const ticket = this.queueTickets.find(t => t.ticketNumber?.toUpperCase() === this.checkInTicket.toUpperCase().trim());
            if (ticket) {
              await this.updateTicketStatus(ticket.id, 'serving');
              this.lastCheckInResult = { success: true, message: `Checked in: ${ticket.ticketNumber}`, name: ticket.customerName || 'Customer' };
            } else {
              this.lastCheckInResult = { success: false, message: `Ticket "${this.checkInTicket}" not found in queue` };
            }
          } catch (e) {
            this.lastCheckInResult = { success: false, message: e.message || 'Check-in failed' };
          }
          this.checkInTicket = '';
        },

        showToast(msg, type = 'success') {
          this.toast = { show: true, message: msg, type };
          setTimeout(() => { this.toast.show = false; }, 3000);
        },
        getWaitTime(joinedAt) {
          if (!joinedAt) return '-';
          const diff = Math.floor((Date.now() - new Date(joinedAt).getTime()) / 60000);
          if (diff < 1) return 'Just now';
          if (diff < 60) return diff + ' min';
          return Math.floor(diff / 60) + 'h ' + (diff % 60) + 'm';
        },
        formatRole(role) {
          if (!role) return '-';
          const fromApi = (this.roles || []).find(r => r.key === role);
          if (fromApi) return fromApi.name;
          const m = { admin: 'Admin', location_manager: 'Location Manager', floor_manager: 'Floor Mgr', front_desk: 'Front Desk', super_admin: 'Super Admin' };
          if (m[role]) return m[role];
          return role.startsWith('custom_')
            ? role.slice(7).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
            : role.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        },
        getRoleDescription(roleKey) {
          if (!roleKey) return '';
          const fromApi = (this.roles || []).find(r => r.key === roleKey);
          if (fromApi && fromApi.description) return fromApi.description;
          const builtIn = {
            admin: 'Full control of the organization across all branches',
            location_manager: 'Can manage assigned branches, create staff, handle bookings & settings',
            floor_manager: 'Can process queue, manage bookings, and update settings',
            front_desk: 'Can only process the queue for assigned services',
          };
          return builtIn[roleKey] || (fromApi ? 'Custom role' : '');
        },
        async loadOrgRoles() {
          try {
            const data = await api('/api/org/roles');
            this.roles = (data && data.roles) || [];
          } catch (e) {
            console.error('loadOrgRoles failed', e);
            this.roles = [];
          }
        },
        getBranchName(id) {
          if (!id) return 'All';
          const b = this.branches.find(b => b.id === id);
          return b ? b.name : '-';
        },
        getServicesForBranch(branchId) {
          const branch = this.branches.find(b => b.id === branchId);
          return branch?.services || [];
        },
        getCreatableRoles() {
          // The server already filters /api/org/roles by the caller's rank
          // (returns only roles with rank < callerRank). We still want to
          // make sure the user being edited can keep their existing role
          // visible in the dropdown even if a stale catalog is missing it.
          const fallback = [
            { value: 'location_manager', label: 'Location Manager', isSystem: true },
            { value: 'floor_manager', label: 'Floor Manager', isSystem: true },
            { value: 'front_desk', label: 'Front Desk', isSystem: true },
          ];
          let list;
          if (this.roles && this.roles.length > 0) {
            list = this.roles
              .filter(r => r.key !== 'super_admin' && r.key !== 'admin')
              .map(r => ({ value: r.key, label: r.name, isSystem: !!r.isSystem }));
          } else {
            list = fallback;
          }
          // If editing, ensure the user's current role is always in the list so
          // the <select> shows the correct value (avoids a blank dropdown when
          // the role was created before a rank check or has since moved up).
          const currentRole = this.userForm && this.userForm.id ? this.userForm.role : null;
          if (currentRole && !list.some(r => r.value === currentRole)) {
            list.unshift({ value: currentRole, label: this.formatRole(currentRole), isSystem: false });
          }
          return list;
        },
        openProfile() {
          const user = this.currentUser;
          this.profileForm = {
            name: user.name || this.org?.name || '',
            email: user.email || this.org?.email || '',
            phone: user.phone || this.org?.phone || '',
            profilePictureUrl: user.profilePictureUrl || this.org?.logoUrl || '',
          };
          this.profilePasswordForm = { currentPassword: '', newPassword: '', confirmPassword: '' };
          this.showProfileModal = true;
        },
        // Flip the org-level AI wait-time prediction flag immediately.
        // Mirrors the mobile OrgSettingsScreen handler: PUTs the new
        // value, then mirrors it into this.org + localStorage so every
        // place in the dashboard that reads org.aiWaitPredictionEnabled
        // stays consistent without a full reload. We don't refetch
        // /api/organizations/me because the server-side cache invalidator
        // already bust the org-flag cache when the PUT landed.
        async toggleAiWaitPrediction(nextEnabled) {
          if (!this.org || !this.org.id || this.aiWaitPredictionSaving) return;
          const previous = this.org.aiWaitPredictionEnabled !== false;
          this.aiWaitPredictionSaving = true;
          try {
            await api(`/api/organizations/${this.org.id}`, {
              method: 'PUT',
              body: JSON.stringify({ aiWaitPredictionEnabled: !!nextEnabled }),
            });
            this.org.aiWaitPredictionEnabled = !!nextEnabled;
            try { localStorage.setItem('tiqkets_org', JSON.stringify(this.org)); } catch (_) {}
            this.showToast(
              nextEnabled ? 'AI wait-time predictions enabled' : 'AI wait-time predictions disabled',
              'success'
            );
          } catch (e) {
            // Revert visually — Alpine re-renders from this.org so just
            // resetting the value is enough; no checkbox state to undo.
            this.org.aiWaitPredictionEnabled = previous;
            this.showToast(e.message || 'Could not save AI prediction setting', 'error');
          }
          this.aiWaitPredictionSaving = false;
        },
        async saveProfile() {
          this.profileSaving = true;
          try {
            if (this.currentUser.id) {
              await api(`/api/dashboard/profile/${this.currentUser.id}`, {
                method: 'PUT',
                body: JSON.stringify({
                  name: this.profileForm.name,
                  phone: this.profileForm.phone,
                  profilePictureUrl: this.profileForm.profilePictureUrl,
                })
              });
            }
            if (this.currentUser.role === 'admin' && this.org?.id) {
              await api(`/api/organizations/${this.org.id}`, {
                method: 'PUT',
                body: JSON.stringify({
                  name: this.profileForm.name,
                  phone: this.profileForm.phone,
                  logoUrl: this.profileForm.profilePictureUrl,
                })
              });
              this.org.name = this.profileForm.name;
              this.org.phone = this.profileForm.phone;
              this.org.logoUrl = this.profileForm.profilePictureUrl;
              localStorage.setItem('tiqkets_org', JSON.stringify(this.org));
            }
            this.currentUser.name = this.profileForm.name;
            this.currentUser.phone = this.profileForm.phone;
            this.currentUser.profilePictureUrl = this.profileForm.profilePictureUrl;
            localStorage.setItem('tiqkets_user', JSON.stringify(this.currentUser));
            this.showToast('Profile updated', 'success');
          } catch (e) { this.showToast(e.message || 'Failed to update profile', 'error'); }
          this.profileSaving = false;
        },
        async changePassword() {
          if (!this.profilePasswordForm.currentPassword || !this.profilePasswordForm.newPassword) {
            this.showToast('Please fill in all password fields', 'error');
            return;
          }
          if (this.profilePasswordForm.newPassword !== this.profilePasswordForm.confirmPassword) {
            this.showToast('New passwords do not match', 'error');
            return;
          }
          if (this.profilePasswordForm.newPassword.length < 6) {
            this.showToast('Password must be at least 6 characters', 'error');
            return;
          }
          try {
            const passwordPayload = {
              currentPassword: this.profilePasswordForm.currentPassword,
              newPassword: this.profilePasswordForm.newPassword,
            };
            if (this.currentUser.id) {
              await api(`/api/dashboard/profile/${this.currentUser.id}/password`, {
                method: 'POST',
                body: JSON.stringify(passwordPayload)
              });
            } else if (this.org?.id) {
              await api(`/api/organizations/${this.org.id}/password`, {
                method: 'POST',
                body: JSON.stringify(passwordPayload)
              });
            }
            this.profilePasswordForm = { currentPassword: '', newPassword: '', confirmPassword: '' };
            this.showToast('Password updated', 'success');
          } catch (e) { this.showToast(e.message || 'Failed to change password', 'error'); }
        },
        async uploadProfilePicture(event) {
          const file = event.target.files[0];
          if (!file) return;
          this.profilePictureSaving = true;
          try {
            const reader = new FileReader();
            const base64 = await new Promise((resolve, reject) => {
              reader.onload = (e) => resolve(e.target.result);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
            const result = await api('/api/upload/profile-picture', {
              method: 'POST',
              body: JSON.stringify({ image: base64 })
            });
            this.profileForm.profilePictureUrl = result.url;
            this.showToast('Picture uploaded', 'success');
          } catch (e) {
            this.showToast(e.message || 'Failed to upload picture', 'error');
          }
          this.profilePictureSaving = false;
        },

        toggleAnnouncements() {
          this.announcementsEnabled = !this.announcementsEnabled;
          localStorage.setItem('tiqkets_announcements', this.announcementsEnabled ? 'true' : 'false');
          if (this.announcementsEnabled) {
            this.connectAnnouncementSSE();
            this.showToast('Speaker announcements enabled', 'success');
          } else {
            this.disconnectAnnouncementSSE();
            this.showToast('Speaker announcements disabled', 'info');
          }
        },

        connectAnnouncementSSE() {
          this.disconnectAnnouncementSSE();
          const branchId = this.selectedBranchId || (this.accessibleBranches[0]?.id);
          if (!branchId) return;
          try {
            const orgId = this.org?.id || '';
            this.announcementSSE = new EventSource(`/api/announcements/stream?branchId=${branchId}&orgId=${orgId}`);
            this.announcementSSE.onmessage = (e) => {
              try {
                const event = JSON.parse(e.data);
                this.announcementQueue.push(event);
                this.processAnnouncementQueue();
              } catch (err) {}
            };
            this.announcementSSE.onerror = () => {
              this.disconnectAnnouncementSSE();
              setTimeout(() => {
                if (this.announcementsEnabled && this.loggedIn) this.connectAnnouncementSSE();
              }, 5000);
            };
          } catch (err) {}
        },

        disconnectAnnouncementSSE() {
          if (this.announcementSSE) {
            this.announcementSSE.close();
            this.announcementSSE = null;
          }
        },

        // Live auto-refresh: keeps the queue list and overview counts current
        // without the user clicking Refresh. Fires every 6s while the tab is
        // visible and the user is on the Queue or Overview page, so a customer
        // joining (mobile / QR / manual add) or a ticket stage/status change
        // shows up on its own. Pauses when the tab is hidden to avoid waste.
        startLivePolling() {
          this.stopLivePolling();
          this._livePollTimer = setInterval(async () => {
            if (!this.loggedIn) return;
            if (typeof document !== 'undefined' && document.hidden) return;
            // In-flight guard: never stack a new request on top of a slow one.
            if (this._livePollBusy) return;
            this._livePollBusy = true;
            try {
              if (this.currentPage === 'queue') {
                await this.loadQueueData();
              } else if (this.currentPage === 'overview') {
                await this.loadStats();
              }
            } catch (_) {
              /* transient network error — next tick retries */
            } finally {
              this._livePollBusy = false;
            }
          }, 6000);
        },

        stopLivePolling() {
          if (this._livePollTimer) {
            clearInterval(this._livePollTimer);
            this._livePollTimer = null;
          }
        },

        async processAnnouncementQueue() {
          if (this.announcementPlaying || this.announcementQueue.length === 0) return;
          this.announcementPlaying = true;
          const event = this.announcementQueue.shift();
          try {
            // Honour the per-mode custom alert sound configured in Super
            // Admin (event.alertSoundUrl). Falls back to the bundled tone
            // if no override is set or the audio fails to load.
            await this.playAlertTone(event);
            // Always prefer the server-rendered spokenText: it already has
            // the Super Admin's custom template (per queue mode and per
            // language) applied with the correct variables interpolated.
            // Only fall back to the local builder if the server payload
            // is missing — keeps backward compat with old listeners.
            const utterances = this.resolveAnnouncementUtterances(event);
            for (let i = 0; i < utterances.length; i++) {
              if (i > 0) await this.sleep(1500);
              await this.speakText(utterances[i].text, utterances[i].lang);
            }
          } catch (err) {}
          this.announcementPlaying = false;
          if (this.announcementQueue.length > 0) this.processAnnouncementQueue();
        },

        // Returns 1 or 2 {text, lang} pairs — primary plus optional
        // English fallback when the branch has "also announce in English"
        // turned on. When the server payload is missing for some reason
        // (older deployment, malformed event), reconstruct sensible
        // English wording from the raw fields so we never go silent.
        resolveAnnouncementUtterances(event) {
          const out = [];
          const primaryText = event.spokenText
            || (event.language === 'ar' ? event.spokenTextAr : event.spokenTextEn)
            || event.spokenTextEn
            || event.spokenTextAr
            || this.buildAnnouncementText(event);
          const primaryLang = (event.languageBcp47 || event.language || 'en-US');
          if (primaryText) out.push({ text: primaryText, lang: primaryLang });
          const fb = (event.fallbackText && String(event.fallbackText).trim()) ? event.fallbackText : null;
          if (fb) {
            out.push({ text: fb, lang: event.fallbackLanguageBcp47 || event.fallbackLanguage || 'en-US' });
          } else if (out.length === 1) {
            // No bilingual fallback configured — repeat the primary line
            // once so the announcer is heard twice (matches old behaviour).
            out.push({ text: out[0].text, lang: out[0].lang });
          }
          return out;
        },

        buildAnnouncementText(event) {
          const num = event.ticketNumber || '';
          const name = event.customerName || '';
          const desk = event.deskName || '';
          const table = event.tableNumber || '';
          const stage = event.stageName || '';
          const mode = (event.queueMode || '').replace(/_/g, '').toLowerCase();

          if (event.type === 'serve' && mode === 'takeaway') {
            return `Order ${num}, ${name}, your order is ready for pickup`;
          }
          if (mode === 'dinein') {
            return table ? `Booking ${num}, ${name}, please proceed to Table ${table}` : `Booking ${num}, ${name}, your table is ready`;
          }
          if (mode === 'takeaway') {
            return `Order ${num}, ${name}, please proceed to the counter`;
          }
          if (mode === 'multistage') {
            const dest = stage ? `${desk} for ${stage}` : desk;
            return `Ticket ${num}, ${name}, please proceed to ${dest || 'the counter'}`;
          }
          return `Ticket ${num}, ${name}, please proceed to ${desk || 'the counter'}`;
        },

        playAlertTone(event) {
          return new Promise((resolve) => {
            try {
              // Prefer the per-mode override uploaded in Super Admin.
              // Resolve relative paths against the dashboard origin so
              // upload paths like "/uploads/..." work in all environments.
              let url = '/public/alert-tone.wav';
              const customUrl = event && event.alertSoundUrl;
              if (customUrl) {
                try {
                  url = (/^https?:\/\//i).test(customUrl)
                    ? customUrl
                    : new URL(customUrl, window.location.origin).toString();
                } catch (e) { /* fall through to default */ }
              }
              const audio = new Audio(url);
              audio.volume = 0.8;
              audio.onended = resolve;
              audio.onerror = () => {
                // If the custom sound failed (404, decode error, etc.),
                // try the bundled fallback once before giving up so the
                // announcer is never silent.
                if (url !== '/public/alert-tone.wav') {
                  try {
                    const fb = new Audio('/public/alert-tone.wav');
                    fb.volume = 0.8;
                    fb.onended = resolve;
                    fb.onerror = resolve;
                    fb.play().catch(() => resolve());
                    return;
                  } catch (_) { /* fall through */ }
                }
                resolve();
              };
              audio.play().catch(() => resolve());
            } catch (e) { resolve(); }
          });
        },

        speakText(text, langHint) {
          return new Promise((resolve) => {
            if (!window.speechSynthesis) { resolve(); return; }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            utterance.volume = 1;
            const voices = window.speechSynthesis.getVoices();
            // Pick the best voice for the requested language, but inside
            // that language always prefer a *female* voice — TIQKETS uses
            // a female announcer voice for brand consistency, regardless
            // of whether the announcement is English, Arabic, etc.
            const lang = (langHint || '').toLowerCase();
            const langPrefix = lang.split('-')[0];
            const femaleRe = /female|samantha|karen|victoria|zira|susan|hazel|moira|tessa|fiona|serena|allison|ava|ellen|amira|laila|hoda|rania|salma|asma|nadia|sara|google\s+(uk|us|arabic).*female/i;
            const isFemale = (v) => femaleRe.test(v.name || '');
            const matchesExact = (v) => (v.lang || '').toLowerCase() === lang;
            const matchesPrefix = (v) => (v.lang || '').toLowerCase().startsWith(langPrefix);
            let voice = null;
            if (langPrefix) {
              voice = voices.find(v => matchesExact(v) && isFemale(v))
                || voices.find(v => matchesPrefix(v) && isFemale(v))
                || voices.find(matchesExact)
                || voices.find(matchesPrefix);
            }
            if (!voice) {
              voice = voices.find(isFemale)
                || voices.find(v => /google.*uk.*english.*female|google.*us.*english/i.test(v.name))
                || voices.find(v => (v.lang || '').toLowerCase().startsWith('en'));
            }
            if (voice) {
              utterance.voice = voice;
              utterance.lang = voice.lang || langHint || 'en-US';
            } else if (langHint) {
              utterance.lang = langHint;
            }
            utterance.onend = resolve;
            utterance.onerror = resolve;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
          });
        },

        sleep(ms) {
          return new Promise(r => setTimeout(r, ms));
        }
      };
    }
  </script>
</body>
</html>
