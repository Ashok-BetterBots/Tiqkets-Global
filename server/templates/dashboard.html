        loadSettingsForm() {
          const b = this.selectedBranch;
          if (b) {
            const s = b.settings || {};
            const branchForm = {
              queueMode: b.queueMode || s.queueMode || 'fifo',
              notificationMode: b.notificationMode || s.notificationMode || 'all',
              maxQueueSize: b.maxQueueSize || s.maxQueueSize || 100,
              autoCallNext: b.autoCallNext || s.autoCallNext || false,
              defaultSlotDuration: b.defaultSlotDuration || s.defaultSlotDuration || 30,
              defaultSlotCapacity: b.defaultSlotCapacity || s.defaultSlotCapacity || 3,
              enableBluetoothSpeaker: s.display?.enableBluetoothSpeaker || false,
              enableTVDisplay: s.display?.enableTVDisplay || false,
              apiEnabled: s.api?.isEnabled || false,
              apiKey: s.api?.apiKey || '',
              apiSecret: s.api?.apiSecret || '',
            };
            if (this.settingsServiceFilter) {
              const svc = (b.services || []).find(sv => sv.id === this.settingsServiceFilter);
              if (svc && svc.serviceSettings) {
                const ss = svc.serviceSettings;
                if (ss.queueMode) branchForm.queueMode = ss.queueMode;
                if (ss.notificationMode) branchForm.notificationMode = ss.notificationMode;
                if (ss.display) {
                  if (ss.display.enableBluetoothSpeaker !== undefined) branchForm.enableBluetoothSpeaker = ss.display.enableBluetoothSpeaker;
                  if (ss.display.enableTVDisplay !== undefined) branchForm.enableTVDisplay = ss.display.enableTVDisplay;
                }
              }
            }
            this.settingsForm = branchForm;
            this.slotDuration = branchForm.defaultSlotDuration;
            this.slotCapacity = branchForm.defaultSlotCapacity;
            this.branchAnnouncementsEnabled = !!(s.display?.announcementsEnabled);
            this.branchAnnouncementLanguage = s.display?.announcementLanguage || 'en';
            this.branchAlsoAnnounceInEnglish = s.display?.alsoAnnounceInEnglish === true;
            this.branchAnnouncerUserId = b.announcerUserId || '';

        playerUrlFor(dev) {
          return location.origin + '/announce/' + (dev.deviceToken || '');
        },
        tvUrlFor(dev) {
          return location.origin + '/tv/' + (dev?.deviceToken || '');
        },
        firstTvDevice() {
          const list = Array.isArray(this.announcementDevices) ? this.announcementDevices : [];
          return list.find(d => d && d.deviceToken) || null;
        },

        // When the TV Display toggle is flipped ON we make sure there is at
        // least one announcement device for this branch — its token becomes
        // the TV's URL. We auto-create a default "TV Display" device so the
        // user gets a copyable URL immediately, without having to switch to
        // the Announcement Devices section first.
        creatingTvDevice: false,
        async onTvDisplayToggle(enabled) {
          if (!enabled) return;
          const branchId = this.selectedBranchId;
          if (!branchId) {
            this.showToast('Select a branch before enabling TV Display.', 'error');
            return;
          }
          // Make sure the device list for this branch is loaded.
          if (!Array.isArray(this.announcementDevices) || this.announcementDevices.length === 0) {
            try { await this.loadAnnouncementDevices(); } catch(_) {}
          }
          if (this.firstTvDevice()) return; // already have one — nothing to do
          this.creatingTvDevice = true;
          try {
            await api(`/api/branches/${branchId}/announcement-devices`, {
              method: 'POST',
              body: JSON.stringify({ deviceName: 'TV Display', language: 'en', isActive: true }),
            });
            await this.loadAnnouncementDevices();
            this.showToast('TV Display URL ready', 'success');
          } catch (e) {
            this.showToast(e.message || 'Failed to generate TV display URL', 'error');
          } finally {
            this.creatingTvDevice = false;
          }
        },

        async loadAnnouncementDevices() {
          const branchId = this.selectedBranchId;
          if (!branchId) { this.announcementDevices = []; return; }
          this.loadingDevices = true;
          try {
            // When a service scope is selected, ask the server for devices
            // bound to that service (plus branch-wide ones). Otherwise show
            // every device on the branch.
            const qs = this.settingsServiceFilter
              ? `?serviceId=${encodeURIComponent(this.settingsServiceFilter)}`
              : '';
            const res = await api(`/api/branches/${branchId}/announcement-devices${qs}`);
            this.announcementDevices = res.devices || [];
          } catch (e) {
            this.announcementDevices = [];
          } finally {
            this.loadingDevices = false;
          }
        },

        // ===== Operations Alerts =====
        alertUserLabel(userId) {
          const m = (this.alertTeamMembers || []).find(x => x.id === userId);
          return m ? m.name : 'Linked user';
        },
        async loadAlertRecipients() {
          const branchId = this.selectedBranchId;
          if (!branchId) { this.alertRecipients = []; this.alertTeamMembers = []; return; }
          this.loadingAlertRecipients = true;
          try {
            const [rcptRes, teamRes] = await Promise.all([
              api(`/api/dashboard/branches/${branchId}/alert-recipients`),
              api(`/api/dashboard/branches/${branchId}/team-members`).catch(() => ({ members: [] })),
            ]);
            this.alertRecipients = rcptRes.recipients || [];
            this.alertTeamMembers = teamRes.members || [];
            // Read thresholds from branch.settings.display.alertThresholds (where engine reads from)
            const branch = this.selectedBranch;
            const t = branch?.settings?.display?.alertThresholds || {};
            this.alertThresholds = {
              waitingCountMax: Number(t.waitingCountMax ?? 20),
              waitingCountMin: Number(t.waitingCountMin ?? 10),
              avgWaitTimeMaxMinutes: Number(t.avgWaitTimeMaxMinutes ?? 30),
              avgWaitTimeMinMinutes: Number(t.avgWaitTimeMinMinutes ?? 15),
            };
          } catch (e) {
            this.alertRecipients = [];
          } finally {
            this.loadingAlertRecipients = false;
          }
        },
        async saveAlertThresholds() {
          const branchId = this.selectedBranchId;
          if (!branchId || this.savingAlertThresholds) return;
          const t = this.alertThresholds;
          if (!(Number.isFinite(t.waitingCountMax) && Number.isFinite(t.waitingCountMin) && Number.isFinite(t.avgWaitTimeMaxMinutes) && Number.isFinite(t.avgWaitTimeMinMinutes))) {
            this.showToast('Thresholds must be numbers', 'error'); return;
          }
          if (t.waitingCountMin > t.waitingCountMax || t.avgWaitTimeMinMinutes > t.avgWaitTimeMaxMinutes) {
            this.showToast('Min must be less than or equal to Max', 'error'); return;
          }
          this.savingAlertThresholds = true;
          try {
            const branch = this.selectedBranch;
            const existing = branch?.settings?.display || {};
            const displaySettings = { ...existing, alertThresholds: { ...t } };
            await api(`/api/dashboard/branches/${branchId}/settings`, {
              method: 'PUT',
              body: JSON.stringify({ displaySettings }),
            });
            if (branch && branch.settings) {
              branch.settings.display = displaySettings;
            }
            this.showToast('Thresholds saved', 'success');
          } catch (e) {
            this.showToast(e.message || 'Failed to save thresholds', 'error');
          } finally {
            this.savingAlertThresholds = false;
          }
        },
        async createAlertRecipient() {
          const branchId = this.selectedBranchId;
          if (!branchId || this.creatingRecipient) return;
          const r = this.newAlertRecipient;
          if (!r.name.trim()) return;
          if (!r.sendViaWhatsapp && !r.sendViaPush) { this.showToast('Pick at least one channel', 'error'); return; }
          if (r.sendViaWhatsapp && !r.phoneNumber.trim()) { this.showToast('WhatsApp channel needs a phone number', 'error'); return; }
          if (r.sendViaPush && !r.userId) { this.showToast('Mobile push channel needs a linked team member', 'error'); return; }
          this.creatingRecipient = true;
          try {
            await api(`/api/dashboard/branches/${branchId}/alert-recipients`, {
              method: 'POST',
              body: JSON.stringify(r),
            });
            this.newAlertRecipient = { name: '', phoneNumber: '', userId: '', sendViaWhatsapp: true, sendViaPush: false, alertOnQueueOpenClose: true, alertOnWaitingCountMax: true, alertOnAvgWaitTimeMax: true };
            this.showToast('Recipient added', 'success');
            await this.loadAlertRecipients();
          } catch (e) {
            this.showToast(e.message || 'Failed to add recipient', 'error');
          } finally {
            this.creatingRecipient = false;
          }
        },

        async createAnnouncementDevice() {

              body: JSON.stringify({ isActive: !dev.isActive }),

        async changeDeviceLanguage(dev, code) {
          if (!code || code === dev.language) return;
          try {
            await api(`/api/announcement-devices/${dev.id}`, {
              method: 'PUT',
              body: JSON.stringify({ language: code }),
            });

          } catch (e) { this.showToast(e.message, 'error'); }

        async saveBranchAnnouncementLanguage(code) {
          const branchId = this.selectedBranchId;
          if (!branchId || !code || code === this.branchAnnouncementLanguage) return;
          const prev = this.branchAnnouncementLanguage;
          this.branchAnnouncementLanguage = code;
          this.savingAnnLang = true;
          try {
            const branch = this.selectedBranch;
            const existing = branch?.settings?.display || {};
            const displaySettings = { ...existing, announcementLanguage: code };
            await api(`/api/dashboard/branches/${branchId}/settings`, {
              method: 'PUT',
              body: JSON.stringify({ displaySettings }),
            });
            // The branch language is the single source of truth — propagate
            // it to EVERY announcement device on this branch (regardless of
            // any current service-scope filter) so audio + TV stay in sync.
            // We must re-fetch the unfiltered list first because
            // this.announcementDevices is filtered by settingsServiceFilter.
            let propagationFailures = 0;
            let propagationTotal = 0;
            try {
              const allRes = await api(`/api/branches/${branchId}/announcement-devices`);
              const allDevices = (allRes && Array.isArray(allRes.devices)) ? allRes.devices : [];
              propagationTotal = allDevices.length;
              const results = await Promise.all(allDevices.map(d =>
                api(`/api/announcement-devices/${d.id}`, {
                  method: 'PUT',
                  body: JSON.stringify({ language: code }),
                }).then(() => true).catch(() => false)
              ));
              propagationFailures = results.filter(ok => !ok).length;
            } catch(_) {
              propagationFailures = -1; // couldn't even list
            }
            if (propagationFailures === 0) {
              this.showToast('Announcement language updated', 'success');
            } else if (propagationFailures < 0) {
              this.showToast('Branch language saved, but devices could not be synced. Reload and retry.', 'error');
            } else {
              this.showToast(`Branch language saved. ${propagationFailures} of ${propagationTotal} devices failed to update.`, 'error');
            }
            await this.loadBranches();
            await this.loadAnnouncementDevices();
          } catch (e) {
            this.branchAnnouncementLanguage = prev;
            this.showToast(e.message || 'Failed to update', 'error');
          } finally {
            this.savingAnnLang = false;
          }
        },

        async saveBranchAnnouncer(userId) {
          const branchId = this.selectedBranchId;
          if (!branchId) return;
          const next = userId || null;
          const prev = this.branchAnnouncerUserId;
          if ((prev || null) === next) return;
          this.branchAnnouncerUserId = userId || '';
          this.savingAnnouncer = true;
          try {
            await api(`/api/dashboard/branches/${branchId}/settings`, {
              method: 'PUT',
              body: JSON.stringify({ announcerUserId: next }),
            });

            await this.loadBranches();

        openUserModal(user) {
          this.showUserPassword = false;
          // Always reload the role catalog AND branches before opening so the
          // dropdowns reflect the latest data. Without a fresh branches load,
          // the branch <select> can render with no matching option for an
          // existing user's branchId — the user then visually sees "Select
          // Branch" while userForm.branchId still holds a stale UUID, which
          // would silently pass the save validation. Reloading guarantees the
          // dropdown shows the real assignment (or surfaces the stale-branch
          // warning shown under the select).
          Promise.allSettled([this.loadOrgRoles(), this.loadBranches()]).finally(() => {
            this.userForm = user
              ? { ...user, password: '', branchIds: user.branchIds || [], assignedServiceIds: user.assignedServiceIds || [] }
              : { name: '', email: '', phone: '', password: '', role: '', branchId: '', branchIds: [], assignedServiceIds: [] };
            this.showUserModal = true;
          });
        },
        async saveUser() {
          try {
            const validRoles = this.getCreatableRoles().map(r => r.value);
            if (!this.userForm.role || !validRoles.includes(this.userForm.role)) {
              this.showToast('Please select a role', 'error');
              return;
            }
            const role = this.userForm.role;
            const isMultiBranchRole = role === 'admin' || role === 'location_manager';
            const branchList = Array.isArray(this.branches) ? this.branches : [];
            const branchIdSet = new Set(branchList.map(b => b.id));
            // If the branches catalog never loaded (network/auth failure), we
            // cannot trust ANY pre-populated branchId / branchIds — they would
            // sneak through this client check and rely solely on the server.
            // Refuse to save and prompt a retry instead, matching the UX of
            // the rest of the dashboard.
            if (branchList.length === 0) {
              try { await this.loadBranches(); } catch (_) {}
              const reloaded = Array.isArray(this.branches) ? this.branches : [];
              if (reloaded.length === 0) {
                this.showToast("Couldn't load branches. Create a branch first or retry.", 'error');
                return;
              }
              // Refresh the local view of the catalog after the retry succeeds.
              branchList.push(...reloaded);
              reloaded.forEach(b => branchIdSet.add(b.id));
            }
            if (isMultiBranchRole) {
              const ids = Array.isArray(this.userForm.branchIds) ? this.userForm.branchIds : [];
              // Drop any UUIDs that no longer point to a real branch (deleted /
              // reorganized) so we never quietly accept a stale assignment.
              const validIds = ids.filter(id => branchIdSet.has(id));
              if (validIds.length === 0) {
                this.showToast('Please assign at least one branch', 'error');
                this.userForm.branchIds = validIds;
                return;
              }
              this.userForm.branchIds = validIds;
            } else {
              const bid = typeof this.userForm.branchId === 'string' ? this.userForm.branchId.trim() : this.userForm.branchId;
              if (!bid) {
                this.showToast('Please select a branch', 'error');
                this.userForm.branchId = '';
                return;
              }
              // Stale-UUID guard: dropdown may visually show "Select Branch"
              // when the underlying value points to a deleted branch.
              if (!branchIdSet.has(bid)) {
                this.showToast('Please select a valid branch', 'error');
                this.userForm.branchId = '';
                return;
              }
            }
            if (role === 'front_desk') {
              if (!Array.isArray(this.userForm.assignedServiceIds) || this.userForm.assignedServiceIds.length === 0) {
                this.showToast('Please select at least one service for Front Desk', 'error');
                return;
              }
            }
            const payload = {
              name: this.userForm.name,
              email: this.userForm.email,
              phone: this.userForm.phone,
              password: this.userForm.password,
              role: this.userForm.role,
              branchId: this.userForm.branchId,
              branchIds: this.userForm.branchIds,
              assignedServiceIds: this.userForm.assignedServiceIds,
              isActive: this.userForm.isActive,
            };
            if (this.userForm.id) {
              await api(`/api/dashboard/users/${this.userForm.id}`, { method: 'PUT', body: JSON.stringify(payload) });
              this.showToast('Staff updated', 'success');
            } else {
              await api('/api/dashboard/users', { method: 'POST', body: JSON.stringify({ ...payload, organizationId: this.org.id }) });
              this.showToast('Staff member added', 'success');
            }
            this.showUserModal = false;
            // Refresh the role catalog AND the staff list so the table reflects
            // the latest data immediately after a create/update.
            await Promise.all([this.loadOrgRoles(), this.loadUsers()]);
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        // Defensive UI gate: hide edit/delete on rows the caller cannot manage.
        // Server already filters them out of GET /users, so this is belt-and-
        // braces. Owner / super-admin always pass (no rank stamped on currentUser).
        canManageStaff(u) {
          const cu = this.currentUser || {};
          if (cu.role === 'admin' || cu.role === 'super_admin') return true;
          const callerRank = typeof cu.rank === 'number' ? cu.rank : this._rankForRoleKey(cu.role);
          const targetRank = typeof u.rank === 'number' ? u.rank : this._rankForRoleKey(u.role);
          return targetRank < callerRank;
        },
        _rankForRoleKey(key) {
          const builtIn = { super_admin: 1000, admin: 100, location_manager: 80, floor_manager: 40, front_desk: 20 };
          if (builtIn[key]) return builtIn[key];
          const r = (this.roles || []).find(r => r.key === key);
          if (r && typeof r.rank === 'number') return r.rank;
          return 30;
        },

        async updateTicketStatus(ticketId, status) {
          const endpointMap = { called: 'call', serving: 'serve', completed: 'complete', no_show: 'no-show', hold: 'hold', arrived: 'arrive' };
          const endpoint = endpointMap[status];
          if (!endpoint) return;
          try {
            const body = {};
            if (status === 'called') {
              const deskInfo = this.getSelectedDeskInfo();
              if (deskInfo) {
                body.deskId = deskInfo.id;
                body.deskName = deskInfo.name;
              }
            }
            await api(`/api/tickets/${ticketId}/${endpoint}`, { method: 'POST', body: JSON.stringify(body) });
            await this.loadQueueData();
            await this.loadStats();
            if (status === 'completed' || status === 'no_show' || status === 'arrived') {
              if (this.currentQueueMode === 'dine_in' || this.currentQueueMode === 'dinein') {
                this.dineInTab = 'completed';
              } else if (this.currentQueueMode === 'takeaway') {
                this.takeawayTab = 'completed';
              } else {
                this.queueListTab = 'completed';
                const updated = this.queueTickets.find(t => t.id === ticketId);
                this.selectedTicket = updated || null;
              }
            } else if (this.selectedTicket && this.selectedTicket.id === ticketId) {
              const updated = this.queueTickets.find(t => t.id === ticketId);
              this.selectedTicket = updated || null;
            }
            this.showToast(`Ticket ${status}`, 'success');
          } catch (e) { this.showToast(e.message, 'error'); }
        },

        async callAgainTicket(ticket) {
          try {
            const body = {};
            const deskInfo = this.getSelectedDeskInfo();
            if (deskInfo) {

            }
            await api(`/api/tickets/${ticket.id}/call`, { method: 'POST', body: JSON.stringify(body) });
            await this.loadQueueData();
            const callNum = (ticket.callCount || 0) + 1;
            this.showToast(`Reminder sent to ${ticket.customerName || 'guest'} (Called ${callNum} time${callNum > 1 ? 's' : ''})`, 'success');
          } catch (e) { this.showToast(e.message, 'error'); }
        },

        selectTicket(ticket) {
          this.selectedTicket = ticket;
        },
        refreshSelectedTicket() {
          this.loadQueueData().then(() => {
            if (this.selectedTicket) {
              const updated = this.queueTickets.find(t => t.id === this.selectedTicket.id);
              this.selectedTicket = updated || null;
            }
          });
        },
        getQueueListFiltered() {
          let tickets;
          if (this.queueListTab === 'active') {
            tickets = this.queueTickets.filter(t => t.status !== 'completed' && t.status !== 'no_show');
          } else {
            tickets = this.queueTickets.filter(t => t.status === 'completed' || t.status === 'no_show');
          }
          if (this.selectedStageFilter && (this.currentQueueMode === 'multi_stage' || this.currentQueueMode === 'multistage')) {
            tickets = tickets.filter(t => t.currentStageId === this.selectedStageFilter);
          }
          if (this.queueServiceFilter) {
            tickets = tickets.filter(t => t.serviceId === this.queueServiceFilter);
          } else {
            // Front-desk staff only see tickets for the services they're assigned to.
            tickets = tickets.filter(t => !t.serviceId || this.isServiceAccessible(t.serviceId));
          }
          if (this.queueDeskFilter) {
            tickets = tickets.filter(t => t.deskId === this.queueDeskFilter);
          }
          if (this.queueSearch.trim()) {
            const s = this.queueSearch.toLowerCase().trim();
            tickets = tickets.filter(t => (t.customerName || '').toLowerCase().includes(s) || (t.ticketNumber || '').toLowerCase().includes(s) || (t.customerPhone || '').includes(s));
          }
          return tickets;
        },
        getDesksForQueueFilter() {
          const branch = this.selectedBranch;
          if (!branch || !branch.services) return [];
          let desks = [];
          const accessible = this.accessibleServicesFor(branch);
          const svcs = this.queueServiceFilter ? accessible.filter(s => s.id === this.queueServiceFilter) : accessible;
          svcs.forEach(svc => {
            if (svc.desks && svc.desks.length > 0) {
              svc.desks.filter(d => d.isActive).forEach(d => {
                if (!desks.find(x => x.id === d.id)) desks.push(d);
              });
            }
          });
          return desks;
        },
        getSelectedDeskInfo() {
          if (!this.queueDeskFilter) return null;
          const desks = this.getDesksForQueueFilter();
          return desks.find(d => d.id === this.queueDeskFilter) || null;
        },
        getQueueStatus() {
          const branch = this.selectedBranch;
          if (this.queueDeskFilter) {
            const desk = this.getSelectedDeskInfo();
            return desk?.queueStatus || 'ended';
          }
          if (this.queueServiceFilter && branch) {
            const svc = (branch.services || []).find(s => s.id === this.queueServiceFilter);
            return svc?.queueStatus || 'ended';
          }
          return branch?.queueStatus || 'ended';
        },
        getQueueStatusTargetLabel() {
          const branch = this.selectedBranch;
          if (this.queueDeskFilter) {
            const desk = this.getSelectedDeskInfo();
            return desk?.name || 'Desk';
          }
          if (this.queueServiceFilter && branch) {
            const svc = (branch.services || []).find(s => s.id === this.queueServiceFilter);
            return svc?.name || 'Service';
          }
          return branch?.name || 'Branch';
        },
        async setQueueStatus(newStatus) {
          const branch = this.selectedBranch;
          if (!branch || this.queueStatusUpdating) return;
          const currentStatus = this.getQueueStatus();
          if (currentStatus === newStatus) return;
          this.queueStatusUpdating = true;
          try {
            if (this.queueDeskFilter) {
              await api(`/api/dashboard/desks/${this.queueDeskFilter}/queue-status`, { method: 'PUT', body: JSON.stringify({ queueStatus: newStatus }) });
              const desk = this.getSelectedDeskInfo();
              if (desk) desk.queueStatus = newStatus;
            } else if (this.queueServiceFilter) {
              await api(`/api/dashboard/services/${this.queueServiceFilter}/queue-status`, { method: 'PUT', body: JSON.stringify({ queueStatus: newStatus }) });
              const svc = (branch.services || []).find(s => s.id === this.queueServiceFilter);
              if (svc) {
                svc.queueStatus = newStatus;
                if (svc.desks) {
                  for (const desk of svc.desks) {
                    await api(`/api/dashboard/desks/${desk.id}/queue-status`, { method: 'PUT', body: JSON.stringify({ queueStatus: newStatus }) });
                    desk.queueStatus = newStatus;
                  }
                }
              }
            } else {
              await api(`/api/dashboard/branches/${branch.id}/queue-status`, { method: 'PUT', body: JSON.stringify({ queueStatus: newStatus }) });
              branch.queueStatus = newStatus;
              for (const svc of this.accessibleServicesFor(branch)) {
                await api(`/api/dashboard/services/${svc.id}/queue-status`, { method: 'PUT', body: JSON.stringify({ queueStatus: newStatus }) });
                svc.queueStatus = newStatus;
                if (svc.desks) {
                  for (const desk of svc.desks) {
                    await api(`/api/dashboard/desks/${desk.id}/queue-status`, { method: 'PUT', body: JSON.stringify({ queueStatus: newStatus }) });
                    desk.queueStatus = newStatus;
                  }
                }
              }
            }
            const labels = { active: 'booking opened', paused: 'paused', ended: 'booking closed' };
            this.showToast(`Queue ${labels[newStatus]} successfully`, 'success');
          } catch (error) {
            console.error('Error updating queue status:', error);
            this.showToast('Failed to update queue status', 'error');
          } finally {
            this.queueStatusUpdating = false;
          }
        },
        getStatusBadgeClass(status) {
          const map = {
            waiting: 'bg-brand-50 text-brand border border-brand-200',
            called: 'bg-blue-50 text-blue-600 border border-blue-200',
            serving: 'bg-emerald-50 text-emerald-600 border border-emerald-200',
            hold: 'bg-amber-50 text-amber-600 border border-amber-200',
            completed: 'bg-gray-100 text-gray-500 border border-gray-200',
            arrived: 'bg-green-50 text-green-600 border border-green-200',
            no_show: 'bg-red-50 text-red-500 border border-red-200'
          };
          return map[status] || 'bg-gray-100 text-gray-500';
        },
        getStatusLabel(status) {
          const map = { waiting: 'Waiting', called: 'Called', serving: 'Serving', hold: 'On Hold', arrived: 'Arrived', completed: 'Completed', no_show: 'No Show' };
          return map[status] || status;
        },
        formatTime(dateStr) {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
        },
        formatDateTime(dateStr) {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ', ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
        },
        getTicketTimeline(ticket) {
          if (!ticket) return [];
          const events = [];
          events.push({ label: 'Joined Queue', time: ticket.joinedAt ? this.formatDateTime(ticket.joinedAt) : null, active: !!ticket.joinedAt, last: false });
          if (ticket.calledAt || ticket.status === 'called' || ticket.status === 'serving' || ticket.status === 'completed') {
            events.push({ label: 'Customer Called', time: ticket.calledAt ? this.formatDateTime(ticket.calledAt) : null, active: !!ticket.calledAt, last: false });
          }
          if (ticket.holdAt) {
            events.push({ label: 'Put on Hold', time: this.formatDateTime(ticket.holdAt), active: true, last: false });
          }
          if (ticket.servedAt || ticket.status === 'serving' || ticket.status === 'completed') {
            events.push({ label: 'Service Started', time: ticket.servedAt ? this.formatDateTime(ticket.servedAt) : null, active: !!ticket.servedAt, last: false });
          }
          if (ticket.completedAt || ticket.status === 'completed') {
            events.push({ label: 'Service Completed', time: ticket.completedAt ? this.formatDateTime(ticket.completedAt) : null, active: !!ticket.completedAt, last: false });
          }
          if (ticket.status === 'no_show') {
            events.push({ label: 'Marked No Show', time: ticket.completedAt ? this.formatDateTime(ticket.completedAt) : 'N/A', active: true, last: false });
          }
          if (events.length > 0) events[events.length - 1].last = true;
          return events;
        },
        async detailAction(status) {
          if (!this.selectedTicket) return;
          if (status === 'cancel') {
            if (!confirm('Cancel this ticket?')) return;
            try {
              await api(`/api/tickets/${this.selectedTicket.id}/cancel`, { method: 'POST' });
              await this.loadQueueData();
              this.selectedTicket = null;
              this.showToast('Ticket cancelled', 'success');
            } catch (e) { this.showToast(e.message, 'error'); }
            return;
          }
          if (status === 'resume') {
            try {
              await api(`/api/tickets/${this.selectedTicket.id}/resume`, { method: 'POST' });
              await this.loadQueueData();
              const updated = this.queueTickets.find(t => t.id === this.selectedTicket.id);
              this.selectedTicket = updated || null;
              this.showToast('Service resumed', 'success');
            } catch (e) { this.showToast(e.message, 'error'); }
            return;
          }
          await this.updateTicketStatus(this.selectedTicket.id, status);
        },
        async finishAndCallNext() {
          if (!this.selectedTicket) return;
          try {
            await api(`/api/tickets/${this.selectedTicket.id}/complete`, { method: 'POST' });
            try {
              const callBody = { serviceId: this.selectedTicket.serviceId || this.queueServiceFilter || undefined };
              const deskInfo = this.getSelectedDeskInfo();
              if (deskInfo) {
                callBody.deskId = deskInfo.id;
                callBody.deskName = deskInfo.name;
              }
              await api(`/api/branches/${this.selectedBranchId}/queue/call-next`, { method: 'POST', body: JSON.stringify(callBody) });
              this.showToast('Finished & called next customer', 'success');
            } catch (e2) {
              this.showToast('Finished! No waiting customers to call.', 'success');
            }
            await this.loadQueueData();
            await this.loadStats();
            const calledTicket = this.queueTickets.find(t => t.status === 'called');
            this.selectedTicket = calledTicket || null;
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        async reassignTicket() {
          if (!this.selectedTicket || !this.assignServiceId) return;
          try {
            const service = this.services.find(s => s.id === this.assignServiceId);
            await api(`/api/tickets/${this.selectedTicket.id}/reassign`, {
              method: 'POST',
              body: JSON.stringify({ serviceId: this.assignServiceId, serviceName: service?.name || '' })
            });
            this.showAssignModal = false;
            this.assignServiceId = '';
            await this.loadQueueData();
            const updated = this.queueTickets.find(t => t.id === this.selectedTicket.id);
            this.selectedTicket = updated || null;
            this.showToast('Ticket reassigned', 'success');
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        canCallTicket(ticket) {
          if (!ticket || ticket.status !== 'waiting') return false;
          if (this.currentQueueMode === 'selective' || this.currentQueueMode === 'dine_in' || this.currentQueueMode === 'dinein') return true;
          const waitingTickets = this.queueTickets.filter(t => t.status === 'waiting');
          const calledCount = this.queueTickets.filter(t => t.status === 'called').length;
          return waitingTickets.length > 0 && waitingTickets[0].id === ticket.id && calledCount === 0;
        },

        async moveTicketToNextStage() {
          if (!this.selectedTicket || !this.selectedTicket.journeyId) return;
          try {
            const journey = this.journeys.find(j => j.id === this.selectedTicket.journeyId && j.isActive);
            if (!journey || !journey.stages) { this.showToast('Journey not found', 'error'); return; }
            const nextIdx = (this.selectedTicket.currentStageIndex || 0) + 1;
            if (nextIdx >= journey.stages.length) { this.showToast('Already at final stage', 'error'); return; }
            const nextStage = journey.stages[nextIdx];
            await api(`/api/tickets/${this.selectedTicket.id}/move-stage`, { method: 'POST', body: JSON.stringify({ stageId: nextStage.id, stageIndex: nextIdx, stageName: nextStage.serviceName }) });
            await this.loadQueueData();
            const updated = this.queueTickets.find(t => t.id === this.selectedTicket.id);
            this.selectedTicket = updated || null;
            this.showToast(`Moved to stage: ${nextStage.serviceName}`, 'success');
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        async moveTicketToStage(val) {
          if (!val || !this.selectedTicket) return;
          const [stageId, stageIndex, stageName] = val.split('|');
          try {
            await api(`/api/tickets/${this.selectedTicket.id}/move-stage`, { method: 'POST', body: JSON.stringify({ stageId, stageIndex: parseInt(stageIndex), stageName }) });
            await this.loadQueueData();
            const updated = this.queueTickets.find(t => t.id === this.selectedTicket.id);
            this.selectedTicket = updated || null;
            this.showToast(`Jumped to stage: ${stageName}`, 'success');
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        async finishAtCurrentStage() {
          if (!this.selectedTicket) return;
          try {
            await api(`/api/tickets/${this.selectedTicket.id}/complete`, { method: 'POST' });
            await this.loadQueueData();
            await this.loadStats();
            this.selectedTicket = null;
            this.showToast('Journey completed at current stage', 'success');
          } catch (e) { this.showToast(e.message, 'error'); }
        },

        // Compute the relationship between the user's current plan and a
        // candidate plan for the buttons in the plan grid. Returns one of
        // 'current' | 'upgrade' | 'downgrade' | 'switch' | 'subscribe'.
        // We use monthlyPrice as the comparator; this is fine because the
        // dashboard shows monthly pricing and the change is always done
        // as a monthly cycle from this surface.
        // Hide the trial sku from the plans grid. The trial is auto-assigned
        // exactly once at organisation registration; it can never be chosen
        // as a plan change. Server enforces this independently in
        // /api/billing/proration-preview and /api/billing/change-plan.
        plansForDisplay() {
          if (!Array.isArray(this.plans)) return [];
          return this.plans.filter(p => p.slug !== 'trial' && !(p.features && (p.features.isTrial === true || (Array.isArray(p.features) && p.features.includes('isTrial')))));
        },
        // Build the bullet list shown on each plan card from the actual
        // limit fields configured by the super admin in Pricing & Plans.
        // - locations  -> plan.maxBranches (null = unlimited via the
        //   "Unlimited Locations" toggle)
        // - users      -> plan.maxDailyTickets (null = unlimited via the
        //   "Unlimited Users" toggle)
        // - team       -> plan.maxStaffUsers
        // - desks      -> plan.features.deskCount
        // - services   -> plan.maxServicesPerBranch (per-branch cap)
        // Anything still set to 0 with no "unlimited" flag is hidden so
        // operators don't see "0 staff users" for unconfigured plans.
        planSpecLines(plan) {
          if (!plan) return [];
          const fx = (plan.features && typeof plan.features === 'object' && !Array.isArray(plan.features)) ? plan.features : {};
          const fmt = (n, singular, plural) => `${n.toLocaleString()} ${n === 1 ? singular : plural}`;
          const out = [];

          // Unlimited is signalled in two ways across the data set:
          //   * `null` — what ppFormToPayload writes when the
          //     "Unlimited" toggle is on in the super admin editor.
          //   * `-1`   — the seed convention used by the legacy
          //     Enterprise plan for branches/staff/services/desks/etc.
          // Plus the matching `unlimited*` boolean flags in `features`.
          // Anything else missing/zero is treated as "not configured"
          // and the bullet is skipped (rather than mislabelled).
          const isUnlimited = (v) => v === null || v === -1 || v === '-1';
          const num = (v) => {
            const n = Number(v);
            return Number.isFinite(n) ? n : 0;
          };

          const branches = plan.maxBranches;
          if (isUnlimited(branches) || fx.unlimitedLocation === true) {
            out.push({ icon: 'fa-solid fa-infinity', label: 'Unlimited locations' });
          } else if (num(branches) > 0) {
            out.push({ icon: 'fa-solid fa-building', label: fmt(num(branches), 'location', 'locations') });
          }

          const daily = plan.maxDailyTickets;
          if (isUnlimited(daily) || fx.unlimitedUsers === true) {
            out.push({ icon: 'fa-solid fa-infinity', label: 'Unlimited daily users' });
          } else if (num(daily) > 0) {
            out.push({ icon: 'fa-solid fa-users', label: `${num(daily).toLocaleString()} users / day` });
          }

          const staffRaw = plan.maxStaffUsers;
          if (isUnlimited(staffRaw)) {
            out.push({ icon: 'fa-solid fa-infinity', label: 'Unlimited staff members' });
          } else if (num(staffRaw) > 0) {
            out.push({ icon: 'fa-solid fa-user-tie', label: fmt(num(staffRaw), 'staff member', 'staff members') });
          }

          const desksRaw = fx.deskCount;
          if (isUnlimited(desksRaw)) {
            out.push({ icon: 'fa-solid fa-infinity', label: 'Unlimited service desks' });
          } else if (num(desksRaw) > 0) {
            out.push({ icon: 'fa-solid fa-desktop', label: fmt(num(desksRaw), 'service desk', 'service desks') });
          }

          // NOTE: maxServicesPerBranch and free-form features.bullets
          // are intentionally NOT rendered here. The Super Admin →
          // Pricing & Plans editor only exposes locations, daily users,
          // staff, desks (and their Unlimited toggles), so we mirror
          // exactly that set on the org Billing page to avoid
          // advertising limits the super admin can't actually edit.

          if (out.length === 0) {
            out.push({ icon: 'fa-solid fa-circle-info', label: 'Plan limits not configured yet' });
          }
          return out;
        },
        planRelation(plan) {
          if (!this.subscription) return 'subscribe';
          if (this.subscription.planId === plan.id) return 'current';
          const current = this.subscription.plan?.monthlyPrice ?? 0;
          const candidate = plan.monthlyPrice ?? 0;
          if (candidate > current) return 'upgrade';
          if (candidate < current) return 'downgrade';
          return 'switch';
        },
        planButtonLabel(plan) {
          const rel = this.planRelation(plan);
          if (rel === 'current') return 'Current Plan';
          if (rel === 'upgrade') return 'Upgrade';
          if (rel === 'downgrade') return 'Downgrade';
          if (rel === 'switch') return 'Switch Plan';
          return 'Choose Plan';
        },
        // Format paise (integer) as a Rupees string, e.g. 99900 -> "₹999.00".
        formatRupees(paise) {
          const v = (Number(paise) || 0) / 100;
          return '\u20B9' + v.toFixed(2);
        },
        formatDate(d) {
          if (!d) return '—';
          try {
            return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
          } catch { return '—'; }
        },
        // Generic in-app confirm. Returns nothing; runs onConfirm when the
        // user clicks the primary CTA. Replaces window.confirm everywhere
        // so prompts stay inside the dashboard theme.
        openConfirm({ title, message, confirmLabel, cancelLabel, tone, onConfirm }) {
          this.confirmContext = {
            title: title || 'Are you sure?',
            message: message || '',
            confirmLabel: confirmLabel || 'Confirm',
            cancelLabel: cancelLabel || 'Cancel',
            tone: tone || 'brand',
            onConfirm: typeof onConfirm === 'function' ? onConfirm : null,
          };
          this.showConfirmModal = true;
        },
        async resolveConfirm() {
          const fn = this.confirmContext?.onConfirm;
          this.showConfirmModal = false;
          if (typeof fn === 'function') {
            try { await fn(); } catch (e) { this.showToast(e.message || 'Action failed', 'error'); }
          }
        },
        // Open the plan change modal. Calls /api/billing/proration-preview
        // for a server-computed breakdown, then renders an in-app modal with
        // the plan transition, period dates, and pricing breakdown. The user
        // either confirms (→ confirmPlanChange) or cancels.
        async subscribeToPlan(plan) {
          try {
            const rel = this.planRelation(plan);
            if (rel === 'current') return;
            // Defensive: never let a trial sku reach this flow even if the
            // grid filter slips. Server rejects this too with a 400.
            if (plan.slug === 'trial' || (plan.features && plan.features.isTrial)) {
              this.showToast('The trial plan is only available at registration.', 'error');
              return;
            }

            let preview;
            try {
              preview = await api('/api/billing/proration-preview', {
                method: 'POST',
                body: JSON.stringify({ orgId: this.org.id, planId: plan.id, billingCycle: 'monthly' }),
              });
            } catch (e) {
              this.showToast(e.message || 'Could not preview change', 'error');
              return;
            }

            const b = preview.breakdown || {};
            const cur = (this.subscription?.plan?.name) || 'No active plan';
            const isDowngrade = !!b.scheduled;
            const isUpgrade = !isDowngrade && (b.amountDueNow || 0) > 0;

            const ctx = {
              tone: isDowngrade ? 'amber' : 'brand',
              currentPlanName: cur,
              newPlanName: plan.name,
              planId: plan.id,
              billingCycle: 'monthly',
              confirmLabel: isDowngrade ? 'Schedule downgrade' : (isUpgrade ? 'Pay & upgrade now' : 'Confirm switch'),
            };

            if (isDowngrade) {
              // Downgrades are deferred to the end of the current paid
              // period. The current plan stays active until then.
              ctx.title = 'Schedule downgrade';
              ctx.subtitle = 'Takes effect at the end of your current billing period';
              ctx.explanation = `Your current "${cur}" plan stays active until your current billing period ends. On that date you'll automatically switch to "${plan.name}". You won't be charged anything today, and you can cancel this scheduled change any time before it takes effect.`;
              ctx.periodStartLabel = 'Downgrade starts on';
              ctx.periodStart = this.formatDate(b.newPeriodStart);
              ctx.periodEndLabel = 'New plan ends on';
              ctx.periodEnd = this.formatDate(b.newPeriodEnd);
              ctx.lineItems = [
                { label: 'Due today', value: this.formatRupees(0), emphasize: true },
              ];
            } else if (isUpgrade) {
              // Upgrades are immediate. The new period starts now and the
              // user pays the prorated amount due.
              ctx.title = 'Upgrade plan';
              ctx.subtitle = 'Takes effect immediately after payment';
              ctx.explanation = `You're switching from "${cur}" to "${plan.name}" right away. We've credited the unused portion of your current plan against the new plan's prorated price. After successful payment, the upgrade is applied immediately and a new billing period starts today.`;
              ctx.periodStartLabel = 'New period starts on';
              ctx.periodStart = this.formatDate(b.newPeriodStart);
              ctx.periodEndLabel = 'New period ends on';
              ctx.periodEnd = this.formatDate(b.newPeriodEnd);
              const items = [
                { label: `${plan.name} (prorated)`, value: this.formatRupees(b.newPlanProrated || b.newPlanFullPrice || 0) },
              ];
              if ((b.unusedCreditFromCurrentPlan || 0) > 0) {
                items.push({ label: `Unused credit from "${cur}"`, value: '− ' + this.formatRupees(b.unusedCreditFromCurrentPlan) });
              }
              items.push({ label: 'Due today', value: this.formatRupees(b.amountDueNow || 0), emphasize: true });
              ctx.lineItems = items;
            } else {
              // Lateral / zero-cost change (e.g. same-priced plan).
              ctx.title = 'Switch plan';
              ctx.subtitle = 'Takes effect immediately';
              ctx.explanation = `Switch to "${plan.name}". No payment is required right now.`;
              ctx.periodStartLabel = 'New period starts on';
              ctx.periodStart = this.formatDate(b.newPeriodStart);
              ctx.periodEndLabel = 'New period ends on';
              ctx.periodEnd = this.formatDate(b.newPeriodEnd);
              ctx.lineItems = [
                { label: 'Due today', value: this.formatRupees(0), emphasize: true },
              ];
            }

            this.planChangeContext = ctx;
            this.planChangeBusy = false;
            this.showPlanChangeModal = true;
          } catch (e) {
            this.showToast(e.message || 'Could not change plan', 'error');
          }
        },
        // User clicked the primary CTA on the plan change modal. Calls
        // /change-plan, then either applies the scheduled downgrade or
        // launches Razorpay checkout for an immediate upgrade.
        async confirmPlanChange() {
          if (!this.planChangeContext || this.planChangeBusy) return;
          const ctx = this.planChangeContext;
          this.planChangeBusy = true;
          try {
            const resp = await api('/api/billing/change-plan', {
              method: 'POST',
              body: JSON.stringify({ orgId: this.org.id, planId: ctx.planId, billingCycle: ctx.billingCycle }),
            });

            // Downgrade or zero-cost change: nothing to pay.
            if (!resp.requiresPayment) {
              this.showPlanChangeModal = false;
              this.planChangeBusy = false;
              const msg = resp.breakdown?.scheduled
                ? `Downgrade scheduled. "${ctx.newPlanName}" will take effect at the end of your current period.`
                : `Plan changed to "${ctx.newPlanName}".`;
              this.showToast(msg, 'success');
              await Promise.all([this.loadSubscription(), this.loadPlanLimits(), this.loadPlans()]);
              return;
            }

            // Upgrade: open Razorpay. Keep the modal open with a busy state
            // so the user has a clear "in progress" affordance until checkout
            // takes over the screen.
            if (typeof window.Razorpay === 'undefined') {
              this.planChangeBusy = false;
              this.showToast('Payment SDK not loaded. Please refresh and try again.', 'error');
              return;
            }
            const rp = resp.razorpay || {};
            const self = this;
            // The server requires subscriptionId on /verify-payment so it
            // can bind the captured payment to the exact subscription row
            // whose pendingOrderId/pendingPlanId/pendingPeriod* were
            // stamped at /change-plan time. Capture it from the change-plan
            // response (falling back to the currently-loaded subscription
            // for safety).
            const subscriptionId = resp.subscription?.id || self.subscription?.id || null;
            const rzp = new window.Razorpay({
              key: rp.keyId,
              order_id: rp.orderId,
              amount: rp.amount,
              currency: rp.currency || 'INR',
              name: 'TIQKETS',
              description: `Switch to ${ctx.newPlanName}`,
              prefill: {
                name: self.org?.name || '',
                email: self.org?.email || '',
                contact: self.org?.phone || '',
              },
              theme: { color: '#7c3aed' },
              handler: async (response) => {
                try {
                  await api('/api/billing/verify-payment', {
                    method: 'POST',
                    body: JSON.stringify({
                      orgId: self.org.id,
                      subscriptionId,
                      razorpay_order_id: response.razorpay_order_id,
                      razorpay_payment_id: response.razorpay_payment_id,
                      razorpay_signature: response.razorpay_signature,
                    }),
                  });
                  self.showPlanChangeModal = false;
                  self.planChangeBusy = false;
                  self.showToast(`Upgraded to "${ctx.newPlanName}".`, 'success');

        formatHolidayDate(dateStr) {
          try { return new Date(dateStr).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }); } catch { return dateStr; }
        },
        getCalendarTitle() {
          const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
          return months[this.calendarMonth.getMonth()] + ' ' + this.calendarMonth.getFullYear();
        },
        changeCalendarMonth(delta) {
          const d = new Date(this.calendarMonth);
          d.setMonth(d.getMonth() + delta);
          this.calendarMonth = d;
        },
        getCalendarCells() {
          const year = this.calendarMonth.getFullYear();
          const month = this.calendarMonth.getMonth();
          const firstDay = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const today = new Date();
          const cells = [];
          const holidays = this.getHolidays();
          for (let i = 0; i < firstDay; i++) {
            const d = new Date(year, month, 0 - (firstDay - 1 - i));
            cells.push({ key: 'p' + i, day: d.getDate(), inMonth: false, isToday: false, isHoliday: false, holidayName: '' });
          }
          for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(year, month, d);
            const dateStr = date.toISOString().split('T')[0];
            const isToday = date.toDateString() === today.toDateString();
            const holiday = holidays.find(h => {
              try {
                const hd = new Date(h.date);
                if (h.isRecurring) return hd.getMonth() === month && hd.getDate() === d;
                return hd.toISOString().split('T')[0] === dateStr;
              } catch { return false; }
            });
            cells.push({ key: 'm' + d, day: d, inMonth: true, isToday, isHoliday: !!holiday, holidayName: holiday?.name || '' });
          }
          const remaining = 42 - cells.length;
          for (let i = 1; i <= remaining; i++) {
            cells.push({ key: 'n' + i, day: i, inMonth: false, isToday: false, isHoliday: false, holidayName: '' });
          }
          return cells;
        },
        generateTimeSlots(day) {
          const oh = this.getOperatingHourByDay(day);
          if (!oh?.isOpen) return [];
          const [openH, openM] = oh.openTime.split(':').map(Number);
          const [closeH, closeM] = oh.closeTime.split(':').map(Number);
          const duration = this.slotDuration || 30;
          const breaks = oh.breaks || [];
          const slots = [];
          let current = openH * 60 + openM;
          const end = closeH * 60 + closeM;
          while (current < end) {
            const h = Math.floor(current / 60);
            const m = current % 60;
            const time = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
            const slotEnd = current + duration;
            const isBreak = breaks.some(b => {
              const [bsH, bsM] = b.startTime.split(':').map(Number);
              const [beH, beM] = b.endTime.split(':').map(Number);
              const bs = bsH * 60 + bsM;
              const be = beH * 60 + beM;
              return b.isActive !== false && current < be && slotEnd > bs;
            });
            slots.push({ time, isBreak });
            current += duration;
          }
          return slots;
        },
        async saveSlotSettings() {
          // Apply to the selected branch, or to every accessible branch when
          // "All Branches" is selected.
          const targets = this.getBookingTargetBranches();
          if (targets.length === 0) { this.showToast('Please select a branch to save slot settings', 'error'); return; }
          try {
            for (const branch of targets) {
              await api(`/api/dashboard/branches/${branch.id}/settings`, { method: 'PUT', body: JSON.stringify({ defaultSlotDuration: this.slotDuration, defaultSlotCapacity: this.slotCapacity }) });
            }
            await this.loadBranches();
            const scope = targets.length > 1 ? ` (${targets.length} branches)` : '';
            this.showToast('Slot settings saved' + scope, 'success');
          } catch (e) { this.showToast(e.message, 'error'); }
        },
        toggleSlotBlocked(day, time) {
          const key = day + '';
          if (!this.blockedSlots[key]) this.blockedSlots[key] = [];
          const idx = this.blockedSlots[key].indexOf(time);
          if (idx >= 0) this.blockedSlots[key].splice(idx, 1);
          else this.blockedSlots[key].push(time);
        },
        isSlotBlocked(day, time) {
          return (this.blockedSlots[day + ''] || []).includes(time);
        },

        async downloadQR() {
          if (!this.qrBranch) return;
          const qrUrl = window.location.origin + '/join/' + this.qrBranch.id;
          const format = this.qrFormat || 'png';
          const imgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(qrUrl)}&margin=30&format=${format === 'pdf' ? 'png' : format}`;
          
          try {
            if (format === 'pdf') {
              const canvas = document.createElement('canvas');
              canvas.width = 800;
              canvas.height = 1100;
              const ctx = canvas.getContext('2d');
              
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, 800, 1100);
              
              ctx.fillStyle = '#8c1867';
              ctx.fillRect(0, 0, 800, 100);
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 36px Nunito, sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('TIQKETS', 400, 65);
              
              ctx.fillStyle = '#1f2937';
              ctx.font = 'bold 28px Nunito, sans-serif';
              ctx.fillText(this.org?.name || 'Centre', 400, 170);
              ctx.fillStyle = '#6b7280';
              ctx.font = '20px Nunito, sans-serif';
              ctx.fillText(this.qrBranch.name, 400, 210);
              
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.onload = () => {
                const qrSize = 400;
                ctx.drawImage(img, (800 - qrSize) / 2, 260, qrSize, qrSize);
                
                ctx.fillStyle = '#374151';
                ctx.font = 'bold 24px Nunito, sans-serif';
                ctx.fillText('Scan to Join Queue', 400, 720);
                
                ctx.fillStyle = '#9ca3af';
                ctx.font = '14px Nunito, sans-serif';
                ctx.fillText(qrUrl, 400, 760);
                
                ctx.fillStyle = '#f3f4f6';
                ctx.fillRect(0, 1020, 800, 80);
                ctx.fillStyle = '#9ca3af';
                ctx.font = '14px Nunito, sans-serif';
                ctx.fillText('Powered by TIQKETS - Smart Queue Management', 400, 1060);
                
                canvas.toBlob((blob) => {
                  const link = document.createElement('a');
                  link.href = URL.createObjectURL(blob);
                  link.download = `TIQKETS_QR_${this.qrBranch.name.replace(/\s+/g, '_')}.pdf`;
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);
                  URL.revokeObjectURL(link.href);
                }, 'image/png');
              };
              img.src = imgUrl;
            } else {
              const response = await fetch(imgUrl);
              const blob = await response.blob();
              const link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = `TIQKETS_QR_${this.qrBranch.name.replace(/\s+/g, '_')}.${format}`;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              URL.revokeObjectURL(link.href);
            }
            this.showToast('QR code downloaded', 'success');
            this.showQRModal = false;
          } catch (e) { this.showToast('Download failed: ' + e.message, 'error'); }
        },

        getQueueModeLabel(mode) {
          const labels = { fifo: 'FIFO Mode', selective: 'Selective Mode', checkin: 'Check-in Mode', takeaway: 'Takeaway Mode', dine_in: 'Dine In Mode', dinein: 'Dine In Mode', multi_stage: 'Multi-Stage Mode', multistage: 'Multi-Stage Mode' };

          return desc[mode] || '';
        },
        getDineInFiltered() {
          if (this.dineInTab === 'completed') return this.queueTickets.filter(t => t.status === 'arrived' || t.status === 'completed' || t.status === 'no_show');
          if (this.dineInTab === 'called') return this.queueTickets.filter(t => t.status === 'called' || t.status === 'serving');
          return this.queueTickets.filter(t => t.status === this.dineInTab);
        },
        openManualAddModal() {
          this.manualAddForm = { customerName: '', customerPhone: '', customerEmail: '', serviceId: '', journeyId: '', priority: 'normal', notes: '', partySize: 2, tableOrRef: '', customFieldValues: {} };
          this.manualAddError = '';
          this.manualAddSuccess = '';
          const activeServices = (this.services || []).filter(s => s.isActive);
          if (activeServices.length === 1) this.manualAddForm.serviceId = activeServices[0].id;
          // Seed an empty value for every custom field of the (possibly
          // pre-selected) single service so reactive bindings have a key
          // to write into and required-field validation can detect blanks.
          this.onManualServiceChange();
